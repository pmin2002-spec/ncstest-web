const state = {
  pos: 0,
  current: null,
  answered: false,
  stats: { total: 0, correct: 0 },
  wrongSet: new Set(),
  wrongOnly: false,
  pool: []
};

const el = {
  categorySelect: document.getElementById('categorySelect'),
  questionSelect: document.getElementById('questionSelect'),
  qCategory: document.getElementById('qCategory'),
  qText: document.getElementById('qText'),
  choices: document.getElementById('choices'),
  feedbackArea: document.getElementById('feedbackArea'),
  nextRow: document.getElementById('nextRow'),
  nextBtn: document.getElementById('nextBtn'),
  statTotal: document.getElementById('statTotal'),
  statCorrect: document.getElementById('statCorrect'),
  statRate: document.getElementById('statRate'),
  statWrong: document.getElementById('statWrong'),
  resetStatsBtn: document.getElementById('resetStatsBtn'),
  wrongOnlyBtn: document.getElementById('wrongOnlyBtn'),
};

function buildCategoryOptions(){
  const cats = ['전체', ...Array.from(new Set(questions.map(q => q.category)))];
  el.categorySelect.innerHTML = cats.map(c => {
    const count = c === '전체' ? questions.length : questions.filter(q => q.category === c).length;
    return `<option value="${c}">${c} (${count})</option>`;
  }).join('');
}

function computeFilteredIndices(){
  const cat = el.categorySelect.value;
  return questions
    .map((q, i) => ({ q, i }))
    .filter(({ q, i }) => (cat === '전체' || q.category === cat) && (!state.wrongOnly || state.wrongSet.has(i)))
    .map(({ i }) => i);
}

function rebuildPool(){
  state.pool = computeFilteredIndices();
  buildQuestionNumberOptions();
}

function buildQuestionNumberOptions(){
  el.questionSelect.innerHTML = state.pool.map((_, pos) => `<option value="${pos}">${pos + 1}번</option>`).join('');
}

function goToPosition(pos){
  if (state.pool.length === 0){
    showEmptyState();
    return;
  }
  state.pos = Math.max(0, Math.min(pos, state.pool.length - 1));
  state.current = state.pool[state.pos];
  el.questionSelect.value = String(state.pos);
  renderQuestion();
}

function nextQuestion(){
  let pos = state.pos + 1;
  if (pos >= state.pool.length) pos = 0;
  goToPosition(pos);
}

function showEmptyState(){
  el.qCategory.textContent = '';
  el.qText.innerHTML = '';
  el.choices.innerHTML = '';
  el.feedbackArea.innerHTML = `
    <div class="empty-state">
      <div class="big">🎉</div>
      ${state.wrongOnly ? '틀린 문제를 모두 맞혔습니다!' : '해당 조건의 문제가 없습니다.'}
    </div>
  `;
  el.nextRow.style.display = 'none';
}

function renderQuestion(){
  const idx = state.current;
  state.answered = false;
  const q = questions[idx];

  el.qCategory.textContent = q.category;
  el.qText.textContent = q.question;
  el.feedbackArea.innerHTML = '';
  el.nextRow.style.display = 'none';

  el.choices.innerHTML = '';
  q.choices.forEach((choiceText, ci) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = `${['①','②','③','④'][ci]} ${choiceText}`;
    btn.addEventListener('click', () => selectAnswer(ci));
    el.choices.appendChild(btn);
  });
}

function selectAnswer(choiceIndex){
  if (state.answered) return;
  state.answered = true;
  const q = questions[state.current];
  const buttons = el.choices.querySelectorAll('.choice');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    else if (i === choiceIndex) b.classList.add('wrong');
  });

  const isCorrect = choiceIndex === q.answer;
  state.stats.total++;
  if (isCorrect) state.stats.correct++;
  updateStats();
  saveStats();

  if (isCorrect) {
    if (state.wrongSet.delete(state.current)) {
      saveWrong();
      updateWrongCount();
      if (state.wrongOnly) {
        // 틀린문제만 보기 모드에서는 맞춘 즉시 목록에서 제거(다음 문제 클릭 시 반영)
        const posInPool = state.pool.indexOf(state.current);
        if (posInPool !== -1) state.pool.splice(posInPool, 1);
        buildQuestionNumberOptions();
        if (state.pool.length > 0) {
          el.questionSelect.value = String(Math.min(state.pos, state.pool.length - 1));
        }
      }
    }
  } else {
    if (!state.wrongSet.has(state.current)) {
      state.wrongSet.add(state.current);
      saveWrong();
      updateWrongCount();
    }
  }

  el.feedbackArea.innerHTML = `
    <div class="feedback ${isCorrect ? 'ok' : 'no'}">
      ${isCorrect ? '정답입니다!' : `오답입니다. 정답은 ${['①','②','③','④'][q.answer]}번입니다.`}
    </div>
    <div class="explain"><b>해설</b><br>${q.explanation}</div>
  `;
  el.nextRow.style.display = 'block';
}

function updateStats(){
  el.statTotal.textContent = state.stats.total;
  el.statCorrect.textContent = state.stats.correct;
  const rate = state.stats.total === 0 ? 0 : Math.round((state.stats.correct / state.stats.total) * 100);
  el.statRate.textContent = rate + '%';
}

function saveStats(){
  try { localStorage.setItem('nh_ncs_stats', JSON.stringify(state.stats)); } catch(e){}
}
function loadStats(){
  try {
    const saved = JSON.parse(localStorage.getItem('nh_ncs_stats'));
    if (saved && typeof saved.total === 'number') state.stats = saved;
  } catch(e){}
}

function saveWrong(){
  try { localStorage.setItem('nh_ncs_wrong', JSON.stringify(Array.from(state.wrongSet))); } catch(e){}
}
function loadWrong(){
  try {
    const saved = JSON.parse(localStorage.getItem('nh_ncs_wrong'));
    if (Array.isArray(saved)) state.wrongSet = new Set(saved.filter(n => Number.isInteger(n) && n >= 0 && n < questions.length));
  } catch(e){}
}
function updateWrongCount(){
  el.statWrong.textContent = state.wrongSet.size;
  el.wrongOnlyBtn.textContent = `틀린문제만 보기 (${state.wrongSet.size})`;
}

el.nextBtn.addEventListener('click', nextQuestion);
el.categorySelect.addEventListener('change', () => {
  rebuildPool();
  goToPosition(0);
});
el.questionSelect.addEventListener('change', () => {
  goToPosition(Number(el.questionSelect.value));
});
el.resetStatsBtn.addEventListener('click', () => {
  state.stats = { total: 0, correct: 0 };
  updateStats();
  saveStats();
});
el.wrongOnlyBtn.addEventListener('click', () => {
  state.wrongOnly = !state.wrongOnly;
  el.wrongOnlyBtn.classList.toggle('active', state.wrongOnly);
  rebuildPool();
  goToPosition(0);
});

document.addEventListener('keydown', (e) => {
  if (!state.answered && ['1','2','3','4'].includes(e.key)) {
    selectAnswer(Number(e.key) - 1);
  } else if (state.answered && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    nextQuestion();
  }
});

loadStats();
loadWrong();
updateStats();
updateWrongCount();
buildCategoryOptions();
rebuildPool();
goToPosition(0);
</script>
</body>
</html>
