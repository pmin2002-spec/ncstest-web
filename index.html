<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NH농협은행 NCS 연습문제</title>
<style>
  :root{
    --bg:#f4f6f5; --card:#ffffff; --text:#1f2a24; --sub:#5b6b62;
    --brand:#00854a; --brand-dark:#00693a; --border:#e1e6e2;
    --correct:#1e8e5a; --correct-bg:#e6f6ec; --wrong:#d64545; --wrong-bg:#fdeaea;
    --chip-bg:#eaf3ee; --shadow:0 2px 10px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121815; --card:#1b2420; --text:#eef2ef; --sub:#9fb0a6;
      --brand:#2fbf78; --brand-dark:#28a76a; --border:#2b3a33;
      --correct:#3ddc84; --correct-bg:#173226; --wrong:#ff6b6b; --wrong-bg:#3a1e1e;
      --chip-bg:#1f2b25; --shadow:0 2px 12px rgba(0,0,0,0.4);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px;}
  header{text-align:center;margin-bottom:20px;}
  header h1{font-size:1.4rem;margin:0 0 4px;color:var(--brand-dark);}
  header p{margin:0;color:var(--sub);font-size:0.85rem;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
  select, button{
    font-size:0.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);color:var(--text);cursor:pointer;
  }
  select:focus,button:focus{outline:2px solid var(--brand);}
  .stats{
    display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:12px 18px;margin-bottom:18px;box-shadow:var(--shadow);font-size:0.85rem;
  }
  .stats b{color:var(--brand-dark);font-size:1rem;}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;
    box-shadow:var(--shadow);
  }
  .chip{
    display:inline-block;background:var(--chip-bg);color:var(--brand-dark);font-size:0.78rem;
    font-weight:600;padding:4px 10px;border-radius:20px;margin-bottom:12px;
  }
  .qtext{font-size:1.08rem;line-height:1.6;margin-bottom:18px;white-space:pre-line;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);font-size:0.95rem;line-height:1.5;transition:background .15s,border-color .15s;
  }
  .choice:hover:not(:disabled){border-color:var(--brand);}
  .choice.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);font-weight:600;}
  .choice.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong);font-weight:600;}
  .choice:disabled{cursor:default;}
  .feedback{margin-top:18px;padding:14px 16px;border-radius:10px;font-size:0.92rem;line-height:1.6;}
  .feedback.ok{background:var(--correct-bg);color:var(--correct);}
  .feedback.no{background:var(--wrong-bg);color:var(--wrong);}
  .explain{margin-top:10px;color:var(--text);background:var(--chip-bg);border-radius:8px;padding:12px 14px;font-size:0.88rem;line-height:1.6;}
  .explain b{color:var(--brand-dark);}
  .next-row{margin-top:20px;text-align:center;}
  .next-btn{
    background:var(--brand);color:#fff;border:none;font-weight:600;padding:12px 30px;font-size:0.95rem;
    border-radius:10px;
  }
  .next-btn:hover{background:var(--brand-dark);}
  .reset-btn{background:transparent;color:var(--sub);}
  footer{text-align:center;color:var(--sub);font-size:0.75rem;margin-top:28px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NH농협은행 NCS 연습문제</h1>
    <p>직무능력평가 5영역 + 직무상식 · 1번부터 순서대로 출제</p>
  </header>

  <div class="controls">
    <select id="categorySelect"></select>
    <select id="questionSelect"></select>
    <button id="resetStatsBtn" class="reset-btn">기록 초기화</button>
  </div>

  <div class="stats">
    <span>푼 문제 <b id="statTotal">0</b></span>
    <span>맞은 문제 <b id="statCorrect">0</b></span>
    <span>정답률 <b id="statRate">0%</b></span>
  </div>

  <div class="card">
    <span class="chip" id="qCategory"></span>
    <div class="qtext" id="qText"></div>
    <div class="choices" id="choices"></div>
    <div id="feedbackArea"></div>
    <div class="next-row" id="nextRow" style="display:none;">
      <button class="next-btn" id="nextBtn">다음 문제 →</button>
    </div>
  </div>

  <footer>
    본 문제는 실제 NH농협은행 기출문제가 아니며, 공개된 NCS 직무능력평가 출제 영역(의사소통·수리·문제해결·자원관리·정보) 및<br>
    일반 금융·협동조합 상식을 바탕으로 정답과 풀이를 직접 검증하여 제작한 연습문제입니다.
  </footer>
</div>

<script>
const questions = [
/* ===================== 의사소통능력 ===================== */
{category:"의사소통능력", question:"다음 중 맞춤법이 올바른 문장은?", choices:["오랫만에 만난 친구와 반가운 인사를 나눴다.","오랜만에 만난 친구와 반가운 인사를 나눴다.","오랬만에 만난 친구와 반가운 인사를 나눴다.","오랫만이 만난 친구와 반가운 인사를 나눴다."], answer:1, explanation:"표준어는 '오랜만'입니다. '오랫만' 등은 잘못된 표기입니다."},
{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"이번 협상에서 양측은 첨예하게 대립했다.\"", choices:["격렬하다","온화하다","소극적이다","무관심하다"], answer:0, explanation:"'첨예하다'는 대립이나 갈등이 매우 날카롭고 격렬함을 뜻합니다."},
{category:"의사소통능력", question:"다음 중 표기가 올바르지 않은 것은?", choices:["웬일","왠지","몇 일","며칠"], answer:2, explanation:"'몇 일'은 잘못된 표기이며, '며칠'이 표준어입니다."},
{category:"의사소통능력", question:"공문서 작성 원칙으로 적절하지 않은 것은?", choices:["결론을 먼저 제시하고 이유를 설명한다.","한 문장에는 여러 내용을 담아 정보량을 최대한 늘린다.","육하원칙에 따라 작성한다.","날짜 표기 시 마지막에 온점(.)을 찍는다."], answer:1, explanation:"공문서는 한 문장에 하나의 내용만 담아 간결하고 명확하게 작성하는 것이 원칙입니다."},
{category:"의사소통능력", question:"다음 사자성어의 뜻이 올바르게 연결된 것은?", choices:["각주구검(刻舟求劍) - 융통성 없이 옛것만 고집함","마이동풍(馬耳東風) - 몹시 기뻐함","오비이락(烏飛梨落) - 아주 가까운 사이","자업자득(自業自得) - 남의 탓으로 돌림"], answer:0, explanation:"각주구검은 '배에 표시를 새겨 칼을 찾는다'는 뜻으로, 상황 변화를 모르고 옛 방식만 고집함을 의미합니다."},
{category:"의사소통능력", question:"다음 글의 중심 내용으로 가장 적절한 것은?\n\"협동조합은 공동의 목적을 가진 사람들이 자발적으로 결성한 자율적인 조직으로, 이용자가 곧 소유자이자 운영자가 되는 특징을 지닌다. 이는 자본을 중심으로 운영되는 일반 주식회사와 달리, 조합원 개개인의 참여와 민주적 의사결정을 중시한다는 점에서 차별화된다.\"", choices:["협동조합과 주식회사의 자본 규모 비교","협동조합의 민주적 운영 원리와 주식회사와의 차이","협동조합의 세계 시장 점유율","주식회사의 장점"], answer:1, explanation:"지문은 협동조합이 조합원의 참여와 민주적 의사결정을 중시한다는 점에서 주식회사와 다르다는 점을 설명하고 있습니다."},
{category:"의사소통능력", question:"의사소통의 저해 요인으로 보기 어려운 것은?", choices:["일방적으로 전달하는 태도","상대방에 대한 선입견","적극적인 경청","감정적인 대응"], answer:2, explanation:"적극적인 경청은 오히려 의사소통을 원활하게 하는 요소입니다."},
{category:"의사소통능력", question:"다음 중 높임법 사용이 올바른 것은?", choices:["주문하신 상품이 나오셨습니다.","할머니께서 지금 방에 계세요.","문의하신 제품은 품절이십니다.","포인트가 적립되셨습니다."], answer:1, explanation:"사물에는 높임법(-시-)을 쓰지 않습니다. '상품', '제품', '포인트'는 사물이므로 존대 표현을 쓰면 어색하며, 사람인 '할머니'를 높인 표현만 올바릅니다."},
{category:"의사소통능력", question:"다음 중 문서와 그 설명의 연결이 옳지 않은 것은?", choices:["기획서 - 프로젝트를 시행하기 위해 계획을 세워 전달하는 문서","보고서 - 업무의 진행 상황이나 결과를 보고하는 문서","공문서 - 개인이 사적인 용도로 작성하는 비공식 문서","비즈니스 메모 - 업무상 확인·전달사항을 간단히 적은 글"], answer:2, explanation:"공문서는 정부기관이나 기업이 대내외적으로 작성하는 공식적인 문서입니다."},
{category:"의사소통능력", question:"경청을 방해하는 요인으로 보기 어려운 것은?", choices:["짐작하기(미리 판단하기)","상대방 말의 요약 및 정리","조언하기에 지나치게 집중하기","다른 생각하기(주의 분산)"], answer:1, explanation:"상대방의 말을 요약·정리하며 듣는 것은 효과적인 경청 방법에 해당합니다."},
{category:"의사소통능력", question:"다음 중 맞춤법이 올바른 것은?", choices:["어의없는 상황이었다","어이없는 상황이었다","어의없는 상활이었다","어히없는 상황이었다"], answer:1, explanation:"표준어는 '어이없다'입니다."},
{category:"의사소통능력", question:"기획서 작성 시 유의해야 할 사항으로 적절하지 않은 것은?", choices:["상대가 요구하는 것을 고려하여 작성한다","핵심 내용을 간결하게 전달한다","시각적인 표현까지 고려하여 작성한다","분량이 많을수록 좋으므로 최대한 길게 작성한다"], answer:3, explanation:"기획서는 분량이 아니라 내용의 명확성과 간결성이 중요합니다."},
{category:"의사소통능력", question:"의사소통능력을 향상시키기 위한 방법으로 가장 적절하지 않은 것은?", choices:["명확한 목표를 설정하고 피드백한다","대화 중 이해한 내용을 확인하며 듣는다","상대가 말하는 도중에는 절대 질문하지 않고 끝까지 참는다","논박하기 전에 상대의 입장을 먼저 이해하려 노력한다"], answer:2, explanation:"적절한 시점에 확인 질문을 하는 것은 효과적인 의사소통 방법이며, 무조건 참는 것이 바람직한 태도는 아닙니다."},
{category:"의사소통능력", question:"업무 이메일 작성 시 가장 적절한 태도는?", choices:["제목 없이 본문만 길게 작성한다","용건을 명확히 하고 핵심을 앞부분에 제시한다","반말과 이모티콘을 자유롭게 사용한다","첨부파일명은 신경 쓰지 않아도 된다"], answer:1, explanation:"업무 이메일은 제목과 핵심 용건을 명확히 밝히는 것이 기본입니다."},
{category:"의사소통능력", question:"다음 중 나머지 세 단어와 의미가 가장 다른 것은?", choices:["신중하다","경솔하다","조심스럽다","세심하다"], answer:1, explanation:"'경솔하다'는 말이나 행동이 조심스럽지 못함을 뜻하여 나머지와 의미가 반대됩니다."},
{category:"의사소통능력", question:"다음 글의 내용과 일치하는 것은?\n\"최근 온라인 뱅킹 이용자가 늘면서 은행 점포 수는 매년 감소하는 추세이다. 그러나 디지털 기기 사용에 익숙하지 않은 고령층을 위해 일부 은행은 이동식 점포나 화상상담 창구를 운영하며 금융 접근성을 보완하고 있다.\"", choices:["모든 은행이 점포 수를 늘리고 있다","온라인 뱅킹 증가로 점포가 줄고 있으나 고령층 대안이 마련되고 있다","고령층은 온라인 뱅킹을 가장 선호한다","이동식 점포는 전면 폐지되었다"], answer:1, explanation:"지문은 점포 감소 추세와 고령층을 위한 보완책(이동식 점포, 화상상담)을 함께 언급하고 있습니다."},
{category:"의사소통능력", question:"'되다/돼다'의 사용이 올바른 것은?", choices:["그렇게 하면 안 됀다","그렇게 하면 안 된다","그렇게 하면 안 되요","그렇게 하면 안돼요, 절대 안됀다"], answer:1, explanation:"'되다'의 활용형 중 '된다'가 표준 표기이며, '됀다', '되요'는 잘못된 표기입니다."},
{category:"의사소통능력", question:"다음 중 주어와 서술어의 호응이 가장 어색한 것은?", choices:["내가 하고 싶은 말은 우리 모두 노력해야 한다는 것이다.","이 제품의 장점은 가격이 저렴하고 성능이 좋다.","오늘의 안건은 예산 편성에 관한 논의이다.","그의 목표는 내년에 자격증을 취득하는 것이다."], answer:1, explanation:"'장점은 ~것이다' 구조로 호응해야 하며, '장점은 가격이 저렴하고 성능이 좋다는 것이다'와 같이 고쳐야 자연스럽습니다."},
{category:"의사소통능력", question:"협상 시 취해야 할 의사소통 태도로 가장 적절한 것은?", choices:["상대방의 입장은 무시하고 자신의 요구만 반복한다","상대방의 이해관계를 파악하며 상호 이익이 되는 대안을 탐색한다","감정적으로 압박하여 굴복시킨다","협상 중 정보를 절대 공개하지 않는다"], answer:1, explanation:"효과적인 협상은 상호 이해관계를 파악하여 서로 이익이 되는 대안을 찾는 것입니다."},
{category:"의사소통능력", question:"문서이해능력에 대한 설명으로 가장 적절한 것은?", choices:["문서 작성자의 의도를 파악하지 않고 글자만 읽는 능력","문서에서 핵심 내용을 파악하고 필요한 정보를 획득·종합하는 능력","문서를 빠르게 많이 읽기만 하면 되는 능력","문서의 글자 수를 세는 능력"], answer:1, explanation:"문서이해능력은 문서의 핵심 내용을 파악하고 필요한 정보를 수집·종합하는 능력입니다."},
{category:"의사소통능력", question:"다음 밑줄 친 표현이 올바르게 쓰인 것은?", choices:["이유는 모르겠지만 왠지 불안하다.","어제 웬지 기분이 좋지 않았다.","그는 리더로써 책임감이 강하다.","배고프던지 말던지 알아서 해라."], answer:0, explanation:"'왠지'는 '왜인지'의 축약형으로 이유를 알 수 없다는 뜻으로 쓰일 때 올바른 표현입니다. '웬지'는 잘못된 표기이며, 자격을 나타낼 때는 '로서', 나열·선택에는 '든지'를 써야 합니다."},
{category:"의사소통능력", question:"다음 중 '반듯이/지긋이/붙이다' 등의 표현이 올바르게 쓰인 것은?", choices:["약속은 반듯이 지켜야 한다.","그는 눈을 지긋이 감고 심호흡을 했다.","편지에 우표를 붙이고 우체국에 가서 부쳤다.","새로운 사업을 붙이려고 계획을 세웠다."], answer:2, explanation:"우표처럼 물건을 붙일 때는 '붙이다', 편지를 보낼 때는 '부치다'를 씁니다. '반드시'(틀림없이), '지그시'(슬며시 힘을 주는 모양), '벌이다'(일을 시작하다)가 각각 올바른 표현입니다."},
{category:"의사소통능력", question:"다음 중 '가리키다/메다/늘리다' 등의 표현이 올바르게 쓰인 것은?", choices:["고무줄을 늘려서 팽팽하게 만들었다.","선생님이 학생들에게 수학을 가리켰다.","그는 넥타이를 단단히 메었다.","회사는 생산량을 두 배로 늘렸다."], answer:3, explanation:"길이를 물리적으로 당겨 늘일 때는 '늘이다', 양이나 규모를 크게 할 때는 '늘리다'를 씁니다. 가르침은 '가르치다', 넥타이를 매는 것은 '매다'가 올바른 표현입니다."},
{category:"의사소통능력", question:"다음 중 '다르다/틀리다' 등의 표현이 올바르게 쓰인 것은?", choices:["이 그림과 저 그림은 색깔이 서로 틀리다.","그는 열심히 노력했다. 그럼으로 좋은 결과를 얻었다.","갑자기 비가 오면 어떻게 하지?","이 두 제품은 성능이 다른데, 가격은 틀리지 않다."], answer:2, explanation:"비교해서 같지 않음은 '다르다', 원인과 결과를 이어줄 때는 '그러므로'가 올바른 표현입니다. '어떻게 하지'는 올바르게 쓰인 표현입니다."},
{category:"의사소통능력", question:"다음 중 '삭이다/벌리다/안치다' 등의 표현이 올바르게 쓰인 것은?", choices:["화가 나서 감정을 삭히지 못하고 폭발했다.","그는 입을 크게 벌이며 하품을 했다.","냄비에 밥을 안치고 불을 켰다.","갑자기 몸이 벽에 부딫쳤다."], answer:2, explanation:"음식 재료를 솥에 넣는 것은 '안치다'가 올바른 표현입니다. 감정을 가라앉히는 것은 '삭이다', 공간을 넓히는 것은 '벌리다', '부딪혔다/부딪쳤다'가 표준 표기입니다."},
{category:"의사소통능력", question:"다음 중 '삼가다/헤매다/설레다' 등의 표준어 표기가 올바른 것은?", choices:["그는 몸이 안 좋아 음주를 삼가했다.","아이는 낯선 골목에서 한참을 헤매였다.","오후가 되자 날씨가 활짝 개었다.","첫 만남을 생각하며 마음이 설레였다."], answer:2, explanation:"'개다', '삼가다', '헤매다', '설레다'가 표준어이며, '개이다', '삼가하다', '헤매이다', '설레이다'는 비표준 표기입니다."},
{category:"의사소통능력", question:"다음 중 '웬만하면/아니에요/나아요' 등의 표준어 표기가 올바른 것은?", choices:["이 정도 실력이면 웬만하면 합격할 수 있다.","저는 학생이 아니예요.","감기에는 푹 쉬는 것이 가장 낳다.","이렇케 하면 문제가 해결될 거예요."], answer:0, explanation:"'웬만하면'이 표준 표기입니다. '아니에요', '낫다', '이렇게'가 각각 올바른 표기입니다."},
{category:"의사소통능력", question:"다음 중 '곰곰이/깨끗이/틈틈이/일일이' 등 부사의 표기가 올바른 것은?", choices:["곰곰히 생각해 보니 그의 말이 맞았다.","그는 방을 깨끗이 청소했다.","시간이 날 때마다 틈틈히 공부했다.","선생님은 학생들의 답안을 일일히 확인했다."], answer:1, explanation:"'깨끗이'가 표준 표기입니다. '곰곰이', '틈틈이', '일일이'가 각각 올바른 표기입니다."},
{category:"의사소통능력", question:"다음 중 사이시옷·표기 규정이 올바른 것은? (나뭇잎/등굣길/빨랫줄 등)", choices:["가을이 되자 나무잎이 노랗게 물들었다.","아이들은 등교길에 친구를 만났다.","행사가 끝난 후 뒤풀이 자리를 마련했다.","마당에 빨래줄을 매어 이불을 널었다."], answer:2, explanation:"'뒤풀이'는 사이시옷이 붙지 않는 표준 표기입니다. '나뭇잎', '등굣길', '빨랫줄'이 각각 올바른 표기입니다."},
{category:"의사소통능력", question:"다음 중 '깊숙이/가까이/느긋이/따뜻이' 등 부사의 표기가 올바른 것은?", choices:["날이 추워지자 옷을 깊숙히 여며 입었다.","그는 가까이 다가와 인사를 건넸다.","주말에는 느긋히 쉬고 싶다.","따뜻히 데운 차를 건넸다."], answer:1, explanation:"'가까이'가 표준 표기입니다. '깊숙이', '느긋이', '따뜻이'가 각각 올바른 표기입니다."},
{category:"의사소통능력", question:"밑줄 친 단어의 반의어로 가장 적절한 것은?\n\"그는 회의에서 신중한 태도를 보였다.\"", choices:["경솔한","침착한","냉정한","차분한"], answer:0, explanation:"'신중하다'의 반의어는 '경솔하다'입니다. 나머지는 모두 신중함과 유사한 의미입니다."},
{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"이 계약은 향후 분쟁의 소지가 있다.\"", choices:["가능성","확실성","필요성","책임성"], answer:0, explanation:"'소지'는 어떤 일이 일어날 가능성을 뜻합니다."},
{category:"의사소통능력", question:"밑줄 친 단어의 반의어로 가장 적절한 것은?\n\"정부는 물가 안정을 위해 재정을 긴축했다.\"", choices:["확대","절감","축소","감축"], answer:0, explanation:"'긴축'(줄이는 것)의 반의어는 '확대'입니다. 나머지는 모두 긴축과 유사한 의미입니다."},
{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"그의 주장은 논리적 근거가 빈약하다.\"", choices:["풍부하다","부족하다","확고하다","명확하다"], answer:1, explanation:"'빈약하다'는 내용이나 근거가 부족하고 약하다는 뜻입니다."},
{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"회사는 신제품 출시를 앞두고 만반의 준비를 했다.\"", choices:["일부","충분","완벽","최소"], answer:2, explanation:"'만반'은 모든 것을 갖추어 완벽하게 준비한 상태를 뜻합니다."},
{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"노사 양측은 오랜 갈등 끝에 극적으로 타결에 이르렀다.\"", choices:["결렬","합의","대립","보류"], answer:1, explanation:"'타결'은 서로 다른 의견이 조정되어 일치된 결론에 이르는 것으로, '합의'와 의미가 유사합니다."},
{category:"의사소통능력", question:"밑줄 친 단어의 반의어로 가장 적절한 것은?\n\"이번 정책은 서민 경제에 실질적인 도움이 되지 못하고 있다는 비판을 받는다.\"", choices:["형식적","근본적","효과적","현실적"], answer:0, explanation:"'실질적'의 반의어는 '형식적'입니다."},
{category:"의사소통능력", question:"밑줄 친 단어의 반의어로 가장 적절한 것은?\n\"그는 회사의 방침에 순응하기로 했다.\"", choices:["저항하다","동조하다","복종하다","따르다"], answer:0, explanation:"'순응하다'의 반의어는 '저항하다'입니다. 나머지는 모두 순응과 유사한 의미입니다."},
{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"새로운 제도 도입으로 업무 처리 절차가 간소화되었다.\"", choices:["복잡화","세분화","단순화","다양화"], answer:2, explanation:"'간소화'는 간단하고 소박하게 한다는 뜻으로 '단순화'와 의미가 유사합니다."},
{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"이 사업은 막대한 예산이 소요되어 신중한 검토가 필요하다.\"", choices:["막연한","엄청난","미미한","일정한"], answer:1, explanation:"'막대하다'는 규모나 양이 매우 크다는 뜻으로 '엄청나다'와 의미가 유사합니다."},
{category:"의사소통능력", question:"풍전등화, 금상첨화 등 다음 사자성어의 뜻으로 올바르게 연결된 것은?", choices:["풍전등화(風前燈火) - 매우 위태로운 상황","금상첨화(錦上添花) - 이미 나쁜 상황이 더 나빠짐","타산지석(他山之石) - 자기 실속만 차림","고육지책(苦肉之策) - 아무 노력 없이 얻는 이익"], answer:0, explanation:"풍전등화는 바람 앞의 등불처럼 매우 위태로운 상황을 뜻합니다. 금상첨화는 좋은 일에 더 좋은 일이 더해짐, 타산지석은 다른 사람의 언행도 자기 수양에 도움이 됨, 고육지책은 자신을 희생해 짜낸 방책을 의미합니다."},
{category:"의사소통능력", question:"\"회사가 어려운 상황에서도 자신의 이익만 챙기려는 태도를 보였다.\" 이러한 태도를 가장 잘 나타내는 사자성어는?", choices:["아전인수(我田引水)","동고동락(同苦同樂)","일편단심(一片丹心)","과유불급(過猶不及)"], answer:0, explanation:"아전인수는 자기 논에만 물을 끌어댄다는 뜻으로, 자기에게만 이롭게 행동함을 의미합니다."},
{category:"의사소통능력", question:"'과유불급(過猶不及)'의 의미로 가장 적절한 것은?", choices:["지나친 것은 부족한 것보다 못하다","한 가지 일로 두 가지 이득을 얻다","시작은 있으나 끝이 없다","작은 일도 무시하면 안 된다"], answer:0, explanation:"과유불급은 정도를 지나치면 오히려 부족한 것과 다름없다는 뜻입니다."},
{category:"의사소통능력", question:"\"여러 번의 실패에도 굴하지 않고 끝내 목표를 이루어냈다.\" 이러한 상황과 가장 잘 어울리는 사자성어는?", choices:["우공이산(愚公移山)","조삼모사(朝三暮四)","유비무환(有備無患)","사면초가(四面楚歌)"], answer:0, explanation:"우공이산은 우공이 산을 옮긴다는 뜻으로, 꾸준한 노력이 큰 일을 이룬다는 의미입니다."},
{category:"의사소통능력", question:"다음 사자성어와 뜻의 연결이 옳지 않은 것은?", choices:["일석이조(一石二鳥) - 한 가지 일로 두 가지 이익을 얻음","고진감래(苦盡甘來) - 고생 끝에 낙이 옴","동상이몽(同床異夢) - 같은 처지에서도 서로 다른 생각을 함","청천벽력(靑天霹靈) - 매우 즐거운 소식"], answer:3, explanation:"청천벽력은 맑게 갠 하늘에서 치는 벼락처럼 갑작스러운 충격적 소식이나 사건을 뜻하며, '즐거운 소식'을 의미하지 않습니다."},
{category:"의사소통능력", question:"\"협상이 결렬되어 회사가 곤란한 처지에 놓였다.\" 이러한 상황을 나타내는 사자성어로 가장 적절한 것은?", choices:["진퇴양난(進退兩難)","새옹지마(塞翁之馬)","전화위복(轉禍爲福)","금의환향(錦衣還鄕)"], answer:0, explanation:"진퇴양난은 나아가지도 물러서지도 못하는 곤란한 처지를 뜻합니다."},
{category:"의사소통능력", question:"'역지사지(易地思之)'의 의미로 가장 적절한 것은?", choices:["처지를 바꾸어서 생각해 봄","자신의 잘못을 깨닫지 못함","남의 도움 없이 혼자 해결함","겉과 속이 서로 다름"], answer:0, explanation:"역지사지는 다른 사람의 처지에서 생각해 본다는 뜻입니다."},
{category:"의사소통능력", question:"\"실패를 통해 오히려 더 좋은 결과를 얻게 되었다.\" 이러한 상황과 가장 잘 어울리는 사자성어는?", choices:["전화위복(轉禍爲福)","자업자득(自業自得)","설상가상(雪上加霜)","토사구팽(兎死狗烹)"], answer:0, explanation:"전화위복은 화가 바뀌어 오히려 복이 된다는 뜻입니다."},
{category:"의사소통능력", question:"각골난망, 수수방관 등 다음 사자성어의 뜻으로 올바르게 연결된 것은?", choices:["각골난망(刻骨難忘) - 은혜가 뼈에 새길 만큼 커서 잊기 어려움","수수방관(袖手傍觀) - 적극적으로 나서서 도움","임기응변(臨機應變) - 원칙만을 고집함","호가호위(狐假虎威) - 스스로의 힘으로 위엄을 세움"], answer:0, explanation:"각골난망은 입은 은혜가 뼈에 새길 만큼 커서 잊을 수 없다는 뜻입니다. 수수방관은 팔짱 끼고 지켜만 봄, 임기응변은 상황에 맞게 대처함, 호가호위는 남의 권세를 빌려 위세를 부림을 뜻합니다."},
{category:"의사소통능력", question:"\"그는 목표를 위해 온갖 어려움과 굴욕을 참고 견뎌냈다.\" 이러한 태도와 가장 잘 어울리는 사자성어는?", choices:["와신상담(臥薪嘗膽)","수주대토(守株待兎)","토사구팽(兎死狗烹)","오리무중(五里霧中)"], answer:0, explanation:"와신상담은 섶에 눕고 쓸개를 맛본다는 뜻으로, 목표를 이루기 위해 어려움을 참고 견딤을 의미합니다."},
{category:"의사소통능력", question:"다음 글의 중심 내용으로 가장 적절한 것은?\n\"최근 몇 년간 국내 1인 가구가 빠르게 증가하면서 소량 포장 식품과 소형 가전제품에 대한 수요도 함께 늘고 있다. 유통업계는 이러한 흐름에 맞춰 기존의 대용량 제품 라인을 축소하고, 소포장·소용량 상품의 비중을 확대하고 있다.\"", choices:["1인 가구 증가에 따른 소포장 상품 수요 확대와 유통업계의 대응","대형 가전제품의 판매 부진 원인","1인 가구의 주거 형태 변화","식품 가격 상승의 배경"], answer:0, explanation:"지문은 1인 가구 증가로 소포장·소용량 상품 수요가 늘고 유통업계가 이에 대응하고 있다는 내용을 다루고 있습니다."},
{category:"의사소통능력", question:"다음 글에서 설명하는 공동판매의 주된 효과로 가장 적절한 것은?\n\"농협은 조합원들이 생산한 농산물을 공동으로 판매함으로써 개별 농가가 겪는 판로 확보의 어려움을 줄이고, 유통 단계를 축소하여 농가의 수취 가격을 높이는 역할을 한다.\"", choices:["농가의 생산량을 강제로 제한하는 효과","개별 판로 확보의 어려움 해소 및 농가 수취가격 상승","농산물의 품질을 균일화하는 효과","농산물 수입을 대체하는 효과"], answer:1, explanation:"지문은 공동판매가 판로 확보의 어려움을 줄이고 유통 단계 축소로 수취가격을 높인다고 설명합니다."},
{category:"의사소통능력", question:"다음 글의 내용과 일치하지 않는 것은?\n\"중앙은행이 정책금리를 인상하면 시중은행의 대출금리와 예금금리도 함께 오르는 경향이 있다. 이는 기업과 가계의 자금 조달 비용을 높여 소비와 투자를 둔화시키고, 결과적으로 물가 상승 압력을 완화하는 효과를 가져온다.\"", choices:["정책금리 인상은 대출금리 상승으로 이어질 수 있다.","정책금리 인상은 소비와 투자를 둔화시킬 수 있다.","정책금리 인상은 물가 상승 압력을 완화하는 효과가 있다.","정책금리 인상은 예금금리를 반드시 하락시킨다."], answer:3, explanation:"지문에 따르면 정책금리 인상은 예금금리를 오히려 상승시키는 경향이 있으므로 ④는 일치하지 않습니다."},
{category:"의사소통능력", question:"다음 글에서 물류센터 자동화의 효과로 언급된 것은?\n\"전자상거래의 확대로 택배 물량이 급증하면서 물류센터의 자동화 설비 도입이 활발해지고 있다. 로봇을 이용한 분류 시스템은 처리 속도를 높이는 동시에 인력 부족 문제를 완화하는 데 기여하고 있다.\"", choices:["처리 속도 향상과 인력 부족 완화","택배 요금의 전면 폐지","전자상거래 시장의 축소","물류센터 수의 감소"], answer:0, explanation:"지문은 자동화 설비가 처리 속도를 높이고 인력 부족 문제를 완화한다고 설명합니다."},
{category:"의사소통능력", question:"다음 글의 내용과 가장 부합하는 것은?\n\"귀농·귀촌 인구가 늘면서 지방자치단체들은 초기 정착을 돕기 위한 주거 지원, 영농 교육, 창업 자금 지원 등 다양한 정책을 마련하고 있다. 그러나 정보 접근성의 지역별 격차로 인해 지원의 실효성에는 차이가 나타나고 있다.\"", choices:["모든 지역에서 귀농·귀촌 지원의 효과가 동일하게 나타난다.","지자체의 지원 정책이 있어도 지역별 정보 격차로 효과 차이가 있을 수 있다.","귀농·귀촌 인구는 최근 감소하고 있다.","영농 교육은 지원 정책에서 제외되어 있다."], answer:1, explanation:"지문은 지원 정책이 있어도 정보 접근성의 지역별 격차로 효과에 차이가 나타난다고 설명합니다."},
{category:"의사소통능력", question:"다음 글에서 환율 변동의 영향을 받는 대상으로 언급되지 않은 것은?\n\"환율은 한 나라의 화폐와 다른 나라 화폐의 교환 비율을 의미하며, 수출입 기업의 실적뿐 아니라 해외여행, 유학, 원자재 수입 물가 등 국민 생활 전반에 영향을 미친다.\"", choices:["수출입 기업의 실적","해외여행 경비","국내 부동산 등기 절차","원자재 수입 물가"], answer:2, explanation:"지문에서 국내 부동산 등기 절차는 환율 변동의 영향으로 언급되지 않았습니다."},
{category:"의사소통능력", question:"다음 글에서 재래시장의 과제로 언급된 것은?\n\"재래시장 활성화를 위해 일부 지역에서는 온누리상품권 사용처를 확대하고, 주차 공간을 늘리는 등 접근성을 개선하는 사업을 추진하고 있다. 다만 상인들의 고령화와 후계자 부족은 여전히 해결해야 할 과제로 남아 있다.\"", choices:["온누리상품권 폐지","상인의 고령화와 후계자 부족","주차 공간의 과잉 공급","대형마트와의 통합"], answer:1, explanation:"지문은 상인의 고령화와 후계자 부족을 재래시장의 남은 과제로 언급하고 있습니다."},
{category:"의사소통능력", question:"다음 글의 내용으로 볼 때, 인공지능 도입의 결과로 가장 적절한 것은?\n\"최근 기업들은 인공지능을 활용해 고객 상담 업무의 일부를 자동화하고 있다. 이를 통해 단순 문의에 대한 응답 시간을 줄이는 대신, 상담 인력은 복잡하고 전문적인 상담에 집중할 수 있게 되었다.\"", choices:["상담 인력이 전면 폐지되었다.","단순 문의 응답 시간이 줄고 상담 인력은 전문 상담에 집중하게 되었다.","고객 문의량이 감소하였다.","기업의 상담 비용이 무조건 증가하였다."], answer:1, explanation:"지문은 인공지능 도입으로 단순 문의 응답 시간이 줄고 상담 인력이 전문 상담에 집중하게 되었다고 설명합니다."},
{category:"의사소통능력", question:"다음 글에서 인력 부족 문제에 대한 대응으로 언급된 것은?\n\"저출산·고령화가 심화되면서 생산 가능 인구가 줄어들고 있다. 이에 따라 기업들은 정년 연장, 외국인 인력 활용 등을 통해 인력 부족 문제에 대응하려는 움직임을 보이고 있다.\"", choices:["정년 연장과 외국인 인력 활용","생산설비의 해외 이전만 추진","신입사원 채용의 전면 중단","근로시간의 대폭 축소"], answer:0, explanation:"지문은 정년 연장과 외국인 인력 활용을 인력 부족 대응책으로 언급하고 있습니다."},
{category:"의사소통능력", question:"다음 글의 내용과 일치하는 것은?\n\"탄소중립 정책이 강화되면서 기업들은 온실가스 배출을 줄이기 위한 설비 투자에 나서고 있다. 초기 투자 비용은 크지만, 장기적으로는 에너지 효율 개선을 통해 운영비를 절감할 수 있다는 분석이 나온다.\"", choices:["탄소중립 설비 투자는 초기 비용이 들지 않는다.","설비 투자는 장기적으로 운영비 절감에 기여할 수 있다.","탄소중립 정책은 기업의 투자를 감소시킨다.","온실가스 배출 감축은 운영비와 무관하다."], answer:1, explanation:"지문은 설비 투자가 장기적으로 운영비 절감에 기여할 수 있다고 설명합니다."},
{category:"의사소통능력", question:"다음 글에서 설명하는 협동조합의 조합원 교육의 목적으로 가장 적절한 것은?\n\"협동조합은 조합원 교육과 정보 제공을 통해 조합원의 권익을 보호하는 기능도 수행한다. 이는 조합원이 단순히 사업의 이용자로 머무는 것이 아니라, 조합 운영에 대한 이해를 바탕으로 의사결정에 참여할 수 있도록 돕는다.\"", choices:["조합원의 이용료를 낮추기 위해서","조합원이 조합 운영에 대한 이해를 바탕으로 의사결정에 참여하게 하기 위해서","조합원의 수를 늘리기 위해서","조합의 직원 채용을 확대하기 위해서"], answer:1, explanation:"지문은 조합원 교육의 목적이 조합 운영에 대한 이해를 바탕으로 의사결정에 참여하게 하는 것이라고 설명합니다."},
{category:"의사소통능력", question:"다음 글의 중심 내용으로 가장 적절한 것은?\n\"최근 소비자들은 제품의 가격과 품질뿐 아니라 기업의 환경·사회적 책임까지 구매 결정의 기준으로 삼는 경향이 강해지고 있다. 이에 따라 기업들도 지속가능성을 경영 전략의 핵심 요소로 반영하고 있다.\"", choices:["소비자의 구매 기준 변화와 기업의 지속가능 경영 전략 반영","제품 가격 하락 추세","기업의 해외 진출 확대","소비자 불만 증가 원인"], answer:0, explanation:"지문은 소비자의 구매 기준 변화와 기업의 지속가능 경영 전략 반영을 중심 내용으로 다루고 있습니다."},
{category:"의사소통능력", question:"다음 글에서 금융기관의 대응으로 언급된 것은?\n\"보이스피싱 범죄가 다양한 수법으로 진화하면서 금융기관들은 이상 거래 탐지 시스템을 고도화하고, 고령층을 대상으로 한 예방 교육을 강화하고 있다. 그러나 신종 수법이 계속 등장해 피해 예방에 어려움이 있다.\"", choices:["이상 거래 탐지 시스템 고도화와 예방 교육 강화","모든 계좌의 거래를 전면 중단","현금 인출 제도의 완전 폐지","고령층 대상 서비스의 전면 축소"], answer:0, explanation:"지문은 이상 거래 탐지 시스템 고도화와 예방 교육 강화를 금융기관의 대응으로 언급하고 있습니다."},
{category:"의사소통능력", question:"다음 글의 내용과 일치하는 것은?\n\"청년층의 자산 형성을 돕기 위해 정부와 금융기관은 정기적으로 저축하면 정부가 지원금을 추가로 얹어주는 방식의 정책형 금융상품을 운영하고 있다. 다만 가입 대상과 소득 기준에 제한이 있어 모든 청년이 혜택을 받는 것은 아니다.\"", choices:["해당 금융상품은 소득 기준과 관계없이 모든 청년이 가입할 수 있다.","정부는 청년의 저축에 지원금을 추가하는 방식의 상품을 운영한다.","이 상품은 민간 기업이 단독으로 운영한다.","가입 대상에는 제한이 전혀 없다."], answer:1, explanation:"지문은 정부가 청년의 저축에 지원금을 추가하는 방식의 정책형 금융상품을 운영한다고 설명합니다."},
{category:"의사소통능력", question:"다음 글에서 농가의 대응 방법으로 언급된 것은?\n\"기후 변화로 인한 이상 기후는 농작물의 수확 시기와 생산량에 직접적인 영향을 미친다. 이에 대응하기 위해 농가에서는 재해에 강한 품종을 도입하거나 재배 시기를 조정하는 등의 방법을 활용하고 있다.\"", choices:["재해에 강한 품종 도입과 재배 시기 조정","농지 면적의 무조건적 확대","모든 작물 재배의 중단","수확량과 관계없는 가격 고정"], answer:0, explanation:"지문은 재해에 강한 품종 도입과 재배 시기 조정을 농가의 대응 방법으로 언급하고 있습니다."},
{category:"의사소통능력", question:"의사소통의 종류 중 '문서적 의사소통'에 해당하지 않는 것은?", choices:["이메일 발송","기획서 작성","전화 통화","공문서 결재"], answer:2, explanation:"전화 통화는 언어적(구두) 의사소통에 해당하며, 나머지는 문서를 통한 의사소통입니다."},

{category:"의사소통능력", question:"다음 중 문장이 어법상 자연스러운 것은?", choices:["이번 사업의 목적은 지역 경제를 활성화하는 데 있다.","이번 사업의 목적은 지역 경제를 활성화한다.","이번 사업이 목적은 지역 경제를 활성화하는 데 있다.","이번 사업의 목적이 지역 경제를 활성화하는 데 두었다."], answer:0, explanation:"'목적은 ~하는 데 있다' 구조가 주어와 서술어의 호응이 가장 자연스럽습니다."},

{category:"의사소통능력", question:"다음 중 어휘 사용이 올바른 것은?", choices:["이 자리를 빌어 감사의 말씀을 전합니다.","이 자리를 빌려 감사의 말씀을 전합니다.","이 자리를 빌러 감사의 말씀을 전합니다.","이 자리를 빌미로 감사의 말씀을 전합니다."], answer:1, explanation:"특정 기회를 이용한다는 뜻으로 쓸 때는 '빌리다'의 활용형인 '빌려'가 표준 표기입니다."},
{category:"의사소통능력", question:"다음 중 맞춤법과 띄어쓰기가 모두 올바른 문장은?", choices:["담당자에게 문의드린 결과, 다음과 같이 안내드립니다.","담당자에게 문의드린 결과, 다음과같이 안내드립니다.","담당자한태 문의드린 결과, 다음과 같이 안내드립니다.","담당자에게 문의드린바, 다음과 같이 안내드립니다."], answer:0, explanation:"②는 '다음과 같이'를 붙여 쓴 띄어쓰기 오류, ③은 '한테'를 '한태'로 잘못 표기한 오류, ④는 의존명사 '바'를 붙여 쓴 띄어쓰기 오류입니다."},
{category:"의사소통능력", question:"다음 문장을 논리적 순서대로 배열한 것은?\n(가) 그러나 최근에는 온라인 플랫폼을 통한 직거래가 늘면서 이러한 구조에 변화가 나타나고 있다.\n(나) 이는 유통 단계를 줄여 생산자와 소비자 모두에게 이익이 될 수 있다는 기대를 낳고 있다.\n(다) 전통적으로 농산물은 생산자에서 도매상, 소매상을 거쳐 소비자에게 전달되는 다단계 유통 구조를 가지고 있었다.\n(라) 다만 신선도 유지와 물류 인프라 구축 등 해결해야 할 과제도 함께 지적된다.", choices:["(다)-(가)-(나)-(라)","(가)-(다)-(나)-(라)","(다)-(나)-(가)-(라)","(나)-(다)-(가)-(라)"], answer:0, explanation:"전통적 구조 설명(다) → 최근 변화(가) → 변화의 기대효과(나) → 남은 과제(라) 순으로 전개되는 것이 논리적입니다."},
{category:"의사소통능력", question:"다음 문장을 논리적 순서대로 배열한 것은?\n(가) 이러한 이유로 전문가들은 규칙적인 운동과 균형 잡힌 식습관을 함께 강조한다.\n(나) 최근 연구에 따르면 수면 부족은 집중력 저하뿐 아니라 면역력 약화와도 관련이 있다.\n(다) 즉, 충분한 수면은 단순한 휴식을 넘어 건강 관리의 핵심 요소로 볼 수 있다.\n(라) 실제로 수면 시간이 부족한 사람들은 감염성 질환에 걸릴 확률이 더 높다는 조사 결과도 있다.", choices:["(나)-(라)-(다)-(가)","(나)-(다)-(라)-(가)","(다)-(나)-(라)-(가)","(라)-(나)-(다)-(가)"], answer:0, explanation:"연구 결과 제시(나) → 구체적 근거(라) → 결론 도출(다) → 추가 제언(가) 순으로 배열하는 것이 자연스럽습니다."},
{category:"의사소통능력", question:"다음 문장을 논리적 순서대로 배열한 것은?\n(가) 그 결과 소비자들은 이전보다 다양한 상품을 비교하며 구매할 수 있게 되었다.\n(나) 모바일 쇼핑이 대중화되면서 소비자의 구매 방식이 크게 변화하였다.\n(다) 그러나 정보가 지나치게 많아 오히려 선택에 어려움을 겪는 소비자도 늘고 있다.\n(라) 언제 어디서든 손쉽게 상품 정보를 검색하고 주문할 수 있게 된 것이다.", choices:["(나)-(라)-(가)-(다)","(나)-(가)-(라)-(다)","(라)-(나)-(가)-(다)","(가)-(나)-(라)-(다)"], answer:0, explanation:"변화 언급(나) → 구체적 설명(라) → 긍정적 결과(가) → 부정적 측면(다) 순으로 배열하는 것이 자연스럽습니다."},
{category:"의사소통능력", question:"다음 문장을 논리적 순서대로 배열한 것은?\n(가) 이에 따라 정부는 재생에너지 발전 비중을 확대하는 정책을 추진하고 있다.\n(나) 화석연료 사용에 따른 온실가스 배출은 기후 변화의 주요 원인으로 지목된다.\n(다) 다만 초기 설비 투자 비용과 간헐적인 발전량 문제는 여전히 해결해야 할 과제이다.\n(라) 태양광과 풍력 등이 대표적인 재생에너지원으로 꼽힌다.", choices:["(나)-(가)-(라)-(다)","(가)-(나)-(라)-(다)","(나)-(라)-(가)-(다)","(라)-(나)-(가)-(다)"], answer:0, explanation:"문제 제기(나) → 정책적 대응(가) → 구체적 사례(라) → 남은 과제(다) 순서가 논리적입니다."},
{category:"의사소통능력", question:"다음 문장을 논리적 순서대로 배열한 것은?\n(가) 그러나 지나친 의존은 사고 발생 시 대처 능력을 저하시킬 수 있다는 우려도 제기된다.\n(나) 자율주행 기술이 발전하면서 운전자의 개입 없이도 주행이 가능한 차량이 늘고 있다.\n(다) 이는 교통사고를 줄이고 운전자의 피로를 덜어줄 수 있다는 점에서 긍정적으로 평가된다.\n(라) 따라서 기술 발전과 함께 안전성 검증 체계도 함께 마련되어야 한다는 목소리가 크다.", choices:["(나)-(다)-(가)-(라)","(나)-(가)-(다)-(라)","(다)-(나)-(가)-(라)","(나)-(다)-(라)-(가)"], answer:0, explanation:"기술 소개(나) → 긍정적 평가(다) → 우려 제기(가) → 대안 제시(라) 순으로 배열하는 것이 논리적입니다."},
/* ===================== 수리능력 ===================== */
{category:"수리능력", question:"물류센터에서 사과 상자 240개를 트럭 A와 B에 나누어 실었다. A트럭에 실은 개수가 B트럭의 1.4배일 때, A트럭에 실은 사과 상자는?", choices:["120개","140개","150개","160개"], answer:1, explanation:"B트럭 개수를 x라 하면 A=1.4x, x+1.4x=240 → 2.4x=240 → x=100, A=1.4×100=140개."},
{category:"수리능력", question:"정가 40,000원인 상품을 20% 할인한 후 다시 10% 추가 할인하여 판매했다. 최종 판매가는?", choices:["27,000원","28,000원","28,800원","29,500원"], answer:2, explanation:"40,000×0.8=32,000, 32,000×0.9=28,800원."},
{category:"수리능력", question:"A는 혼자 하면 12일, B는 혼자 하면 18일 걸리는 일이 있다. 두 사람이 함께 하면 며칠 걸리는가?", choices:["6일","7.2일","8일","9일"], answer:1, explanation:"하루 작업량은 1/12+1/18=3/36+2/36=5/36. 전체 일수는 36/5=7.2일."},
{category:"수리능력", question:"원금 1,000,000원을 연이율 4%의 단리로 2년간 예치했을 때 받는 총 이자는?", choices:["40,000원","80,000원","120,000원","160,000원"], answer:1, explanation:"단리 이자 = 원금×이율×기간 = 1,000,000×0.04×2=80,000원."},
{category:"수리능력", question:"어떤 상품의 원가에 20%의 이익을 붙여 정가를 정한 후, 정가에서 10% 할인하여 판매했더니 800원의 이익을 얻었다. 원가는?", choices:["8,000원","9,000원","10,000원","11,000원"], answer:2, explanation:"원가를 c라 하면 판매가=1.2c×0.9=1.08c, 이익=0.08c=800 → c=10,000원."},
{category:"수리능력", question:"주머니에 빨간공 3개, 파란공 5개가 있다. 임의로 2개를 꺼낼 때 모두 빨간공일 확률은?", choices:["1/28","3/28","3/56","1/8"], answer:1, explanation:"전체 경우의 수 C(8,2)=28, 빨간공 2개를 뽑는 경우 C(3,2)=3. 확률=3/28."},
{category:"수리능력", question:"창고의 쌀 재고가 지난달보다 15% 감소하여 현재 1,700포대이다. 지난달 재고는 몇 포대인가?", choices:["1,900포대","1,950포대","2,000포대","2,050포대"], answer:2, explanation:"지난달 재고를 x라 하면 x×0.85=1,700 → x=2,000포대."},
{category:"수리능력", question:"연도별 조합원 수가 2023년 210만 명, 2024년 220.5만 명일 때, 2023년 대비 2024년 증가율은?", choices:["3%","4%","5%","6%"], answer:2, explanation:"(220.5-210)/210=10.5/210=0.05=5%."},
{category:"수리능력", question:"자동차가 처음에는 시속 100km로 달리다가 이후 시속 50km로 속도를 줄여 총 300km를 4시간 동안 주행했다. 시속 100km로 달린 시간은?", choices:["1시간","1.5시간","2시간","2.5시간"], answer:2, explanation:"100km로 달린 시간을 t라 하면 100t+50(4-t)=300 → 50t=100 → t=2시간."},
{category:"수리능력", question:"각 자리 숫자의 합이 9인 두 자리 자연수가 있다. 십의 자리와 일의 자리를 바꾼 수가 원래 수보다 27 크다면, 원래 수는?", choices:["27","36","45","54"], answer:1, explanation:"십의 자리 a, 일의 자리 b, a+b=9. (10b+a)-(10a+b)=9(b-a)=27→b-a=3. 연립하면 a=3,b=6, 원래 수=36 (검증: 63-36=27)."},
{category:"수리능력", question:"두 수의 비가 3:5이고 합이 96일 때, 큰 수는?", choices:["48","54","60","66"], answer:2, explanation:"3x+5x=96→x=12. 큰 수=5×12=60."},
{category:"수리능력", question:"상품 A는 원가 대비 20% 이익, 상품 B는 원가 대비 20% 손실로 판매했는데 두 상품의 판매가가 같았다. A의 원가가 40,000원일 때 B의 원가는?", choices:["50,000원","55,000원","60,000원","65,000원"], answer:2, explanation:"A 판매가=40,000×1.2=48,000원. B원가×0.8=48,000 → B원가=60,000원."},
{category:"수리능력", question:"형과 동생이 어떤 금액을 5:3으로 나누었더니 형이 동생보다 48,000원 더 많이 받았다. 전체 금액은?", choices:["168,000원","180,000원","192,000원","204,000원"], answer:2, explanation:"5x-3x=2x=48,000 → x=24,000. 전체=8x=192,000원."},
{category:"수리능력", question:"A직원은 1건당 6분, B직원은 1건당 4분이 걸린다. 두 직원이 동시에 각자 독립적으로 업무를 처리할 때, 총 60건을 처리하는 데 걸리는 시간은?", choices:["120분","132분","144분","156분"], answer:2, explanation:"A의 처리율 1/6건/분, B는 1/4건/분. 합산 처리율=1/6+1/4=5/12건/분. 시간=60÷(5/12)=144분."},
{category:"수리능력", question:"A, B, C 세 지점의 월 매출액이 각각 120백만원, 150백만원, 180백만원일 때, 세 지점의 평균 매출액은?", choices:["140백만원","145백만원","150백만원","155백만원"], answer:2, explanation:"(120+150+180)÷3=450÷3=150백만원."},
{category:"수리능력", question:"상품 가격이 작년에 10% 상승했고, 올해 다시 10% 하락했다. 2년 전 가격이 100,000원이었다면 현재 가격은?", choices:["98,000원","99,000원","100,000원","101,000원"], answer:1, explanation:"100,000×1.1×0.9=99,000원."},
{category:"수리능력", question:"농도 10%의 소금물 200g에 물을 추가하여 농도 5%의 소금물을 만들려고 한다. 추가해야 하는 물의 양은?", choices:["150g","180g","200g","220g"], answer:2, explanation:"소금의 양은 200×0.1=20g으로 일정. 20÷(200+x)=0.05 → 200+x=400 → x=200g."},
{category:"수리능력", question:"지점장 후보 5명 중 지점장 1명과 부지점장 1명을 뽑는 방법의 수는? (두 직책은 구분됨)", choices:["10가지","15가지","20가지","25가지"], answer:2, explanation:"순서가 있는 선택이므로 순열 P(5,2)=5×4=20가지."},
{category:"수리능력", question:"남자직원 4명, 여자직원 3명 중 대표 2명을 뽑을 때, 남자 1명과 여자 1명이 뽑힐 확률은?", choices:["2/7","3/7","4/7","5/7"], answer:2, explanation:"전체 경우 C(7,2)=21. 남1·여1 조합 경우=4×3=12. 확률=12/21=4/7."},
{category:"수리능력", question:"월~일 요일별 방문 고객 수가 100, 120, 90, 110, 130, 80, 70명일 때, 일주일 평균 방문 고객 수는?", choices:["95명","100명","105명","110명"], answer:1, explanation:"합계=100+120+90+110+130+80+70=700. 700÷7=100명."},
{category:"수리능력", question:"A는 혼자 하면 8일, B는 혼자 하면 24일 걸리는 일이 있다. 두 사람이 함께 하면 며칠 걸리는가?", choices:["4일","6일","8일","12일"], answer:1, explanation:"하루 작업량 1/8+1/24=3/24+1/24=4/24=1/6. 전체 일수=6일."},
{category:"수리능력", question:"어떤 일을 A가 혼자 하면 15일, A와 B가 함께 하면 6일 걸린다. B가 혼자 하면 며칠 걸리는가?", choices:["9일","10일","12일","15일"], answer:1, explanation:"1/15+1/B=1/6 → 1/B=1/6-1/15=5/30-2/30=3/30=1/10 → B=10일."},
{category:"수리능력", question:"물탱크를 채우는데 A호스는 4시간, B호스는 6시간 걸린다. 두 호스를 동시에 사용하면 몇 시간 걸리는가?", choices:["2시간","2.4시간","3시간","3.6시간"], answer:1, explanation:"1/4+1/6=3/12+2/12=5/12. 걸리는 시간=12/5=2.4시간."},
{category:"수리능력", question:"甲, 乙, 丙 세 사람이 함께 일하면 4일에 끝나는 일이 있다. 甲이 혼자하면 12일, 乙이 혼자하면 24일 걸릴 때, 丙이 혼자 하면 며칠 걸리는가?", choices:["6일","8일","10일","16일"], answer:1, explanation:"1/12+1/24=1/8. 1/丙=1/4-1/8=1/8 → 丙=8일."},
{category:"수리능력", question:"어떤 프로젝트를 5명이 하면 18일 걸린다. 이 프로젝트를 9일 만에 끝내려면 최소 몇 명이 필요한가? (1인당 생산성 동일)", choices:["7명","9명","10명","12명"], answer:2, explanation:"총 작업량=5×18=90인일. 9일에 필요한 인원=90÷9=10명."},
{category:"수리능력", question:"A는 혼자 하면 15일이 걸리는 일이 있다. A가 5일 동안 일하다가 그만두었고, 나머지를 B가 혼자 8일 만에 마쳤다. B가 혼자 처음부터 끝까지 한다면 며칠이 걸리는가?", choices:["10일","12일","14일","16일"], answer:1, explanation:"A가 5일간 한 작업량=5/15=1/3. 남은 2/3을 B가 8일에 완료 → B의 하루 작업량=1/12 → 전체 완료 시간=12일."},
{category:"수리능력", question:"원가 15,000원인 물건에 30%의 이익을 붙여 정가를 매겼다. 정가는?", choices:["18,000원","18,500원","19,500원","20,000원"], answer:2, explanation:"15,000×1.3=19,500원."},
{category:"수리능력", question:"정가 25,000원인 상품을 할인하여 팔았더니 판매가가 20,000원이 되었다. 할인율은?", choices:["15%","18%","20%","25%"], answer:2, explanation:"(25,000-20,000)/25,000=5,000/25,000=20%."},
{category:"수리능력", question:"원가에 40% 이익을 붙여 정가를 정했으나 정가의 25%를 할인하여 판매했다. 원가가 20,000원일 때 판매가는?", choices:["19,600원","20,600원","21,000원","22,400원"], answer:2, explanation:"정가=20,000×1.4=28,000원. 판매가=28,000×0.75=21,000원."},
{category:"수리능력", question:"상품을 정가의 20% 할인하여 판매했는데도 원가의 12% 이익을 얻었다. 원가가 25,000원일 때 정가는?", choices:["30,000원","32,000원","35,000원","38,000원"], answer:2, explanation:"판매가=25,000×1.12=28,000원. 정가×0.8=28,000 → 정가=35,000원."},
{category:"수리능력", question:"원가가 8,000원인 상품을 정가의 10% 할인하여 팔아서 원가의 8% 이익을 얻으려 한다. 정가는 얼마로 책정해야 하는가?", choices:["9,200원","9,400원","9,600원","9,800원"], answer:2, explanation:"판매가=8,000×1.08=8,640원. 정가×0.9=8,640 → 정가=9,600원."},
{category:"수리능력", question:"어떤 상품 두 개를 각각 12,000원에 팔았다. 한 개는 원가의 20% 이익을, 다른 한 개는 원가의 20% 손실을 보고 팔았다면, 전체 매매의 손익은?", choices:["손실 1,000원","이익 1,000원","손실 2,000원","이익 없음"], answer:0, explanation:"이익 물건 원가=12,000/1.2=10,000원. 손실 물건 원가=12,000/0.8=15,000원. 총원가=25,000원, 총판매가=24,000원 → 손실 1,000원."},
{category:"수리능력", question:"정가 50,000원인 제품을 두 차례에 걸쳐 각각 10%씩 할인하여 판매했다. 최종 판매가는?", choices:["39,000원","40,000원","40,500원","41,000원"], answer:2, explanation:"50,000×0.9×0.9=40,500원."},
{category:"수리능력", question:"원가의 25% 이익을 기대하고 정가를 매겼는데, 정가에서 12,000원을 할인해서 팔아 원가의 5% 이익만 얻었다. 원가는?", choices:["50,000원","55,000원","60,000원","65,000원"], answer:2, explanation:"정가=1.25c, 판매가=1.25c-12,000=1.05c → 0.2c=12,000 → c=60,000원."},
{category:"수리능력", question:"농도 6%의 소금물 500g과 농도 12%의 소금물 300g을 섞으면 몇 %의 소금물이 되는가?", choices:["7.5%","8%","8.25%","9%"], answer:2, explanation:"소금 총량=500×0.06+300×0.12=30+36=66g. 총량=800g. 농도=66/800=8.25%."},
{category:"수리능력", question:"농도 15%의 소금물 400g에서 물을 증발시켜 농도 20%의 소금물을 만들려고 한다. 증발시켜야 하는 물의 양은?", choices:["80g","100g","120g","150g"], answer:1, explanation:"소금량=400×0.15=60g. 60/(400-x)=0.2 → 400-x=300 → x=100g."},
{category:"수리능력", question:"농도 4%의 설탕물 600g에 설탕 40g을 추가로 넣으면 농도는 몇 %가 되는가?", choices:["8%","9%","10%","12%"], answer:2, explanation:"설탕량=600×0.04+40=24+40=64g. 총량=640g. 농도=64/640=10%."},
{category:"수리능력", question:"농도 10%의 소금물 200g과 농도 20%의 소금물 300g을 섞으면 몇 %의 소금물이 되는가?", choices:["14%","15%","16%","18%"], answer:2, explanation:"소금 총량=200×0.1+300×0.2=20+60=80g. 총량=500g. 농도=80/500=16%."},
{category:"수리능력", question:"농도 9%의 소금물 300g에서 소금물 100g을 퍼내고, 그 자리에 물 100g을 부었다. 새로 만들어진 소금물의 농도는?", choices:["5%","6%","7%","9%"], answer:1, explanation:"퍼내고 남은 200g의 농도는 여전히 9%이므로 소금량=18g. 물 100g을 더해 총 300g → 농도=18/300=6%."},
{category:"수리능력", question:"물 180g에 소금 20g을 넣어 소금물을 만들었다. 이 소금물의 농도는?", choices:["8%","9%","10%","12%"], answer:2, explanation:"소금물 총량=180+20=200g. 농도=20/200=10%."},
{category:"수리능력", question:"A는 시속 4km로 걷고, B는 A보다 1시간 늦게 같은 지점에서 출발하여 시속 6km로 걸어 A를 따라간다. B가 출발한 지 몇 시간 후에 A를 따라잡는가?", choices:["1시간","1.5시간","2시간","2.5시간"], answer:2, explanation:"B의 이동시간을 t라 하면 A의 이동시간은 t+1. 이동거리가 같으므로 4(t+1)=6t → t=2시간."},
{category:"수리능력", question:"둘레가 3km인 호수를 A는 시속 6km, B는 반대방향으로 시속 9km로 동시에 출발하여 걷는다. 두 사람이 처음 만나는 데 걸리는 시간은?", choices:["10분","12분","15분","20분"], answer:1, explanation:"반대방향이므로 합산 속도=15km/h. 시간=3/15=0.2시간=12분."},
{category:"수리능력", question:"기차가 길이 200m인 다리를 완전히 통과하는 데 20초가 걸렸다. 기차의 길이가 100m라면 기차의 속력(m/s)은?", choices:["10m/s","12m/s","15m/s","20m/s"], answer:2, explanation:"다리를 완전히 통과하려면 다리길이+기차길이=300m를 이동해야 한다. 속력=300/20=15m/s."},
{category:"수리능력", question:"A와 B는 같은 지점에서 반대 방향으로 동시에 출발하여 각각 시속 5km, 시속 7km로 걷는다. 두 사람 사이의 거리가 36km가 되는 데 걸리는 시간은?", choices:["2시간","3시간","4시간","6시간"], answer:1, explanation:"합산속도=12km/h. 시간=36/12=3시간."},
{category:"수리능력", question:"배가 강물을 거슬러 24km를 가는데 4시간이 걸리고, 같은 거리를 내려올 때는 2시간이 걸린다. 강물의 유속은?", choices:["2km/h","3km/h","4km/h","5km/h"], answer:1, explanation:"거슬러갈 때 속력=24/4=6km/h(배속력-유속). 내려올 때 속력=24/2=12km/h(배속력+유속). 연립하면 배속력=9, 유속=3km/h."},
{category:"수리능력", question:"등산로 왕복 거리가 12km이다. 올라갈 때는 시속 3km, 내려올 때는 시속 6km로 걸었다면, 왕복에 걸린 평균 속력은?", choices:["3.5km/h","4km/h","4.5km/h","5km/h"], answer:1, explanation:"편도 거리=6km. 올라갈 때 2시간, 내려올 때 1시간, 총 3시간에 12km 이동. 평균속력=12/3=4km/h."},
{category:"수리능력", question:"자동차로 240km 거리를 가는데 처음 절반은 시속 80km, 나머지 절반은 시속 60km로 달렸다. 총 걸린 시간은?", choices:["3시간","3.5시간","4시간","4.5시간"], answer:1, explanation:"편도 절반 거리=120km. t1=120/80=1.5시간, t2=120/60=2시간. 총 3.5시간."},
{category:"수리능력", question:"두 지점 A, B 사이의 거리는 90km이다. 갑은 A에서, 을은 B에서 동시에 출발해 서로를 향해 마주보고 달린다. 갑의 속력은 시속 20km, 을의 속력은 시속 25km일 때, 두 사람이 만나는 지점은 A로부터 몇 km 떨어진 곳인가?", choices:["35km","40km","45km","50km"], answer:1, explanation:"합산속도=45km/h. 만나는 시간=90/45=2시간. A로부터 거리=20×2=40km."},
{category:"수리능력", question:"세 사람이 자본금 2:3:5의 비율로 투자하여 총 1억원을 모았다. 가장 많이 투자한 사람의 투자금은?", choices:["3,000만원","4,000만원","5,000만원","6,000만원"], answer:2, explanation:"전체 비율의 합은 10. 가장 많은 몫=5/10×1억=5,000만원."},
{category:"수리능력", question:"어떤 회사의 남녀 직원 비율이 3:2이고 전체 직원이 150명일 때, 여직원 수는?", choices:["50명","60명","75명","90명"], answer:1, explanation:"비율의 합=5. 여직원=2/5×150=60명."},
{category:"수리능력", question:"두 그룹 A, B의 평균 점수가 각각 80점, 90점이고 인원수 비율이 A:B=3:2일 때, 전체 평균 점수는?", choices:["82점","84점","85점","86점"], answer:1, explanation:"전체 평균=(3×80+2×90)/5=(240+180)/5=420/5=84점."},
{category:"수리능력", question:"어떤 금액을 갑, 을, 병이 4:3:2의 비율로 나누었더니 갑이 을보다 20,000원 더 많이 받았다. 병이 받은 금액은?", choices:["30,000원","35,000원","40,000원","45,000원"], answer:2, explanation:"4x-3x=x=20,000. 병=2x=40,000원."},
{category:"수리능력", question:"어떤 상품의 재료비:인건비:기타비용의 비율이 5:3:2이고 총 비용이 60만원일 때, 인건비는?", choices:["15만원","18만원","20만원","24만원"], answer:1, explanation:"비율의 합=10. 인건비=3/10×60만원=18만원."},
{category:"수리능력", question:"두 수의 최대공약수가 12이고 두 수의 비가 3:4일 때, 두 수의 합은?", choices:["72","78","84","96"], answer:2, explanation:"3과 4는 서로소이므로 두 수는 12×3=36, 12×4=48. 합=36+48=84."},
{category:"수리능력", question:"서로 다른 6개의 부서 중 3개 부서를 선택하는 방법의 수는? (순서 무관)", choices:["15","18","20","24"], answer:2, explanation:"조합 C(6,3)=6!/(3!3!)=20."},
{category:"수리능력", question:"7명의 팀원 중 팀장 1명, 부팀장 1명, 총무 1명을 각각 다르게 선출하는 방법의 수는?", choices:["120","150","180","210"], answer:3, explanation:"순열 P(7,3)=7×6×5=210."},
{category:"수리능력", question:"남자 3명, 여자 4명 중에서 대표 3명을 뽑을 때, 뽑는 방법의 수는? (조건 없음)", choices:["21","28","35","42"], answer:2, explanation:"전체 7명 중 3명을 뽑는 조합 C(7,3)=35."},
{category:"수리능력", question:"0,1,2,3,4 다섯 개의 숫자를 한 번씩만 사용하여 만들 수 있는 세 자리 자연수의 개수는? (맨 앞자리는 0이 될 수 없음)", choices:["36","48","60","64"], answer:1, explanation:"백의자리 0제외 4가지, 십의자리 남은 4개 중 4가지, 일의자리 남은 3개 중 3가지. 4×4×3=48."},
{category:"수리능력", question:"5명이 일렬로 서서 사진을 찍을 때, 특정 두 사람 A, B가 항상 이웃하도록 서는 방법의 수는?", choices:["24","36","48","60"], answer:2, explanation:"A,B를 한 묶음으로 보면 4개 단위의 배열 4!=24, A,B 내부 순서 2가지. 24×2=48."},
{category:"수리능력", question:"원탁에 6명이 앉는 원순열의 수는?", choices:["60","100","120","720"], answer:2, explanation:"원순열의 수는 (n-1)!이므로 (6-1)!=5!=120."},
{category:"수리능력", question:"주사위 두 개를 동시에 던질 때, 두 눈의 합이 7이 될 확률은?", choices:["1/6","1/9","1/12","1/4"], answer:0, explanation:"합이 7인 경우는 (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) 6가지. 전체 36가지 중 6/36=1/6."},
{category:"수리능력", question:"한 개의 동전을 3번 던질 때, 앞면이 정확히 2번 나올 확률은?", choices:["1/4","3/8","1/2","5/8"], answer:1, explanation:"C(3,2)×(1/2)^3=3×1/8=3/8."},
{category:"수리능력", question:"상자에 흰 공 4개, 검은 공 6개가 있다. 한 개를 꺼내 확인 후 다시 넣고 또 한 개를 꺼낼 때, 두 번 모두 흰 공일 확률은? (복원추출)", choices:["1/25","2/25","4/25","2/5"], answer:2, explanation:"매번 흰 공을 꺼낼 확률=4/10=2/5. 두 번 모두일 확률=(2/5)²=4/25."},
{category:"수리능력", question:"어떤 시험에 A가 합격할 확률은 0.6, B가 합격할 확률은 0.5이다. 두 사람이 서로 독립적으로 시험을 볼 때, 적어도 한 명이 합격할 확률은?", choices:["0.3","0.5","0.7","0.8"], answer:3, explanation:"적어도 한 명 합격 확률=1-(둘 다 불합격)=1-(0.4×0.5)=1-0.2=0.8."},
{category:"수리능력", question:"1부터 10까지의 숫자가 각각 적힌 카드가 있다. 임의로 한 장을 뽑을 때, 3의 배수 또는 5의 배수가 나올 확률은?", choices:["3/10","2/5","1/2","3/5"], answer:2, explanation:"3의 배수(3,6,9) 3개, 5의 배수(5,10) 2개, 중복 없음. 5/10=1/2."},
{category:"수리능력", question:"주머니에 빨간 구슬 4개, 노란 구슬 2개, 파란 구슬 4개가 있다. 임의로 1개를 꺼낼 때 빨간 구슬이 아닐 확률은?", choices:["2/5","1/2","3/5","7/10"], answer:2, explanation:"전체 10개 중 빨간 구슬이 아닌 것은 6개. 확률=6/10=3/5."},
{category:"수리능력", question:"원금 2,000,000원을 연이율 5%의 단리로 3년간 예치했을 때 만기 시 받는 총액(원금+이자)은?", choices:["2,200,000원","2,250,000원","2,300,000원","2,350,000원"], answer:2, explanation:"이자=2,000,000×0.05×3=300,000원. 총액=2,300,000원."},
{category:"수리능력", question:"원금 1,000,000원을 연이율 10%의 연복리로 2년간 예치했을 때 만기 시 받는 총액은?", choices:["1,100,000원","1,200,000원","1,210,000원","1,220,000원"], answer:2, explanation:"1,000,000×1.1²=1,000,000×1.21=1,210,000원."},
{category:"수리능력", question:"연이율 6%의 단리로 예치하여 1년 후 이자로 90,000원을 받았다면 예치한 원금은?", choices:["1,200,000원","1,350,000원","1,500,000원","1,800,000원"], answer:2, explanation:"원금=90,000÷0.06=1,500,000원."},
{category:"수리능력", question:"원금 500,000원을 월이율 1%의 단리로 8개월간 예치했을 때 받는 이자는?", choices:["32,000원","36,000원","40,000원","44,000원"], answer:2, explanation:"이자=500,000×0.01×8=40,000원."},
{category:"수리능력", question:"어떤 금액을 연이율 8%의 단리로 5년간 예치했더니 이자가 200,000원이었다. 원금은?", choices:["400,000원","450,000원","500,000원","550,000원"], answer:2, explanation:"원금=200,000÷(0.08×5)=200,000÷0.4=500,000원."},
{category:"수리능력", question:"원금 800,000원을 연이율 5%의 연복리로 2년간 예치했을 때 받는 이자(원금 제외)는?", choices:["80,000원","81,000원","82,000원","84,000원"], answer:2, explanation:"800,000×1.05²=882,000원. 이자=882,000-800,000=82,000원."},
{category:"수리능력", question:"어떤 학생의 국어, 영어, 수학 점수 평균이 85점이다. 사회 점수 89점을 포함하여 4개 과목의 평균을 구하면?", choices:["85점","86점","87점","88점"], answer:1, explanation:"국영수 합=85×3=255점. 4과목 합=255+89=344점. 평균=344÷4=86점."},
{category:"수리능력", question:"5개 지점의 평균 매출이 320만원이다. 이 중 한 지점의 매출이 실제보다 50만원 낮게 입력되었다면, 올바른 평균 매출은?", choices:["325만원","330만원","335만원","340만원"], answer:1, explanation:"원래 합계=320×5=1,600만원. 올바른 합계=1,650만원. 평균=1,650÷5=330만원."},
{category:"수리능력", question:"남학생 20명의 평균 키가 172cm, 여학생 30명의 평균 키가 162cm일 때, 전체 학생의 평균 키는?", choices:["164cm","165cm","166cm","167cm"], answer:2, explanation:"합계=20×172+30×162=3,440+4,860=8,300. 인원=50. 평균=8,300÷50=166cm."},
{category:"수리능력", question:"4개의 수 12, 18, 20, x의 평균이 17일 때, x의 값은?", choices:["14","16","18","20"], answer:2, explanation:"합=17×4=68. 12+18+20=50. x=68-50=18."},
{category:"수리능력", question:"어떤 반의 시험 평균이 76점이었는데, 한 명이 전학을 가면서 그 학생의 점수(88점)를 제외하고 다시 계산하니 평균이 75점이 되었다. 전학 전 학생 수는?", choices:["11명","12명","13명","14명"], answer:2, explanation:"전학 전 인원 n, 76n-88=75(n-1) → 76n-88=75n-75 → n=13명."},
{category:"수리능력", question:"세 지점 A, B, C의 직원 수는 각각 10명, 15명, 25명이고 평균 근속연수가 각각 5년, 7년, 9년이다. 세 지점 전체 직원의 평균 근속연수는?", choices:["7년","7.3년","7.6년","8년"], answer:2, explanation:"합=10×5+15×7+25×9=50+105+225=380. 인원=50. 평균=380÷50=7.6년."},
{category:"수리능력", question:"어떤 회사의 매출이 작년 8억원에서 올해 9억 2천만원으로 증가했다. 매출 증가율은?", choices:["10%","12%","15%","18%"], answer:2, explanation:"(9.2-8)/8=1.2/8=0.15=15%."},
{category:"수리능력", question:"인구가 매년 5%씩 증가하는 도시의 현재 인구가 21,000명이라면 1년 전 인구는?", choices:["19,500명","19,800명","20,000명","20,500명"], answer:2, explanation:"1년 전 인구×1.05=21,000 → 1년 전 인구=20,000명."},
{category:"수리능력", question:"어떤 상품의 판매량이 지난달 대비 20% 감소하여 이번달 800개가 판매되었다. 지난달 판매량은?", choices:["900개","950개","1,000개","1,050개"], answer:2, explanation:"지난달×0.8=800 → 지난달=1,000개."},
{category:"수리능력", question:"올해 매출이 작년보다 25% 증가했고, 작년 매출은 재작년보다 20% 감소했다. 재작년 매출이 10억원이었다면 올해 매출은?", choices:["9억원","9.5억원","10억원","10.5억원"], answer:2, explanation:"작년=10억×0.8=8억원. 올해=8억×1.25=10억원."},
{category:"수리능력", question:"어떤 상품의 가격이 두 차례에 걸쳐 각각 10%씩 인상되었다. 최초 가격이 50,000원이었다면 현재 가격은?", choices:["58,000원","60,000원","60,500원","61,000원"], answer:2, explanation:"50,000×1.1×1.1=50,000×1.21=60,500원."},
{category:"수리능력", question:"어떤 지역의 신규 계좌 개설 건수가 2023년 4,000건에서 2024년 4,800건으로 증가했다. 2024년의 전년 대비 증가율은?", choices:["15%","18%","20%","25%"], answer:2, explanation:"(4,800-4,000)/4,000=800/4,000=0.2=20%."},
{category:"수리능력", question:"두 자리 자연수가 있다. 이 수는 각 자리 숫자의 합의 7배이고, 십의 자리 숫자는 일의 자리 숫자보다 2 크다. 이 수는?", choices:["24","35","42","51"], answer:2, explanation:"십의자리 a, 일의자리 b라 하면 a-b=2, 10a+b=7(a+b). 연립하면 a=4,b=2 → 42 (검증: 4+2=6, 6×7=42)."},
{category:"수리능력", question:"두 자리 자연수가 있다. 이 수의 십의 자리와 일의 자리를 바꾼 수는 원래 수보다 45 크며, 두 자리 숫자의 합은 9이다. 원래 수는?", choices:["18","27","36","45"], answer:1, explanation:"십의자리 a, 일의자리 b, b-a=5, a+b=9 → a=2,b=7 → 원래 수 27 (검증: 72-27=45)."},
{category:"수리능력", question:"어떤 두 자리 자연수의 각 자리 숫자의 합은 11이고, 63과 90 사이의 짝수이다. 이 수는?", choices:["65","74","83","92"], answer:1, explanation:"63과 90 사이에서 자릿수 합이 11인 수는 65, 74, 83인데 이 중 짝수는 74뿐이다."},
{category:"수리능력", question:"연속하는 세 자연수의 합이 72일 때, 가장 큰 수는?", choices:["23","24","25","26"], answer:2, explanation:"중간 수를 n이라 하면 (n-1)+n+(n+1)=3n=72 → n=24. 가장 큰 수=25."},
{category:"수리능력", question:"현재 아버지의 나이는 딸의 나이의 3배이고, 두 사람의 나이 합은 52세이다. 딸의 나이는?", choices:["11세","12세","13세","14세"], answer:2, explanation:"딸의 나이를 d라 하면 d+3d=52 → 4d=52 → d=13세."},
{category:"수리능력", question:"현재 어머니의 나이는 아들의 나이보다 24세 많다. 5년 후 어머니의 나이가 아들의 나이의 2배가 된다면, 현재 아들의 나이는?", choices:["17세","19세","21세","23세"], answer:1, explanation:"아들 현재 나이 x, 어머니=x+24. 5년 후 x+29=2(x+5) → x=19세."},
{category:"수리능력", question:"현재 형의 나이는 동생의 나이의 2배이다. 6년 전에는 형의 나이가 동생 나이의 5배였다. 현재 동생의 나이는?", choices:["6세","7세","8세","9세"], answer:2, explanation:"동생 현재 나이 d, 형=2d. 6년 전: 2d-6=5(d-6) → 2d-6=5d-30 → d=8세."},
{category:"수리능력", question:"아버지와 아들의 나이 차는 28세이며, 10년 후 아버지의 나이는 아들 나이의 2배가 된다. 현재 아들의 나이는?", choices:["16세","18세","20세","22세"], answer:1, explanation:"아들 현재 나이 x, 아버지=x+28. 10년 후 x+38=2(x+10) → x=18세."},
{category:"수리능력", question:"한 개당 무게가 3kg인 상자를 트럭에 실으려 하는데, 트럭의 최대 적재량은 450kg이다. 상자를 최대 몇 개까지 실을 수 있는가?", choices:["120개","135개","150개","165개"], answer:2, explanation:"450÷3=150개."},
{category:"수리능력", question:"볼펜 한 개의 가격은 700원이고 예산은 10,000원이다. 볼펜을 최대 몇 개까지 구입할 수 있는가?", choices:["12개","13개","14개","15개"], answer:2, explanation:"10,000÷700=14.28...이므로 최대 14개까지 구입 가능하다."},
{category:"수리능력", question:"어떤 물건을 1개당 1,200원에 판매하여 총비용 90,000원을 회수하려면 최소 몇 개를 팔아야 하는가?", choices:["65개","70개","75개","80개"], answer:2, explanation:"90,000÷1,200=75개."},
{category:"수리능력", question:"버스 한 대에 최대 45명이 탈 수 있다. 총 260명의 인원을 수송하려면 버스가 최소 몇 대 필요한가?", choices:["5대","6대","7대","8대"], answer:1, explanation:"260÷45=5.77...이므로 최소 6대가 필요하다."},
{category:"수리능력", question:"다음은 A지점의 월별 대출 상담 건수이다: 1월 40건, 2월 55건, 3월 65건, 4월 60건. 4개월간 평균 상담 건수는?", choices:["50건","52건","55건","58건"], answer:2, explanation:"합계=40+55+65+60=220건. 평균=220÷4=55건."},
{category:"수리능력", question:"연도별 조합원 저축 총액이 2022년 80억원, 2023년 92억원이었다. 2023년의 전년 대비 증가율은?", choices:["10%","12%","15%","20%"], answer:2, explanation:"(92-80)/80=12/80=0.15=15%."},
{category:"수리능력", question:"상품별 판매 비중이 예금 40%, 대출 35%, 보험 15%, 카드 10%이다. 전체 고객 수가 2,000명일 때, 보험 상품을 이용하는 고객 수는?", choices:["200명","250명","300명","350명"], answer:2, explanation:"2,000×0.15=300명."},
{category:"수리능력", question:"A지점은 직원 10명이 총 350건, B지점은 직원 15명이 총 480건을 처리했다. 직원 1인당 처리 건수가 더 많은 지점과 그 값은?", choices:["A지점, 35건","B지점, 32건","A지점, 32건","B지점, 35건"], answer:0, explanation:"A지점=350÷10=35건/인, B지점=480÷15=32건/인. A지점이 더 많다."},
/* ===================== 문제해결능력 ===================== */
{category:"문제해결능력", question:"\"비가 오면 우산을 챙긴다\"가 참일 때, 다음 중 반드시 참인 것은?", choices:["우산을 챙기면 비가 온다","비가 오지 않으면 우산을 챙기지 않는다","우산을 챙기지 않으면 비가 오지 않는다","비가 오지 않아도 우산을 챙길 수 있다"], answer:2, explanation:"원명제의 대우(우산을 챙기지 않으면 비가 오지 않는다)는 원명제가 참이면 항상 참입니다. ①②는 역·이 관계로 참임이 보장되지 않습니다."},
{category:"문제해결능력", question:"A, B, C, D 네 사람이 일렬로 서 있다. B는 A보다 앞에, C는 D보다 앞에, A는 C보다 앞에 서 있다. 다음 중 항상 참인 것은?", choices:["B가 가장 앞에 선다","C가 가장 앞에 선다","D가 두 번째로 선다","A가 세 번째로 선다"], answer:0, explanation:"조건을 정리하면 B<A<C<D 순서로 완전히 결정됩니다(작을수록 앞). 따라서 B가 항상 가장 앞에 섭니다."},
{category:"문제해결능력", question:"\"모든 사원은 회의에 참석한다\"가 참일 때, 다음 중 항상 참인 것은?", choices:["모든 참석자는 사원이다","회의에 참석하지 않는 사람은 사원이 아니다","발표를 하는 사람은 모두 사원이다","사원이 아니면 회의에 참석하지 않는다"], answer:1, explanation:"원명제(사원→참석)의 대우는 '참석하지 않으면 사원이 아니다'이며, 이는 원명제와 논리적으로 동치이므로 항상 참입니다. ①③④는 역이나 이 관계로 보장되지 않습니다."},
{category:"문제해결능력", question:"A, B, C, D 네 사람 중 한 명이 회의 자료를 분실했다. 세 사람은 진실을, 한 사람만 거짓을 말한다.\nA: \"나는 분실하지 않았다.\"\nB: \"분실한 사람은 C이다.\"\nC: \"분실한 사람은 D이다.\"\nD: \"나는 분실하지 않았다.\"\n분실한 사람은?", choices:["A","B","C","D"], answer:2, explanation:"C가 거짓을 말한 경우만 모순 없이 성립합니다: C의 말(D가 분실)이 거짓이므로 D는 아니고, B의 말(C가 분실)이 진실이므로 분실한 사람은 C입니다. A, D의 진술도 모두 모순 없이 성립합니다."},
{category:"문제해결능력", question:"SWOT 분석에서 약점(Weakness)에 해당하는 것은?", choices:["신규 시장 진출 기회","경쟁사의 시장 철수","낮은 브랜드 인지도","정부의 지원 정책 확대"], answer:2, explanation:"약점은 조직 내부의 부정적 요인입니다. 낮은 브랜드 인지도가 이에 해당하며, 나머지는 외부의 기회(Opportunity) 요인입니다."},
{category:"문제해결능력", question:"문제해결 절차(문제 인식 → 문제 도출 → 원인 분석 → 해결안 개발 → 실행 및 평가)에서 '문제 인식' 다음 단계는?", choices:["원인 분석","문제 도출","해결안 개발","실행 및 평가"], answer:1, explanation:"문제 인식 이후에는 어떤 문제를 해결해야 하는지 명확히 하는 문제 도출 단계가 이어집니다."},
{category:"문제해결능력", question:"브레인스토밍의 규칙으로 적절하지 않은 것은?", choices:["자유롭게 발언한다","다른 사람의 의견을 비판하지 않는다","질보다 양을 추구한다","발언 전 충분히 검토한 후 신중하게 말한다"], answer:3, explanation:"브레인스토밍은 즉흥적이고 자유로운 발언을 장려하는 기법으로, 신중한 사전 검토를 요구하지 않습니다."},
{category:"문제해결능력", question:"\"을이 참석하면 병도 참석한다\", \"병이 참석하면 정은 참석하지 않는다\", \"정이 참석하지 않으면 무가 참석한다\"가 모두 참일 때, 을이 참석했다면 반드시 참석하는 사람을 모두 고르면?", choices:["갑, 을","을, 병, 무","을, 정","병, 정, 무"], answer:1, explanation:"을 참석→병 참석→정 불참→무 참석. 따라서 을, 병, 무는 반드시 참석하며, 정은 참석하지 않고 갑은 알 수 없습니다."},
{category:"문제해결능력", question:"창의적 사고를 촉진하는 방법으로 적절하지 않은 것은?", choices:["자유연상법","강제연결법","기존 틀에서만 사고하기","마인드맵 활용"], answer:2, explanation:"창의적 사고는 기존의 틀에서 벗어나 사고하는 것이 핵심이며, 틀에 갇힌 사고는 오히려 창의성을 저해합니다."},
{category:"문제해결능력", question:"다음 중 '성급한 일반화의 오류'에 해당하는 예는?", choices:["내가 만난 두 명의 A지역 사람이 불친절했으니 A지역 사람은 모두 불친절하다.","그 사람 말은 못 믿어, 예전에 거짓말을 한 적이 있으니까.","비가 오면 땅이 젖는다. 땅이 젖었으니 비가 온 것이다.","내일도 해가 뜰 것이다, 오늘 해가 떴으니까."], answer:0, explanation:"적은 수의 사례로 전체를 단정 짓는 것이 성급한 일반화의 오류입니다. ②는 인신공격의 오류, ③은 후건 긍정의 오류입니다."},
