{category:"의사소통능력", question:"밑줄 친 단어와 의미가 가장 유사한 것은?\n\"매출 급증은 신제품의 인기를 보여주는 방증이다.\"", choices:["간접적인 증거","직접적인 반박","확실한 오류","불필요한 자료"], answer:0, explanation:"'방증'은 어떤 사실을 직접 증명하지는 않지만 간접적으로 증명해 주는 것을 뜻합니다."},
{category:"의사소통능력", question:"다음 글의 중심 내용으로 가장 적절한 것은?\n\"마이데이터 서비스는 여러 금융기관에 흩어져 있는 개인의 금융정보를 한곳에서 통합 조회할 수 있도록 하는 서비스이다. 이를 통해 소비자는 자신의 자산과 소비 현황을 한눈에 파악하고 맞춤형 금융상품을 추천받을 수 있다.\"", choices:["마이데이터 서비스의 개념과 소비자 편익","금융기관의 개인정보 보호 의무","마이데이터 서비스의 법적 규제 현황","금융상품의 종류"], answer:0, explanation:"지문은 마이데이터 서비스가 흩어진 금융정보를 통합 조회하게 해 소비자에게 편익을 준다는 내용을 다루고 있습니다."},
{category:"의사소통능력", question:"다음 글에서 언급된 스미싱 예방 방법으로 가장 적절한 것은?\n\"스미싱은 문자메시지를 이용해 악성 앱 설치를 유도하거나 개인정보를 탈취하는 사기 수법이다. 출처가 불분명한 문자의 링크는 클릭하지 않고, 의심스러운 경우 금융기관에 직접 확인하는 것이 안전하다.\"", choices:["출처 불분명한 문자의 링크를 클릭하지 않고 직접 확인한다","모든 문자메시지의 링크를 클릭해 확인한다","비밀번호를 문자로 전송해 확인받는다","의심스러운 앱을 먼저 설치해 본다"], answer:0, explanation:"지문은 출처가 불분명한 문자의 링크를 클릭하지 않고 금융기관에 직접 확인하는 것이 스미싱 예방 방법이라고 설명합니다."},
{category:"의사소통능력", question:"다음 글의 내용과 일치하는 것은?\n\"ESG는 환경(Environment), 사회(Social), 지배구조(Governance)의 앞 글자를 딴 용어로, 기업의 재무적 성과뿐 아니라 비재무적 요소까지 평가하는 기준으로 활용된다. 최근에는 투자자들도 ESG 평가 결과를 투자 결정에 반영하는 추세이다.\"", choices:["ESG는 기업의 재무적 성과만을 평가하는 지표이다.","ESG는 환경·사회·지배구조를 포괄하는 비재무적 평가 기준이다.","투자자들은 ESG 평가를 전혀 고려하지 않는다.","ESG는 법적 강제력이 있는 회계 기준이다."], answer:1, explanation:"지문은 ESG가 환경, 사회, 지배구조를 포괄하는 비재무적 평가 기준이며 투자 결정에도 반영되고 있다고 설명합니다."},
{category:"의사소통능력", question:"다음 글의 중심 내용으로 가장 적절한 것은?\n\"로컬푸드 운동은 생산지와 소비지 간의 거리를 최소화하여 신선한 농산물을 공급하려는 움직임이다. 이를 통해 유통 단계에서 발생하는 비용과 탄소 배출을 줄이고, 지역 농업인의 소득 증대에도 기여할 수 있다.\"", choices:["로컬푸드 운동의 개념과 기대 효과","농산물 수출 확대 방안","해외 농산물 수입 절차","대형마트의 유통 전략"], answer:0, explanation:"지문은 로컬푸드 운동의 개념과 유통비용·탄소배출 절감, 농가 소득 증대 등의 기대 효과를 설명하고 있습니다."},
{category:"의사소통능력", question:"다음 글에서 설명하는 협동조합의 원칙으로 가장 적절한 것은?\n\"협동조합은 인종, 성별, 사회적·정치적 신념 등에 따른 차별 없이 조합의 서비스를 이용할 수 있는 모든 사람에게 열려 있으며, 조합원이 되는 것도 자율적인 의사에 따른다.\"", choices:["자발적이고 개방적인 조합원 제도","조합원의 경제적 참여","자율과 독립","협동조합 간 협동"], answer:0, explanation:"지문은 차별 없이 누구에게나 열려 있고 자율적 의사에 따라 조합원이 될 수 있다는 '자발적이고 개방적인 조합원 제도'를 설명하고 있습니다."},
{category:"의사소통능력", question:"다음 글에서 설명하는 제도의 목적으로 가장 적절한 것은?\n\"농산물 이력추적관리제도는 농산물의 생산부터 판매까지 각 단계의 정보를 기록하여 문제 발생 시 원인을 신속히 파악하고 대응할 수 있도록 하는 제도이다.\"", choices:["농산물 가격을 인위적으로 통제하기 위해서","문제 발생 시 원인을 신속히 파악하고 대응하기 위해서","농산물 수출량을 늘리기 위해서","생산자의 소득을 균등하게 배분하기 위해서"], answer:1, explanation:"지문은 이 제도가 문제 발생 시 원인을 신속히 파악하고 대응하기 위한 것이라고 설명합니다."},
{category:"의사소통능력", question:"다음 글의 내용과 일치하는 것은?\n\"예대마진은 은행이 대출로 받는 이자와 예금에 지급하는 이자의 차이를 의미하며, 은행의 주요 수익원 중 하나이다. 기준금리가 인상되는 시기에는 대출금리가 예금금리보다 빠르게 오르면서 예대마진이 확대되는 경우가 많다.\"", choices:["예대마진은 은행의 손실 요인이다.","예대마진은 대출이자와 예금이자의 차이로 은행의 주요 수익원이다.","기준금리 인상은 예대마진과 무관하다.","예대마진은 항상 일정하게 유지된다."], answer:1, explanation:"지문은 예대마진이 대출이자와 예금이자의 차이이며 은행의 주요 수익원이라고 설명합니다."},
{category:"의사소통능력", question:"다음 글에서 언급된 디지털 취약계층 지원 방안으로 가장 적절한 것은?\n\"키오스크와 모바일 앱 이용이 확산되면서 고령층 등 디지털 취약계층의 소외 문제가 대두되고 있다. 이에 일부 기관은 방문 상담 창구를 유지하고, 쉬운 사용법 교육을 제공하는 등의 대책을 마련하고 있다.\"", choices:["모든 오프라인 창구를 폐쇄한다","방문 상담 창구 유지와 사용법 교육 제공","디지털 기기 이용을 전면 금지한다","고령층 대상 서비스를 축소한다"], answer:1, explanation:"지문은 방문 상담 창구 유지와 사용법 교육 제공을 디지털 취약계층 지원 방안으로 언급하고 있습니다."},
{category:"의사소통능력", question:"다음 글의 중심 내용으로 가장 적절한 것은?\n\"이상 기후로 인한 흉작이 반복되면서 농산물 가격이 급등하는 현상이 나타나고 있다. 전문가들은 이러한 기후 요인이 물가 상승에 미치는 영향이 갈수록 커지고 있다고 지적한다.\"", choices:["기후 변화로 인한 농산물 가격 급등과 물가 상승 우려","농산물 수출 증가 원인","기후 변화와 무관한 물가 안정 정책","해외 농산물 수입 절차 간소화"], answer:0, explanation:"지문은 기후 변화로 인한 흉작이 농산물 가격 급등과 물가 상승으로 이어지고 있다는 내용을 다루고 있습니다."},
{category:"의사소통능력", question:"다음 글에서 스마트팜 확산의 걸림돌로 언급된 것은?\n\"스마트팜은 센서와 자동화 설비를 통해 농작물 생육 환경을 최적으로 관리할 수 있게 해준다. 그러나 고가의 설비 투자 비용과 관련 기술을 다룰 수 있는 전문 인력의 부족이 확산의 걸림돌로 지적된다.\"", choices:["설비 투자 비용과 전문 인력 부족","농산물 생산량의 과잉","소비자의 낮은 선호도","정부 지원 정책의 부재"], answer:0, explanation:"지문은 고가의 설비 투자 비용과 전문 인력 부족을 스마트팜 확산의 걸림돌로 언급하고 있습니다."},
{category:"의사소통능력", question:"다음 글의 내용과 일치하는 것은?\n\"금융소비자보호법은 금융상품 판매 과정에서 소비자에게 상품의 위험성과 주요 내용을 충분히 설명하도록 의무화하고 있다. 이를 위반하여 불완전판매가 발생한 경우, 금융회사는 그에 따른 책임을 질 수 있다.\"", choices:["금융회사는 상품 설명 의무가 없다.","불완전판매가 발생해도 금융회사는 책임지지 않는다.","금융상품 판매 시 위험성과 주요 내용을 설명할 의무가 있다.","금융소비자보호법은 판매자만을 보호하기 위한 법이다."], answer:2, explanation:"지문은 금융상품 판매 시 위험성과 주요 내용을 설명할 의무가 있으며 이를 위반하면 책임을 질 수 있다고 설명합니다."},
{category:"의사소통능력", question:"다음 글의 중심 내용으로 가장 적절한 것은?\n\"중앙은행 디지털화폐(CBDC)는 중앙은행이 발행하는 전자적 형태의 화폐로, 현금 없는 사회로의 전환에 대응하고 지급결제의 안정성을 높이기 위해 여러 국가에서 연구·실험되고 있다.\"", choices:["CBDC의 개념과 각국의 연구·실험 동향","암호화폐 투자 방법","현금 사용의 완전한 폐지 확정","은행 점포 확대 계획"], answer:0, explanation:"지문은 CBDC의 개념과 각국이 이를 연구·실험하고 있는 동향을 설명하고 있습니다."},
/* ===================== 수리능력 ===================== */
{category:"수리능력", question:"물류센터에서 사과 상자 240개를 트럭 A와 B에 나누어 실었다. A트럭에 실은 개수가 B트럭의 1.4배일 때, A트럭에 실은 사과 상자는?", choices:["120개","140개","150개","160개"], answer:1, explanation:"B트럭 개수를 x라 하면 A=1.4x, x+1.4x=240 → 2.4x=240 → x=100, A=1.4×100=140개."},
{category:"수리능력", question:"정가 40,000원인 상품을 20% 할인한 후 다시 10% 추가 할인하여 판매했다. 최종 판매가는?", choices:["27,000원","28,000원","28,800원","29,500원"], answer:2, explanation:"40,000×0.8=32,000, 32,000×0.9=28,800원."},
{category:"수리능력", question:"A는 혼자 하면 12일, B는 혼자 하면 18일 걸리는 일이 있다. 두 사람이 함께 하면 며칠 걸리는가?", choices:["6일","7.2일","8일","9일"], answer:1, explanation:"하루 작업량은 1/12+1/18=3/36+2/36=5/36. 전체 일수는 36/5=7.2일."},
{category:"수리능력", question:"원금 1,000,000원을 연이율 4%의 단리로 2년간 예치했을 때 받는 총 이자는?", choices:["40,000원","80,000원","120,000원","160,000원"], answer:1, explanation:"단리 이자 = 원금×이율×기간 = 1,000,000×0.04×2=80,000원."},
{category:"수리능력", question:"어떤 상품의 원가에 20%의 이익을 붙여 정가를 정한 후, 정가에서 10% 할인하여 판매했더니 800원의 이익을 얻었다. 원가는?", choices:["8,000원","9,000원","10,000원","11,000원"], answer:2, explanation:"원가를 c라 하면 판매가=1.2c×0.9=1.08c, 이익=0.08c=800 → c=10,000원."},
{category:"수리능력", question:"주머니에 빨간공 3개, 파란공 5개가 있다. 임의로 2개를 꺼낼 때 모두 빨간공일 확률은?", choices:["1/28","3/28","3/56","1/8"], answer:1, explanation:"전체 경우의 수 C(8,2)=28, 빨간공 2개를 뽑는 경우 C(3,2)=3. 확률=3/28."},
{category:"수리능력", question:"창고의 쌀 재고가 지난달보다 15% 감소하여 현재 1,700포대이다. 지난달 재고는 몇 포대인가?", choices:["1,900포대","1,950포대","2,000포대","2,050포대"], answer:2, explanation:"지난달 재고를 x라 하면 x×0.85=1,700 → x=2,000포대."},
{category:"수리능력", question:"연도별 조합원 수가 2023년 210만 명, 2024년 220.5만 명일 때, 2023년 대비 2024년 증가율은?", choices:["3%","4%","5%","6%"], answer:2, explanation:"(220.5-210)/210=10.5/210=0.05=5%."},
{category:"수리능력", question:"자동차가 처음에는 시속 100km로 달리다가 이후 시속 50km로 속도를 줄여 총 300km를 4시간 동안 주행했다. 시속 100km로 달린 시간은?", choices:["1시간","1.5시간","2시간","2.5시간"], answer:2, explanation:"100km로 달린 시간을 t라 하면 100t+50(4-t)=300 → 50t=100 → t=2시간."},
{category:"수리능력", question:"각 자리 숫자의 합이 9인 두 자리 자연수가 있다. 십의 자리와 일의 자리를 바꾼 수가 원래 수보다 27 크다면, 원래 수는?", choices:["27","36","45","54"], answer:1, explanation:"십의 자리 a, 일의 자리 b, a+b=9. (10b+a)-(10a+b)=9(b-a)=27→b-a=3. 연립하면 a=3,b=6, 원래 수=36 (검증: 63-36=27)."},
{category:"수리능력", question:"두 수의 비가 3:5이고 합이 96일 때, 큰 수는?", choices:["48","54","60","66"], answer:2, explanation:"3x+5x=96→x=12. 큰 수=5×12=60."},
{category:"수리능력", question:"상품 A는 원가 대비 20% 이익, 상품 B는 원가 대비 20% 손실로 판매했는데 두 상품의 판매가가 같았다. A의 원가가 40,000원일 때 B의 원가는?", choices:["50,000원","55,000원","60,000원","65,000원"], answer:2, explanation:"A 판매가=40,000×1.2=48,000원. B원가×0.8=48,000 → B원가=60,000원."},
{category:"수리능력", question:"형과 동생이 어떤 금액을 5:3으로 나누었더니 형이 동생보다 48,000원 더 많이 받았다. 전체 금액은?", choices:["168,000원","180,000원","192,000원","204,000원"], answer:2, explanation:"5x-3x=2x=48,000 → x=24,000. 전체=8x=192,000원."},
{category:"수리능력", question:"A직원은 1건당 6분, B직원은 1건당 4분이 걸린다. 두 직원이 동시에 각자 독립적으로 업무를 처리할 때, 총 60건을 처리하는 데 걸리는 시간은?", choices:["120분","132분","144분","156분"], answer:2, explanation:"A의 처리율 1/6건/분, B는 1/4건/분. 합산 처리율=1/6+1/4=5/12건/분. 시간=60÷(5/12)=144분."},
{category:"수리능력", question:"A, B, C 세 지점의 월 매출액이 각각 120백만원, 150백만원, 180백만원일 때, 세 지점의 평균 매출액은?", choices:["140백만원","145백만원","150백만원","155백만원"], answer:2, explanation:"(120+150+180)÷3=450÷3=150백만원."},
{category:"수리능력", question:"상품 가격이 작년에 10% 상승했고, 올해 다시 10% 하락했다. 2년 전 가격이 100,000원이었다면 현재 가격은?", choices:["98,000원","99,000원","100,000원","101,000원"], answer:1, explanation:"100,000×1.1×0.9=99,000원."},
{category:"수리능력", question:"농도 10%의 소금물 200g에 물을 추가하여 농도 5%의 소금물을 만들려고 한다. 추가해야 하는 물의 양은?", choices:["150g","180g","200g","220g"], answer:2, explanation:"소금의 양은 200×0.1=20g으로 일정. 20÷(200+x)=0.05 → 200+x=400 → x=200g."},
{category:"수리능력", question:"지점장 후보 5명 중 지점장 1명과 부지점장 1명을 뽑는 방법의 수는? (두 직책은 구분됨)", choices:["10가지","15가지","20가지","25가지"], answer:2, explanation:"순서가 있는 선택이므로 순열 P(5,2)=5×4=20가지."},
{category:"수리능력", question:"남자직원 4명, 여자직원 3명 중 대표 2명을 뽑을 때, 남자 1명과 여자 1명이 뽑힐 확률은?", choices:["2/7","3/7","4/7","5/7"], answer:2, explanation:"전체 경우 C(7,2)=21. 남1·여1 조합 경우=4×3=12. 확률=12/21=4/7."},
{category:"수리능력", question:"월~일 요일별 방문 고객 수가 100, 120, 90, 110, 130, 80, 70명일 때, 일주일 평균 방문 고객 수는?", choices:["95명","100명","105명","110명"], answer:1, explanation:"합계=100+120+90+110+130+80+70=700. 700÷7=100명."},
{category:"수리능력", question:"A는 혼자 하면 8일, B는 혼자 하면 24일 걸리는 일이 있다. 두 사람이 함께 하면 며칠 걸리는가?", choices:["4일","6일","8일","12일"], answer:1, explanation:"하루 작업량 1/8+1/24=3/24+1/24=4/24=1/6. 전체 일수=6일."},
{category:"수리능력", question:"어떤 일을 A가 혼자 하면 15일, A와 B가 함께 하면 6일 걸린다. B가 혼자 하면 며칠 걸리는가?", choices:["9일","10일","12일","15일"], answer:1, explanation:"1/15+1/B=1/6 → 1/B=1/6-1/15=5/30-2/30=3/30=1/10 → B=10일."},
{category:"수리능력", question:"물탱크를 채우는데 A호스는 4시간, B호스는 6시간 걸린다. 두 호스를 동시에 사용하면 몇 시간 걸리는가?", choices:["2시간","2.4시간","3시간","3.6시간"], answer:1, explanation:"1/4+1/6=3/12+2/12=5/12. 걸리는 시간=12/5=2.4시간."},
{category:"수리능력", question:"甲, 乙, 丙 세 사람이 함께 일하면 4일에 끝나는 일이 있다. 甲이 혼자하면 12일, 乙이 혼자하면 24일 걸릴 때, 丙이 혼자 하면 며칠 걸리는가?", choices:["6일","8일","10일","16일"], answer:1, explanation:"1/12+1/24=1/8. 1/丙=1/4-1/8=1/8 → 丙=8일."},
{category:"수리능력", question:"어떤 프로젝트를 5명이 하면 18일 걸린다. 이 프로젝트를 9일 만에 끝내려면 최소 몇 명이 필요한가? (1인당 생산성 동일)", choices:["7명","9명","10명","12명"], answer:2, explanation:"총 작업량=5×18=90인일. 9일에 필요한 인원=90÷9=10명."},
{category:"수리능력", question:"A는 혼자 하면 15일이 걸리는 일이 있다. A가 5일 동안 일하다가 그만두었고, 나머지를 B가 혼자 8일 만에 마쳤다. B가 혼자 처음부터 끝까지 한다면 며칠이 걸리는가?", choices:["10일","12일","14일","16일"], answer:1, explanation:"A가 5일간 한 작업량=5/15=1/3. 남은 2/3을 B가 8일에 완료 → B의 하루 작업량=1/12 → 전체 완료 시간=12일."},
{category:"수리능력", question:"원가 15,000원인 물건에 30%의 이익을 붙여 정가를 매겼다. 정가는?", choices:["18,000원","18,500원","19,500원","20,000원"], answer:2, explanation:"15,000×1.3=19,500원."},
{category:"수리능력", question:"정가 25,000원인 상품을 할인하여 팔았더니 판매가가 20,000원이 되었다. 할인율은?", choices:["15%","18%","20%","25%"], answer:2, explanation:"(25,000-20,000)/25,000=5,000/25,000=20%."},
{category:"수리능력", question:"원가에 40% 이익을 붙여 정가를 정했으나 정가의 25%를 할인하여 판매했다. 원가가 20,000원일 때 판매가는?", choices:["19,600원","20,600원","21,000원","22,400원"], answer:2, explanation:"정가=20,000×1.4=28,000원. 판매가=28,000×0.75=21,000원."},
{category:"수리능력", question:"상품을 정가의 20% 할인하여 판매했는데도 원가의 12% 이익을 얻었다. 원가가 25,000원일 때 정가는?", choices:["30,000원","32,000원","35,000원","38,000원"], answer:2, explanation:"판매가=25,000×1.12=28,000원. 정가×0.8=28,000 → 정가=35,000원."},
{category:"수리능력", question:"원가가 8,000원인 상품을 정가의 10% 할인하여 팔아서 원가의 8% 이익을 얻으려 한다. 정가는 얼마로 책정해야 하는가?", choices:["9,200원","9,400원","9,600원","9,800원"], answer:2, explanation:"판매가=8,000×1.08=8,640원. 정가×0.9=8,640 → 정가=9,600원."},
{category:"수리능력", question:"어떤 상품 두 개를 각각 12,000원에 팔았다. 한 개는 원가의 20% 이익을, 다른 한 개는 원가의 20% 손실을 보고 팔았다면, 전체 매매의 손익은?", choices:["손실 1,000원","이익 1,000원","손실 2,000원","이익 없음"], answer:0, explanation:"이익 물건 원가=12,000/1.2=10,000원. 손실 물건 원가=12,000/0.8=15,000원. 총원가=25,000원, 총판매가=24,000원 → 손실 1,000원."},
{category:"수리능력", question:"정가 50,000원인 제품을 두 차례에 걸쳐 각각 10%씩 할인하여 판매했다. 최종 판매가는?", choices:["39,000원","40,000원","40,500원","41,000원"], answer:2, explanation:"50,000×0.9×0.9=40,500원."},
{category:"수리능력", question:"원가의 25% 이익을 기대하고 정가를 매겼는데, 정가에서 12,000원을 할인해서 팔아 원가의 5% 이익만 얻었다. 원가는?", choices:["50,000원","55,000원","60,000원","65,000원"], answer:2, explanation:"정가=1.25c, 판매가=1.25c-12,000=1.05c → 0.2c=12,000 → c=60,000원."},
{category:"수리능력", question:"농도 6%의 소금물 500g과 농도 12%의 소금물 300g을 섞으면 몇 %의 소금물이 되는가?", choices:["7.5%","8%","8.25%","9%"], answer:2, explanation:"소금 총량=500×0.06+300×0.12=30+36=66g. 총량=800g. 농도=66/800=8.25%."},
{category:"수리능력", question:"농도 15%의 소금물 400g에서 물을 증발시켜 농도 20%의 소금물을 만들려고 한다. 증발시켜야 하는 물의 양은?", choices:["80g","100g","120g","150g"], answer:1, explanation:"소금량=400×0.15=60g. 60/(400-x)=0.2 → 400-x=300 → x=100g."},
{category:"수리능력", question:"농도 4%의 설탕물 600g에 설탕 40g을 추가로 넣으면 농도는 몇 %가 되는가?", choices:["8%","9%","10%","12%"], answer:2, explanation:"설탕량=600×0.04+40=24+40=64g. 총량=640g. 농도=64/640=10%."},
{category:"수리능력", question:"농도 10%의 소금물 200g과 농도 20%의 소금물 300g을 섞으면 몇 %의 소금물이 되는가?", choices:["14%","15%","16%","18%"], answer:2, explanation:"소금 총량=200×0.1+300×0.2=20+60=80g. 총량=500g. 농도=80/500=16%."},
{category:"수리능력", question:"농도 9%의 소금물 300g에서 소금물 100g을 퍼내고, 그 자리에 물 100g을 부었다. 새로 만들어진 소금물의 농도는?", choices:["5%","6%","7%","9%"], answer:1, explanation:"퍼내고 남은 200g의 농도는 여전히 9%이므로 소금량=18g. 물 100g을 더해 총 300g → 농도=18/300=6%."},
{category:"수리능력", question:"물 180g에 소금 20g을 넣어 소금물을 만들었다. 이 소금물의 농도는?", choices:["8%","9%","10%","12%"], answer:2, explanation:"소금물 총량=180+20=200g. 농도=20/200=10%."},
{category:"수리능력", question:"A는 시속 4km로 걷고, B는 A보다 1시간 늦게 같은 지점에서 출발하여 시속 6km로 걸어 A를 따라간다. B가 출발한 지 몇 시간 후에 A를 따라잡는가?", choices:["1시간","1.5시간","2시간","2.5시간"], answer:2, explanation:"B의 이동시간을 t라 하면 A의 이동시간은 t+1. 이동거리가 같으므로 4(t+1)=6t → t=2시간."},
{category:"수리능력", question:"둘레가 3km인 호수를 A는 시속 6km, B는 반대방향으로 시속 9km로 동시에 출발하여 걷는다. 두 사람이 처음 만나는 데 걸리는 시간은?", choices:["10분","12분","15분","20분"], answer:1, explanation:"반대방향이므로 합산 속도=15km/h. 시간=3/15=0.2시간=12분."},
{category:"수리능력", question:"기차가 길이 200m인 다리를 완전히 통과하는 데 20초가 걸렸다. 기차의 길이가 100m라면 기차의 속력(m/s)은?", choices:["10m/s","12m/s","15m/s","20m/s"], answer:2, explanation:"다리를 완전히 통과하려면 다리길이+기차길이=300m를 이동해야 한다. 속력=300/20=15m/s."},
{category:"수리능력", question:"A와 B는 같은 지점에서 반대 방향으로 동시에 출발하여 각각 시속 5km, 시속 7km로 걷는다. 두 사람 사이의 거리가 36km가 되는 데 걸리는 시간은?", choices:["2시간","3시간","4시간","6시간"], answer:1, explanation:"합산속도=12km/h. 시간=36/12=3시간."},
{category:"수리능력", question:"배가 강물을 거슬러 24km를 가는데 4시간이 걸리고, 같은 거리를 내려올 때는 2시간이 걸린다. 강물의 유속은?", choices:["2km/h","3km/h","4km/h","5km/h"], answer:1, explanation:"거슬러갈 때 속력=24/4=6km/h(배속력-유속). 내려올 때 속력=24/2=12km/h(배속력+유속). 연립하면 배속력=9, 유속=3km/h."},
{category:"수리능력", question:"등산로 왕복 거리가 12km이다. 올라갈 때는 시속 3km, 내려올 때는 시속 6km로 걸었다면, 왕복에 걸린 평균 속력은?", choices:["3.5km/h","4km/h","4.5km/h","5km/h"], answer:1, explanation:"편도 거리=6km. 올라갈 때 2시간, 내려올 때 1시간, 총 3시간에 12km 이동. 평균속력=12/3=4km/h."},
{category:"수리능력", question:"자동차로 240km 거리를 가는데 처음 절반은 시속 80km, 나머지 절반은 시속 60km로 달렸다. 총 걸린 시간은?", choices:["3시간","3.5시간","4시간","4.5시간"], answer:1, explanation:"편도 절반 거리=120km. t1=120/80=1.5시간, t2=120/60=2시간. 총 3.5시간."},
{category:"수리능력", question:"두 지점 A, B 사이의 거리는 90km이다. 갑은 A에서, 을은 B에서 동시에 출발해 서로를 향해 마주보고 달린다. 갑의 속력은 시속 20km, 을의 속력은 시속 25km일 때, 두 사람이 만나는 지점은 A로부터 몇 km 떨어진 곳인가?", choices:["35km","40km","45km","50km"], answer:1, explanation:"합산속도=45km/h. 만나는 시간=90/45=2시간. A로부터 거리=20×2=40km."},
{category:"수리능력", question:"세 사람이 자본금 2:3:5의 비율로 투자하여 총 1억원을 모았다. 가장 많이 투자한 사람의 투자금은?", choices:["3,000만원","4,000만원","5,000만원","6,000만원"], answer:2, explanation:"전체 비율의 합은 10. 가장 많은 몫=5/10×1억=5,000만원."},
{category:"수리능력", question:"어떤 회사의 남녀 직원 비율이 3:2이고 전체 직원이 150명일 때, 여직원 수는?", choices:["50명","60명","75명","90명"], answer:1, explanation:"비율의 합=5. 여직원=2/5×150=60명."},
{category:"수리능력", question:"두 그룹 A, B의 평균 점수가 각각 80점, 90점이고 인원수 비율이 A:B=3:2일 때, 전체 평균 점수는?", choices:["82점","84점","85점","86점"], answer:1, explanation:"전체 평균=(3×80+2×90)/5=(240+180)/5=420/5=84점."},
{category:"수리능력", question:"어떤 금액을 갑, 을, 병이 4:3:2의 비율로 나누었더니 갑이 을보다 20,000원 더 많이 받았다. 병이 받은 금액은?", choices:["30,000원","35,000원","40,000원","45,000원"], answer:2, explanation:"4x-3x=x=20,000. 병=2x=40,000원."},
{category:"수리능력", question:"어떤 상품의 재료비:인건비:기타비용의 비율이 5:3:2이고 총 비용이 60만원일 때, 인건비는?", choices:["15만원","18만원","20만원","24만원"], answer:1, explanation:"비율의 합=10. 인건비=3/10×60만원=18만원."},
{category:"수리능력", question:"두 수의 최대공약수가 12이고 두 수의 비가 3:4일 때, 두 수의 합은?", choices:["72","78","84","96"], answer:2, explanation:"3과 4는 서로소이므로 두 수는 12×3=36, 12×4=48. 합=36+48=84."},
{category:"수리능력", question:"서로 다른 6개의 부서 중 3개 부서를 선택하는 방법의 수는? (순서 무관)", choices:["15","18","20","24"], answer:2, explanation:"조합 C(6,3)=6!/(3!3!)=20."},
{category:"수리능력", question:"7명의 팀원 중 팀장 1명, 부팀장 1명, 총무 1명을 각각 다르게 선출하는 방법의 수는?", choices:["120","150","180","210"], answer:3, explanation:"순열 P(7,3)=7×6×5=210."},
{category:"수리능력", question:"남자 3명, 여자 4명 중에서 대표 3명을 뽑을 때, 뽑는 방법의 수는? (조건 없음)", choices:["21","28","35","42"], answer:2, explanation:"전체 7명 중 3명을 뽑는 조합 C(7,3)=35."},
{category:"수리능력", question:"0,1,2,3,4 다섯 개의 숫자를 한 번씩만 사용하여 만들 수 있는 세 자리 자연수의 개수는? (맨 앞자리는 0이 될 수 없음)", choices:["36","48","60","64"], answer:1, explanation:"백의자리 0제외 4가지, 십의자리 남은 4개 중 4가지, 일의자리 남은 3개 중 3가지. 4×4×3=48."},
{category:"수리능력", question:"5명이 일렬로 서서 사진을 찍을 때, 특정 두 사람 A, B가 항상 이웃하도록 서는 방법의 수는?", choices:["24","36","48","60"], answer:2, explanation:"A,B를 한 묶음으로 보면 4개 단위의 배열 4!=24, A,B 내부 순서 2가지. 24×2=48."},
{category:"수리능력", question:"원탁에 6명이 앉는 원순열의 수는?", choices:["60","100","120","720"], answer:2, explanation:"원순열의 수는 (n-1)!이므로 (6-1)!=5!=120."},
{category:"수리능력", question:"주사위 두 개를 동시에 던질 때, 두 눈의 합이 7이 될 확률은?", choices:["1/6","1/9","1/12","1/4"], answer:0, explanation:"합이 7인 경우는 (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) 6가지. 전체 36가지 중 6/36=1/6."},
{category:"수리능력", question:"한 개의 동전을 3번 던질 때, 앞면이 정확히 2번 나올 확률은?", choices:["1/4","3/8","1/2","5/8"], answer:1, explanation:"C(3,2)×(1/2)^3=3×1/8=3/8."},
{category:"수리능력", question:"상자에 흰 공 4개, 검은 공 6개가 있다. 한 개를 꺼내 확인 후 다시 넣고 또 한 개를 꺼낼 때, 두 번 모두 흰 공일 확률은? (복원추출)", choices:["1/25","2/25","4/25","2/5"], answer:2, explanation:"매번 흰 공을 꺼낼 확률=4/10=2/5. 두 번 모두일 확률=(2/5)²=4/25."},
{category:"수리능력", question:"어떤 시험에 A가 합격할 확률은 0.6, B가 합격할 확률은 0.5이다. 두 사람이 서로 독립적으로 시험을 볼 때, 적어도 한 명이 합격할 확률은?", choices:["0.3","0.5","0.7","0.8"], answer:3, explanation:"적어도 한 명 합격 확률=1-(둘 다 불합격)=1-(0.4×0.5)=1-0.2=0.8."},
{category:"수리능력", question:"1부터 10까지의 숫자가 각각 적힌 카드가 있다. 임의로 한 장을 뽑을 때, 3의 배수 또는 5의 배수가 나올 확률은?", choices:["3/10","2/5","1/2","3/5"], answer:2, explanation:"3의 배수(3,6,9) 3개, 5의 배수(5,10) 2개, 중복 없음. 5/10=1/2."},
{category:"수리능력", question:"주머니에 빨간 구슬 4개, 노란 구슬 2개, 파란 구슬 4개가 있다. 임의로 1개를 꺼낼 때 빨간 구슬이 아닐 확률은?", choices:["2/5","1/2","3/5","7/10"], answer:2, explanation:"전체 10개 중 빨간 구슬이 아닌 것은 6개. 확률=6/10=3/5."},
{category:"수리능력", question:"원금 2,000,000원을 연이율 5%의 단리로 3년간 예치했을 때 만기 시 받는 총액(원금+이자)은?", choices:["2,200,000원","2,250,000원","2,300,000원","2,350,000원"], answer:2, explanation:"이자=2,000,000×0.05×3=300,000원. 총액=2,300,000원."},
{category:"수리능력", question:"원금 1,000,000원을 연이율 10%의 연복리로 2년간 예치했을 때 만기 시 받는 총액은?", choices:["1,100,000원","1,200,000원","1,210,000원","1,220,000원"], answer:2, explanation:"1,000,000×1.1²=1,000,000×1.21=1,210,000원."},
{category:"수리능력", question:"연이율 6%의 단리로 예치하여 1년 후 이자로 90,000원을 받았다면 예치한 원금은?", choices:["1,200,000원","1,350,000원","1,500,000원","1,800,000원"], answer:2, explanation:"원금=90,000÷0.06=1,500,000원."},
{category:"수리능력", question:"원금 500,000원을 월이율 1%의 단리로 8개월간 예치했을 때 받는 이자는?", choices:["32,000원","36,000원","40,000원","44,000원"], answer:2, explanation:"이자=500,000×0.01×8=40,000원."},
{category:"수리능력", question:"어떤 금액을 연이율 8%의 단리로 5년간 예치했더니 이자가 200,000원이었다. 원금은?", choices:["400,000원","450,000원","500,000원","550,000원"], answer:2, explanation:"원금=200,000÷(0.08×5)=200,000÷0.4=500,000원."},
{category:"수리능력", question:"원금 800,000원을 연이율 5%의 연복리로 2년간 예치했을 때 받는 이자(원금 제외)는?", choices:["80,000원","81,000원","82,000원","84,000원"], answer:2, explanation:"800,000×1.05²=882,000원. 이자=882,000-800,000=82,000원."},
{category:"수리능력", question:"어떤 학생의 국어, 영어, 수학 점수 평균이 85점이다. 사회 점수 89점을 포함하여 4개 과목의 평균을 구하면?", choices:["85점","86점","87점","88점"], answer:1, explanation:"국영수 합=85×3=255점. 4과목 합=255+89=344점. 평균=344÷4=86점."},
{category:"수리능력", question:"5개 지점의 평균 매출이 320만원이다. 이 중 한 지점의 매출이 실제보다 50만원 낮게 입력되었다면, 올바른 평균 매출은?", choices:["325만원","330만원","335만원","340만원"], answer:1, explanation:"원래 합계=320×5=1,600만원. 올바른 합계=1,650만원. 평균=1,650÷5=330만원."},
{category:"수리능력", question:"남학생 20명의 평균 키가 172cm, 여학생 30명의 평균 키가 162cm일 때, 전체 학생의 평균 키는?", choices:["164cm","165cm","166cm","167cm"], answer:2, explanation:"합계=20×172+30×162=3,440+4,860=8,300. 인원=50. 평균=8,300÷50=166cm."},
{category:"수리능력", question:"4개의 수 12, 18, 20, x의 평균이 17일 때, x의 값은?", choices:["14","16","18","20"], answer:2, explanation:"합=17×4=68. 12+18+20=50. x=68-50=18."},
{category:"수리능력", question:"어떤 반의 시험 평균이 76점이었는데, 한 명이 전학을 가면서 그 학생의 점수(88점)를 제외하고 다시 계산하니 평균이 75점이 되었다. 전학 전 학생 수는?", choices:["11명","12명","13명","14명"], answer:2, explanation:"전학 전 인원 n, 76n-88=75(n-1) → 76n-88=75n-75 → n=13명."},
{category:"수리능력", question:"세 지점 A, B, C의 직원 수는 각각 10명, 15명, 25명이고 평균 근속연수가 각각 5년, 7년, 9년이다. 세 지점 전체 직원의 평균 근속연수는?", choices:["7년","7.3년","7.6년","8년"], answer:2, explanation:"합=10×5+15×7+25×9=50+105+225=380. 인원=50. 평균=380÷50=7.6년."},
{category:"수리능력", question:"어떤 회사의 매출이 작년 8억원에서 올해 9억 2천만원으로 증가했다. 매출 증가율은?", choices:["10%","12%","15%","18%"], answer:2, explanation:"(9.2-8)/8=1.2/8=0.15=15%."},
{category:"수리능력", question:"인구가 매년 5%씩 증가하는 도시의 현재 인구가 21,000명이라면 1년 전 인구는?", choices:["19,500명","19,800명","20,000명","20,500명"], answer:2, explanation:"1년 전 인구×1.05=21,000 → 1년 전 인구=20,000명."},
{category:"수리능력", question:"어떤 상품의 판매량이 지난달 대비 20% 감소하여 이번달 800개가 판매되었다. 지난달 판매량은?", choices:["900개","950개","1,000개","1,050개"], answer:2, explanation:"지난달×0.8=800 → 지난달=1,000개."},
{category:"수리능력", question:"올해 매출이 작년보다 25% 증가했고, 작년 매출은 재작년보다 20% 감소했다. 재작년 매출이 10억원이었다면 올해 매출은?", choices:["9억원","9.5억원","10억원","10.5억원"], answer:2, explanation:"작년=10억×0.8=8억원. 올해=8억×1.25=10억원."},
{category:"수리능력", question:"어떤 상품의 가격이 두 차례에 걸쳐 각각 10%씩 인상되었다. 최초 가격이 50,000원이었다면 현재 가격은?", choices:["58,000원","60,000원","60,500원","61,000원"], answer:2, explanation:"50,000×1.1×1.1=50,000×1.21=60,500원."},
{category:"수리능력", question:"어떤 지역의 신규 계좌 개설 건수가 2023년 4,000건에서 2024년 4,800건으로 증가했다. 2024년의 전년 대비 증가율은?", choices:["15%","18%","20%","25%"], answer:2, explanation:"(4,800-4,000)/4,000=800/4,000=0.2=20%."},
{category:"수리능력", question:"두 자리 자연수가 있다. 이 수는 각 자리 숫자의 합의 7배이고, 십의 자리 숫자는 일의 자리 숫자보다 2 크다. 이 수는?", choices:["24","35","42","51"], answer:2, explanation:"십의자리 a, 일의자리 b라 하면 a-b=2, 10a+b=7(a+b). 연립하면 a=4,b=2 → 42 (검증: 4+2=6, 6×7=42)."},
{category:"수리능력", question:"두 자리 자연수가 있다. 이 수의 십의 자리와 일의 자리를 바꾼 수는 원래 수보다 45 크며, 두 자리 숫자의 합은 9이다. 원래 수는?", choices:["18","27","36","45"], answer:1, explanation:"십의자리 a, 일의자리 b, b-a=5, a+b=9 → a=2,b=7 → 원래 수 27 (검증: 72-27=45)."},
{category:"수리능력", question:"어떤 두 자리 자연수의 각 자리 숫자의 합은 11이고, 63과 90 사이의 짝수이다. 이 수는?", choices:["65","74","83","92"], answer:1, explanation:"63과 90 사이에서 자릿수 합이 11인 수는 65, 74, 83인데 이 중 짝수는 74뿐이다."},
{category:"수리능력", question:"연속하는 세 자연수의 합이 72일 때, 가장 큰 수는?", choices:["23","24","25","26"], answer:2, explanation:"중간 수를 n이라 하면 (n-1)+n+(n+1)=3n=72 → n=24. 가장 큰 수=25."},
{category:"수리능력", question:"현재 아버지의 나이는 딸의 나이의 3배이고, 두 사람의 나이 합은 52세이다. 딸의 나이는?", choices:["11세","12세","13세","14세"], answer:2, explanation:"딸의 나이를 d라 하면 d+3d=52 → 4d=52 → d=13세."},
{category:"수리능력", question:"현재 어머니의 나이는 아들의 나이보다 24세 많다. 5년 후 어머니의 나이가 아들의 나이의 2배가 된다면, 현재 아들의 나이는?", choices:["17세","19세","21세","23세"], answer:1, explanation:"아들 현재 나이 x, 어머니=x+24. 5년 후 x+29=2(x+5) → x=19세."},
{category:"수리능력", question:"현재 형의 나이는 동생의 나이의 2배이다. 6년 전에는 형의 나이가 동생 나이의 5배였다. 현재 동생의 나이는?", choices:["6세","7세","8세","9세"], answer:2, explanation:"동생 현재 나이 d, 형=2d. 6년 전: 2d-6=5(d-6) → 2d-6=5d-30 → d=8세."},
{category:"수리능력", question:"아버지와 아들의 나이 차는 28세이며, 10년 후 아버지의 나이는 아들 나이의 2배가 된다. 현재 아들의 나이는?", choices:["16세","18세","20세","22세"], answer:1, explanation:"아들 현재 나이 x, 아버지=x+28. 10년 후 x+38=2(x+10) → x=18세."},
{category:"수리능력", question:"한 개당 무게가 3kg인 상자를 트럭에 실으려 하는데, 트럭의 최대 적재량은 450kg이다. 상자를 최대 몇 개까지 실을 수 있는가?", choices:["120개","135개","150개","165개"], answer:2, explanation:"450÷3=150개."},
{category:"수리능력", question:"볼펜 한 개의 가격은 700원이고 예산은 10,000원이다. 볼펜을 최대 몇 개까지 구입할 수 있는가?", choices:["12개","13개","14개","15개"], answer:2, explanation:"10,000÷700=14.28...이므로 최대 14개까지 구입 가능하다."},
{category:"수리능력", question:"어떤 물건을 1개당 1,200원에 판매하여 총비용 90,000원을 회수하려면 최소 몇 개를 팔아야 하는가?", choices:["65개","70개","75개","80개"], answer:2, explanation:"90,000÷1,200=75개."},
{category:"수리능력", question:"버스 한 대에 최대 45명이 탈 수 있다. 총 260명의 인원을 수송하려면 버스가 최소 몇 대 필요한가?", choices:["5대","6대","7대","8대"], answer:1, explanation:"260÷45=5.77...이므로 최소 6대가 필요하다."},
{category:"수리능력", question:"다음은 A지점의 월별 대출 상담 건수이다: 1월 40건, 2월 55건, 3월 65건, 4월 60건. 4개월간 평균 상담 건수는?", choices:["50건","52건","55건","58건"], answer:2, explanation:"합계=40+55+65+60=220건. 평균=220÷4=55건."},
{category:"수리능력", question:"연도별 조합원 저축 총액이 2022년 80억원, 2023년 92억원이었다. 2023년의 전년 대비 증가율은?", choices:["10%","12%","15%","20%"], answer:2, explanation:"(92-80)/80=12/80=0.15=15%."},
{category:"수리능력", question:"상품별 판매 비중이 예금 40%, 대출 35%, 보험 15%, 카드 10%이다. 전체 고객 수가 2,000명일 때, 보험 상품을 이용하는 고객 수는?", choices:["200명","250명","300명","350명"], answer:2, explanation:"2,000×0.15=300명."},
{category:"수리능력", question:"A지점은 직원 10명이 총 350건, B지점은 직원 15명이 총 480건을 처리했다. 직원 1인당 처리 건수가 더 많은 지점과 그 값은?", choices:["A지점, 35건","B지점, 32건","A지점, 32건","B지점, 35건"], answer:0, explanation:"A지점=350÷10=35건/인, B지점=480÷15=32건/인. A지점이 더 많다."},
{category:"수리능력", question:"자동차로 240km 떨어진 곳을 시속 60km로 이동하면서 도중에 30분간 휴식을 취했다. 총 소요 시간은?", choices:["4시간","4.5시간","5시간","5.5시간"], answer:1, explanation:"이동시간=240÷60=4시간. 휴식 30분을 더하면 총 4.5시간."},
{category:"수리능력", question:"자전거를 타고 갈 때는 시속 15km, 걸어서 돌아올 때는 시속 5km로 같은 길을 왕복했더니 총 4시간이 걸렸다. 편도 거리는?", choices:["10km","12km","15km","18km"], answer:2, explanation:"편도 거리를 d라 하면 d/15+d/5=4 → (d+3d)/15=4 → 4d=60 → d=15km."},
{category:"수리능력", question:"A와 B는 같은 지점에서 같은 방향으로 동시에 출발했다. A는 시속 8km, B는 시속 5km로 걸을 때, A가 B보다 6km 앞서는 데 걸리는 시간은?", choices:["1.5시간","2시간","2.5시간","3시간"], answer:1, explanation:"속력차=8-5=3km/h. 6÷3=2시간."},
{category:"수리능력", question:"360km 거리를 시속 90km로 달리면 시속 72km로 달릴 때보다 몇 분 일찍 도착하는가?", choices:["40분","50분","60분","75분"], answer:2, explanation:"360/90=4시간, 360/72=5시간. 차이=1시간=60분."},
{category:"수리능력", question:"배가 강을 거슬러 오르는데 시속 8km, 내려올 때는 시속 12km로 같은 구간을 왕복하는데 총 5시간이 걸렸다. 편도 거리는?", choices:["20km","22km","24km","28km"], answer:2, explanation:"편도 거리 d에 대해 d/8+d/12=5 → 5d/24=5 → d=24km."},
{category:"수리능력", question:"시속 4km로 걷던 사람이 9km 떨어진 목적지까지 가는데, 도중부터 시속 6km로 속도를 올려 총 1시간 45분 만에 도착했다. 시속 4km로 걸은 거리는?", choices:["2km","3km","4km","5km"], answer:1, explanation:"시속 4km로 걸은 거리를 x라 하면 x/4+(9-x)/6=1.75 → 3x+2(9-x)=21 → x=3km."},
{category:"수리능력", question:"A, B 두 지점을 왕복하는데 갈 때는 시속 50km, 올 때는 시속 75km로 달렸다. 왕복 평균 속력은?", choices:["58km/h","60km/h","62.5km/h","65km/h"], answer:1, explanation:"평균속력=2×50×75/(50+75)=7500/125=60km/h."},
{category:"수리능력", question:"길이 260m인 터널을 완전히 통과하는 데 12초가 걸리는 기차가 있다. 기차의 길이가 100m라면 이 기차의 속력은?", choices:["25m/s","28m/s","30m/s","32m/s"], answer:2, explanation:"터널+기차 길이=260+100=360m. 속력=360÷12=30m/s."},
{category:"수리능력", question:"둘레 2.4km인 트랙을 갑은 시속 12km, 을은 같은 방향으로 시속 8km로 동시에 출발했다. 갑이 을을 한 바퀴 앞서는 데 걸리는 시간은?", choices:["24분","30분","36분","40분"], answer:2, explanation:"속력차=12-8=4km/h. 2.4÷4=0.6시간=36분."},
{category:"수리능력", question:"시속 72km로 달리는 자동차의 속력을 m/s로 환산하면?", choices:["15m/s","18m/s","20m/s","22m/s"], answer:2, explanation:"72×1000÷3600=20m/s."},
{category:"수리능력", question:"A는 집에서 회사까지 시속 40km로 가면 정시보다 6분 늦게 도착하고, 시속 50km로 가면 정시보다 6분 일찍 도착한다. 집에서 회사까지의 거리는?", choices:["32km","36km","40km","45km"], answer:2, explanation:"거리 d에 대해 d/40-d/50=12/60=0.2 → d(5-4)/200=0.2 → d=40km."},
{category:"수리능력", question:"두 주자가 400m 트랙에서 반대 방향으로 동시에 출발하여 각각 초속 5m, 초속 3m로 달릴 때, 처음 만날 때까지 걸리는 시간은?", choices:["40초","45초","50초","60초"], answer:2, explanation:"합산속력=5+3=8m/s. 400÷8=50초."},
{category:"수리능력", question:"어떤 일을 A가 혼자 하면 10일, B가 혼자 하면 15일 걸린다. A가 4일 동안 일하다가 그만두면, 나머지를 B가 혼자 하는데 며칠이 걸리는가?", choices:["6일","8일","9일","10일"], answer:2, explanation:"A가 4일간 한 일의 양=4/10=2/5. 남은 일=3/5. B의 하루 작업량=1/15이므로 시간=3/5÷1/15=9일."},
{category:"수리능력", question:"물탱크를 채우는 데 A관은 4시간, 배수하는 데 B관은 12시간이 걸린다. 두 관을 동시에 열면 물탱크를 채우는 데 걸리는 시간은?", choices:["5시간","6시간","7시간","8시간"], answer:1, explanation:"순유입률=1/4-1/12=3/12-1/12=2/12=1/6. 시간=6시간."},
{category:"수리능력", question:"어떤 작업에서 갑은 을보다 일을 2배 빨리 한다. 두 사람이 함께 작업하면 8일이 걸릴 때, 갑이 혼자 하면 며칠 걸리는가?", choices:["10일","12일","14일","16일"], answer:1, explanation:"을의 하루 작업량을 r이라 하면 갑=2r. 3r=1/8 → r=1/24. 갑의 작업량=1/12 → 갑 혼자 12일."},
{category:"수리능력", question:"직원 8명이 어떤 작업을 10일 만에 끝낼 수 있다. 같은 작업을 5일 만에 끝내려면 몇 명이 더 필요한가?", choices:["6명","7명","8명","9명"], answer:2, explanation:"총 작업량=8×10=80인일. 5일에 필요한 인원=80÷5=16명. 추가 필요 인원=16-8=8명."},
{category:"수리능력", question:"A, B 두 사람이 함께 일하면 6일 걸리는 작업을, A 혼자 먼저 4일 일한 후 나머지를 B가 혼자 9일 만에 마쳤다. A 혼자 이 작업을 하면 며칠 걸리는가?", choices:["8일","9일","10일","12일"], answer:2, explanation:"A와 B의 하루 작업량을 a, b라 하면 a+b=1/6, 4a+9b=1. 연립하면 a=1/10 → A 혼자 10일."},
{category:"수리능력", question:"어떤 공사를 정상적으로 진행하면 20일이 걸리지만, 작업 속도를 25% 높이면 며칠 만에 끝낼 수 있는가?", choices:["14일","15일","16일","18일"], answer:2, explanation:"작업 속도가 1.25배가 되면 소요일수는 20÷1.25=16일."},
{category:"수리능력", question:"인쇄기 A는 분당 40장, 인쇄기 B는 분당 60장을 인쇄한다. 두 인쇄기를 동시에 가동하여 총 3,000장을 인쇄하는 데 걸리는 시간은?", choices:["25분","28분","30분","32분"], answer:2, explanation:"합산 속도=40+60=100장/분. 시간=3,000÷100=30분."},
{category:"수리능력", question:"벽면 페인트칠을 갑 혼자 하면 6시간, 을 혼자 하면 9시간 걸린다. 갑과 을이 함께 2시간 동안 작업한 후 나머지를 을 혼자 마무리하려면 추가로 몇 시간이 걸리는가?", choices:["3시간","3.5시간","4시간","4.5시간"], answer:2, explanation:"합산 작업률=1/6+1/9=5/18. 2시간 동안 5/9 완료, 남은 4/9를 을 혼자(1/9/시간) 처리하면 4시간."},
{category:"수리능력", question:"어떤 저수지에 물을 채우는데 수도관 하나로는 6시간, 배수구로 빼는데는 15시간이 걸린다. 수도관과 배수구를 동시에 열어 놓으면 저수지를 채우는 데 걸리는 시간은?", choices:["8시간","9시간","10시간","12시간"], answer:2, explanation:"순유입률=1/6-1/15=5/30-2/30=3/30=1/10. 채우는 시간=10시간."},
{category:"수리능력", question:"신입사원 연수 과제를 A팀은 6일, B팀은 10일, C팀은 15일 만에 각각 끝낼 수 있다. 세 팀이 함께 작업하면 며칠 걸리는가?", choices:["2일","3일","4일","5일"], answer:1, explanation:"하루 작업량 합=1/6+1/10+1/15=5/30+3/30+2/30=10/30=1/3. 완료 시간=3일."},
{category:"수리능력", question:"현재 A의 나이는 B의 나이의 3배이다. 9년 후 A의 나이가 B의 나이의 2배가 된다면 현재 B의 나이는?", choices:["6세","7세","9세","11세"], answer:2, explanation:"B의 나이를 b라 하면 A=3b. 9년 후 3b+9=2(b+9) → b=9세."},
{category:"수리능력", question:"현재 삼촌과 조카의 나이 합은 50세이고, 삼촌의 나이는 조카 나이의 4배이다. 조카의 나이는?", choices:["8세","9세","10세","12세"], answer:2, explanation:"조카 나이를 n이라 하면 n+4n=50 → n=10세."},
{category:"수리능력", question:"4년 전 아버지의 나이는 아들 나이의 7배였고, 현재 아버지의 나이는 아들 나이의 4배이다. 현재 아버지의 나이는?", choices:["28세","30세","32세","34세"], answer:2, explanation:"아들 현재 나이를 s라 하면 아버지=4s. 4년 전 4s-4=7(s-4) → s=8, 아버지=32세."},
{category:"수리능력", question:"올해 언니의 나이는 동생 나이의 2배보다 3살 많다. 두 사람의 나이 합이 33세일 때, 동생의 나이는?", choices:["8세","9세","10세","11세"], answer:2, explanation:"동생 나이를 e라 하면 언니=2e+3. e+(2e+3)=33 → 3e=30 → e=10세."},
{category:"수리능력", question:"현재 이모의 나이는 조카 나이의 5배이다. 10년 후 이모의 나이가 조카 나이의 3배가 될 때, 현재 조카의 나이는?", choices:["8세","9세","10세","12세"], answer:2, explanation:"조카 나이를 n이라 하면 이모=5n. 10년 후 5n+10=3(n+10) → n=10세."},
{category:"수리능력", question:"현재 나이 차이가 6세인 두 형제가 있다. 7년 후 형의 나이가 동생 나이의 1.5배가 될 때, 현재 동생의 나이는?", choices:["4세","5세","6세","7세"], answer:1, explanation:"동생 현재 나이를 y라 하면 형=y+6. 7년 후 y+13=1.5(y+7) → 0.5y=2.5 → y=5세."},
{category:"수리능력", question:"현재 세 형제의 나이 합은 44세이며, 첫째는 둘째보다 3세 많고 둘째는 셋째보다 4세 많다. 셋째의 나이는?", choices:["9세","10세","11세","12세"], answer:2, explanation:"셋째 나이를 t라 하면 둘째=t+4, 첫째=t+7. t+(t+4)+(t+7)=44 → 3t+11=44 → t=11세."},
{category:"수리능력", question:"아버지 나이는 딸 나이의 5배보다 2세 적다. 두 사람 나이의 합이 58세일 때 딸의 나이는?", choices:["8세","9세","10세","11세"], answer:2, explanation:"딸 나이를 d라 하면 아버지=5d-2. d+5d-2=58 → 6d=60 → d=10세."},
{category:"수리능력", question:"농도 5%의 소금물 400g에 소금 100g을 추가로 넣으면 농도는 몇 %가 되는가?", choices:["20%","22%","24%","26%"], answer:2, explanation:"소금량=400×0.05+100=20+100=120g. 총량=500g. 농도=120/500=24%."},
{category:"수리능력", question:"농도 24%의 소금물 250g에 물 350g을 섞으면 농도는 몇 %가 되는가?", choices:["8%","9%","10%","12%"], answer:2, explanation:"소금량=250×0.24=60g. 총량=250+350=600g. 농도=60/600=10%."},
{category:"수리능력", question:"농도 7%의 소금물과 농도 13%의 소금물을 섞어서 농도 10%의 소금물 600g을 만들려고 한다. 필요한 7% 소금물의 양은?", choices:["250g","280g","300g","320g"], answer:2, explanation:"7%소금물 xg, 13%소금물 (600-x)g. 0.07x+0.13(600-x)=60 → -0.06x=-18 → x=300g."},
{category:"수리능력", question:"농도 15%의 소금물 240g에서 물을 증발시켜 농도 24%의 소금물을 만들려고 한다. 증발시켜야 하는 물의 양은?", choices:["70g","80g","90g","100g"], answer:2, explanation:"소금량=240×0.15=36g. 36/(240-x)=0.24 → 240-x=150 → x=90g."},
{category:"수리능력", question:"농도 10%의 소금물 500g에서 물 100g을 증발시키면 농도는 몇 %가 되는가?", choices:["11%","12%","12.5%","13%"], answer:2, explanation:"소금량=500×0.1=50g(불변). 총량이 400g으로 줄어드므로 농도=50/400=12.5%."},
{category:"수리능력", question:"소금물 A(농도 6%) 400g과 소금물 B(농도 x%) 200g을 섞었더니 농도 10%의 소금물이 되었다. B의 농도는?", choices:["15%","16%","18%","20%"], answer:2, explanation:"400×0.06+200×(x/100)=600×0.10 → 24+2x=60 → 2x=36 → x=18%."},
{category:"수리능력", question:"물 240g에 소금 xg을 넣어 농도 20%의 소금물을 만들려고 한다. 필요한 소금의 양은?", choices:["50g","55g","60g","65g"], answer:2, explanation:"x/(240+x)=0.2 → x=0.2×240+0.2x → 0.8x=48 → x=60g."},
{category:"수리능력", question:"농도 30%의 소금물 100g과 농도 10%의 소금물 300g을 섞으면 몇 %의 소금물이 되는가?", choices:["13%","14%","15%","16%"], answer:2, explanation:"소금량=100×0.3+300×0.1=30+30=60g. 총량=400g. 농도=60/400=15%."},
{category:"수리능력", question:"설탕물 500g의 농도가 8%이다. 여기에 물을 더 넣어 농도를 4%로 만들려면 물을 얼마나 더 넣어야 하는가?", choices:["400g","450g","500g","550g"], answer:2, explanation:"설탕량=500×0.08=40g. 40/(500+x)=0.04 → 500+x=1000 → x=500g."},
{category:"수리능력", question:"농도 16%의 소금물 150g과 농도 4%의 소금물 450g을 섞으면 몇 %의 소금물이 되는가?", choices:["6%","7%","8%","9%"], answer:1, explanation:"소금량=150×0.16+450×0.04=24+18=42g. 총량=600g. 농도=42/600=7%."},
{category:"수리능력", question:"소금물 360g 중 소금이 45g 들어 있다. 이 소금물의 농도는?", choices:["10%","11.5%","12.5%","13%"], answer:2, explanation:"45÷360=0.125=12.5%."},
{category:"수리능력", question:"농도 20%의 소금물 500g에서 소금물 200g을 퍼내고 그 자리에 물 200g을 부으면 새로운 소금물의 농도는?", choices:["10%","12%","14%","15%"], answer:1, explanation:"퍼내고 남은 300g의 농도는 여전히 20%이므로 소금량=60g. 물 200g을 더해도 총량은 500g. 농도=60/500=12%."},
{category:"수리능력", question:"원가 12,000원인 물건에 25%의 이익을 붙여 정가를 정했다가, 재고 처리를 위해 정가에서 20% 할인하여 판매했다. 이때 손익은?", choices:["손실 600원","이익 없음","이익 600원","이익 1,200원"], answer:1, explanation:"정가=12,000×1.25=15,000원. 판매가=15,000×0.8=12,000원. 원가와 같아 이익이 없다."},
{category:"수리능력", question:"정가 60,000원짜리 제품을 15% 할인해서 팔았을 때 판매가는?", choices:["48,000원","49,500원","51,000원","52,500원"], answer:2, explanation:"60,000×0.85=51,000원."},
{category:"수리능력", question:"원가에 35%의 이익을 붙여 정가를 정했더니 정가가 27,000원이 되었다. 원가는?", choices:["18,500원","19,500원","20,000원","21,000원"], answer:2, explanation:"원가×1.35=27,000 → 원가=20,000원."},
{category:"수리능력", question:"어떤 상품을 정가에서 30% 할인하여 팔아도 원가의 5% 이익이 남도록 하려고 한다. 원가가 40,000원일 때 정가는?", choices:["55,000원","58,000원","60,000원","62,000원"], answer:2, explanation:"판매가=40,000×1.05=42,000원. 정가×0.7=42,000 → 정가=60,000원."},
{category:"수리능력", question:"상품 가격을 20% 인상한 후 다시 20% 인하했다. 원래 가격이 30,000원이었다면 최종 가격은?", choices:["27,600원","28,200원","28,800원","29,400원"], answer:2, explanation:"30,000×1.2×0.8=28,800원."},
{category:"수리능력", question:"원가 25,000원인 상품에 정가를 붙여 정가의 10% 할인 판매했더니 원가의 8% 이익을 얻었다. 정가는?", choices:["27,500원","28,500원","30,000원","31,500원"], answer:2, explanation:"판매가=25,000×1.08=27,000원. 정가×0.9=27,000 → 정가=30,000원."},
{category:"수리능력", question:"정가 45,000원인 상품을 두 차례에 걸쳐 각각 20%, 10%씩 할인하여 판매했다. 최종 판매가는?", choices:["31,500원","32,400원","33,000원","34,200원"], answer:1, explanation:"45,000×0.8×0.9=32,400원."},
{category:"수리능력", question:"상품 A를 정가에서 30% 할인하여 21,000원에 판매했다. 이 상품의 정가는?", choices:["27,000원","28,000원","30,000원","32,000원"], answer:2, explanation:"정가×0.7=21,000 → 정가=30,000원."},
{category:"수리능력", question:"원가 16,000원인 물건 두 개를 각각 20,000원, 24,000원에 팔았다. 전체 이익률은?", choices:["30%","35%","37.5%","40%"], answer:2, explanation:"총원가=32,000원, 총판매가=44,000원, 이익=12,000원. 이익률=12,000/32,000=37.5%."},
{category:"수리능력", question:"어떤 상품을 원가의 2할 이익을 붙여 정가를 매겼으나 팔리지 않아 정가의 1할을 할인해서 판매하였다. 원가가 50,000원일 때 이익은?", choices:["3,000원","3,500원","4,000원","4,500원"], answer:2, explanation:"정가=50,000×1.2=60,000원. 판매가=60,000×0.9=54,000원. 이익=54,000-50,000=4,000원."},
{category:"수리능력", question:"정가가 원가보다 4,000원 높고, 정가의 25%를 할인하여 팔면 원가와 같아진다. 정가는?", choices:["14,000원","15,000원","16,000원","17,000원"], answer:2, explanation:"원가 c, 정가=c+4,000. (c+4,000)×0.75=c → 0.25c=3,000 → c=12,000원, 정가=16,000원."},
{category:"수리능력", question:"상품의 원가가 30,000원이다. 이 상품을 정가의 10% 할인해서 팔아 원가 대비 26% 이익을 얻으려면 정가는 얼마로 정해야 하는가?", choices:["40,000원","41,000원","42,000원","43,000원"], answer:2, explanation:"판매가=30,000×1.26=37,800원. 정가×0.9=37,800 → 정가=42,000원."},
{category:"수리능력", question:"원금 3,000,000원을 연이율 3%의 단리로 5년간 예치했을 때 만기 총액은?", choices:["3,300,000원","3,400,000원","3,450,000원","3,500,000원"], answer:2, explanation:"이자=3,000,000×0.03×5=450,000원. 총액=3,450,000원."},
{category:"수리능력", question:"원금 500,000원을 연이율 8%의 연복리로 2년간 예치했을 때 받는 이자(원금 제외)는?", choices:["80,000원","82,000원","83,200원","84,000원"], answer:2, explanation:"500,000×1.08²=583,200원. 이자=583,200-500,000=83,200원."},
{category:"수리능력", question:"연이율 4%의 단리 예금 상품에 어떤 금액을 예치하여 3년 후 이자로 180,000원을 받았다. 예치한 원금은?", choices:["1,300,000원","1,400,000원","1,500,000원","1,600,000원"], answer:2, explanation:"원금=180,000÷(0.04×3)=180,000÷0.12=1,500,000원."},
{category:"수리능력", question:"원금 2,000,000원을 월이율 0.5%의 단리로 10개월간 예치했을 때 받는 이자는?", choices:["80,000원","90,000원","100,000원","110,000원"], answer:2, explanation:"이자=2,000,000×0.005×10=100,000원."},
{category:"수리능력", question:"원금 1,500,000원을 연이율 6%의 단리로 예치하여 만기 시 총액 1,770,000원을 받았다면 예치 기간은?", choices:["2년","3년","4년","5년"], answer:1, explanation:"이자=1,770,000-1,500,000=270,000원. 기간=270,000÷(1,500,000×0.06)=3년."},
{category:"수리능력", question:"원금 1,000,000원을 연이율 20%의 연복리로 2년간 예치했을 때 만기 총액은?", choices:["1,400,000원","1,420,000원","1,440,000원","1,460,000원"], answer:2, explanation:"1,000,000×1.2²=1,440,000원."},
{category:"수리능력", question:"연이율 5%의 단리 상품에 원금 4,000,000원을 6개월간 예치했을 때 받는 이자는?", choices:["80,000원","90,000원","100,000원","120,000원"], answer:2, explanation:"이자=4,000,000×0.05×(6/12)=100,000원."},
{category:"수리능력", question:"원금 2,500,000원을 연이율 4%의 단리로 예치할 때, 이자가 300,000원이 되려면 몇 년이 걸리는가?", choices:["2년","3년","4년","5년"], answer:1, explanation:"기간=300,000÷(2,500,000×0.04)=3년."},
{category:"수리능력", question:"원금 900,000원을 연이율 10%의 연복리로 3년간 예치했을 때 만기 총액은? (단, 1.1³=1.331)", choices:["1,170,000원","1,188,000원","1,197,900원","1,210,000원"], answer:2, explanation:"900,000×1.1³=900,000×1.331=1,197,900원."},
{category:"수리능력", question:"갑은 원금 2,000,000원을 연이율 6%의 단리로, 을은 원금 2,000,000원을 연이율 5%의 단리로 각각 3년간 예치했다. 두 사람의 이자 차이는?", choices:["40,000원","50,000원","60,000원","70,000원"], answer:2, explanation:"갑 이자=2,000,000×0.06×3=360,000원, 을 이자=2,000,000×0.05×3=300,000원. 차이=60,000원."},
{category:"수리능력", question:"서로 다른 5권의 책을 책꽂이에 일렬로 꽂는 방법의 수는?", choices:["60","100","120","150"], answer:2, explanation:"5!=120가지."},
{category:"수리능력", question:"1부터 9까지의 숫자가 각각 적힌 카드가 있다. 임의로 한 장을 뽑을 때, 짝수 또는 7의 배수가 나올 확률은?", choices:["4/9","5/9","2/3","7/9"], answer:1, explanation:"짝수(2,4,6,8) 4개, 7의 배수(7) 1개, 중복 없음. 확률=5/9."},
{category:"수리능력", question:"남자 5명, 여자 3명 중에서 위원 2명을 뽑을 때, 적어도 한 명이 여자일 확률은?", choices:["5/14","9/14","5/7","3/4"], answer:1, explanation:"전체 C(8,2)=28. 모두 남자인 경우 C(5,2)=10. 적어도 한 명 여자=1-10/28=18/28=9/14."},
{category:"수리능력", question:"동전 하나와 주사위 하나를 동시에 던질 때, 동전은 앞면이 나오고 주사위는 짝수가 나올 확률은?", choices:["1/6","1/4","1/3","1/2"], answer:1, explanation:"동전 앞면 확률 1/2, 주사위 짝수 확률 1/2. 독립사건이므로 1/2×1/2=1/4."},
{category:"수리능력", question:"1부터 100까지의 자연수 중에서 임의로 하나를 뽑을 때, 4의 배수일 확률은?", choices:["1/5","1/4","3/10","1/3"], answer:1, explanation:"1~100 중 4의 배수는 25개. 확률=25/100=1/4."},
{category:"수리능력", question:"서로 다른 색의 공 5개를 일렬로 배열할 때, 특정 두 개의 공이 서로 이웃하지 않게 배열하는 방법의 수는?", choices:["60","64","72","80"], answer:2, explanation:"전체 배열 5!=120, 특정 두 공이 이웃하는 경우=2×4!=48. 이웃하지 않는 경우=120-48=72."},
{category:"수리능력", question:"5개의 문항 중 3개를 선택하여 순서대로 답하는 방법의 수는?", choices:["20","40","60","120"], answer:2, explanation:"순열 P(5,3)=5×4×3=60."},
{category:"수리능력", question:"주사위를 두 번 던질 때, 첫 번째 나온 눈이 두 번째 나온 눈보다 클 확률은?", choices:["1/3","5/12","1/2","7/12"], answer:1, explanation:"전체 36가지 중 두 눈이 같은 경우 6가지를 제외한 30가지의 절반이 첫 번째가 더 큰 경우이므로 15/36=5/12."},
{category:"수리능력", question:"8명의 학생 중 대표 2명을 뽑아 각각 회장, 부회장으로 임명하는 방법의 수는?", choices:["28","42","56","64"], answer:2, explanation:"순열 P(8,2)=8×7=56."},
{category:"수리능력", question:"상자 안에 1부터 20까지의 숫자가 적힌 공이 있다. 임의로 1개를 꺼낼 때, 3의 배수도 아니고 5의 배수도 아닐 확률은?", choices:["9/20","11/20","3/5","13/20"], answer:1, explanation:"3의 배수 6개, 5의 배수 4개, 15의 배수(중복) 1개 → 합집합 9개. 둘 다 아닌 경우=20-9=11개. 확률=11/20."},
{category:"수리능력", question:"흰 공 3개, 검은 공 5개가 든 주머니에서 2개를 동시에 꺼낼 때, 서로 다른 색이 나올 확률은?", choices:["11/28","13/28","15/28","17/28"], answer:2, explanation:"전체 C(8,2)=28. 흰공1·검은공1 조합=3×5=15. 확률=15/28."},
{category:"수리능력", question:"어떤 시험에서 A가 합격할 확률이 0.7, B가 합격할 확률이 0.8이다. 두 사람이 독립적으로 시험을 볼 때, 둘 다 불합격할 확률은?", choices:["0.04","0.06","0.08","0.1"], answer:1, explanation:"둘 다 불합격 확률=(1-0.7)×(1-0.8)=0.3×0.2=0.06."},
{category:"수리능력", question:"6명이 원탁에 둘러앉을 때, 특정 두 사람이 이웃하게 앉는 경우의 수는?", choices:["36","42","48","60"], answer:2, explanation:"두 사람을 한 묶음으로 보면 5명의 원순열 (5-1)!=24, 묶음 내부 순서 2가지. 24×2=48."},
{category:"수리능력", question:"4개의 알파벳 A,B,C,D를 모두 사용하여 만들 수 있는 문자열 중에서 A가 맨 앞에 오는 경우의 수는?", choices:["4","6","8","12"], answer:1, explanation:"A를 고정하고 나머지 3개를 배열하는 방법=3!=6가지."},
{category:"수리능력", question:"자료 2, 4, 6, 8, 10의 평균은?", choices:["5","6","7","8"], answer:1, explanation:"(2+4+6+8+10)/5=30/5=6."},
{category:"수리능력", question:"자료 2, 4, 6, 8, 10의 분산은?", choices:["6","7","8","10"], answer:2, explanation:"평균=6. 편차 제곱의 합=16+4+0+4+16=40. 분산=40/5=8."},
{category:"수리능력", question:"자료 2, 4, 6, 8, 10의 표준편차는? (분산은 8이다)", choices:["2","2√2","3","2√3"], answer:1, explanation:"표준편차=√분산=√8=2√2."},
{category:"수리능력", question:"5개 자료의 평균이 20이고 분산이 16일 때, 표준편차는?", choices:["3","4","5","6"], answer:1, explanation:"표준편차=√16=4."},
{category:"수리능력", question:"자료 3, 5, 7, 7, 8의 중앙값(median)은?", choices:["5","6","7","8"], answer:2, explanation:"자료를 크기순으로 나열하면 3,5,7,7,8이며 가운데 값(3번째)은 7이다."},
{category:"수리능력", question:"어떤 반 학생 8명의 시험 점수가 70, 75, 80, 80, 80, 85, 90, 95일 때, 최빈값은?", choices:["75","80","85","90"], answer:1, explanation:"80점이 3번으로 가장 많이 나타나므로 최빈값은 80점이다."},
{category:"수리능력", question:"A반 학생 30명의 평균 점수는 72점, B반 학생 20명의 평균 점수는 82점이다. 두 반을 합친 전체 평균 점수는?", choices:["75점","76점","77점","78점"], answer:1, explanation:"합계=30×72+20×82=2,160+1,640=3,800. 인원=50. 평균=3,800÷50=76점."},
{category:"수리능력", question:"6개 지점의 월 매출이 각각 100, 120, 90, 110, 130, 140(백만원)일 때, 평균 매출액과 최댓값의 차이는?", choices:["20백만원","23백만원","25백만원","28백만원"], answer:2, explanation:"평균=690÷6=115백만원. 최댓값 140백만원과의 차이=25백만원."},
{category:"수리능력", question:"자료 4, 6, 8, 10, 12의 평균으로부터 각 값의 편차 제곱의 합은?", choices:["30","35","40","45"], answer:2, explanation:"평균=8. 편차: -4,-2,0,2,4. 제곱합=16+4+0+4+16=40."},
{category:"수리능력", question:"어떤 자료의 분산이 25일 때 표준편차는?", choices:["4","5","6","25"], answer:1, explanation:"표준편차=√25=5."},
{category:"수리능력", question:"두 그룹 A(10명, 평균 75점), B(15명, 평균 85점)를 합친 전체 평균 점수는?", choices:["79점","80점","81점","82점"], answer:2, explanation:"합계=10×75+15×85=750+1,275=2,025. 인원=25. 평균=2,025÷25=81점."},
{category:"수리능력", question:"5명의 몸무게가 각각 55, 60, 65, 70, 75kg일 때 이 자료의 범위(최댓값-최솟값)는?", choices:["15kg","18kg","20kg","25kg"], answer:2, explanation:"범위=최댓값-최솟값=75-55=20kg."},
{category:"수리능력", question:"다음은 어느 지점의 요일별 방문 고객 수이다: 월 90명, 화 85명, 수 100명, 목 95명, 금 120명, 토 150명, 일 140명. 일주일간 총 방문 고객 수는?", choices:["760명","770명","780명","800명"], answer:2, explanation:"90+85+100+95+120+150+140=780명."},
{category:"수리능력", question:"다음은 연도별 신규 대출 건수이다: 2021년 300건, 2022년 360건, 2023년 420건. 2021년 대비 2023년의 증가율은?", choices:["30%","35%","40%","45%"], answer:2, explanation:"(420-300)/300=120/300=0.4=40%."},
{category:"수리능력", question:"다음은 A~D 네 지점의 분기 매출액(억원)이다: A 12, B 18, C 15, D 25. 네 지점 매출액 합계에서 D지점이 차지하는 비중은?", choices:["30%","32%","35.7%","40%"], answer:2, explanation:"합계=12+18+15+25=70억원. D지점 비중=25/70=약 35.7%."},
{category:"수리능력", question:"다음은 월별 생산량 추이이다: 1월 500개, 2월 550개, 3월 600개, 4월 480개. 3월 대비 4월 생산량의 감소율은?", choices:["15%","18%","20%","22%"], answer:2, explanation:"3월 대비 4월 감소량=600-480=120개. 감소율=120/600=20%."},
{category:"수리능력", question:"다음은 어느 은행의 상품별 가입 고객 비중이다: 예금 35%, 적금 25%, 대출 20%, 보험 20%. 전체 고객이 4,000명일 때 적금과 보험 가입 고객 수의 합은?", choices:["1,600명","1,700명","1,800명","1,900명"], answer:2, explanation:"적금 고객=4,000×0.25=1,000명, 보험 고객=4,000×0.2=800명. 합계=1,800명."},
{category:"수리능력", question:"어떤 상품의 판매량이 작년 1,200개에서 올해 1,500개로 증가했다. 증가율은?", choices:["20%","22%","25%","28%"], answer:2, explanation:"(1,500-1,200)/1,200=300/1,200=0.25=25%."},
{category:"수리능력", question:"회원 수가 매년 10%씩 증가하는 모임의 현재 회원 수가 1,331명이라면 2년 전 회원 수는?", choices:["1,000명","1,050명","1,100명","1,150명"], answer:2, explanation:"2년 전 회원수×1.1²=1,331 → 2년 전=1,331÷1.21=1,100명."},
{category:"수리능력", question:"어떤 상품 가격이 15% 인하되어 현재 34,000원이다. 인하 전 가격은?", choices:["38,000원","39,000원","40,000원","41,000원"], answer:2, explanation:"인하 전 가격×0.85=34,000 → 인하 전 가격=40,000원."},
{category:"수리능력", question:"지난해 매출 대비 올해 매출이 12% 증가했고, 올해 매출은 5억 6천만원이다. 지난해 매출은?", choices:["4.5억원","4.8억원","5억원","5.2억원"], answer:2, explanation:"지난해 매출×1.12=5.6억원 → 지난해 매출=5억원."},
{category:"수리능력", question:"어떤 공장의 불량률이 지난달 4%에서 이번달 3%로 감소했다. 지난달과 이번달 생산량이 동일하게 2,500개일 때, 두 달의 불량품 수 차이는?", choices:["20개","25개","30개","35개"], answer:1, explanation:"지난달 불량품=2,500×0.04=100개. 이번달=2,500×0.03=75개. 차이=25개."},
/* ===================== 문제해결능력 ===================== */
{category:"문제해결능력", question:"\"비가 오면 우산을 챙긴다\"가 참일 때, 다음 중 반드시 참인 것은?", choices:["우산을 챙기면 비가 온다","비가 오지 않으면 우산을 챙기지 않는다","우산을 챙기지 않으면 비가 오지 않는다","비가 오지 않아도 우산을 챙길 수 있다"], answer:2, explanation:"원명제의 대우(우산을 챙기지 않으면 비가 오지 않는다)는 원명제가 참이면 항상 참입니다. ①②는 역·이 관계로 참임이 보장되지 않습니다."},
{category:"문제해결능력", question:"A, B, C, D 네 사람이 일렬로 서 있다. B는 A보다 앞에, C는 D보다 앞에, A는 C보다 앞에 서 있다. 다음 중 항상 참인 것은?", choices:["B가 가장 앞에 선다","C가 가장 앞에 선다","D가 두 번째로 선다","A가 세 번째로 선다"], answer:0, explanation:"조건을 정리하면 B<A<C<D 순서로 완전히 결정됩니다(작을수록 앞). 따라서 B가 항상 가장 앞에 섭니다."},
{category:"문제해결능력", question:"\"모든 사원은 회의에 참석한다\"가 참일 때, 다음 중 항상 참인 것은?", choices:["모든 참석자는 사원이다","회의에 참석하지 않는 사람은 사원이 아니다","발표를 하는 사람은 모두 사원이다","사원이 아니면 회의에 참석하지 않는다"], answer:1, explanation:"원명제(사원→참석)의 대우는 '참석하지 않으면 사원이 아니다'이며, 이는 원명제와 논리적으로 동치이므로 항상 참입니다. ①③④는 역이나 이 관계로 보장되지 않습니다."},
{category:"문제해결능력", question:"A, B, C, D 네 사람 중 한 명이 회의 자료를 분실했다. 세 사람은 진실을, 한 사람만 거짓을 말한다.\nA: \"나는 분실하지 않았다.\"\nB: \"분실한 사람은 C이다.\"\nC: \"분실한 사람은 D이다.\"\nD: \"나는 분실하지 않았다.\"\n분실한 사람은?", choices:["A","B","C","D"], answer:2, explanation:"C가 거짓을 말한 경우만 모순 없이 성립합니다: C의 말(D가 분실)이 거짓이므로 D는 아니고, B의 말(C가 분실)이 진실이므로 분실한 사람은 C입니다. A, D의 진술도 모두 모순 없이 성립합니다."},
{category:"문제해결능력", question:"SWOT 분석에서 약점(Weakness)에 해당하는 것은?", choices:["신규 시장 진출 기회","경쟁사의 시장 철수","낮은 브랜드 인지도","정부의 지원 정책 확대"], answer:2, explanation:"약점은 조직 내부의 부정적 요인입니다. 낮은 브랜드 인지도가 이에 해당하며, 나머지는 외부의 기회(Opportunity) 요인입니다."},
{category:"문제해결능력", question:"문제해결 절차(문제 인식 → 문제 도출 → 원인 분석 → 해결안 개발 → 실행 및 평가)에서 '문제 인식' 다음 단계는?", choices:["원인 분석","문제 도출","해결안 개발","실행 및 평가"], answer:1, explanation:"문제 인식 이후에는 어떤 문제를 해결해야 하는지 명확히 하는 문제 도출 단계가 이어집니다."},
{category:"문제해결능력", question:"브레인스토밍의 규칙으로 적절하지 않은 것은?", choices:["자유롭게 발언한다","다른 사람의 의견을 비판하지 않는다","질보다 양을 추구한다","발언 전 충분히 검토한 후 신중하게 말한다"], answer:3, explanation:"브레인스토밍은 즉흥적이고 자유로운 발언을 장려하는 기법으로, 신중한 사전 검토를 요구하지 않습니다."},
{category:"문제해결능력", question:"\"을이 참석하면 병도 참석한다\", \"병이 참석하면 정은 참석하지 않는다\", \"정이 참석하지 않으면 무가 참석한다\"가 모두 참일 때, 을이 참석했다면 반드시 참석하는 사람을 모두 고르면?", choices:["갑, 을","을, 병, 무","을, 정","병, 정, 무"], answer:1, explanation:"을 참석→병 참석→정 불참→무 참석. 따라서 을, 병, 무는 반드시 참석하며, 정은 참석하지 않고 갑은 알 수 없습니다."},
{category:"문제해결능력", question:"창의적 사고를 촉진하는 방법으로 적절하지 않은 것은?", choices:["자유연상법","강제연결법","기존 틀에서만 사고하기","마인드맵 활용"], answer:2, explanation:"창의적 사고는 기존의 틀에서 벗어나 사고하는 것이 핵심이며, 틀에 갇힌 사고는 오히려 창의성을 저해합니다."},
{category:"문제해결능력", question:"다음 중 '성급한 일반화의 오류'에 해당하는 예는?", choices:["내가 만난 두 명의 A지역 사람이 불친절했으니 A지역 사람은 모두 불친절하다.","그 사람 말은 못 믿어, 예전에 거짓말을 한 적이 있으니까.","비가 오면 땅이 젖는다. 땅이 젖었으니 비가 온 것이다.","내일도 해가 뜰 것이다, 오늘 해가 떴으니까."], answer:0, explanation:"적은 수의 사례로 전체를 단정 짓는 것이 성급한 일반화의 오류입니다. ②는 인신공격의 오류, ③은 후건 긍정의 오류입니다."},
{category:"문제해결능력", question:"4명 A, B, C, D가 일렬로 된 4개의 좌석(왼쪽부터 1~4번)에 앉는다. D는 4번 자리에 앉고, B는 C의 바로 오른쪽 자리에 앉으며(C, B가 연속), A는 1번 자리에 앉지 않는다. 다음 중 항상 참인 것은?", choices:["C가 맨 왼쪽(1번)에 앉는다","A가 B보다 왼쪽에 앉는다","D는 왼쪽에서 두 번째에 앉는다","B가 맨 왼쪽에 앉는다"], answer:0, explanation:"D=4번 고정. 남은 1~3번에 A,B,C가 앉는데 C,B가 연속이어야 하므로 C=1,B=2,A=3만 성립(A≠1 조건 때문). 따라서 C가 항상 맨 왼쪽입니다."},
{category:"문제해결능력", question:"문제 유형 중 '탐색형 문제'에 해당하는 것은?", choices:["이미 발생하여 원인 규명이 필요한 문제","현재는 문제가 없으나 방치하면 손실이 발생할 것으로 예상되는 문제","미래 상황에 대응하기 위해 새로운 목표를 설정하는 문제","기준을 초과하여 발생한 이탈 문제"], answer:1, explanation:"탐색형 문제(잠재문제)는 현재는 드러나지 않았지만 방치하면 손실이 발생할 수 있는 문제입니다. ①④는 발생형, ③은 설정형 문제입니다."},
{category:"문제해결능력", question:"로직트리(Logic Tree)를 활용하는 목적으로 가장 적절한 것은?", choices:["문제의 원인을 상위-하위 계층으로 세분화하여 체계적으로 분석하기 위해","자원의 소요 비용을 계산하기 위해","팀원의 업무를 배분하기 위해","문서의 형식을 통일하기 위해"], answer:0, explanation:"로직트리는 문제나 원인을 나뭇가지 모양으로 세분화하여 체계적으로 분석하는 도구입니다."},
{category:"문제해결능력", question:"5개 팀(A,B,C,D,E)의 성과 순위에서 \"A는 B보다 순위가 높다\", \"C는 A보다 순위가 높다\", \"D는 E보다 순위가 낮다\", \"B는 D보다 순위가 높다\", \"C는 E보다 순위가 높다\"가 모두 참일 때, 순위가 가장 높은 팀은?", choices:["A","B","C","E"], answer:2, explanation:"C>A>B>D이고 C>E>D이므로, C는 A·B·D·E 모두보다 순위가 높습니다. 따라서 C가 1위입니다."},
{category:"문제해결능력", question:"'해결안 개발' 단계에서 수행하는 활동으로 가장 적절한 것은?", choices:["문제를 명확히 인식한다","다양한 해결안을 도출하고 최적안을 선정한다","실행 결과를 평가한다","문제의 원인을 세분화하여 분석한다"], answer:1, explanation:"해결안 개발 단계에서는 여러 해결 방안을 도출하고 그중 최적의 안을 선정합니다."},
{category:"문제해결능력", question:"논리적 사고를 구성하는 요소로 보기 어려운 것은?", choices:["생각하는 습관","상대 논리의 구조화","사실만을 강조한 주장","타인에 대한 이해와 설득"], answer:2, explanation:"논리적 사고의 구성요소는 생각하는 습관, 상대 논리의 구조화, 구체적인 생각, 타인에 대한 이해, 설득 등이며 '사실만을 강조한 주장'은 해당하지 않습니다."},
{category:"문제해결능력", question:"SWOT 분석에서 'ST전략'의 의미로 적절한 것은?", choices:["강점을 활용하여 기회를 포착하는 전략","강점을 활용하여 위협을 회피·최소화하는 전략","약점을 보완하여 기회를 활용하는 전략","약점과 위협을 최소화하는 전략"], answer:1, explanation:"ST전략은 내부 강점(Strength)으로 외부 위협(Threat)을 회피하거나 최소화하는 전략입니다."},
{category:"문제해결능력", question:"\"모든 면접자는 필기시험 합격자이다\"와 \"갑은 면접을 보았다\"가 참일 때, 다음 중 반드시 참인 것은?", choices:["갑은 필기시험에 합격했다","갑은 서류심사에 탈락했다","갑을 제외한 모두는 필기시험에 불합격했다","필기시험 합격자는 모두 면접을 본다"], answer:0, explanation:"전건 긍정(모두스 포넨스)에 의해 면접을 본 갑은 필기시험 합격자입니다. ④는 역 관계로 보장되지 않습니다."},
{category:"문제해결능력", question:"브레인스토밍에서 아이디어가 충분히 나온 후 다음 단계로 가장 적절한 것은?", choices:["즉시 실행한다","유사한 아이디어끼리 그룹화(유목화)한다","제안자를 평가한다","회의를 바로 종료한다"], answer:1, explanation:"도출된 아이디어를 유사한 것끼리 묶어 정리하는 유목화 단계가 이어집니다."},
{category:"문제해결능력", question:"문제해결에 필요한 기본 요소 중 '전략적 사고'의 의미로 가장 적절한 것은?", choices:["현재 담당 업무만을 고려하는 사고","문제와 해결방안을 조직 전체의 관점에서 검토하는 사고","남들이 쓰지 않는 방식을 무조건 사용하는 사고","과거의 경험만을 활용하는 사고"], answer:1, explanation:"전략적 사고는 현재 담당 업무를 넘어 조직 전체의 관점에서 문제를 바라보는 사고를 의미합니다."},
{category:"문제해결능력", question:"SWOT 분석에서 '기회(Opportunity)'에 해당하는 것은?", choices:["낮은 자금력","노후화된 설비","신규 시장의 성장","경쟁사의 공격적 마케팅"], answer:2, explanation:"신규 시장의 성장은 외부의 긍정적 요인인 기회에 해당합니다. 낮은 자금력·노후화된 설비는 내부 약점, 경쟁사의 공격적 마케팅은 외부 위협입니다."},
{category:"문제해결능력", question:"SWOT 분석에서 'WO전략'의 의미로 적절한 것은?", choices:["약점을 보완하여 기회를 활용하는 전략","강점으로 위협을 회피하는 전략","강점으로 기회를 포착하는 전략","약점과 위협을 동시에 최소화하는 전략"], answer:0, explanation:"WO전략은 내부 약점(Weakness)을 보완하여 외부 기회(Opportunity)를 활용하는 전략입니다."},
{category:"문제해결능력", question:"SWOT 분석에서 'WT전략'의 의미로 적절한 것은?", choices:["약점을 보완하고 위협을 회피하기 위해 사업을 축소하거나 철수하는 전략","강점을 활용해 기회를 극대화하는 전략","기회를 이용해 약점을 보완하는 전략","위협요인을 강점으로 전환하는 전략"], answer:0, explanation:"WT전략은 내부 약점과 외부 위협이 겹치는 가장 불리한 상황에서 방어적으로 사업을 축소·철수하는 전략입니다."},
{category:"문제해결능력", question:"문제해결 절차 중 '원인 분석' 단계에서 수행하는 활동으로 가장 적절한 것은?", choices:["문제의 근본 원인을 파악하기 위해 자료를 수집하고 분석한다","해결안을 실행한다","실행 결과를 평가한다","목표를 처음 설정한다"], answer:0, explanation:"원인 분석 단계는 문제 도출 이후 근본 원인을 찾기 위해 자료를 수집·분석하는 단계입니다."},
{category:"문제해결능력", question:"문제해결 절차 중 '실행 및 평가' 단계의 활동으로 가장 적절한 것은?", choices:["실행계획을 수립하고 실행 결과를 평가하여 피드백한다","문제를 처음 인식한다","문제의 원인을 도출한다","해결안을 도출한다"], answer:0, explanation:"실행 및 평가는 문제해결 절차의 마지막 단계로, 계획을 실행하고 그 결과를 평가·피드백합니다."},
{category:"문제해결능력", question:"여러 아이디어를 자유롭게 발산시키는 사고방식은?", choices:["수렴적 사고","발산적 사고","비판적 사고","논리적 사고"], answer:1, explanation:"발산적 사고는 다양한 아이디어를 자유롭게 확장하여 생성하는 사고방식입니다."},
{category:"문제해결능력", question:"여러 아이디어 중 최적의 답을 선택해 나가는 사고방식은?", choices:["발산적 사고","수렴적 사고","직관적 사고","확산적 사고"], answer:1, explanation:"수렴적 사고는 도출된 다양한 아이디어를 평가·선별하여 최적의 답으로 좁혀가는 사고방식입니다."},

{category:"문제해결능력", question:"논리적 사고 개발 방법인 '피라미드 구조'의 활용 목적으로 가장 적절한 것은?", choices:["하위의 개별 사실들을 종합하여 상위의 결론을 도출하는 과정을 구조화하기 위해","예산을 배정하기 위해","일정을 순차적으로 나열하기 위해","물품을 분류하기 위해"], answer:0, explanation:"피라미드 구조는 하위의 사실·근거들을 쌓아 올려 상위의 결론에 이르는 논리 전개를 시각적으로 구조화한 것입니다."},
{category:"문제해결능력", question:"브레인라이팅(Brainwriting)의 특징으로 가장 적절한 것은?", choices:["발언 대신 글로 아이디어를 적어 제출함으로써 발언에 소극적인 사람도 참여할 수 있게 하는 기법","반드시 발표를 통해서만 아이디어를 낸다","리더 한 사람만 아이디어를 제시한다","비판을 반드시 포함해야 한다"], answer:0, explanation:"브레인라이팅은 말이 아닌 글로 아이디어를 제출하여 발언이 어려운 사람도 자유롭게 참여할 수 있게 하는 기법입니다."},
{category:"문제해결능력", question:"문제해결 시 '가설 지향적 접근'이 의미하는 것으로 가장 적절한 것은?", choices:["문제의 원인이나 해결책에 대한 가설을 먼저 세우고 이를 검증하며 접근하는 방식","아무런 가정 없이 모든 자료를 무작정 수집하는 방식","이미 검증이 끝난 사실만 다루는 방식","가설을 세우지 않는 것이 좋다는 원칙"], answer:0, explanation:"가설 지향적 접근은 먼저 가설을 세우고 이를 자료로 검증해 나가며 효율적으로 문제에 접근하는 방식입니다."},
{category:"문제해결능력", question:"다음 중 '미끄러운 경사길 오류'의 예로 가장 적절한 것은?", choices:["이번에 지각을 허용하면 결국 모든 직원이 매일 지각하게 되고 회사는 망할 것이다.","내 편이 아니면 적이다.","모두가 찬성하니 옳다.","그가 예전에 실수했으니 이번에도 틀렸다."], answer:0, explanation:"미끄러운 경사길 오류는 한 단계를 허용하면 극단적인 결과까지 불가피하게 이어진다고 과장하는 오류입니다."},
{category:"문제해결능력", question:"SWOT 분석에서 '기회-위협(O-T)' 요인이 외부 환경 요인으로 분류되는 이유는?", choices:["조직이 통제하기 어려운 시장, 경쟁, 정책 등 외부에서 비롯되기 때문","항상 긍정적이기 때문","조직 내부 역량이기 때문","측정이 불가능하기 때문"], answer:0, explanation:"기회와 위협은 조직이 직접 통제하기 어려운 시장·경쟁·정책 등 외부 환경에서 비롯되는 요인입니다."},
{category:"문제해결능력", question:"'벤치마킹' 수행 시 유의할 점으로 가장 적절한 것은?", choices:["타사의 성공 요인을 자사의 상황에 맞게 재해석하여 적용해야 한다","타사의 방식을 그대로 복제하면 항상 성공한다","경쟁사 정보는 불법적으로라도 수집해야 한다","자사의 상황은 고려하지 않아도 된다"], answer:0, explanation:"벤치마킹은 타사의 성공 요인을 그대로 베끼는 것이 아니라 자사 상황에 맞게 재해석하여 적용해야 효과가 있습니다."},
{category:"문제해결능력", question:"\"성과가 좋으면 보너스를 받는다\"가 참일 때 반드시 참인 것은?", choices:["보너스를 받으면 성과가 좋다","보너스를 받지 못하면 성과가 좋지 않다","성과가 좋지 않으면 보너스를 받지 못한다","성과가 좋지 않아도 보너스를 받을 수 있다"], answer:1, explanation:"원명제(성과 좋음→보너스)의 대우인 \"보너스를 받지 못하면 성과가 좋지 않다\"만 항상 참입니다. ①③은 역·이 관계로 보장되지 않습니다."},
{category:"문제해결능력", question:"A,B,C,D,E 다섯 명이 달리기 시합을 했다. B는 A보다 늦게 들어왔고, C는 B보다 늦게 들어왔다. D는 A보다 먼저 들어왔고, E는 D보다 늦게 들어왔지만 A보다는 먼저 들어왔다. 1등은 누구인가?", choices:["A","D","E","C"], answer:1, explanation:"조건을 정리하면 D<E<A<B<C 순서(빠른 순)로 완전히 결정됩니다. 따라서 1등은 D입니다."},
{category:"문제해결능력", question:"갑,을,병,정 네 사람 중 한 명만 진실을 말하고 세 명은 거짓을 말한다. 갑: \"을은 거짓말을 한다.\" 을: \"병은 거짓말을 한다.\" 병: \"정은 진실을 말한다.\" 정: \"갑은 진실을 말한다.\" 진실을 말한 사람은?", choices:["갑","을","병","정"], answer:1, explanation:"을이 진실을 말한다고 가정하면 병=거짓, 정=거짓, 갑=거짓이 모두 모순 없이 성립하며 진실이 정확히 1명입니다. 다른 경우는 모두 진실이 2명 이상 되어 모순됩니다."},
{category:"문제해결능력", question:"5개 부서(인사,총무,영업,홍보,전산) 중 신입사원 5명(A,B,C,D,E)이 각각 한 부서씩 배치된다. A는 영업팀이 아니다. B는 홍보팀이다. C는 전산팀이다. D는 총무팀이다. E는 인사팀이 아니다. 다음 중 옳은 것은?", choices:["A는 인사팀이다","B는 영업팀이다","D는 홍보팀이다","E는 전산팀이다"], answer:0, explanation:"B=홍보, D=총무, C=전산으로 고정되면 남은 인사·영업은 A, E가 나눠 갖는데 A는 영업이 아니므로 A=인사, E=영업으로 확정됩니다."},
{category:"문제해결능력", question:"원탁에 A,B,C,D,E,F 여섯 명이 일정한 간격으로 앉아 있다. A와 D는 마주보고 앉아있다. B는 A의 바로 오른쪽에 앉는다. C는 B의 바로 오른쪽에 앉는다. E는 D의 바로 오른쪽에 앉는다. F의 바로 오른쪽에 앉는 사람은?", choices:["A","B","C","E"], answer:0, explanation:"6인 원탁에서 A(1)-B(2)-C(3)-D(4)-E(5)-F(6) 순서로 시계방향 자리가 결정되며, F(6번)의 바로 오른쪽(시계방향 다음)은 A(1번)입니다."},
{category:"문제해결능력", question:"병은 1위이다. 갑은 을보다 순위가 높다. 무는 을보다 순위가 높다. 정은 무보다 순위가 낮다. 을은 정보다 순위가 높다. 순위가 가장 낮은(5위) 사람은?", choices:["갑","을","무","정"], answer:3, explanation:"을<정, 무<정이 모두 성립하고 갑<을이므로 정은 갑·을·무 모두보다 순위가 낮습니다(숫자가 큼). 따라서 정이 5위입니다."},
{category:"문제해결능력", question:"A,B,C,D 네 사람이 각각 커피, 홍차, 주스, 물 중 서로 다른 음료를 하나씩 마신다. A는 커피를 마시지 않는다. B는 주스 또는 물을 마신다. C는 홍차를 마신다. D는 물을 마시지 않는다. 커피를 마시는 사람은?", choices:["A","B","C","D"], answer:3, explanation:"C=홍차로 고정되고, 커피는 A(제외됨)나 B(주스·물만 가능하므로 제외됨)가 될 수 없어 D로 확정됩니다."},
{category:"문제해결능력", question:"\"모든 정규직 사원은 퇴직연금에 가입되어 있다. 민수는 퇴직연금에 가입되어 있지 않다.\" 이때 반드시 참인 것은?", choices:["민수는 정규직이 아니다","민수는 계약직이다","민수는 회사에 다니지 않는다","민수는 곧 퇴직연금에 가입할 것이다"], answer:0, explanation:"원명제의 대우(연금 미가입→정규직 아님)에 의해 ①만 항상 참입니다. ②는 정규직이 아닌 다른 고용형태일 가능성도 있어 보장되지 않습니다."},
{category:"문제해결능력", question:"6개 좌석이 일렬로 있다(왼쪽1~오른쪽6). A는 3 또는 4번에 앉는다. B는 A의 바로 옆에 앉는다. C는 1번, D는 6번에 앉는다. E는 F의 바로 왼쪽에 앉는다. F는 5번에 앉지 않는다. 다음 중 항상 참인 것은?", choices:["A는 3번 자리에 앉는다","B는 5번 자리에 앉는다","E는 4번 자리에 앉는다","C는 6번 자리에 앉는다"], answer:1, explanation:"C=1,D=6 고정 후 남은 2~5에 A,B,E,F를 배치할 때 F≠5 조건을 만족하는 경우는 A=4,B=5,E=2,F=3뿐입니다. 따라서 B는 항상 5번에 앉습니다."},
{category:"문제해결능력", question:"A,B,C,D 네 사람의 진술 중 정확히 하나만 거짓이고 나머지는 진실이다. A: \"나는 1등이 아니다.\" B: \"C가 1등이다.\" C: \"D가 1등이다.\" D: \"나는 1등이다.\" 1등은 누구인가?", choices:["A","B","C","D"], answer:3, explanation:"1등이 D라고 가정하면 A(참),C(참),D(참)는 모두 성립하고 B(거짓)만 거짓이 되어 조건과 일치합니다. 다른 경우는 모두 거짓이 2개 이상 발생합니다."},
{category:"문제해결능력", question:"\"성실한 사람은 신뢰를 받는다. 신뢰를 받는 사람은 승진 기회를 얻는다.\"가 참일 때 항상 참인 것은?", choices:["성실하지 않은 사람은 승진 기회를 얻지 못한다","성실한 사람은 승진 기회를 얻는다","승진 기회를 얻은 사람은 성실하다","신뢰를 받으면 성실하다"], answer:1, explanation:"두 명제를 연쇄적으로 연결(가설적 삼단논법)하면 \"성실하면 승진 기회를 얻는다\"가 항상 참입니다. 나머지는 역·이 관계로 보장되지 않습니다."},
{category:"문제해결능력", question:"가,나,다,라,마 다섯 명이 월~금 하루에 한 명씩 당직을 선다. 가는 월요일 또는 화요일에 당직을 선다. 나는 가보다 먼저 당직을 선다. 다는 금요일에 당직을 선다. 라는 마보다 나중에 당직을 선다. 마는 수요일에 당직을 선다. 목요일에 당직을 서는 사람은?", choices:["가","나","라","마"], answer:2, explanation:"나<가이고 가는 월·화 중 하나여야 하므로 가=화, 나=월로 확정됩니다. 다=금, 마=수가 고정되면 남은 목요일은 라가 차지합니다."},
{category:"문제해결능력", question:"A,B,C 세 사람은 각각 항상 진실만 말하거나 항상 거짓만 말한다. A: \"B는 거짓말쟁이이다.\" B: \"C는 거짓말쟁이이다.\" C: \"A와 B는 모두 거짓말쟁이이다.\" 실제 거짓말쟁이는 몇 명인가?", choices:["0명","1명","2명","3명"], answer:2, explanation:"A가 진실이면 B는 거짓, B가 거짓이면 C는 진실이어야 하는데 C가 진실이려면 \"A와 B 모두 거짓\"이어야 해 A가 진실이라는 가정과 모순됩니다. A가 거짓이면 B는 진실, B가 진실이면 C는 거짓, C가 거짓이면 \"A,B 중 적어도 하나는 진실\"이 성립해야 하는데 B가 진실이므로 모순 없이 성립합니다. 따라서 A=거짓, B=진실, C=거짓으로 거짓말쟁이는 2명(A, C)입니다."},
{category:"문제해결능력", question:"\"모든 회원은 연회비를 납부한다. 어떤 사람은 회원이 아니다.\"라는 전제로부터 논리적으로 반드시 도출되는 것은?", choices:["어떤 사람은 연회비를 납부하지 않는다","모든 사람은 연회비를 납부한다","회원이 아닌 사람은 연회비를 납부하지 않는다","회원이 아닌 사람의 연회비 납부 여부는 이 전제만으로 알 수 없다"], answer:3, explanation:"주어진 전제는 회원의 연회비 납부만 보장할 뿐, 비회원의 연회비 납부 여부에 대해서는 아무런 정보도 주지 않으므로 알 수 없다는 것이 유일하게 타당한 결론입니다."},
{category:"문제해결능력", question:"4개 팀(기획,영업,개발,홍보)이 각각 다른 층(2~5층)에 있다. 기획팀은 개발팀보다 높은 층에 있다. 영업팀은 2층에 있다. 홍보팀은 기획팀보다 낮은 층에 있다. 개발팀은 영업팀보다 높은 층에 있다. 기획팀이 있는 층은?", choices:["2층","3층","4층","5층"], answer:3, explanation:"영업=2층 고정 후 남은 3~5층 중 기획팀은 개발팀과 홍보팀 모두보다 높아야 하므로 유일하게 5층이 될 수 있습니다."},
{category:"문제해결능력", question:"다음 중 브레인스토밍 규칙을 준수한 사례로 가장 적절한 것은?", choices:["팀장이 먼저 결론을 제시하고 나머지는 근거만 덧붙였다","한 팀원이 다소 비현실적인 아이디어를 제시했지만 아무도 비판하지 않고 다음 아이디어로 넘어갔다","아이디어 수가 많아지자 회의 중간에 발언을 제한했다","발언한 아이디어의 실현 가능성을 즉시 평가하여 탈락시켰다"], answer:1, explanation:"브레인스토밍은 비판 금지 원칙에 따라 아이디어의 현실성을 즉시 평가하지 않고 자유롭게 발언을 이어가야 합니다."},
{category:"문제해결능력", question:"갑,을,병,정 네 명 중 정확히 두 명이 자격증을 보유하고 있다. 갑과 을의 진술은 모두 진실이고, 병과 정의 진술은 모두 거짓이다. 갑: \"나는 자격증이 있다.\" 을: \"병은 자격증이 없다.\" 병: \"정은 자격증이 있다.\" 정: \"갑은 자격증이 없다.\" 자격증을 보유한 사람은?", choices:["갑, 을","갑, 병","을, 정","병, 정"], answer:0, explanation:"갑의 진술이 참이므로 갑=보유. 을의 진술이 참이므로 병=미보유. 병의 진술이 거짓이므로 정=미보유. 정확히 두 명이 보유해야 하므로 나머지 한 명인 을=보유로 확정됩니다."},
{category:"문제해결능력", question:"\"프로젝트 예산이 초과되면 추가 승인을 받아야 한다. 이번 프로젝트는 추가 승인을 받지 않았다.\" 이때 반드시 참인 것은?", choices:["이번 프로젝트는 예산이 초과되지 않았다","이번 프로젝트는 예산이 초과되었다","추가 승인은 항상 필요하지 않다","예산이 초과되지 않으면 항상 승인을 받는다"], answer:0, explanation:"원명제(초과→승인)의 대우(승인 안 받음→초과 안 됨)에 의해 ①만 항상 참입니다."},
{category:"문제해결능력", question:"6명이 3명씩 홍팀·백팀으로 나뉜다. A와 B는 같은 팀이다. C와 D는 다른 팀이다. E는 홍팀이다. A는 백팀이다. 다음 중 항상 참인 것은?", choices:["C는 백팀이다","F는 홍팀이다","D는 백팀이다","A는 홍팀이다"], answer:1, explanation:"A,B=백팀(2명), E=홍팀(1명)이 고정되면 C,D 중 한 명이 백팀의 마지막 자리를 채우고 나머지는 홍팀으로 가야 하므로, F는 반드시 홍팀의 나머지 자리를 채우게 됩니다."},
{category:"문제해결능력", question:"로직트리를 활용해 매출 부진의 원인을 분석할 때, 대분류로 적절하지 않은 것은?", choices:["고객 요인(고객 수 감소, 재구매율 하락)","제품 요인(품질, 가격)","유통 요인(판매 채널)","담당자의 개인 취미"], answer:3, explanation:"담당자의 개인 취미는 매출 부진의 원인 분석과 논리적 관련성이 없는 항목입니다."},
{category:"문제해결능력", question:"\"매출이 증가하면 광고비를 늘린다\"가 참일 때 반드시 참인 것은?", choices:["광고비를 늘리면 매출이 증가한다","광고비를 늘리지 않으면 매출이 증가하지 않는다","매출이 증가하지 않으면 광고비를 늘리지 않는다","매출이 증가하지 않아도 광고비를 늘릴 수 있다"], answer:1, explanation:"원명제(증가→늘림)의 대우(안 늘림→증가 안 함)만 항상 참입니다."},
{category:"문제해결능력", question:"A,B,C,D 네 부서의 예산이 서로 다르다. A는 B보다 예산이 많다. C는 A보다 예산이 많다. D는 B보다 예산이 적다. 예산이 가장 많은 부서와 가장 적은 부서를 순서대로 나열하면?", choices:["A, B","C, D","C, A","B, D"], answer:1, explanation:"C>A>B>D 순으로 완전히 결정되므로 가장 많은 부서는 C, 가장 적은 부서는 D입니다."},
{category:"문제해결능력", question:"5명(서연,도윤,민수,지수,현우)이 1~5번 번호표를 받는다(왼쪽1번부터). 서연은 1번, 민수는 3번이다. 지수는 민수보다 번호가 크고, 현우는 지수보다 번호가 크다. 도윤은 현우보다 번호가 작다. 5번을 받는 사람은?", choices:["민수","지수","현우","도윤"], answer:2, explanation:"서연=1, 민수=3 고정 후 남은 2,4,5 중 지수>3, 현우>지수 조건을 만족하려면 지수=4, 현우=5, 도윤=2로 유일하게 결정됩니다."},
{category:"문제해결능력", question:"진실만 말하는 사람 2명과 거짓만 말하는 사람 2명, 총 4명(A,B,C,D)이 있다. A: \"나와 B는 서로 다른 부류이다.\" B: \"C는 거짓말쟁이이다.\" C: \"D는 진실쟁이이다.\" D: \"A는 진실쟁이이다.\" 진실을 말하는 두 사람은?", choices:["A, C, D","A, B","B, D","C, D"], answer:0, explanation:"A의 진술 구조상 A가 진실이든 거짓이든 결과적으로 A는 진실, B는 거짓으로 귀결되며, B가 거짓이므로 C는 진실, C가 진실이므로 D도 진실이 되어 A, C, D가 진실을 말하는 3명이 됩니다."},
{category:"문제해결능력", question:"문제해결 시 활용하는 '체크리스트법'의 특징으로 가장 적절한 것은?", choices:["점검해야 할 항목을 미리 목록화하여 빠짐없이 확인하는 방법","모든 항목을 무작위로 확인하는 방법","한 번 사용한 체크리스트는 재사용하지 않는다","체크리스트는 정량적 항목만 포함해야 한다"], answer:0, explanation:"체크리스트법은 점검할 항목을 사전에 목록화하여 빠짐없이 순서대로 확인하는 기법입니다."},
{category:"문제해결능력", question:"네 명(A,B,C,D)이 각각 다른 스포츠(축구,야구,농구,배구)를 좋아한다. A는 축구를 좋아하지 않는다. B는 농구 또는 배구를 좋아한다. C는 야구를 좋아한다. D는 배구를 좋아하지 않는다. 축구를 좋아하는 사람은?", choices:["A","B","C","D"], answer:3, explanation:"C=야구로 고정되고, 축구는 A(제외)나 B(농구·배구만 가능하므로 제외)가 될 수 없어 D로 확정됩니다."},
{category:"문제해결능력", question:"\"이자율이 오르면 대출 수요가 감소한다. 이번 달 대출 수요는 감소하지 않았다.\" 이때 반드시 참인 것은?", choices:["이번 달 이자율은 오르지 않았다","이번 달 이자율은 올랐다","대출 수요는 항상 일정하다","이자율과 대출 수요는 관련이 없다"], answer:0, explanation:"원명제의 대우(수요 감소 안 함→이자율 안 오름)에 의해 ①만 항상 참입니다."},
{category:"문제해결능력", question:"네 개의 상자(A,B,C,D) 중 하나에만 선물이 있다. 세 사람의 진술 중 두 명은 진실, 한 명은 거짓이다. 갑: \"선물은 A 상자에 있다.\" 을: \"선물은 A 상자에 없다.\" 병: \"선물은 C 상자에 있다.\" 선물이 들어있는 상자는?", choices:["A","B","C","D"], answer:2, explanation:"갑과 을은 서로 반대 주장이라 항상 둘 중 하나만 참입니다. 조건상 진실이 2명이어야 하므로 병은 반드시 진실이어야 하며, 이에 따라 선물은 C 상자에 있습니다."},
{category:"문제해결능력", question:"다음 중 SWOT분석을 실제 상황에 적용한 예로 적절하지 않은 것은?", choices:["낮은 인건비(강점)를 활용해 저가 상품 시장에 진출한다","노후 설비(약점)를 보완하기 위해 정부 지원금(기회)을 활용해 설비를 교체한다","경쟁사의 신제품 출시(위협)에 자사의 기술력(강점)으로 신제품을 선제 출시한다","자금 부족(약점)을 해결하기 위해 오히려 사업을 무리하게 확장한다"], answer:3, explanation:"자금 부족이라는 약점 상황에서 무리하게 사업을 확장하는 것은 WT전략의 취지(위험 회피·축소)에 정반대되는 부적절한 대응입니다."},
{category:"문제해결능력", question:"3명(A,B,C)이 가위바위보를 한 번씩 냈다(모두 다른 것을 냄). A는 가위를 내지 않았다. B는 바위를 내지 않았다. C는 보를 냈다. A가 낸 것은?", choices:["가위","바위","보","알 수 없음"], answer:1, explanation:"C=보로 고정되면 남은 가위·바위 중 A는 가위를 낼 수 없으므로 A=바위, 나머지 B=가위로 결정됩니다."},
{category:"문제해결능력", question:"\"온라인 매출이 늘면 오프라인 매출이 준다. 이번 분기에는 오프라인 매출이 줄지 않았다.\" 이때 반드시 참인 것은?", choices:["이번 분기 온라인 매출은 늘지 않았다","이번 분기 온라인 매출은 늘었다","온라인과 오프라인 매출은 항상 반비례한다","오프라인 매출이 늘면 온라인 매출도 늘어난다"], answer:0, explanation:"원명제의 대우(오프라인 안 줄음→온라인 안 늘음)에 의해 ①만 항상 참입니다."},
{category:"문제해결능력", question:"5명(A,B,C,D,E)의 키를 비교했다. A는 C보다 크다. B는 A보다 작다. D는 E보다 크다. C는 D보다 크다. E는 B보다 크다. 키가 가장 큰 사람은?", choices:["A","B","C","D"], answer:0, explanation:"A>C>D>E>B 순으로 완전히 결정되는 하나의 서열이 만들어지므로 키가 가장 큰 사람은 A입니다."},
{category:"문제해결능력", question:"문제해결을 위한 정보 수집 및 분석 시, 신뢰할 수 없는 자료를 활용했을 때 발생할 수 있는 문제로 가장 적절한 것은?", choices:["의사결정의 정확성이 떨어지고 잘못된 결론에 도달할 위험이 커진다","항상 더 빠른 의사결정이 가능해진다","비용이 자동으로 절감된다","분석 시간이 단축된다"], answer:0, explanation:"신뢰할 수 없는 자료는 잘못된 분석과 결론으로 이어져 의사결정의 정확성을 떨어뜨립니다."},
{category:"문제해결능력", question:"4개 부서(총무,인사,영업,기획)가 순서대로 예산 심사를 받는다. 총무부는 인사부보다 먼저 심사받는다. 영업부는 총무부보다 나중에 심사받는다. 기획부는 영업부보다 먼저 심사받는다. 인사부는 기획부보다 먼저 심사받는다. 가장 먼저 심사받는 부서는?", choices:["총무부","인사부","기획부","영업부"], answer:0, explanation:"총무<인사<기획<영업 순으로 완전히 결정되므로 가장 먼저 심사받는 부서는 총무부입니다."},
{category:"문제해결능력", question:"'문제 정의'가 명확하지 않을 때 발생할 수 있는 결과로 가장 적절한 것은?", choices:["정확한 원인 분석과 해결안 도출이 어려워진다","모든 문제가 자동으로 해결된다","불필요한 논의가 완전히 사라진다","의사결정 속도가 항상 빨라진다"], answer:0, explanation:"문제 정의가 불명확하면 이후 원인 분석과 해결안 도출 과정 전체가 방향을 잃고 어려워집니다."},
{category:"문제해결능력", question:"A,B,C,D 네 명의 면접자가 순서대로 자기소개를 한다. B는 A보다 먼저 소개한다. C는 가장 마지막에 소개한다. D는 B보다 먼저 소개한다. 첫 번째로 소개하는 사람은?", choices:["A","B","C","D"], answer:3, explanation:"C=4번째로 고정되고, 남은 D<B<A 순서가 1,2,3번을 채우므로 D가 가장 먼저 소개합니다."},
{category:"문제해결능력", question:"\"어떤 관리자는 엄격하다. 엄격한 사람은 부하 직원에게 존경받지 못한다.\"로부터 논리적으로 타당하게 도출되는 것은?", choices:["모든 관리자는 존경받지 못한다","어떤 관리자는 존경받지 못할 수 있다","존경받는 사람은 모두 관리자가 아니다","엄격하지 않은 관리자는 모두 존경받는다"], answer:1, explanation:"특정(어떤) 관리자가 엄격하고 엄격한 사람은 모두 존경받지 못하므로, 그 특정 관리자들은 존경받지 못한다는 결론(어떤 관리자는 존경받지 못한다)만 타당하게 도출됩니다."},

{category:"문제해결능력", question:"A,B,C,D,E,F 여섯 명이 일렬로 된 6개 좌석(1~6번)에 앉는다. A는 3번 좌석에 앉는다. B는 A의 바로 왼쪽 좌석에 앉는다. C는 6번 좌석에 앉는다. D는 E의 바로 오른쪽 좌석에 앉는다. F가 앉는 좌석은?", choices:["1번","4번","5번","6번"], answer:0, explanation:"A=3,B=2,C=6이 고정되면 남은 1,4,5번 중 D가 E의 바로 오른쪽이어야 하므로 E=4,D=5로 정해지고, F는 남은 1번 좌석에 앉습니다."},
{category:"문제해결능력", question:"네 명(갑,을,병,정)이 열람실 책상 1~4번(왼쪽부터)에 앉는다. 을은 1번에 앉는다. 병은 4번에 앉는다. 정은 갑보다 왼쪽에 앉는다. 3번 자리에 앉는 사람은?", choices:["갑","을","병","정"], answer:0, explanation:"을=1, 병=4로 고정되고 남은 2,3번 중 정이 갑보다 왼쪽이어야 하므로 정=2, 갑=3으로 결정됩니다."},
{category:"문제해결능력", question:"다섯 명(A,B,C,D,E)이 셔틀버스의 1~5번(앞부터) 좌석에 앉는다. C는 1번에 앉는다. A는 2번 또는 3번에 앉는다. B는 A의 바로 뒷좌석(번호가 1 큰 좌석)에 앉는다. D는 A보다 앞좌석에 앉는다. D는 5번에 앉지 않는다. E가 앉는 좌석은?", choices:["2번","3번","4번","5번"], answer:3, explanation:"D가 A보다 앞자리여야 하므로 A=2인 경우는 성립하지 않아 A=3,B=4로 결정됩니다. 이때 D는 A(3)보다 앞인 2번이 되고, 남은 5번은 E가 차지합니다."},
{category:"문제해결능력", question:"네 명(A,B,C,D)이 계산대 앞에 일렬로 줄을 서 있다(1번이 맨 앞). C는 4번에 서 있다. A는 1번에 서 있지 않다. B는 D보다 앞에 서 있다. 1번에 서 있는 사람은?", choices:["A","B","C","D"], answer:1, explanation:"C=4로 고정되고 A는 1번이 될 수 없습니다. 남은 A,B,D 중 B가 D보다 앞이어야 하므로 어떤 경우든 1번 자리는 B가 차지합니다."},
{category:"문제해결능력", question:"원탁에 갑,을,병,정,무,기 여섯 명이 일정한 간격으로 앉아 있다. 갑과 정은 마주보고 앉는다. 을은 갑의 바로 왼쪽에 앉는다. 병은 을의 바로 왼쪽에 앉는다. 무는 정의 바로 왼쪽에 앉는다. 기의 바로 왼쪽에 앉는 사람은?", choices:["갑","무","병","정"], answer:0, explanation:"갑-기-무-정-병-을 순으로 좌석이 정해지며, 기의 바로 왼쪽에는 갑이 앉습니다."},
{category:"문제해결능력", question:"원탁에 A,B,C,D,E,F 여섯 명이 앉아 있다. A와 D는 마주본다. B는 D의 바로 오른쪽에 앉는다. C는 B의 바로 오른쪽에 앉는다. E는 A의 바로 오른쪽에 앉는다. F와 마주보는 사람은?", choices:["B","C","D","E"], answer:1, explanation:"A-E-F-D-B-C 순으로 좌석이 결정되며, F와 마주보는 자리에는 C가 앉습니다."},
{category:"문제해결능력", question:"원탁에 갑,을,병,정,무,기가 앉아 있다. 갑과 병은 마주본다. 을은 갑의 바로 오른쪽에 앉는다. 정은 병의 바로 오른쪽에 앉는다. 무는 정의 바로 오른쪽에 앉는다. 기는 누구와 누구 사이에 앉는가?", choices:["갑과 을 사이","을과 병 사이","병과 정 사이","무와 갑 사이"], answer:1, explanation:"갑-을-기-병-정-무 순으로 배치되며, 기는 을과 병 사이에 앉습니다."},
{category:"문제해결능력", question:"월~금 5일 중 하루씩 다섯 부서(총무,인사,영업,전산,홍보)가 워크숍을 진행한다. 총무는 인사보다 먼저 진행한다. 영업은 수요일에 진행한다. 전산은 영업보다 나중에 진행한다. 홍보는 전산보다 나중에 진행한다. 인사는 화요일에 진행한다. 목요일에 워크숍을 진행하는 부서는?", choices:["총무","영업","전산","홍보"], answer:2, explanation:"총무=월,인사=화,영업=수로 고정되고, 전산은 영업보다 나중, 홍보는 전산보다 나중이어야 하므로 전산=목, 홍보=금으로 결정됩니다."},
{category:"문제해결능력", question:"월~금 중 하루씩 다섯 사람(A,B,C,D,E)이 건강검진을 받는다. C는 월요일에 받는다. D는 화요일에 받는다. B는 금요일에 받지 않는다. E는 A보다 늦게 받는다. 금요일에 검진받는 사람은?", choices:["A","B","D","E"], answer:3, explanation:"C=월, D=화로 고정된 후 남은 수,목,금 중 B는 금요일이 될 수 없고 E는 A보다 늦어야 하므로, 가장 늦은 금요일은 반드시 E가 차지하게 됩니다."},
{category:"문제해결능력", question:"네 명(A,B,C,D)이 서로 다른 색깔의 티셔츠(빨강,파랑,노랑,초록)를 입고 있다. A는 빨강과 초록을 입지 않았다. B는 노랑 또는 초록을 입었다. C는 파랑을 입었다. 빨강을 입은 사람은?", choices:["A","B","C","D"], answer:3, explanation:"C=파랑으로 고정되고, A는 빨강·초록이 아니므로 노랑을 입게 됩니다. 그러면 B는 초록이 되고, 남은 빨강은 D가 입게 됩니다."},
{category:"문제해결능력", question:"네 가구(A,B,C,D)가 서로 다른 반려동물(강아지,고양이,토끼,새)을 키운다. B는 강아지를 키운다. A는 고양이와 토끼를 키우지 않는다. D는 토끼 또는 새를 키운다. 새를 키우는 가구는?", choices:["A","B","C","D"], answer:0, explanation:"B=강아지로 고정되고, A는 고양이·토끼가 아니므로 새를 키우게 됩니다. 그러면 D는 남은 토끼를 키우고, C는 고양이를 키우게 됩니다."},
{category:"문제해결능력", question:"A,B,C,D 네 사람 중 한 명이 회의실 노트북을 파손했다. 네 명 중 정확히 한 명만 거짓말을 하고 있다.\nA: \"나는 파손하지 않았다.\"\nB: \"나는 파손하지 않았다.\"\nC: \"D가 파손했다.\"\nD: \"B가 파손했다.\"\n파손한 사람은?", choices:["A","B","C","D"], answer:3, explanation:"D가 범인이라고 가정하면 A,B,C의 진술은 모두 참이 되고 D의 진술(B가 했다)만 거짓이 되어 거짓말이 정확히 1명이 됩니다. 다른 사람을 범인으로 가정하면 거짓말이 2명 이상 발생해 모순됩니다."},
{category:"문제해결능력", question:"갑,을,병,정 네 사람 중 한 명만 회식 자리에 지각했다. 세 사람은 진실을, 한 사람은 거짓을 말한다.\n갑: \"을은 지각하지 않았다.\"\n을: \"병이 지각했다.\"\n병: \"나는 지각하지 않았다.\"\n정: \"갑이 지각했다.\"\n지각한 사람은?", choices:["갑","을","병","정"], answer:0, explanation:"을이 거짓말을 한다고 가정하면 병은 지각하지 않았고, 갑·병·정의 진술이 모두 모순 없이 성립하며 지각한 사람은 갑으로 확정됩니다. 다른 사람을 거짓말쟁이로 가정하면 지각한 사람이 2명 이상 되어 모순됩니다."},
{category:"문제해결능력", question:"A,B,C 세 사람은 각각 항상 진실만 말하거나 항상 거짓만 말한다.\nA: \"나와 C는 같은 부류이다.\"\nB: \"A는 거짓말쟁이이다.\"\nC: \"B는 진실쟁이이다.\"\n다음 중 항상 참인 것은?", choices:["A는 진실만 말한다","B는 거짓말쟁이이다","C는 진실만 말한다","A와 B는 같은 부류이다"], answer:2, explanation:"A=거짓말쟁이, B=진실쟁이, C=진실쟁이로 유일하게 결정되므로, 'C는 진실만 말한다'만 항상 참입니다."},
{category:"문제해결능력", question:"A,B,C,D 네 사람 중 한 명이 탕비실 머그컵을 깨뜨렸다. 네 명 중 정확히 한 명만 거짓말을 하고 있다.\nA: \"B가 깨뜨렸다.\"\nB: \"나는 깨뜨리지 않았다.\"\nC: \"나는 깨뜨리지 않았다.\"\nD: \"A가 깨뜨렸다.\"\n머그컵을 깨뜨린 사람은?", choices:["A","B","C","D"], answer:0, explanation:"A가 범인이라고 가정하면 A의 진술만 거짓이 되고 B,C,D의 진술은 모두 참이 되어 거짓말이 정확히 1명이 됩니다. 다른 사람을 범인으로 가정하면 거짓말이 2명 이상 발생합니다."},
{category:"문제해결능력", question:"P,Q,R,S 네 차량 중 한 대가 장애인 주차구역에 위반 주차를 했다. 차주 네 명 중 정확히 한 명만 거짓말을 하고 있다.\nP: \"나는 위반하지 않았다.\"\nQ: \"나는 위반하지 않았다.\"\nR: \"S가 위반했다.\"\nS: \"Q가 위반했다.\"\n위반 주차를 한 차량은?", choices:["P","Q","R","S"], answer:3, explanation:"S가 위반 차량이라고 가정하면 P,Q,R의 진술은 모두 참이 되고 S의 진술(Q가 위반했다)만 거짓이 되어 거짓말이 정확히 1명이 됩니다. 다른 차량을 위반 차량으로 가정하면 거짓말이 2명 이상 발생합니다."},
{category:"문제해결능력", question:"상자 안 사탕의 개수는 18개이다. 이에 대해 세 사람이 진술했다. A: \"사탕은 20개보다 많다.\" B: \"사탕은 15개보다 적다.\" C: \"사탕은 정확히 18개이다.\" 진실을 말한 사람은 총 몇 명인가?", choices:["0명","1명","2명","3명"], answer:1, explanation:"실제 사탕 개수가 18개이므로 A(거짓), B(거짓), C(참)로 진실을 말한 사람은 C 한 명뿐입니다."},
{category:"문제해결능력", question:"회사 워크숍에서 세 사람(갑,을,병)은 각각 항상 진실만 말하거나 항상 거짓만 말한다.\n갑: \"을과 나는 다른 부류이다.\"\n을: \"병은 거짓말쟁이이다.\"\n병: \"갑은 진실쟁이이다.\"\n진실을 말하는 사람은 모두 몇 명인가?", choices:["0명","1명","2명","3명"], answer:2, explanation:"갑을 진실쟁이로 가정하면 을은 거짓말쟁이, 병은 진실쟁이로 모순 없이 결정되어 진실을 말하는 사람은 갑과 병 2명입니다. 갑을 거짓말쟁이로 가정하면 논리적 모순이 발생합니다."},
{category:"문제해결능력", question:"네 명(A,B,C,D) 중 정확히 두 명이 야근수당을 부정 청구했다. A와 C의 진술은 모두 진실이고, B와 D의 진술은 모두 거짓이다.\nA: \"B가 부정 청구했다.\"\nB: \"나는 부정 청구하지 않았다.\"\nC: \"D가 부정 청구했다.\"\nD: \"A가 부정 청구했다.\"\n부정 청구한 두 사람은?", choices:["A, B","B, D","A, C","C, D"], answer:1, explanation:"A의 진술(참)에 따라 B가 부정 청구했고, C의 진술(참)에 따라 D가 부정 청구했습니다. B와 D의 진술도 이와 모순 없이 성립하여 부정 청구한 두 사람은 B와 D입니다."},
{category:"문제해결능력", question:"A,B,C,D,E 다섯 명 중 한 명이 사내 시스템 비밀번호를 외부에 유출했다. 다섯 명 중 정확히 한 명만 거짓말을 하고 있다.\nA: \"나는 유출하지 않았다.\"\nB: \"나는 유출하지 않았다.\"\nC: \"나는 유출하지 않았다.\"\nD: \"E가 유출했다.\"\nE: \"C가 유출했다.\"\n비밀번호를 유출한 사람은?", choices:["A","C","D","E"], answer:3, explanation:"E가 범인이라고 가정하면 A,B,C의 결백 진술과 D의 진술(E가 했다)이 모두 참이 되고, E의 진술(C가 했다)만 거짓이 되어 거짓말이 정확히 1명이 됩니다. 다른 사람을 범인으로 가정하면 거짓말이 2명 이상 발생합니다."},
{category:"문제해결능력", question:"갑,을,병 세 사람 중 한 명이 화분에 물 주는 것을 잊었다. 세 명의 진술 중 정확히 한 명만 진실이다.\n갑: \"을이 잊었다.\"\n을: \"내가 잊었다.\"\n병: \"내가 잊지 않았다.\"\n물 주는 것을 잊은 사람은?", choices:["갑","을","병","알 수 없음"], answer:0, explanation:"병의 진술만 진실이라고 가정하면 병과 을 모두 물 주기를 잊지 않은 것이 되어, 남은 갑이 잊은 사람으로 결정되며 모순이 없습니다. 갑이나 을의 진술만 진실이라고 가정하면 자기모순이 발생합니다."},
{category:"문제해결능력", question:"세 영업사원(A,B,C)이 이번 달 판매 실적에 대해 말했다. A: \"나는 목표를 달성했다.\" B: \"A는 목표를 달성하지 못했다.\" C: \"B와 A 중 적어도 한 명은 목표를 달성했다.\" A와 B의 진술은 서로 모순되어 둘 중 하나만 참이며, 실제로 세 진술 중 참인 것은 정확히 2개였다. C의 진술은 참인가 거짓인가?", choices:["참이다","거짓이다","알 수 없다","경우에 따라 다르다"], answer:0, explanation:"A와 B는 서로 모순되는 진술이므로 둘 중 반드시 한 명만 참입니다. 전체 참인 진술이 2개이므로 나머지 하나인 C의 진술도 참이어야 합니다."},
{category:"문제해결능력", question:"A,B,C,D 네 사람 중 한 명이 잃어버린 우산의 주인이다. 네 명 중 정확히 한 명만 거짓말을 하고 있다.\nA: \"B의 우산이다.\"\nB: \"내 우산이 아니다.\"\nC: \"내 우산이 아니다.\"\nD: \"A의 우산이다.\"\n우산의 주인은?", choices:["A","B","C","D"], answer:0, explanation:"A가 우산 주인이라고 가정하면 A의 진술(B의 우산이다)만 거짓이 되고 B,C,D의 진술은 모두 참이 되어 거짓말이 정확히 1명이 됩니다. 다른 사람을 주인으로 가정하면 거짓말이 2명 이상 발생합니다."},
{category:"문제해결능력", question:"세 사람(A,B,C)은 각각 항상 진실만 말하거나 항상 거짓만 말한다.\nA: \"B와 C는 같은 부류이다.\"\nB: \"A는 거짓말쟁이이다.\"\nC: \"나는 진실쟁이이다.\"\n거짓말쟁이는 총 몇 명인가?", choices:["0명","1명","2명","3명"], answer:2, explanation:"가능한 경우는 (A=진실,B=거짓,C=거짓) 또는 (A=거짓,B=진실,C=거짓) 두 가지뿐이며, 두 경우 모두 거짓말쟁이가 정확히 2명입니다."},
{category:"문제해결능력", question:"네 사람(A,B,C,D)에게 지난 회의 참석 여부를 물었다. A: \"나는 참석했다.\" B: \"A는 참석하지 않았다.\" C: \"나와 D는 둘 다 참석했다.\" D: \"B는 참석했다.\" 실제로 회의에 참석한 사람은 A와 D 두 명뿐이었다. 다음 중 진술이 참인 사람은?", choices:["A","B","C","D"], answer:0, explanation:"실제 참석자는 A와 D뿐이므로 A의 진술만 사실과 일치하여 참이고, B·C·D의 진술은 모두 사실과 다릅니다."},
{category:"문제해결능력", question:"네 사람(가,나,다,라) 중 한 명이 회사 법인카드를 사적으로 사용했다. 네 명의 진술 중 정확히 하나만 거짓이다.\n가: \"나는 사용하지 않았다.\"\n나: \"다가 사용했다.\"\n다: \"라는 사용하지 않았다.\"\n라: \"나는 사용하지 않았다.\"\n사적으로 사용한 사람은?", choices:["가","나","다","라"], answer:1, explanation:"나가 법인카드를 사용했다고 가정하면 나의 진술(다가 사용했다)만 거짓이 되고 가,다,라의 진술은 모두 참이 되어 거짓이 정확히 1개가 됩니다. 다른 사람을 범인으로 가정하면 거짓이 0개, 2개, 3개가 되어 조건과 맞지 않습니다."},
{category:"문제해결능력", question:"세 사람(하나,두리,세찬) 중 한 명이 회사 공용 프린터를 고장 냈다. 세 사람의 진술 중 정확히 하나만 진실이다.\n하나: \"두리가 고장 냈다.\"\n두리: \"내가 고장 냈다.\"\n세찬: \"내가 고장 내지 않았다.\"\n프린터를 고장 낸 사람은?", choices:["하나","두리","세찬","알 수 없음"], answer:0, explanation:"두리가 고장 냈다고 가정하면 하나와 두리의 진술이 동시에 참이 되어 진실이 2개가 되므로 모순입니다. 소거법으로 하나가 고장 낸 것으로 결정되며 이때 세찬의 진술만 진실이 되어 조건을 만족합니다."},
{category:"문제해결능력", question:"SWOT 분석에서 'SO전략'의 의미로 적절한 것은?", choices:["강점을 활용하여 기회를 포착하는 전략","강점으로 위협을 회피하는 전략","약점을 보완하여 기회를 활용하는 전략","약점과 위협을 최소화하는 전략"], answer:0, explanation:"SO전략은 내부 강점(Strength)을 활용해 외부 기회(Opportunity)를 포착하는 전략입니다."},
{category:"문제해결능력", question:"SWOT 분석에서 강점(Strength)에 해당하는 것은?", choices:["경쟁사의 시장 철수","우수한 기술력과 특허 보유","높은 원자재 가격 상승","신규 경쟁자의 시장 진입"], answer:1, explanation:"우수한 기술력과 특허 보유는 조직 내부의 긍정적 요인인 강점에 해당합니다. 나머지는 외부 환경 요인입니다."},
{category:"문제해결능력", question:"SWOT 분석에서 위협(Threat)에 해당하는 것은?", choices:["자사의 높은 브랜드 인지도","숙련된 인력 보유","신규 경쟁자의 시장 진입","최신 생산 설비"], answer:2, explanation:"신규 경쟁자의 시장 진입은 외부의 부정적 요인인 위협에 해당합니다. 나머지는 내부의 강점 요인입니다."},
{category:"문제해결능력", question:"3C 분석에서 'Company(자사)' 요소가 주로 분석하는 내용으로 가장 적절한 것은?", choices:["경쟁사의 시장 점유율","고객의 구매 행동과 니즈","환율 변동 추이","자사의 보유 자원과 역량, 경영 성과"], answer:3, explanation:"3C 분석의 Company는 자사의 보유 자원, 역량, 경영 성과 등 내부 역량을 분석하는 요소입니다."},
{category:"문제해결능력", question:"3C 분석에서 'Customer(고객)' 요소가 주로 분석하는 내용으로 가장 적절한 것은?", choices:["시장 규모와 고객의 니즈, 구매 행동","자사의 조직 구조","경쟁사의 재무 상태","정부의 규제 정책"], answer:0, explanation:"3C 분석의 Customer는 시장 규모, 고객의 니즈와 구매 행동 등을 분석하는 요소입니다."},
{category:"문제해결능력", question:"문제해결 과정에서 3C 분석을 활용하는 주된 목적으로 가장 적절한 것은?", choices:["인사 평가 기준을 마련하기 위해","고객, 경쟁자, 자사의 관점에서 사업 환경을 종합적으로 파악하기 위해","회계 장부를 정리하기 위해","생산 일정을 수립하기 위해"], answer:1, explanation:"3C 분석은 고객, 경쟁자, 자사를 종합적으로 분석하여 사업 환경과 전략 방향을 파악하는 데 활용됩니다."},
{category:"문제해결능력", question:"문제 유형 중 '발생형 문제'의 특징으로 가장 적절한 것은?", choices:["미래에 새로운 목표를 설정하는 문제","현재는 드러나지 않으나 방치 시 손실이 예상되는 문제","이미 발생하여 원인 규명과 즉각적 조치가 필요한 문제","해결 여부와 무관하게 조직에 영향이 없는 문제"], answer:2, explanation:"발생형 문제는 이미 발생하여 원인 규명과 즉각적 조치가 필요한 문제로, 눈에 보이는 문제라고도 합니다."},
{category:"문제해결능력", question:"탐색형 문제(잠재문제)를 방치할 경우 발생할 수 있는 결과로 가장 적절한 것은?", choices:["문제가 저절로 사라진다","즉시 매출이 증가한다","조직의 위험이 자동으로 감소한다","현재는 드러나지 않던 문제가 향후 손실이나 심각한 문제로 확대될 수 있다"], answer:3, explanation:"탐색형 문제(잠재문제)는 방치할 경우 향후 손실이나 더 심각한 문제로 확대될 위험이 있습니다."},
{category:"문제해결능력", question:"문제 유형 중 '설정형 문제'를 다른 말로 표현할 때 가장 적절한 것은?", choices:["창조적 문제","이탈문제","미달문제","잠재문제"], answer:0, explanation:"설정형 문제는 미래 상황에 대응하기 위해 새로운 목표를 설정하는 문제로, 창조적 문제라고도 불립니다."},
{category:"문제해결능력", question:"문제를 발생형·탐색형·설정형으로 분류하는 주된 기준으로 가장 적절한 것은?", choices:["문제 해결에 소요되는 비용","문제가 나타나는 시점과 성격(현재/잠재/미래)","문제를 제기한 사람의 직급","문제 해결에 참여하는 인원 수"], answer:1, explanation:"발생형·탐색형·설정형 문제 분류는 문제가 현재 나타나 있는지, 잠재되어 있는지, 미래에 설정하는 것인지에 따라 구분됩니다."},
{category:"문제해결능력", question:"'퍼실리테이션(Facilitation)'의 개념적 의미로 가장 적절한 것은?", choices:["특정 결론을 강제로 주입하는 활동","집단이 문제를 잘 해결하도록 과정을 돕고 촉진하는 활동","회의 시간을 최대한 단축시키는 활동","의사결정 권한을 한 사람에게 집중시키는 활동"], answer:1, explanation:"퍼실리테이션은 집단이 스스로 문제를 잘 해결하도록 그 과정을 돕고 촉진하는 활동을 의미합니다."},
{category:"문제해결능력", question:"문제해결 과정에서 퍼실리테이터에게 요구되는 바람직한 태도로 가장 적절한 것은?", choices:["자신의 의견을 논의 초반에 결론으로 제시한다","소수 의견은 무시하고 다수 의견만 반영한다","구성원의 의견을 경청하고 중립적 입장에서 논의를 촉진한다","구성원 간 갈등이 생기면 논의를 즉시 종료한다"], answer:2, explanation:"퍼실리테이터는 중립적 입장에서 구성원의 의견을 경청하며 합의에 이르도록 논의를 촉진해야 합니다."},
{category:"문제해결능력", question:"퍼실리테이션에 의한 문제해결 방식이 전통적인 회의 방식과 다른 점으로 가장 적절한 것은?", choices:["직급이 높은 사람의 의견을 그대로 결론으로 채택한다","사전에 결론을 정해 놓고 형식적으로 회의를 진행한다","구성원의 참여 없이 소수가 모든 것을 결정한다","동등한 위치에서 서로의 사고를 자극하며 창조적 해결책을 도출하도록 돕는다"], answer:3, explanation:"퍼실리테이션은 구성원이 동등한 위치에서 서로 자극하며 창조적으로 문제를 해결하도록 돕는 방식입니다."},
{category:"문제해결능력", question:"'창의적 사고'의 정의로 가장 적절한 것은?", choices:["기존의 정보를 조합하거나 새롭게 조직하여 참신한 아이디어를 산출하는 능력","이미 정해진 규정을 그대로 따르는 능력","타인의 아이디어를 그대로 모방하는 능력","숫자 계산을 빠르게 처리하는 능력"], answer:0, explanation:"창의적 사고는 기존의 정보들을 조합하거나 재조직하여 참신하고 유용한 아이디어를 만들어내는 능력입니다."},
{category:"문제해결능력", question:"창의적 사고 기법 '스캠퍼(SCAMPER)'에서 'C'가 의미하는 것은?", choices:["Copy(복사)","Combine(결합)","Change(변경)","Count(계산)"], answer:1, explanation:"스캠퍼의 'C'는 두 가지 이상을 결합하여 새로운 것을 만드는 Combine(결합)을 의미합니다."},
{category:"문제해결능력", question:"창의적 사고 기법 '스캠퍼(SCAMPER)'에서 'A'가 의미하는 것은?", choices:["Add(추가)","Analyze(분석)","Assume(가정)","Adapt(적용)"], answer:3, explanation:"스캠퍼의 'A'는 다른 분야의 아이디어를 가져와 적용하는 Adapt(적용)를 의미합니다."},
{category:"문제해결능력", question:"창의적 사고 기법 '스캠퍼(SCAMPER)'에서 'M'이 의미하는 것으로 가장 적절한 것은?", choices:["Modify(수정, 확대·축소)","Manage(관리)","Merge(합병)","Measure(측정)"], answer:0, explanation:"스캠퍼의 'M'은 형태나 색, 크기 등을 수정하거나 확대·축소하는 Modify를 의미합니다."},
{category:"문제해결능력", question:"창의적 사고 기법 '스캠퍼(SCAMPER)'에서 'E'가 의미하는 것은?", choices:["Expand(확장)","Eliminate(제거)","Evaluate(평가)","Explain(설명)"], answer:1, explanation:"스캠퍼의 'E'는 불필요한 요소를 제거하는 Eliminate(제거)를 의미합니다."},
{category:"문제해결능력", question:"창의적 사고 기법 '스캠퍼(SCAMPER)'에서 마지막 글자 'R'이 의미하는 것으로 가장 적절한 것은?", choices:["Repeat(반복)","Reduce(축소)","Rearrange/Reverse(재배열/뒤집기)","Report(보고)"], answer:2, explanation:"스캠퍼의 마지막 'R'은 순서를 재배열하거나 뒤집어 보는 Rearrange/Reverse를 의미합니다."},
{category:"문제해결능력", question:"'육색사고모자(Six Thinking Hats)' 기법의 목적으로 가장 적절한 것은?", choices:["팀원의 복장을 통일하기 위해","회의 시간을 색깔별로 배정하기 위해","다수결 투표 결과를 색으로 표시하기 위해","서로 다른 색의 모자로 상징되는 여섯 가지 사고 방식을 전환하며 다각도로 검토하기 위해"], answer:3, explanation:"육색사고모자 기법은 여섯 가지 색의 모자가 상징하는 서로 다른 사고방식을 전환해 가며 문제를 다각도로 검토하는 기법입니다."},
{category:"문제해결능력", question:"'연꽃기법(연화기법)'의 특징으로 가장 적절한 것은?", choices:["핵심 주제를 중심에 놓고 연꽃 모양으로 아이디어를 확산시켜 나가는 기법","단 하나의 아이디어만 선택하는 기법","숫자로만 아이디어를 표현하는 기법","경쟁사의 자료만 분석하는 기법"], answer:0, explanation:"연꽃기법은 중심 주제를 두고 주변으로 연꽃 모양처럼 아이디어를 확산시켜 나가는 창의적 사고 기법입니다."},
