{category:"문제해결능력", question:"논리적 사고의 구성요소 중 '상대 논리의 구조화'가 의미하는 것으로 가장 적절한 것은?", choices:["상대방의 의견을 무조건 수용하는 것","상대방의 발언을 가로막는 것","상대방과의 대화를 회피하는 것","자신의 논리를 전개하기 전에 상대방의 논리를 구조적으로 파악하여 약점을 보완하는 것"], answer:3, explanation:"상대 논리의 구조화는 상대방이 어떤 논리로 주장하는지를 구조적으로 파악하고 이를 바탕으로 자신의 논리를 보완하는 것을 의미합니다."},
{category:"문제해결능력", question:"논리적 사고의 구성요소 중 '구체적인 생각'이 의미하는 것으로 가장 적절한 것은?", choices:["상대방이 상상하기 쉽도록 구체적인 이미지나 사례를 활용해 표현하는 것","추상적인 용어만 사용하는 것","숫자를 전혀 사용하지 않는 것","결론 없이 현상만 나열하는 것"], answer:0, explanation:"구체적인 생각은 상대방이 이해하고 상상하기 쉽도록 구체적인 예시나 이미지를 통해 생각을 표현하는 것을 의미합니다."},
{category:"문제해결능력", question:"SWOT 분석에서 내부 환경 분석의 대상이 되는 것은?", choices:["경쟁사의 신제품 출시","자사의 인적자원과 기술력","정부의 규제 변화","시장의 성장 가능성"], answer:1, explanation:"내부 환경 분석은 자사의 인적자원, 기술력, 재무 상태 등 조직 내부의 강점과 약점을 다루며, 나머지는 외부 환경 요인입니다."},
{category:"문제해결능력", question:"브레인스토밍의 4대 원칙 중 '자유분방(Freewheeling)'이 의미하는 것으로 가장 적절한 것은?", choices:["진행자가 발언 내용을 사전에 검열하는 것","실현 가능한 아이디어만 발언하도록 제한하는 것","엉뚱하거나 비현실적으로 보이는 아이디어라도 자유롭게 제시할 수 있도록 허용하는 것","발언 순서를 엄격히 고정하는 것"], answer:2, explanation:"자유분방은 엉뚱하거나 비현실적으로 보이는 아이디어라도 자유롭게 제시할 수 있도록 허용하는 브레인스토밍의 원칙입니다."},
{category:"문제해결능력", question:"창의적 사고와 논리적 사고의 차이에 대한 설명으로 가장 적절한 것은?", choices:["창의적 사고와 논리적 사고는 완전히 동일한 개념이다","논리적 사고는 항상 새로운 아이디어만을 다룬다","창의적 사고는 근거 없이 결론만 내리면 완성된다","창의적 사고는 새로운 가능성을 자유롭게 확장하는 데 중점을 두고, 논리적 사고는 근거와 체계를 갖추어 타당성을 검증하는 데 중점을 둔다"], answer:3, explanation:"창의적 사고는 새로운 가능성과 아이디어의 확장에 중점을 두고, 논리적 사고는 근거와 체계를 갖추어 타당성을 검증하는 데 중점을 둡니다."},
{category:"문제해결능력", question:"직업기초능력으로서 문제해결능력이 중요한 이유로 가장 적절한 것은?", choices:["업무 수행 중 발생하는 다양한 문제를 창의적·논리적으로 해결하여 조직의 성과에 기여할 수 있기 때문","문제를 회피할수록 조직의 성과가 높아지기 때문","문제해결능력은 특정 소수 직무에만 필요하기 때문","문제해결능력은 경력이 오래된 사람에게만 요구되기 때문"], answer:0, explanation:"문제해결능력은 업무 중 발생하는 다양한 문제를 창의적·논리적으로 해결하여 조직 성과에 기여하는 데 필요한 직업기초능력입니다."},
{category:"문제해결능력", question:"브레인스토밍으로 아이디어를 발산한 이후, 수렴 단계에서 유의해야 할 점으로 가장 적절한 것은?", choices:["발산 단계와 마찬가지로 비판을 완전히 배제해야 한다","미리 정한 평가 기준에 따라 객관적으로 아이디어를 선별해야 한다","가장 먼저 제시된 아이디어를 무조건 채택해야 한다","평가 없이 모든 아이디어를 동시에 실행해야 한다"], answer:1, explanation:"수렴 단계에서는 발산 단계와 달리 미리 정한 평가 기준에 따라 객관적으로 아이디어를 선별하는 과정이 필요합니다."},
/* ===================== 자원관리능력 ===================== */
{category:"자원관리능력", question:"시간관리의 효과로 볼 수 없는 것은?", choices:["스트레스 감소","균형적인 삶","생산성 향상","무조건적인 업무량 증가"], answer:3, explanation:"시간관리는 효율적인 시간 활용을 통해 생산성과 삶의 질을 높이는 것이며, 업무량 증가 자체가 목적이 아닙니다."},
{category:"자원관리능력", question:"물적자원 관리의 방해요인이 아닌 것은?", choices:["보관장소를 파악하지 못한 경우","훼손 및 파손된 경우","정기적으로 재고를 점검하는 경우","분실한 경우"], answer:2, explanation:"정기적인 재고 점검은 오히려 물적자원을 효과적으로 관리하는 방법입니다."},
{category:"자원관리능력", question:"SMART 목표 설정 원칙에서 'M'이 의미하는 것은?", choices:["Specific","Measurable","Multiple","Motivated"], answer:1, explanation:"SMART는 Specific, Measurable, Achievable, Relevant, Time-bound의 약자이며 'M'은 측정 가능성(Measurable)을 의미합니다."},
{category:"자원관리능력", question:"업무 A(소요2시간, 마감 오후3시), B(소요1시간, 마감 오후1시), C(소요3시간, 마감 오후5시), D(소요1시간, 마감 오후2시)를 오전9시부터 시작할 때, 모든 마감기한을 지킬 수 있는 처리 순서는?", choices:["A-B-C-D","B-D-A-C","D-B-C-A","C-A-D-B"], answer:1, explanation:"마감기한이 빠른 순서(B 1시→D 2시→A 3시→C 5시)로 처리하면 각각 오전10시, 오전11시, 오후1시, 오후4시에 끝나 모든 기한을 지킬 수 있습니다."},
{category:"자원관리능력", question:"예산관리에서 '간접비'에 해당하는 것은?", choices:["재료비","인건비(직접 투입인력)","사무실 임대료","원료 구입비"], answer:2, explanation:"간접비는 사업에 직접 소요되지 않는 비용으로 사무실 임대료, 보험료, 광고비 등이 해당합니다."},
{category:"자원관리능력", question:"인적자원의 특성 중 '능동성'이 의미하는 것으로 가장 적절한 것은?", choices:["자원의 가치는 사용 시기와 장소에 따라 달라진다","인적자원은 스스로 개발 가능하며 능동적으로 활용된다","인적자원은 다른 자원과 달리 개발될 수 없다","인적자원도 물적자원처럼 소모성 자원이다"], answer:1, explanation:"인적자원은 환경 변화에 그대로 좌우되지 않고 스스로 성과를 결정할 수 있는 능동적 자원입니다."},
{category:"자원관리능력", question:"총 예산 500만원 중 인건비 200만원, 재료비 150만원, 홍보비 80만원을 배정하고 나머지를 예비비로 배정할 때 예비비는?", choices:["50만원","60만원","70만원","80만원"], answer:2, explanation:"500-200-150-80=70만원."},
{category:"자원관리능력", question:"물적자원 관리 과정을 순서대로 나열한 것은? (사용물품과 보관물품 구분 → 유사 물품끼리 분류 → 보관장소 선정)", choices:["보관장소 선정 → 분류 → 구분","구분 → 분류 → 보관장소 선정","분류 → 구분 → 보관장소 선정","보관장소 선정 → 구분 → 분류"], answer:1, explanation:"물적자원 관리는 사용물품·보관물품 구분 → 동일·유사 물품 분류 → 물품 특성에 맞는 보관장소 선정 순으로 진행됩니다."},
{category:"자원관리능력", question:"인력 5명이 하루 8시간씩 10일 동안 끝낼 수 있는 업무량을, 인력을 8명으로 늘려 동일한 하루 8시간 근무로 처리하면 며칠 만에 끝낼 수 있는가? (1인당 생산성 동일 가정)", choices:["5일","6.25일","7일","8일"], answer:1, explanation:"총 작업량은 5명×10일=50인일. 8명이 처리하면 50÷8=6.25일."},
{category:"자원관리능력", question:"시간낭비 요인 중 외적 요인에 해당하는 것은?", choices:["우선순위 없이 일하는 습관","여러 가지 일을 한번에 하려는 태도","동료 및 방문객의 잦은 방문","계획 부족"], answer:2, explanation:"동료·방문객의 잦은 방문은 본인이 통제하기 어려운 외적 요인이며, 나머지는 개인의 습관에서 비롯된 내적 요인입니다."},
{category:"자원관리능력", question:"화요일 오전 회의를 위해 회의실을 예약해야 한다. A회의실은 화요일 오전에 이미 예약이 있고, B회의실은 수용인원 8명으로 참석자 10명을 수용할 수 없다. C회의실은 화요일 오전 예약이 없고 수용인원 12명이며, D회의실은 예약은 없으나 발표에 필요한 프로젝터가 없다. 예약해야 할 회의실은?", choices:["A회의실","B회의실","C회의실","D회의실"], answer:2, explanation:"시간·인원·시설 조건을 모두 만족하는 곳은 C회의실뿐입니다."},
{category:"자원관리능력", question:"예산 수립 시 유의할 점으로 적절하지 않은 것은?", choices:["필요한 활동이나 과업을 도출한다","우선순위를 고려하여 예산을 배정한다","무조건 최저 비용으로 책정하여 예산을 최대한 절감한다","예산과 실제 지출의 차이를 모니터링한다"], answer:2, explanation:"예산은 과업 수행에 필요한 수준으로 적절히 책정해야 하며, 무리한 절감은 과업 수행에 차질을 줄 수 있습니다."},
{category:"자원관리능력", question:"자원관리의 4단계 순서로 옳은 것은?", choices:["자원 확보 → 필요한 자원의 종류·양 확인 → 활용 계획 수립 → 계획대로 수행","필요한 자원의 종류·양 확인 → 자원 확보 → 활용 계획 수립 → 계획에 따른 수행","활용 계획 수립 → 자원 확인 → 확보 → 수행","확보 → 수행 → 계획 수립 → 확인"], answer:1, explanation:"자원관리는 필요한 자원 파악 → 자원 확보 → 활용 계획 수립 → 계획에 따른 수행 순으로 진행됩니다."},
{category:"자원관리능력", question:"총 작업 비용이 1,200만원이고 이 중 직접비가 900만원이라면 간접비의 비율은?", choices:["15%","20%","25%","30%"], answer:2, explanation:"간접비=1,200-900=300만원. 비율=300÷1,200=25%."},
{category:"자원관리능력", question:"A업무를 외부업체에 위탁하면 300만원, 내부에서 처리하면 인건비 200만원과 장비 임대비 50만원이 든다. 비용 측면에서 더 유리한 방법과 절감액은?", choices:["외부위탁, 50만원 절감","내부처리, 50만원 절감","내부처리, 100만원 절감","외부위탁, 100만원 절감"], answer:1, explanation:"내부처리 비용=200+50=250만원, 외부위탁=300만원. 내부처리가 50만원 더 절감됩니다."},
{category:"자원관리능력", question:"'최소자원 투입의 원칙'과 가장 관련 있는 개념은?", choices:["효과성","효율성","형평성","안정성"], answer:1, explanation:"효율성은 투입 자원 대비 산출을 극대화, 즉 최소 자원으로 최대 효과를 얻는 것과 관련됩니다."},
{category:"자원관리능력", question:"인력배치의 원칙 중 '적재적소 배치'가 의미하는 것은?", choices:["팀원의 희망대로만 배치","개인의 역량과 성격 등을 고려하여 최적의 위치에 배치","근속연수 순서로만 배치","무작위로 배치"], answer:1, explanation:"적재적소 배치는 개인의 능력과 성격을 고려하여 그에 맞는 자리에 배치하는 원칙입니다."},
{category:"자원관리능력", question:"물적자원 관리 방법 중 '회전대응 보관의 원칙'이 의미하는 것은?", choices:["입출고 빈도가 높은 물품을 출입구 가까운 곳에 보관","무게가 무거운 물품을 아래에 보관","물품을 알파벳 순서로 보관","물품을 색상별로 보관"], answer:0, explanation:"회전대응 보관의 원칙은 입출고 빈도(사용 빈도)를 고려하여 자주 쓰는 물품을 출입구와 가까운 곳에 보관하는 것입니다."},
{category:"자원관리능력", question:"프로젝트 예산이 부족할 때 대응 방법으로 가장 적절하지 않은 것은?", choices:["우선순위가 낮은 활동의 예산을 축소한다","불필요한 지출 항목을 재검토한다","계획했던 품질 기준을 사전 협의 없이 임의로 낮춘다","예산 초과 원인을 분석한다"], answer:2, explanation:"품질 기준을 협의 없이 임의로 낮추는 것은 신뢰를 저해하는 부적절한 대응입니다."},
{category:"자원관리능력", question:"시간계획의 기본 원리인 '60:40의 법칙'이 의미하는 것으로 가장 적절한 것은?", choices:["계획된 행동 60%, 계획 외 행동(우발상황·자발행동) 40%의 비율로 시간 배정","업무의 60%만 완료해도 충분하다","근무시간의 60%는 회의에 사용한다","하루의 60%는 휴식한다"], answer:0, explanation:"60:40의 법칙은 전체 시간 중 60%는 계획된 행동에, 40%는 예측하지 못한 사건이나 자발적 행동에 대응하기 위해 남겨두는 원리입니다."},
{category:"자원관리능력", question:"자원관리의 대상이 되는 4대 자원에 해당하지 않는 것은?", choices:["시간","예산","물적자원","지적재산권"], answer:3, explanation:"자원관리의 4대 자원은 시간, 예산(돈), 물적자원, 인적자원입니다. 지적재산권은 이 4대 자원 분류에 포함되지 않습니다."},
{category:"자원관리능력", question:"자원관리에 실패하는 원인으로 보기 어려운 것은?", choices:["비계획적 행동","편리성 추구","자원 활용에 대한 명확한 목표 설정","자원 관리 노하우 부족"], answer:2, explanation:"명확한 목표 설정은 자원관리의 성공 요인이며, 실패 원인이 아닙니다."},
{category:"자원관리능력", question:"시간관리 매트릭스에서 '중요하지만 긴급하지 않은 일'에 해당하는 활동으로 가장 적절한 것은?", choices:["장기적 역량 개발을 위한 자기계발","마감이 임박한 보고서 작성","갑작스러운 민원 응대","의미 없는 잡무 처리"], answer:0, explanation:"자기계발은 중요도는 높지만 당장 긴급하지 않은 활동의 대표적 예입니다."},
{category:"자원관리능력", question:"파레토법칙(80:20 법칙)을 업무관리에 적용한 설명으로 가장 적절한 것은?", choices:["모든 업무는 동일한 중요도를 가진다","전체 성과의 80%는 상위 20%의 핵심 업무에서 창출된다","업무의 80%를 먼저 처리해야 한다","20%의 인력이 80%의 비용을 사용해야 한다"], answer:1, explanation:"파레토법칙은 소수의 핵심 요인(20%)이 전체 성과(80%)의 대부분을 좌우한다는 원리입니다."},
{category:"자원관리능력", question:"시간계획 수립의 일반적 순서로 옳은 것은?", choices:["시간계획서 작성 → 목표 설정 → 우선순위 판단","우선순위 판단 → 시간계획서 작성 → 목표 설정","예상 소요시간 산정 → 목표 설정 → 시간계획서 작성","목표 설정 → 우선순위 판단 → 예상 소요시간 산정 → 시간계획서 작성"], answer:3, explanation:"시간계획은 목표 설정 후 우선순위를 판단하고, 예상 소요시간을 산정한 뒤 시간계획서를 작성하는 순서로 진행됩니다."},
{category:"자원관리능력", question:"다음 중 직접비에 해당하지 않는 것은?", choices:["재료비","인건비","시설비","건물 관리비"], answer:3, explanation:"건물 관리비는 간접비에 해당하며, 나머지는 사업 수행에 직접 소요되는 직접비입니다."},
{category:"자원관리능력", question:"다음 중 간접비에 해당하지 않는 것은?", choices:["보험료","광고비","통신비","원료 구입비"], answer:3, explanation:"원료 구입비는 직접비이며, 보험료·광고비·통신비는 사업에 직접 소요되지 않는 간접비입니다."},
{category:"자원관리능력", question:"물적자원 관리 원칙 중 '동일 및 유사 물품을 함께 보관'하는 원칙의 목적으로 가장 적절한 것은?", choices:["분실 시 책임을 분산시키기 위해","보관장소를 최소화하기 위해","물품을 찾을 때 시간과 노력을 줄이기 위해","물품의 가격을 낮추기 위해"], answer:2, explanation:"동일·유사 물품을 함께 보관하면 필요할 때 신속하게 찾아 사용할 수 있어 시간과 노력을 절감할 수 있습니다."},
{category:"자원관리능력", question:"물품 보관 시 '명칭이나 유형을 기재하여 파악이 쉽도록 하는' 원칙은?", choices:["회전대응 보관의 원칙","통로대면의 원칙","표시의 원칙","유사성의 원칙"], answer:2, explanation:"표시의 원칙은 물품에 명칭이나 종류를 기재해 쉽게 파악할 수 있도록 하는 원칙입니다."},
{category:"자원관리능력", question:"예산관리에서 '무조건 예산을 최대한 아껴 남기는 것'이 바람직하지 않은 이유로 가장 적절한 것은?", choices:["예산이 남으면 세금이 늘어나기 때문","과도한 절감이 계획된 과업의 품질이나 완성도를 떨어뜨릴 수 있기 때문","예산은 항상 초과되어야 하기 때문","예산 절감은 법으로 금지되어 있기 때문"], answer:1, explanation:"예산은 과업 수행에 필요한 적정 수준으로 책정해야 하며, 무리한 절감은 오히려 과업의 품질을 저해할 수 있습니다."},
{category:"자원관리능력", question:"인력배치의 3원칙 중 '팀 전체의 능력을 고려하여 팀원 전체가 균형 있게 배치되도록 하는' 원칙은?", choices:["적재적소주의","능력주의","균형주의","성과주의"], answer:2, explanation:"균형주의는 팀이나 조직 전체의 관점에서 인력이 균형 있게 배치되도록 하는 원칙입니다."},
{category:"자원관리능력", question:"인력배치의 3원칙 중 '개인이 가진 능력과 성향을 발휘할 수 있는 위치에 배치'하는 원칙은?", choices:["적재적소주의","능력주의","균형주의","성과주의"], answer:0, explanation:"적재적소주의는 개인의 능력과 성향에 맞는 위치에 배치하는 원칙입니다."},
{category:"자원관리능력", question:"인력배치의 3원칙 중 '능력주의'에 대한 설명으로 가장 적절한 것은?", choices:["근속연수가 긴 사람을 우선 배치한다","성과를 낼 수 있는 여건을 만들어 주며 능력을 발휘하도록 하는 원칙이다","출신 지역을 고려하여 배치한다","무작위로 배치하는 원칙이다"], answer:1, explanation:"능력주의는 능력을 발휘할 수 있는 기회와 여건을 부여하고 그에 따른 성과를 평가하는 원칙입니다."},
{category:"자원관리능력", question:"시간자원의 특성으로 가장 적절한 것은?", choices:["비축하여 나중에 사용할 수 있다","누구에게나 동일한 속도로 흘러간다","사용하지 않으면 가치가 증가한다","사람마다 하루의 시간량이 다르다"], answer:1, explanation:"시간은 누구에게나 동일한 속도로 흘러가며 저장하거나 재사용할 수 없는 특성을 가집니다."},
{category:"자원관리능력", question:"물적자원 활용의 방해요인 중 '보관장소를 파악하지 못하는 경우'를 예방하는 방법으로 가장 적절한 것은?", choices:["물품을 다양한 장소에 나누어 보관한다","물품 목록과 보관위치를 기록·관리한다","물품을 최대한 많이 구매한다","물품 사용을 최소화한다"], answer:1, explanation:"물품 목록과 보관위치를 기록·관리하면 필요할 때 신속히 찾을 수 있습니다."},
{category:"자원관리능력", question:"'효과성'과 '효율성'의 차이를 가장 올바르게 설명한 것은?", choices:["효과성은 투입 대비 산출의 비율을, 효율성은 목표 달성 여부를 의미한다","효과성은 목표를 얼마나 달성했는가를, 효율성은 투입 자원 대비 산출을 얼마나 극대화했는가를 의미한다","효과성과 효율성은 완전히 같은 의미이다","효과성과 효율성은 예산관리에서만 사용되는 개념이다"], answer:1, explanation:"효과성은 목표 달성도를, 효율성은 투입 자원 대비 산출의 극대화 정도를 의미합니다."},
{category:"자원관리능력", question:"예산 수립 방식인 'Bottom-up 방식'에 대한 설명으로 가장 적절한 것은?", choices:["경영진이 전체 예산을 먼저 정하고 부서별로 배분하는 방식","각 부서나 활동 단위에서 필요한 예산을 산정해 취합하여 전체 예산을 수립하는 방식","예산을 아예 수립하지 않는 방식","전년도 예산을 그대로 사용하는 방식"], answer:1, explanation:"Bottom-up 방식은 하위 단위에서 필요한 예산을 산정해 상위로 취합하는 방식입니다."},
{category:"자원관리능력", question:"예산 수립 방식인 'Top-down 방식'에 대한 설명으로 가장 적절한 것은?", choices:["조직 전체의 목표 예산을 먼저 설정한 뒤 하위 부서에 배분하는 방식","각 팀원이 자율적으로 예산을 정하는 방식","예산을 실행 후에 사후적으로 산정하는 방식","고객의 요구에 따라서만 예산을 정하는 방식"], answer:0, explanation:"Top-down 방식은 조직 전체의 목표 예산을 먼저 정하고 이를 하위 부서에 배분하는 방식입니다."},
{category:"자원관리능력", question:"다음 중 물적자원으로 분류하기 어려운 것은?", choices:["생산 설비","원재료","사무용품","조직 구성원의 노하우"], answer:3, explanation:"조직 구성원의 노하우는 인적자원의 역량에 해당하며, 물적자원으로 분류되지 않습니다."},
{category:"자원관리능력", question:"인적자원관리의 특성으로 옳지 않은 것은?", choices:["개발 가능성을 지닌 자원이다","전략적 자원으로 활용될 수 있다","환경변화와 관계없이 항상 동일한 성과를 낸다","능동성을 지닌 자원이다"], answer:2, explanation:"인적자원은 환경과 조건, 관리 방식에 따라 성과가 달라지는 능동적 자원입니다."},
{category:"자원관리능력", question:"시간관리를 위한 구체적 방법으로 적절하지 않은 것은?", choices:["할 일 목록(To-do List) 작성","우선순위에 따라 일을 처리","모든 요청을 즉시, 순서와 관계없이 처리","정해진 시간 동안 집중해서 일하기(타임블로킹)"], answer:2, explanation:"우선순위를 고려하지 않고 모든 요청을 즉시 처리하는 것은 효과적인 시간관리 방법이 아닙니다."},
{category:"자원관리능력", question:"회의 자원(시간, 장소, 인력)을 효율적으로 관리하기 위한 방법으로 가장 적절하지 않은 것은?", choices:["회의 목적과 안건을 사전에 공유한다","회의 시간을 명확히 정하고 지킨다","안건과 무관한 인원도 모두 참석시킨다","회의록을 작성하여 결과를 공유한다"], answer:2, explanation:"안건과 무관한 인원을 참석시키는 것은 인력자원을 비효율적으로 사용하는 것입니다."},
{category:"자원관리능력", question:"자원의 낭비를 유발하는 요인으로 보기 어려운 것은?", choices:["자원에 대한 인식 부재","노하우 부족","계획적인 자원 활용","편리성 추구"], answer:2, explanation:"계획적인 자원 활용은 낭비를 방지하는 요인이며, 낭비의 원인이 아닙니다."},
{category:"자원관리능력", question:"물적자원관리에서 '통로대면의 원칙'이 의미하는 것으로 가장 적절한 것은?", choices:["물품을 쉽게 찾을 수 있도록 통로 면에 보관하는 원칙","물품을 색상별로 진열하는 원칙","가장 무거운 물품을 통로에 두는 원칙","통로를 최대한 좁게 만드는 원칙"], answer:0, explanation:"통로대면의 원칙은 물품을 통로 면에 보관하여 쉽게 찾고 이동할 수 있도록 하는 원칙입니다."},
{category:"자원관리능력", question:"인적자원의 특성인 '개발가능성'에 대한 설명으로 가장 적절한 것은?", choices:["환경변화와 관계없이 성과가 고정되어 있다","교육과 훈련을 통해 잠재력과 능력을 지속적으로 개발할 수 있다","한번 정해진 역량은 변하지 않는다","물적자원과 마찬가지로 소모되기만 한다"], answer:2, explanation:"인적자원은 교육과 훈련을 통해 잠재력을 지속적으로 개발할 수 있는 특성을 지닙니다."},
{category:"자원관리능력", question:"시간낭비를 유발하는 요인 중 '내적 요인'에 해당하는 것은?", choices:["상급자의 갑작스러운 지시","동료의 잦은 방문","우선순위를 정하지 않고 일하는 습관","예상치 못한 정전"], answer:2, explanation:"우선순위를 정하지 않는 습관은 본인의 행동에서 비롯된 내적 요인이며, 나머지는 외적 요인입니다."},

{category:"자원관리능력", question:"예산 1,000만원 중 700만원을 이미 집행했다면, 남은 예산은 전체의 몇 %인가?", choices:["20%","25%","30%","35%"], answer:2, explanation:"(1,000-700)÷1,000=30%."},
{category:"자원관리능력", question:"A업무는 3명이 4일, B업무는 2명이 6일 걸린다(두 업무는 서로 독립적이며 인력은 겹치지 않음). 두 업무를 동시에 진행하는 데 필요한 최소 동시 투입 인원은?", choices:["3명","4명","5명","6명"], answer:2, explanation:"A업무에 3명, B업무에 2명이 동시에 필요하므로 합산 5명이 필요합니다."},
{category:"자원관리능력", question:"창고 임대료가 월 80만원인데, 보관 물품이 늘어 창고를 1.5배 넓혀야 한다면 예상 월 임대료는? (면적에 비례)", choices:["100만원","120만원","110만원","130만원"], answer:1, explanation:"80만원×1.5=120만원."},
{category:"자원관리능력", question:"월 예산 500만원 중 하루 평균 20만원씩 소진한다면, 예산이 모두 소진되기까지 며칠이 걸리는가?", choices:["20일","22일","25일","28일"], answer:2, explanation:"500÷20=25일."},
{category:"자원관리능력", question:"인력 A(1일 8건 처리), B(1일 5건 처리)가 함께 일하면 총 260건을 처리하는 데 며칠이 걸리는가?", choices:["18일","20일","22일","24일"], answer:1, explanation:"합산 처리량=8+5=13건/일. 260÷13=20일."},
{category:"자원관리능력", question:"인건비 예산 900만원을 근무일수에 비례하여 갑, 을, 병 세 명에게 배분한다. 갑 20일, 을 15일, 병 10일 근무했다면 갑이 받는 금액은?", choices:["350만원","400만원","380만원","420만원"], answer:1, explanation:"총 근무일=45일. 갑의 비율=20/45. 900만원×20/45=400만원."},
{category:"자원관리능력", question:"회의 자료를 1인당 30장씩 인쇄해야 하며 참석자가 25명이다. 프린터 한 대가 1분에 12장을 인쇄할 수 있다면 전체 인쇄에 걸리는 시간은?", choices:["55분","58분","62.5분","65분"], answer:2, explanation:"총 인쇄량=30×25=750장. 750÷12=62.5분."},
{category:"자원관리능력", question:"예산 640만원을 프로젝트 진행률에 따라 지급하기로 했다. 1단계(40% 진행) 완료 시 지급받는 금액은?", choices:["216만원","236만원","276만원","256만원"], answer:3, explanation:"640만원×0.4=256만원."},
{category:"자원관리능력", question:"어떤 자재를 kg당 3,500원에 구매한다. 예산 700,000원으로 구매할 수 있는 최대 자재 양은?", choices:["200kg","180kg","190kg","210kg"], answer:0, explanation:"700,000÷3,500=200kg."},
{category:"자원관리능력", question:"동일한 업무를 A팀은 6시간, B팀은 8시간, C팀은 12시간에 처리한다. 세 팀이 함께 처리하면 걸리는 시간은?", choices:["2시간","8/3시간(약 2.67시간)","2.4시간","3시간"], answer:1, explanation:"시간당 처리율 합=1/6+1/8+1/12=9/24=3/8. 전체 소요시간=8/3시간(약 2.67시간)."},
{category:"자원관리능력", question:"인력 10명이 하루 6시간씩 근무하여 5일 만에 끝낸 작업을, 인력 15명이 하루 4시간씩 근무하면 며칠이 걸리는가?", choices:["4일","5일","6일","7일"], answer:1, explanation:"총 작업량=10×6×5=300인시간. 15명×4시간=60시간/일. 300÷60=5일."},
{category:"자원관리능력", question:"물품구매 예산 250만원 중 소모품에 60%, 사무기기에 25%를 배정하면 나머지 예비 예산은?", choices:["30만원","32.5만원","35만원","37.5만원"], answer:3, explanation:"100%-60%-25%=15%. 250만원×0.15=37.5만원."},
{category:"자원관리능력", question:"A창고에서 B창고까지 물품을 옮기는 데 트럭 1대로는 왕복 4회가 필요하며, 왕복 1회에 40분이 걸린다. 트럭 2대를 동시에 운행하여 균등하게 나누어 운송하면 전체 운송이 완료되는 데 걸리는 시간은?", choices:["80분","40분","60분","160분"], answer:0, explanation:"트럭 2대가 각각 2회씩 왕복하면 되므로 소요시간=2×40분=80분."},
{category:"자원관리능력", question:"직원 1인당 사무용품 지급 예산이 15,000원이고 직원이 48명일 때 전체 예산은?", choices:["680,000원","720,000원","700,000원","740,000원"], answer:1, explanation:"15,000×48=720,000원."},
{category:"자원관리능력", question:"프로젝트 기간이 원래 20일 걸릴 예정이었으나 인력을 25% 추가 투입하여 기간을 단축했다. 추가 투입 후 소요 기간은? (작업량 동일, 인력과 기간은 반비례)", choices:["14일","15일","16일","18일"], answer:2, explanation:"원래 인력을 P, 총 작업량=20P. 새 인력=1.25P. 새 기간=20P÷1.25P=16일."},
{category:"자원관리능력", question:"예산 480만원을 A, B 두 활동에 5:7 비율로 배분한다면 B활동에 배정되는 금액은?", choices:["240만원","260만원","300만원","280만원"], answer:3, explanation:"전체 비율 합=12. B=7/12×480만원=280만원."},
{category:"자원관리능력", question:"재고 물품 1,200개를 매일 40개씩 사용한다면 재고가 모두 소진되기까지 며칠이 걸리는가?", choices:["30일","25일","28일","32일"], answer:0, explanation:"1,200÷40=30일."},
{category:"자원관리능력", question:"업무 우선순위 점수를 중요도(40%)와 긴급도(60%)의 가중평균으로 계산한다. 업무 X의 중요도 80점, 긴급도 60점일 때 가중평균 점수는?", choices:["62점","68점","65점","70점"], answer:1, explanation:"80×0.4+60×0.6=32+36=68점."},
{category:"자원관리능력", question:"어느 부서의 연간 예산이 1억 2천만원이고 이를 12개월 균등 배분한다면 월 예산은?", choices:["900만원","950만원","1,000만원","1,050만원"], answer:2, explanation:"12,000만원÷12=1,000만원."},
{category:"자원관리능력", question:"인쇄물 1,000장을 인쇄해야 하는데 프린터 A는 1분에 25장, 프린터 B는 1분에 15장을 인쇄한다. 두 대를 동시에 사용하면 인쇄를 마치는 데 걸리는 시간은?", choices:["20분","22분","28분","25분"], answer:3, explanation:"합산 인쇄속도=25+15=40장/분. 1,000÷40=25분."},
{category:"자원관리능력", question:"예산 550만원 중 320만원을 이미 사용했다. 남은 예산으로 1개당 15만원인 장비를 최대 몇 개 구매할 수 있는가?", choices:["15개","13개","14개","16개"], answer:0, explanation:"남은 예산=550-320=230만원. 230÷15=15.33이므로 최대 15개 구매 가능합니다."},
{category:"자원관리능력", question:"직원 A는 문서 1건을 처리하는 데 20분, 직원 B는 30분이 걸린다. 두 사람이 각자 독립적으로 하루 8시간 동안 처리할 수 있는 총 문서 건수는?", choices:["32건","40건","36건","44건"], answer:1, explanation:"A는 시간당 3건, B는 시간당 2건 처리. 합산 5건/시간×8시간=40건."},
{category:"자원관리능력", question:"예산 90만원으로 1개 6만원인 의자와 1개 3만원인 테이블을 구매하려 한다. 의자를 10개 구매하고 남은 예산으로 구매할 수 있는 테이블의 최대 개수는?", choices:["8개","9개","10개","11개"], answer:2, explanation:"의자 10개=60만원. 남은 예산=30만원. 30÷3=10개."},
{category:"자원관리능력", question:"프로젝트가 원래 인력 4명 기준 24일이 걸릴 예정이었다. 인력을 6명으로 늘리면 며칠 만에 끝나는가? (작업량과 인력은 반비례)", choices:["14일","15일","18일","16일"], answer:3, explanation:"총 작업량=4×24=96인일. 96÷6=16일."},
{category:"자원관리능력", question:"시간관리 매트릭스 4분면 중 '긴급하면서 중요한 일'의 예로 가장 적절한 것은?", choices:["장기 자기계발 계획 수립","갑작스러운 고객 클레임 대응","의미 없는 SNS 확인","친교를 위한 사적 통화"], answer:1, explanation:"긴급하면서 중요한 일은 즉각적인 대응이 필요한 위기 상황이나 클레임 대응 등이 해당합니다."},
{category:"자원관리능력", question:"시간관리 매트릭스에서 '긴급하지만 중요하지 않은 일'의 예로 가장 적절한 것은?", choices:["형식적인 전화 응대나 불필요한 보고","연간 사업계획 수립","자격증 취득을 위한 학습","비상 상황 대응"], answer:0, explanation:"긴급하지만 중요하지 않은 일은 당장 처리해야 하지만 성과에 큰 영향을 주지 않는 형식적 업무 등이 해당하며, 가능하면 위임하는 것이 바람직합니다."},
{category:"자원관리능력", question:"업무 K(소요1시간, 마감 9:30), J(소요2시간, 마감 11:30), M(소요3시간, 마감 14:30), L(소요2시간, 마감 16:30)을 오전8시30분부터 처리할 때, 모든 마감기한을 지킬 수 있는 처리 순서는?", choices:["K-J-M-L","J-K-M-L","M-J-K-L","L-M-J-K"], answer:0, explanation:"마감이 빠른 순서(K 9:30→J 11:30→M 14:30→L 16:30)로 처리하면 각각 9:30, 11:30, 14:30, 16:30에 끝나 모든 기한을 지킬 수 있습니다."},
{category:"자원관리능력", question:"업무 P(소요1시간, 마감 오전10:00), S(소요1시간, 마감 오전11:30), R(소요2시간, 마감 오후1:30), Q(소요3시간, 마감 오후5:00)를 오전9시부터 처리할 때, 모든 마감기한을 지킬 수 있는 처리 순서는?", choices:["P-S-R-Q","Q-P-S-R","R-Q-P-S","S-R-P-Q"], answer:0, explanation:"마감이 빠른 순서(P 10:00→S 11:30→R 13:30→Q 17:00)로 처리하면 각각 오전10시, 오전11시30분, 오후1시30분, 오후5시에 끝나 모든 마감을 지킬 수 있습니다."},
{category:"자원관리능력", question:"다음 네 가지 업무 중 마감기한이 가장 임박하여 가장 먼저 처리해야 하는 것은? (모든 업무는 오늘 접수됨) A(마감 오늘 오후6시), B(마감 내일 오전9시), C(마감 오늘 오후3시), D(마감 모레)", choices:["A","B","C","D"], answer:2, explanation:"마감기한이 가장 이른 업무부터 처리하는 것이 원칙이며, C(오늘 오후3시)가 가장 임박한 마감입니다."},
{category:"자원관리능력", question:"다음 중 시간관리를 잘하는 사람의 특징으로 보기 어려운 것은?", choices:["업무의 우선순위를 명확히 설정한다","목표에 따라 계획을 세우고 실행한다","계획에 없는 요청은 무조건 거절한다","여유시간을 계획적으로 활용한다"], answer:2, explanation:"계획에 없는 요청이라도 상황에 따라 유연하게 대응하는 것이 바람직하며, 무조건적인 거절은 효과적인 시간관리라 볼 수 없습니다."},
{category:"자원관리능력", question:"다음 중 시간관리를 방해하는 외적 요인에 해당하는 것은?", choices:["목표의식의 부족","계획 없이 즉흥적으로 일하는 습관","잦은 시스템 오류 및 정전","우선순위를 정하지 못하는 우유부단함"], answer:2, explanation:"시스템 오류나 정전은 본인이 통제하기 어려운 외적 요인이며, 나머지는 개인의 습관에서 비롯된 내적 요인입니다."},
{category:"자원관리능력", question:"다음 중 시간관리를 방해하는 내적 요인에 해당하는 것은?", choices:["상사의 갑작스러운 업무 지시","거래처의 일정 변경 통보","한번에 여러 일을 처리하려는 습관","예기치 못한 기기 고장"], answer:2, explanation:"한번에 여러 일을 처리하려는 습관은 본인의 행동에서 비롯된 내적 요인이며, 나머지는 외적 요인입니다."},
{category:"자원관리능력", question:"여러 업무의 우선순위를 정할 때 고려해야 할 기준으로 가장 거리가 먼 것은?", choices:["업무의 중요도","업무의 긴급도","업무 담당자의 개인적 선호도","마감기한"], answer:2, explanation:"우선순위는 중요도, 긴급도, 마감기한 등 객관적 기준에 따라 정해야 하며 개인적 선호도가 기준이 되어서는 안 됩니다."},
{category:"자원관리능력", question:"하루, 주간, 월간 등 시간 단위로 해야 할 일을 미리 계획하는 도구를 활용하는 목적으로 가장 적절한 것은?", choices:["업무를 가시화하여 체계적으로 관리하기 위해","업무량을 무조건 늘리기 위해","타인에게 보여주기 위한 형식적 목적으로","계획을 세우면 실행하지 않아도 되기 때문"], answer:0, explanation:"시간계획 도구는 해야 할 일을 가시화하여 체계적으로 관리할 수 있도록 돕습니다."},
{category:"자원관리능력", question:"여러 업무를 동시에 처리하는 멀티태스킹의 문제점으로 가장 적절한 것은?", choices:["업무 집중도가 높아져 효율이 증가한다","각 업무에 대한 집중력이 분산되어 오히려 효율이 떨어질 수 있다","항상 시간을 단축시킨다","실수가 줄어든다"], answer:1, explanation:"멀티태스킹은 집중력을 분산시켜 개별 업무의 효율과 정확도를 떨어뜨릴 수 있습니다."},
{category:"자원관리능력", question:"다음주 목요일 오후 2시에 부서 회의를 진행하려 한다. 참석 대상자 5명의 일정은 다음과 같다: 甲(가능), 乙(가능), 丙(해당 시간 외부출장), 丁(가능), 戊(가능). 이 경우 가장 적절한 대응은?", choices:["丙을 제외하고 예정대로 진행한다","丙의 일정을 고려하여 회의 시간을 조율하거나 별도로 내용을 공유한다","전체 일정을 취소한다","丙에게 알리지 않고 진행한다"], answer:1, explanation:"참석이 어려운 인원의 일정을 최대한 배려하여 시간을 조율하거나 회의 내용을 별도로 공유하는 것이 바람직합니다."},
{category:"자원관리능력", question:"업무 마감기한을 준수하는 것이 조직에 미치는 영향으로 가장 적절한 것은?", choices:["후속 업무 및 협업 부서에 미치는 영향을 최소화하고 신뢰를 유지할 수 있다","마감기한은 개인의 문제일 뿐 조직에는 영향이 없다","마감기한을 지키지 않아도 성과에는 변화가 없다","마감기한 준수는 창의성을 저해하므로 지양해야 한다"], answer:0, explanation:"마감기한 준수는 후속 업무와 협업 부서에 미치는 영향을 최소화하고 조직 간 신뢰를 유지하는 데 중요합니다."},
{category:"자원관리능력", question:"오전 9시에 출근하여 A업무(1시간30분), B업무(45분), C업무(2시간15분)를 순서대로 쉬는 시간 없이 처리한다면 세 업무를 모두 마치는 시각은?", choices:["오후12시30분","오후1시","오후1시30분","오후2시"], answer:2, explanation:"1시간30분+45분+2시간15분=4시간30분. 오전9시+4시간30분=오후1시30분입니다."},
{category:"자원관리능력", question:"오전 10시에 시작한 회의가 40분간 진행된 후 10분간 휴식하고, 다시 50분간 속개되었다면 회의가 최종 종료된 시각은?", choices:["오전11시20분","오전11시30분","오전11시40분","오전12시"], answer:2, explanation:"40분+10분+50분=100분(1시간40분). 오전10시+1시간40분=오전11시40분입니다."},
{category:"자원관리능력", question:"긴급한 일에만 매몰되어 중요하지만 긴급하지 않은 일을 계속 미루는 경우 발생할 수 있는 문제로 가장 적절한 것은?", choices:["장기적인 목표 달성이 어려워질 수 있다","단기 성과가 즉시 사라진다","조직의 규모가 줄어든다","예산이 자동으로 증가한다"], answer:0, explanation:"중요하지만 긴급하지 않은 일을 계속 미루면 장기적인 목표나 역량 개발이 소홀해질 수 있습니다."},
{category:"자원관리능력", question:"출퇴근 이동시간과 같이 반복적으로 소요되는 시간을 사전에 파악해두면 얻을 수 있는 이점으로 가장 적절한 것은?", choices:["일정 계획의 정확도를 높일 수 있다","이동시간이 완전히 사라진다","업무량이 줄어든다","예산이 절감된다"], answer:0, explanation:"반복적으로 소요되는 시간을 미리 파악하면 보다 현실적이고 정확한 일정 계획을 세울 수 있습니다."},
{category:"자원관리능력", question:"접수된 순서대로만 업무를 처리하고 중요도나 마감기한을 고려하지 않을 때 발생할 수 있는 문제는?", choices:["모든 업무가 항상 제때 처리된다","중요하거나 긴급한 업무의 처리가 지연될 수 있다","업무 효율이 무조건 향상된다","자원 낭비가 발생하지 않는다"], answer:1, explanation:"접수 순서만 고려하면 정작 중요하거나 긴급한 업무의 처리가 지연될 위험이 있습니다."},
{category:"자원관리능력", question:"다음 중 오늘 안에 반드시 완료해야 하는, 즉 가장 먼저 처리해야 할 업무는? A(다음 주 마감, 소요 3일), B(오늘 마감, 소요 2시간), C(내일 마감, 소요 1일), D(이번 주 금요일 마감, 소요 반나절)", choices:["A","B","C","D"], answer:1, explanation:"마감기한이 가장 임박한 업무는 오늘 마감인 B이므로 가장 먼저 처리해야 합니다."},
{category:"자원관리능력", question:"일반적으로 사용되는 시간관리 매트릭스(아이젠하워 매트릭스)를 구성하는 두 축으로 옳은 것은?", choices:["중요도와 긴급도","비용과 품질","난이도와 선호도","인력과 예산"], answer:0, explanation:"아이젠하워 매트릭스는 중요도와 긴급도라는 두 축을 기준으로 업무를 네 가지로 분류합니다."},
{category:"자원관리능력", question:"다음 중 직접비에 해당하는 것으로 가장 적절한 것은?", choices:["특허권 사용료","건물 임대료","일반 관리비","공과금"], answer:0, explanation:"특허권 사용료와 같이 특정 프로젝트 수행에 직접 소요되는 비용은 직접비에 해당하며, 나머지는 간접비입니다."},
{category:"자원관리능력", question:"다음 중 간접비에 해당하는 것으로 가장 적절한 것은?", choices:["원자재 구입비","연구개발 인건비","사무실 전기 및 수도 요금","외주 용역비"], answer:2, explanation:"사무실 전기 및 수도 요금과 같은 공과금은 간접비에 해당하며, 나머지는 사업에 직접 소요되는 직접비입니다."},
{category:"자원관리능력", question:"예산관리의 일반적인 절차를 순서대로 나열한 것은?", choices:["필요 과업 및 활동 규명 → 우선순위 결정 → 예산 배정 → 예산 집행 및 통제","예산 집행 → 과업 규명 → 우선순위 결정 → 예산 배정","예산 배정 → 우선순위 결정 → 과업 규명 → 집행","우선순위 결정 → 예산 집행 → 과업 규명 → 배정"], answer:0, explanation:"예산관리는 필요한 과업 규명 → 우선순위 결정 → 예산 배정 → 집행 및 통제의 순서로 진행됩니다."},
{category:"자원관리능력", question:"예산 수립 방식에 대한 설명으로 옳지 않은 것은?", choices:["Top-down 방식은 조직 전체 목표예산을 먼저 정한다","Bottom-up 방식은 현장의 실제 소요를 반영하기 쉽다","두 방식은 조직 상황에 따라 혼용하여 사용할 수 있다","Bottom-up 방식은 항상 예산을 가장 적게 산정한다"], answer:3, explanation:"Bottom-up 방식이 항상 예산을 가장 적게 산정한다고 단정할 수 없으며, 실제 현장 소요를 반영하다 보면 오히려 예산이 커질 수도 있습니다."},
{category:"자원관리능력", question:"프로젝트 진행 중 예산 초과가 예상될 때 가장 먼저 해야 할 일로 적절한 것은?", choices:["초과 원인을 파악하고 지출 내역을 재검토한다","초과분을 개인 비용으로 충당한다","프로젝트를 즉시 중단한다","보고 없이 예산을 임의로 증액한다"], answer:0, explanation:"예산 초과가 예상되면 먼저 원인을 파악하고 지출 내역을 재검토하여 대응 방안을 마련해야 합니다."},
{category:"자원관리능력", question:"예산 대비 실제 지출 현황을 정기적으로 점검(모니터링)하는 목적으로 가장 적절한 것은?", choices:["차이를 조기에 파악하여 적절한 대응을 하기 위해","예산 담당자를 문책하기 위해","지출을 무조건 늘리기 위해","보고서 분량을 늘리기 위해"], answer:0, explanation:"정기적인 모니터링은 예산과 실제 지출의 차이를 조기에 파악하여 적절히 대응하기 위한 것입니다."},
{category:"자원관리능력", question:"이미 지출되어 회수할 수 없는 비용으로, 향후 의사결정에 영향을 주어서는 안 되는 비용을 가리키는 용어는?", choices:["매몰비용","기회비용","간접비","예비비"], answer:0, explanation:"매몰비용은 이미 지출되어 회수 불가능한 비용으로, 합리적 의사결정 시 고려하지 않아야 합니다."},
{category:"자원관리능력", question:"하나의 대안을 선택함으로써 포기하게 되는 다른 대안의 가치를 의미하는 용어는?", choices:["매몰비용","기회비용","한계비용","고정비용"], answer:1, explanation:"기회비용은 한 대안을 선택함으로써 포기해야 하는 다른 대안의 가치를 의미합니다."},
{category:"자원관리능력", question:"예산 편성 시 예측하지 못한 지출에 대비하여 별도로 책정해두는 항목은?", choices:["예비비","직접비","세금","감가상각비"], answer:0, explanation:"예비비는 예측하지 못한 지출에 대비하여 별도로 책정해두는 예산 항목입니다."},
{category:"자원관리능력", question:"예산관리 시 '우선순위'를 고려해야 하는 이유로 가장 적절한 것은?", choices:["한정된 예산을 핵심 과업에 효과적으로 배분하기 위해","모든 항목에 동일하게 배분하면 되므로 불필요하다","우선순위는 법적으로 정해져 있기 때문에","예산은 무제한이므로 상관없다"], answer:0, explanation:"예산은 한정되어 있으므로 우선순위를 고려하여 핵심 과업에 효과적으로 배분해야 합니다."},
{category:"자원관리능력", question:"예산 750만원을 마케팅팀과 영업팀에 3:2 비율로 나눈다면 마케팅팀이 받는 금액은?", choices:["450만원","400만원","500만원","350만원"], answer:0, explanation:"전체 비율 합=5. 마케팅팀=3/5×750만원=450만원."},
{category:"자원관리능력", question:"총 사업비 1,500만원 중 직접비가 전체의 70%라면 간접비는?", choices:["350만원","400만원","450만원","500만원"], answer:2, explanation:"직접비=1,500만원×0.7=1,050만원. 간접비=1,500-1,050=450만원."},
{category:"자원관리능력", question:"부서 예산 400만원 중 이번 달까지 60%를 집행했다면 남은 예산은?", choices:["120만원","140만원","160만원","180만원"], answer:2, explanation:"남은 비율=40%. 400만원×0.4=160만원."},
{category:"자원관리능력", question:"예산 620만원을 A,B,C 세 프로젝트에 각각 40%,35%,25%로 배분할 때 C프로젝트에 배정되는 금액은?", choices:["124만원","155만원","217만원","186만원"], answer:1, explanation:"620만원×0.25=155만원."},
{category:"자원관리능력", question:"1개당 8,000원인 소모품을 예산 96,000원으로 최대 몇 개 구매할 수 있는가?", choices:["10개","11개","12개","13개"], answer:2, explanation:"96,000÷8,000=12개."},
{category:"자원관리능력", question:"인건비 예산이 전체 예산의 55%이며 금액으로 440만원이라면 전체 예산은?", choices:["750만원","800만원","820만원","880만원"], answer:1, explanation:"440만원÷0.55=800만원."},
{category:"자원관리능력", question:"예산 900만원 중 300만원은 인건비, 나머지의 40%는 재료비로 배정한다면 재료비는?", choices:["220만원","230만원","240만원","250만원"], answer:2, explanation:"나머지=900-300=600만원. 재료비=600만원×0.4=240만원."},
{category:"자원관리능력", question:"지난달 예산 대비 실제 지출이 15% 초과되었다. 지난달 예산이 400만원이었다면 실제 지출액은?", choices:["440만원","450만원","460만원","470만원"], answer:2, explanation:"400만원×1.15=460만원."},
{category:"자원관리능력", question:"행사 예산 250만원 중 대관료 90만원, 다과비 40만원을 제외한 나머지를 홍보비로 사용한다면 홍보비는?", choices:["100만원","110만원","120만원","130만원"], answer:2, explanation:"250-90-40=120만원."},
{category:"자원관리능력", question:"예산을 부서 인원수에 비례하여 배분한다. 총 예산 720만원, A부서 8명, B부서 4명일 때 A부서가 받는 금액은?", choices:["420만원","440만원","460만원","480만원"], answer:3, explanation:"비율=8:4=2:1. A부서=2/3×720만원=480만원."},
{category:"자원관리능력", question:"구매 예산 180만원으로 1개 12,000원인 물품을 100개 구매했다. 남은 예산으로 1개 6,000원인 물품을 최대 몇 개 구매할 수 있는가?", choices:["80개","90개","100개","110개"], answer:2, explanation:"180만원=1,800,000원. 100개×12,000원=1,200,000원 사용. 남은 금액=600,000원. 600,000÷6,000=100개."},
{category:"자원관리능력", question:"총예산 대비 초과 지출률이 8%이고 초과 금액이 32만원이라면 총예산은?", choices:["350만원","380만원","400만원","420만원"], answer:2, explanation:"32만원÷0.08=400만원."},
{category:"자원관리능력", question:"프로젝트 예산 1,100만원 중 계약금으로 40%를 먼저 지급하고, 나머지는 중도금과 잔금으로 균등하게 나눈다면 중도금은?", choices:["300만원","320만원","330만원","350만원"], answer:2, explanation:"계약금=1,100만원×0.4=440만원. 나머지=660만원, 균등 배분 시 중도금=330만원."},

{category:"자원관리능력", question:"조직 내 인적자원관리에서 '동기부여'가 중요한 이유로 가장 적절한 것은?", choices:["구성원의 자발적인 성과 창출을 이끌어낼 수 있기 때문","동기부여는 비용이 전혀 들지 않기 때문","동기부여는 법적 의무사항이기 때문","동기부여는 인사평가와 무관하기 때문"], answer:0, explanation:"동기부여는 구성원의 자발적인 성과 창출을 이끌어내는 데 중요한 역할을 합니다."},
{category:"자원관리능력", question:"다음 중 효과적인 인력배치를 위해 사전에 파악해야 할 정보로 가장 거리가 먼 것은?", choices:["직원 개인의 역량과 적성","직무의 요구 특성","직원의 개인적 재산 규모","팀 내 인력 구성 현황"], answer:2, explanation:"직원의 개인적 재산 규모는 인력배치와 관련이 없는 정보입니다."},
{category:"자원관리능력", question:"인적자원관리에서 '이직 방지' 및 '핵심인재 유지'를 위한 방안으로 가장 적절하지 않은 것은?", choices:["공정한 보상체계 마련","경력개발 기회 제공","일방적인 업무 과중 부여","원활한 소통 문화 조성"], answer:2, explanation:"일방적인 업무 과중 부여는 오히려 이직을 촉진하는 요인이 됩니다."},
{category:"자원관리능력", question:"다음 중 인적자원의 특성으로 옳은 것을 모두 고르면? ㄱ. 능동성 ㄴ. 개발가능성 ㄷ. 전략적 자원 ㄹ. 완전한 예측가능성", choices:["ㄱ,ㄴ,ㄷ","ㄱ,ㄴ,ㄹ","ㄴ,ㄷ,ㄹ","ㄱ,ㄷ,ㄹ"], answer:0, explanation:"인적자원은 능동성, 개발가능성, 전략적 자원이라는 특성을 지니며, 환경과 관리방식에 따라 성과가 달라지므로 완전히 예측 가능하다고 볼 수 없습니다."},
{category:"자원관리능력", question:"인력을 채용할 때 직무기술서(직무의 내용, 요구 역량 등)를 먼저 작성해야 하는 이유로 가장 적절한 것은?", choices:["직무에 적합한 인재를 효과적으로 선발하기 위해","서류 작업량을 늘리기 위해","채용 비용을 무조건 절감하기 위해","법적으로 아무 의미가 없기 때문"], answer:0, explanation:"직무기술서를 먼저 작성하면 직무에 적합한 인재를 효과적으로 선발하는 데 도움이 됩니다."},
{category:"자원관리능력", question:"다음 중 팀 성과를 저해하는 인적자원관리 상의 문제로 보기 어려운 것은?", choices:["역할과 책임의 불명확","불공정한 평가 및 보상","원활한 정보 공유와 협업","일방적인 의사결정 구조"], answer:2, explanation:"원활한 정보 공유와 협업은 오히려 팀 성과를 높이는 요인입니다."},
{category:"자원관리능력", question:"신입사원 배치 시 적성검사와 면접 결과를 종합적으로 고려하는 이유로 가장 적절한 것은?", choices:["개인의 역량과 조직의 요구를 균형 있게 반영한 배치를 하기 위해","서류 절차를 늘리기 위해","비용을 늘리기 위해","무작위 배치를 위해"], answer:0, explanation:"적성검사와 면접 결과를 종합적으로 고려하면 개인의 역량과 조직의 요구를 균형 있게 반영한 배치가 가능합니다."},
{category:"자원관리능력", question:"인적자원관리 활동 중 '역량 평가 및 피드백'을 정기적으로 실시하는 목적으로 가장 적절한 것은?", choices:["구성원의 성장을 지원하고 조직 성과를 향상시키기 위해","평가는 형식적 절차에 불과하기 때문","피드백은 불필요한 갈등만 유발하기 때문","평가 결과는 활용할 필요가 없기 때문"], answer:0, explanation:"정기적인 역량 평가와 피드백은 구성원의 성장을 지원하고 조직 성과를 향상시키기 위한 활동입니다."},
{category:"자원관리능력", question:"다음 사례에 해당하는 자원 낭비 요인으로 가장 적절한 것은? '필요한 자원의 종류와 양을 사전에 계획하지 않고 즉흥적으로 구매하여 중복 구매가 발생하였다.'", choices:["비계획적 행동","편리성 추구","노하우 부족","자원에 대한 인식 부재"], answer:0, explanation:"사전 계획 없이 즉흥적으로 행동하여 중복 구매가 발생한 것은 비계획적 행동에 해당합니다."},
{category:"자원관리능력", question:"다음 사례에 해당하는 자원 낭비 요인으로 가장 적절한 것은? '일회용품이 재사용 가능한 물품보다 사용이 간편하다는 이유로 불필요하게 많이 사용하였다.'", choices:["비계획적 행동","편리성 추구","자원에 대한 인식 부재","노하우 부족"], answer:1, explanation:"당장의 편리함을 우선시하여 자원을 낭비한 것은 편리성 추구에 해당합니다."},
{category:"자원관리능력", question:"다음 사례에 해당하는 자원 낭비 요인으로 가장 적절한 것은? '자원관리의 필요성 자체를 인식하지 못하여 남는 자원을 방치하였다.'", choices:["노하우 부족","자원에 대한 인식 부재","편리성 추구","비계획적 행동"], answer:1, explanation:"자원관리의 필요성 자체를 인식하지 못한 것은 자원에 대한 인식 부재에 해당합니다."},
{category:"자원관리능력", question:"다음 사례에 해당하는 자원 낭비 요인으로 가장 적절한 것은? '자원을 효율적으로 관리하는 방법을 알지 못하여 동일한 실수를 반복하였다.'", choices:["노하우 부족","편리성 추구","자원에 대한 인식 부재","비계획적 행동"], answer:0, explanation:"자원관리 방법을 알지 못해 실수를 반복한 것은 노하우 부족에 해당합니다."},
{category:"자원관리능력", question:"자원 낭비를 예방하기 위한 방법으로 가장 적절하지 않은 것은?", choices:["자원 활용 계획을 사전에 수립한다","자원관리 노하우를 습득하고 공유한다","당장의 편리함을 최우선 기준으로 삼는다","자원의 중요성에 대한 인식을 높인다"], answer:2, explanation:"당장의 편리함만을 최우선 기준으로 삼는 것은 오히려 자원 낭비를 유발하는 요인입니다."},
{category:"자원관리능력", question:"물적, 시간적, 예산적 자원을 낭비하지 않고 효과적으로 활용하기 위해 가장 우선적으로 필요한 것은?", choices:["자원이 유한하다는 것을 인식하고 계획을 수립하는 것","자원을 최대한 많이 확보해두는 것","자원 관리를 담당 부서에만 맡기는 것","자원 사용을 전면 금지하는 것"], answer:0, explanation:"자원이 유한하다는 것을 인식하고 이를 바탕으로 계획을 수립하는 것이 효과적인 자원 활용의 출발점입니다."},
{category:"자원관리능력", question:"다음 중 자원 낭비의 결과로 나타날 수 있는 현상으로 보기 어려운 것은?", choices:["불필요한 비용 증가","목표 달성 지연","조직의 신뢰도 저하","자원 활용의 효율성 극대화"], answer:3, explanation:"자원 낭비는 비용 증가, 목표 달성 지연, 신뢰도 저하 등을 초래하며 효율성 극대화와는 거리가 멉니다."},
{category:"자원관리능력", question:"같은 업무를 여러 사람이 중복으로 처리하여 인력과 시간이 낭비되는 것을 방지하기 위한 방법으로 가장 적절한 것은?", choices:["업무 분장을 명확히 하고 협업 현황을 공유한다","모든 업무를 한 사람에게만 몰아준다","업무 분담표를 아예 작성하지 않는다","의사소통을 최소화한다"], answer:0, explanation:"업무 분장을 명확히 하고 협업 현황을 공유하면 중복 업무로 인한 자원 낭비를 방지할 수 있습니다."},
{category:"자원관리능력", question:"SMART 목표 설정 원칙에서 'S'가 의미하는 것은?", choices:["Specific(구체적인)","Simple(단순한)","Sudden(갑작스러운)","Static(고정된)"], answer:0, explanation:"SMART의 'S'는 목표가 구체적이어야 함을 의미하는 Specific입니다."},
{category:"자원관리능력", question:"SMART 목표 설정 원칙에서 'A'가 일반적으로 의미하는 것은?", choices:["Ambiguous","Achievable(달성 가능한)","Automatic","Aggressive"], answer:1, explanation:"SMART의 'A'는 현실적으로 달성 가능해야 함을 의미하는 Achievable입니다."},
{category:"자원관리능력", question:"SMART 목표 설정 원칙에서 'R'이 의미하는 것은?", choices:["Random","Repeated","Relevant(관련성 있는)","Rigid"], answer:2, explanation:"SMART의 'R'은 목표가 조직이나 개인의 방향성과 관련이 있어야 함을 의미하는 Relevant입니다."},
{category:"자원관리능력", question:"SMART 목표 설정 원칙에서 'T'가 의미하는 것은?", choices:["Time-bound(시간제한이 있는)","Total","Talented","Tentative"], answer:0, explanation:"SMART의 'T'는 목표 달성에 명확한 기한이 있어야 함을 의미하는 Time-bound입니다."},
{category:"자원관리능력", question:"동일한 예산으로 더 많은 산출물을 얻어냈다면 이는 무엇이 향상되었다고 볼 수 있는가?", choices:["효율성","형평성","합법성","안정성"], answer:0, explanation:"동일한 투입으로 더 많은 산출을 얻는 것은 효율성이 향상된 것을 의미합니다."},
{category:"자원관리능력", question:"자원관리 능력이 뛰어난 사람의 특징으로 가장 적절한 것은?", choices:["가용 자원을 정확히 파악하고 우선순위에 따라 계획적으로 활용한다","자원을 최대한 많이 확보하기만 하면 된다고 생각한다","계획 없이 상황에 따라 즉흥적으로 대응한다","자원 관리를 타인에게 전적으로 위임하고 관여하지 않는다"], answer:0, explanation:"자원관리 능력이 뛰어난 사람은 가용 자원을 정확히 파악하고 우선순위에 따라 계획적으로 활용합니다."},
{category:"자원관리능력", question:"업무 수행 시 시간, 예산, 물적자원, 인적자원을 균형 있게 관리해야 하는 이유로 가장 적절한 것은?", choices:["한 가지 자원의 부족이나 낭비가 전체 업무 성과에 영향을 줄 수 있기 때문","네 가지 자원은 서로 완전히 무관하기 때문","예산만 충분하면 나머지는 자동으로 해결되기 때문","시간관리만 잘하면 다른 자원은 중요하지 않기 때문"], answer:0, explanation:"네 가지 자원은 서로 연관되어 있어 한 가지 자원의 부족이나 낭비가 전체 업무 성과에 영향을 줄 수 있으므로 균형 있게 관리해야 합니다."},
{category:"자원관리능력", question:"순환보직(직무순환)제도의 목적으로 가장 적절한 것은?", choices:["다양한 직무 경험을 통해 역량을 개발하고 조직 적응력을 높이기 위해","특정 직원에게 동일 업무를 평생 담당하게 하기 위해","인건비를 무조건 절감하기 위해","조직 개편을 어렵게 만들기 위해"], answer:0, explanation:"직무순환은 구성원이 다양한 직무를 경험하도록 하여 역량을 개발하고 조직 전체의 적응력과 유연성을 높이기 위한 인적자원관리 제도입니다."},

{category:"정보능력", question:"엑셀에서 특정 조건을 만족하는 셀들의 합계를 구하는 함수는?", choices:["VLOOKUP","SUMIF","COUNTIF","IFERROR"], answer:1, explanation:"SUMIF는 조건을 만족하는 셀의 합계를 구하는 함수입니다."},
{category:"정보능력", question:"엑셀 함수 =VLOOKUP(A1, B1:D10, 3, FALSE)의 기능으로 옳은 것은?", choices:["A1값을 B1:D10의 첫 열에서 찾아 정확히 일치할 때 3번째 열의 값을 반환","A1값을 3번째 행에서 찾는다","B1:D10의 평균을 구한다","A1이 B1:D10에 있는지 TRUE/FALSE로만 반환"], answer:0, explanation:"VLOOKUP(찾을값, 범위, 반환할 열 번호, 정확히 일치 여부)로, FALSE는 정확히 일치하는 값만 찾으라는 의미입니다."},
{category:"정보능력", question:"다음 시간 단위를 큰 것부터 작은 것 순서로 나열한 것은? (ms, μs, ns, ps)", choices:["ms > μs > ns > ps","ps > ns > μs > ms","ns > ms > ps > μs","μs > ms > ns > ps"], answer:0, explanation:"1ms=10⁻³s, 1μs=10⁻⁶s, 1ns=10⁻⁹s, 1ps=10⁻¹²s이므로 ms>μs>ns>ps 순입니다."},
{category:"정보능력", question:"이진수 1011을 10진수로 변환한 값은?", choices:["9","10","11","12"], answer:2, explanation:"1011₂ = 1×8+0×4+1×2+1×1 = 8+0+2+1 = 11."},
{category:"정보능력", question:"정보보안의 3대 요소가 아닌 것은?", choices:["기밀성(Confidentiality)","무결성(Integrity)","가용성(Availability)","확장성(Scalability)"], answer:3, explanation:"정보보안의 3대 요소는 기밀성, 무결성, 가용성이며 확장성은 이에 해당하지 않습니다."},
{category:"정보능력", question:"엑셀 함수 =IF(B2>=80,\"합격\",\"불합격\")의 의미로 옳은 것은?", choices:["B2가 80 이상이면 합격, 그렇지 않으면 불합격 표시","B2가 80 초과이면 합격","B2와 80이 같으면 합격","B2가 80 이하이면 합격"], answer:0, explanation:"IF(조건, 참일 때 값, 거짓일 때 값) 구조로, B2>=80은 80 이상을 의미합니다."},
{category:"정보능력", question:"IPv4의 주소 표현 방식으로 옳은 것은?", choices:["8비트씩 4개 구간, 총 32비트","16비트씩 8개 구간, 총 128비트","8비트씩 8개 구간","32비트씩 4개 구간"], answer:0, explanation:"IPv4는 8비트씩 4개 구간(옥텟)으로 구성되어 총 32비트입니다. (IPv6는 16비트×8구간, 128비트)"},
{category:"정보능력", question:"컴퓨터 바이러스 예방 및 대응 방법으로 적절하지 않은 것은?", choices:["백신 프로그램을 최신 버전으로 유지한다","출처가 불분명한 이메일 첨부파일은 실행하지 않는다","중요한 자료는 정기적으로 백업한다","무료 소프트웨어는 출처와 상관없이 모두 다운로드하여 사용한다"], answer:3, explanation:"출처가 불분명한 소프트웨어를 무분별하게 다운로드하는 것은 바이러스 감염 위험을 높입니다."},
{category:"정보능력", question:"엑셀에서 여러 조건을 모두 만족하는 셀의 개수를 구하는 함수는?", choices:["COUNT","COUNTA","COUNTIFS","SUMIFS"], answer:2, explanation:"COUNTIFS는 여러 조건을 모두 만족하는 셀의 개수를 구하는 함수입니다."},
{category:"정보능력", question:"데이터베이스에서 기본키(Primary Key)의 특징으로 옳지 않은 것은?", choices:["각 레코드를 고유하게 식별한다","null값을 가질 수 있다","테이블 내에서 중복될 수 없다","하나의 테이블에는 하나의 기본키(또는 복합키 하나의 세트)만 지정할 수 있다"], answer:1, explanation:"기본키는 각 레코드를 고유하게 식별해야 하므로 null값을 가질 수 없습니다."},
{category:"정보능력", question:"클라우드 컴퓨팅 서비스 모델 중 'SaaS'의 예시로 가장 적절한 것은?", choices:["가상 서버 인프라 대여","개발 플랫폼 제공","웹 기반 이메일 및 오피스 프로그램","물리적 데이터센터 임대"], answer:2, explanation:"SaaS(Software as a Service)는 소프트웨어 자체를 서비스로 제공하는 형태로, 웹 기반 오피스·이메일 서비스가 대표적입니다."},
{category:"정보능력", question:"엑셀에서 수식을 다른 셀에 복사해도 참조 위치가 바뀌지 않도록 고정하는 참조 방식은?", choices:["상대참조","절대참조($A$1)","혼합참조","순환참조"], answer:1, explanation:"절대참조는 행과 열 앞에 $를 붙여(예: $A$1) 셀을 복사해도 참조 위치가 고정되도록 합니다."},
{category:"정보능력", question:"다음 코드를 실행한 결과는?\ntotal = 0\nfor i in 1 to 5:\n    total = total + i\nprint(total)", choices:["10","15","20","25"], answer:1, explanation:"1+2+3+4+5=15가 출력됩니다."},
{category:"정보능력", question:"'알고리즘'의 조건으로 적절하지 않은 것은?", choices:["유한한 단계 내에 종료되어야 한다","각 단계는 명확하게 정의되어야 한다","동일한 입력에 대해 실행할 때마다 다른 결과가 나와야 한다","실행 가능해야 한다"], answer:2, explanation:"알고리즘은 동일한 입력에 대해 항상 동일한 결과를 산출해야 하는 명확성을 가져야 합니다."},
{category:"정보능력", question:"정보의 가공 절차를 순서대로 나열한 것은?", choices:["수집 → 기획 → 활용 → 관리","기획 → 수집 → 관리 → 활용","관리 → 기획 → 수집 → 활용","활용 → 관리 → 수집 → 기획"], answer:1, explanation:"정보는 필요성을 기획하고, 이를 바탕으로 수집한 후 관리하고, 최종적으로 활용하는 순서로 처리됩니다."},
{category:"정보능력", question:"엑셀에서 =ROUND(1234.567, 1)의 결과값은?", choices:["1234.5","1234.6","1234.57","1235"], answer:1, explanation:"소수 첫째 자리까지 반올림하면 둘째 자리 숫자 6에 의해 올림되어 1234.6이 됩니다."},
{category:"정보능력", question:"정보검색 시 사용하는 연산자 중 AND 연산자의 기능으로 옳은 것은?", choices:["두 단어 중 하나라도 포함된 문서를 검색","두 단어를 모두 포함한 문서를 검색","특정 단어를 제외한 문서를 검색","정확히 일치하는 문구만 검색"], answer:1, explanation:"AND 연산자는 지정한 두 단어(조건)를 모두 포함하는 문서를 검색합니다."},
{category:"정보능력", question:"개인정보 보호를 위한 행동으로 적절하지 않은 것은?", choices:["비밀번호를 주기적으로 변경한다","공용 컴퓨터 사용 후 로그아웃한다","회원가입 시 비밀번호를 모든 사이트에서 동일하게 사용한다","출처가 불분명한 사이트에 개인정보를 입력하지 않는다"], answer:2, explanation:"여러 사이트에 동일한 비밀번호를 사용하면 하나가 유출될 경우 다른 계정도 위험해집니다."},
{category:"정보능력", question:"엑셀에서 텍스트 문자열을 왼쪽에서부터 지정한 개수만큼 추출하는 함수는?", choices:["RIGHT","MID","LEFT","LEN"], answer:2, explanation:"LEFT 함수는 문자열의 왼쪽에서부터 지정한 개수만큼의 문자를 추출합니다."},
{category:"정보능력", question:"빅데이터의 특징을 나타내는 3V(Volume, Velocity, Variety)에 해당하지 않는 것은?", choices:["Volume(규모)","Velocity(속도)","Variety(다양성)","Value(가치)"], answer:3, explanation:"전통적인 3V는 Volume, Velocity, Variety이며, Value와 Veracity는 이후 4V/5V로 확장되며 추가된 개념입니다."},
{category:"정보능력", question:"셀 A1=10, A2=25, A3=15일 때 =SUM(A1:A3)의 결과는?", choices:["40","45","50","55"], answer:2, explanation:"SUM은 지정한 범위의 합을 구합니다. 10+25+15=50."},
{category:"정보능력", question:"셀 B1=8, B2=12, B3=10, B4=10일 때 =AVERAGE(B1:B4)의 결과는?", choices:["8","9","10","11"], answer:2, explanation:"(8+12+10+10)÷4=40÷4=10."},
{category:"정보능력", question:"셀 C1=7, C2=3, C3=9, C4=5일 때 =MAX(C1:C4)-MIN(C1:C4)의 결과는?", choices:["4","5","6","7"], answer:2, explanation:"최댓값 9에서 최솟값 3을 빼면 6입니다."},
{category:"정보능력", question:"D1=90, D2=75, D3=88, D4=90일 때 =RANK(D1,D1:D4,0)의 결과는?", choices:["1","2","3","4"], answer:0, explanation:"RANK(값,범위,0)은 내림차순 순위를 반환합니다. D1과 D4가 모두 최댓값 90으로 동률이므로 D1의 순위는 1위입니다."},
{category:"정보능력", question:"E1=\"합격\", E2=빈 셀, E3=\"불합격\", E4=90일 때 =COUNTA(E1:E4)의 결과는?", choices:["2","3","4","5"], answer:1, explanation:"COUNTA는 비어있지 않은 셀의 개수를 구합니다. E2만 빈 셀이므로 나머지 3개가 집계됩니다."},
{category:"정보능력", question:"=IFERROR(10/0,\"오류\")의 결과는?", choices:["0","10","오류","#DIV/0!"], answer:2, explanation:"10/0은 오류를 발생시키므로 IFERROR는 지정한 대체값인 \"오류\"를 반환합니다."},
{category:"정보능력", question:"F1=\"농협\", F2=\"은행\"일 때 =CONCATENATE(F1,F2)의 결과는?", choices:["농협","은행","농협은행","은행농협"], answer:2, explanation:"CONCATENATE는 여러 텍스트를 순서대로 결합합니다."},
{category:"정보능력", question:"G1=1234500일 때 =TEXT(G1,\"#,##0\")의 결과로 가장 적절한 것은?", choices:["1234500","1,234,500","1234,500","123,4500"], answer:1, explanation:"\"#,##0\" 서식은 천 단위마다 쉼표를 넣어 표시합니다."},
{category:"정보능력", question:"H1=\"금융감독원\"일 때 =MID(H1,3,2)의 결과는?", choices:["금융","감독","독원","금감"], answer:1, explanation:"금(1)융(2)감(3)독(4)원(5) 중 3번째 글자부터 2글자는 \"감독\"입니다."},
{category:"정보능력", question:"I1=\"데이터분석사\"일 때 =LEFT(I1,3)의 결과는?", choices:["데이터","이터분","분석사","데이"], answer:0, explanation:"왼쪽에서부터 3글자를 추출하면 '데이터'입니다."},
{category:"정보능력", question:"J1=\"스마트뱅킹\"일 때 =RIGHT(J1,3)의 결과는?", choices:["스마트","마트뱅","트뱅킹","뱅킹"], answer:2, explanation:"오른쪽에서부터 3글자를 추출하면 '트뱅킹'입니다."},
{category:"정보능력", question:"수식을 다른 셀에 복사했을 때 열은 고정되고 행만 상대적으로 바뀌는 참조 방식은?", choices:["$A$1","A$1","$A1","A1"], answer:2, explanation:"'$A1'은 열에만 $를 붙인 혼합참조로, 복사 시 열(A)은 고정되고 행 번호만 상대적으로 바뀝니다."},
{category:"정보능력", question:"VLOOKUP 사용 시 찾을 값이 항상 있어야 하는 위치는?", choices:["범위의 마지막 열","범위의 첫 번째 열","범위의 중간 열","아무 위치나 가능"], answer:1, explanation:"VLOOKUP은 지정한 범위의 첫 번째 열에서 찾을 값을 검색합니다."},
{category:"정보능력", question:"HLOOKUP 사용 시 찾을 값이 항상 있어야 하는 위치는?", choices:["범위의 첫 번째 행","범위의 마지막 행","범위의 첫 번째 열","범위의 마지막 열"], answer:0, explanation:"HLOOKUP은 지정한 범위의 첫 번째 행에서 찾을 값을 검색합니다."},
{category:"정보능력", question:"대량의 데이터를 항목별로 요약하여 합계·평균 등을 빠르게 집계·분석하는 엑셀 기능은?", choices:["매크로","피벗테이블","시나리오 관리자","목표값 찾기"], answer:1, explanation:"피벗테이블은 데이터를 항목별로 재구성하여 요약·집계·분석하는 기능입니다."},
{category:"정보능력", question:"특정 조건을 만족하는 셀에 자동으로 배경색이나 글꼴 서식을 적용하는 기능은?", choices:["조건부 서식","데이터 유효성 검사","이름 정의","틀 고정"], answer:0, explanation:"조건부 서식은 지정한 조건을 만족하는 셀에 자동으로 서식을 적용하는 기능입니다."},
{category:"정보능력", question:"셀에 입력 가능한 값의 종류나 범위를 미리 제한하여 잘못된 데이터 입력을 막는 기능은?", choices:["조건부 서식","데이터 유효성 검사","시트 보호","매크로"], answer:1, explanation:"데이터 유효성 검사는 셀에 입력할 수 있는 데이터의 종류나 범위를 제한하는 기능입니다."},
{category:"정보능력", question:"K1=5, K2=3일 때 =AND(K1>0,K2>0)의 결과는?", choices:["TRUE","FALSE","0","오류"], answer:0, explanation:"AND 함수는 모든 조건이 참일 때만 TRUE를 반환합니다. K1>0, K2>0 모두 참이므로 TRUE입니다."},
{category:"정보능력", question:"L1=-5, L2=3일 때 =OR(L1>0,L2>0)의 결과는?", choices:["TRUE","FALSE","0","오류"], answer:0, explanation:"OR 함수는 하나라도 조건이 참이면 TRUE를 반환합니다. L2>0이 참이므로 TRUE입니다."},
{category:"정보능력", question:"=MOD(17,5)의 결과는?", choices:["1","2","3","4"], answer:1, explanation:"17을 5로 나누면 3이 몫이고 나머지가 2입니다(17=3×5+2). MOD는 나머지를 반환합니다."},
{category:"정보능력", question:"=INT(9.6)의 결과는?", choices:["8","9","10","9.6"], answer:1, explanation:"INT는 소수 부분을 버리고 그보다 작거나 같은 최대 정수를 반환하므로 9입니다."},
{category:"정보능력", question:"범위 M1:M5에 값 {12,45,7,45,30}이 있을 때 =LARGE(M1:M5,2)의 결과는?", choices:["30","45","12","7"], answer:1, explanation:"큰 값부터 나열하면 45,45,30,12,7이므로 2번째로 큰 값도 45입니다."},
{category:"정보능력", question:"N1=\" 농협은행 \"(앞뒤에 공백 포함)일 때 =TRIM(N1)의 결과로 가장 적절한 것은?", choices:["농협은행 (양쪽 공백 그대로)","농협은행 (양쪽 공백 제거)","농협 은행 (중간에 공백 추가)","농협은행 (뒤쪽 공백만 제거)"], answer:1, explanation:"TRIM은 텍스트 양쪽 끝의 불필요한 공백을 제거합니다."},
{category:"정보능력", question:"=LEN(\"NH농협은행\")의 결과는?", choices:["4","5","6","7"], answer:2, explanation:"\"NH농협은행\"은 N,H,농,협,은,행으로 총 6글자입니다."},
{category:"정보능력", question:"특정 값이 범위 내에서 몇 번째 위치(행 또는 열 번호)에 있는지 반환하는 함수는?", choices:["MATCH","INDEX","VLOOKUP","RANK"], answer:0, explanation:"MATCH(찾을값, 범위, 옵션)는 값이 범위 내에서 몇 번째 위치에 있는지를 반환합니다."},
{category:"정보능력", question:"INDEX(범위, MATCH(찾을값, 범위, 0))의 조합을 사용하는 주된 이유로 가장 적절한 것은?", choices:["단순 합계를 구하기 위해","VLOOKUP과 달리 찾을 열이 반환할 열의 오른쪽에 있어도 검색 가능하기 때문","텍스트 서식을 바꾸기 위해","그래프를 그리기 위해"], answer:1, explanation:"INDEX와 MATCH를 조합하면 VLOOKUP처럼 왼쪽 열만 검색해야 하는 제약 없이 유연하게 값을 찾을 수 있습니다."},
{category:"정보능력", question:"필터링(숨김)된 행을 제외하고 화면에 보이는 셀만 집계할 수 있는 함수는?", choices:["SUM","SUBTOTAL","COUNT","AVERAGE"], answer:1, explanation:"SUBTOTAL은 옵션에 따라 숨겨진(필터링된) 행을 제외하고 집계할 수 있습니다."},
{category:"정보능력", question:"화면을 아래로 스크롤해도 제목 행이 항상 보이도록 고정하는 기능은?", choices:["창 나누기","틀 고정","인쇄 영역 설정","시트 숨기기"], answer:1, explanation:"틀 고정은 스크롤 시에도 지정한 행이나 열이 화면에 항상 보이도록 고정하는 기능입니다."},
{category:"정보능력", question:"십진수 25를 이진수로 변환하면?", choices:["10111","11001","11010","10011"], answer:1, explanation:"25=16+8+1=2⁴+2³+2⁰ 이므로 이진수로 11001입니다."},
{category:"정보능력", question:"이진수 1101을 십진수로 변환하면?", choices:["11","12","13","14"], answer:2, explanation:"1101₂=8+4+0+1=13."},
{category:"정보능력", question:"십진수 100을 16진수로 변환하면?", choices:["5A","64","6A","46"], answer:1, explanation:"100=6×16+4이므로 16진수로 64입니다."},
{category:"정보능력", question:"8진수 17을 10진수로 변환하면?", choices:["13","14","15","16"], answer:2, explanation:"8진수 17=1×8+7=15."},
{category:"정보능력", question:"16진수 2F를 10진수로 변환하면?", choices:["45","46","47","48"], answer:2, explanation:"16진수 2F=2×16+15=47."},
{category:"정보능력", question:"1바이트(Byte)는 몇 비트(bit)로 구성되는가?", choices:["4비트","8비트","16비트","32비트"], answer:1, explanation:"1바이트는 8비트로 구성됩니다."},
{category:"정보능력", question:"저장장치 용량 단위를 작은 것부터 큰 순서로 나열한 것은?", choices:["KB<MB<GB<TB","MB<KB<TB<GB","GB<TB<KB<MB","TB<GB<MB<KB"], answer:0, explanation:"용량 단위는 KB<MB<GB<TB 순으로 커집니다."},
{category:"정보능력", question:"1GB는 몇 MB인가?", choices:["512MB","1000MB","1024MB","2048MB"], answer:2, explanation:"정보량 단위는 1024(2¹⁰)를 기준으로 하므로 1GB=1024MB입니다."},
{category:"정보능력", question:"다음 중 저장장치가 아닌 것은?", choices:["SSD","HDD","USB메모리","CPU"], answer:3, explanation:"CPU는 연산을 처리하는 중앙처리장치로, 데이터를 저장하는 장치가 아닙니다."},
{category:"정보능력", question:"LAN(Local Area Network)에 대한 설명으로 가장 적절한 것은?", choices:["전세계를 연결하는 통신망","한정된 공간(사무실, 건물 등) 내부의 통신망","위성을 이용한 통신망","전화선만을 이용하는 통신망"], answer:1, explanation:"LAN은 사무실이나 건물처럼 한정된 공간 내부를 연결하는 근거리 통신망입니다."},
{category:"정보능력", question:"인터넷에서 도메인 이름을 숫자로 이루어진 IP주소로 변환해주는 시스템은?", choices:["DNS","HTTP","FTP","DHCP"], answer:0, explanation:"DNS(Domain Name System)는 도메인 이름을 IP주소로 변환해주는 시스템입니다."},
{category:"정보능력", question:"웹 브라우저와 웹 서버 간에 하이퍼텍스트 문서를 전송하기 위한 프로토콜은?", choices:["FTP","SMTP","HTTP","TCP"], answer:2, explanation:"HTTP는 웹에서 하이퍼텍스트 문서를 주고받기 위한 통신 프로토콜입니다."},
{category:"정보능력", question:"서로 다른 네트워크를 연결하고 최적의 경로로 데이터를 전달하는 네트워크 장비는?", choices:["허브","라우터","리피터","모니터"], answer:1, explanation:"라우터는 서로 다른 네트워크를 연결하며 데이터의 전송 경로를 결정하는 장비입니다."},
{category:"정보능력", question:"인터넷을 통해 데이터가 암호화되어 안전하게 전송됨을 나타내는 프로토콜은?", choices:["HTTP","HTTPS","FTP","Telnet"], answer:1, explanation:"HTTPS는 HTTP에 암호화(SSL/TLS)를 추가하여 데이터를 안전하게 전송하는 프로토콜입니다."},
{category:"정보능력", question:"방화벽(Firewall)의 주된 기능으로 가장 적절한 것은?", choices:["네트워크 속도를 높이는 장치","내부 네트워크와 외부 네트워크 사이에서 비인가 접근을 차단하는 보안 장치","파일을 압축하는 장치","화면 해상도를 높이는 장치"], answer:1, explanation:"방화벽은 내부·외부 네트워크 사이에서 비인가된 접근을 탐지·차단하는 보안 장치입니다."},
{category:"정보능력", question:"정보를 제3자가 알아볼 수 없도록 특정한 규칙에 따라 변환하는 기술은?", choices:["암호화","압축","백업","포맷"], answer:0, explanation:"암호화는 정보를 특정 규칙(키)에 따라 제3자가 알아볼 수 없는 형태로 변환하는 기술입니다."},
{category:"정보능력", question:"암호화할 때와 복호화할 때 서로 다른 키(공개키·개인키)를 사용하는 암호화 방식은?", choices:["대칭키 암호화","비대칭키(공개키) 암호화","해시 암호화","단방향 암호화"], answer:1, explanation:"비대칭키 암호화는 암호화와 복호화에 서로 다른 키(공개키와 개인키)를 사용합니다."},
{category:"정보능력", question:"로그인 시 아이디·비밀번호 외에 문자메시지 인증번호 등을 추가로 요구하는 보안 방식은?", choices:["단일 인증","2단계 인증(다중 인증)","공인인증서 폐지","방화벽 인증"], answer:1, explanation:"2단계 인증은 비밀번호 외에 추가 인증 수단을 요구하여 보안을 강화하는 방식입니다."},
{category:"정보능력", question:"정상 프로그램으로 위장하여 사용자 정보를 몰래 유출하는 악성코드는?", choices:["트로이 목마","방화벽","백신","쿠키"], answer:0, explanation:"트로이 목마는 정상 프로그램으로 위장해 시스템에 침투하여 정보를 유출하거나 피해를 주는 악성코드입니다."},
{category:"정보능력", question:"사용자를 속여 은행이나 기관을 사칭한 가짜 웹사이트로 유도해 개인정보를 탈취하는 공격 기법은?", choices:["피싱(Phishing)","방화벽","백업","포맷"], answer:0, explanation:"피싱은 신뢰할 수 있는 기관을 사칭하여 개인정보나 금융정보를 탈취하는 사회공학적 공격 기법입니다."},
{category:"정보능력", question:"데이터의 무결성을 확인하기 위해 원본 데이터로부터 고정된 길이의 값을 생성하는 함수는?", choices:["해시 함수","압축 함수","암호화 키","방화벽"], answer:0, explanation:"해시 함수는 데이터로부터 고정된 길이의 값을 생성하여 데이터의 위변조 여부를 확인하는 데 사용됩니다."},
{category:"정보능력", question:"데이터베이스에서 데이터 중복을 최소화하고 무결성을 높이기 위해 테이블을 구조화하는 과정은?", choices:["정규화","암호화","백업","인덱싱"], answer:0, explanation:"정규화는 데이터 중복을 줄이고 무결성을 높이기 위해 테이블 구조를 체계적으로 설계하는 과정입니다."},
{category:"정보능력", question:"관계형 데이터베이스에서 다른 테이블의 기본키를 참조하는 값은?", choices:["기본키(Primary Key)","외래키(Foreign Key)","후보키","대체키"], answer:1, explanation:"외래키는 다른 테이블의 기본키를 참조하여 테이블 간 관계를 형성하는 값입니다."},
{category:"정보능력", question:"SQL에서 테이블의 데이터를 조회할 때 사용하는 기본 명령어는?", choices:["SELECT","INSERT","DELETE","UPDATE"], answer:0, explanation:"SELECT문은 테이블에서 원하는 데이터를 조회하는 데 사용하는 기본 SQL 명령어입니다."},
{category:"정보능력", question:"누구나 무료로 사용할 수 있지만 소스코드는 공개되지 않는 소프트웨어는?", choices:["프리웨어(Freeware)","오픈소스 소프트웨어","상용 소프트웨어","컴파일러"], answer:0, explanation:"프리웨어는 무료로 사용할 수 있으나 소스코드가 공개되지 않는 소프트웨어이며, 오픈소스는 소스코드까지 공개됩니다."},
{category:"정보능력", question:"클라우드 컴퓨팅에서 개발자가 애플리케이션을 개발할 수 있는 플랫폼(운영체제, 실행환경 등)을 서비스로 제공하는 모델은?", choices:["IaaS","PaaS","SaaS","DaaS"], answer:1, explanation:"PaaS(Platform as a Service)는 애플리케이션 개발에 필요한 플랫폼 환경을 서비스로 제공하는 모델입니다."},
{category:"정보능력", question:"클라우드 컴퓨팅에서 서버, 스토리지 등 하드웨어 인프라 자체를 서비스로 제공하는 모델은?", choices:["IaaS","PaaS","SaaS","FaaS"], answer:0, explanation:"IaaS(Infrastructure as a Service)는 서버·스토리지 등 하드웨어 인프라를 서비스로 제공하는 모델입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ntotal = 0\nfor i in 1 to 10:\n    total = total + i\nprint(total)", choices:["45","50","55","60"], answer:2, explanation:"1부터 10까지의 합은 55입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nx = 5\ny = 3\nif x > y:\n    print(\"A\")\nelse:\n    print(\"B\")", choices:["A","B","오류","x"], answer:0, explanation:"x(5)가 y(3)보다 크므로 조건이 참이 되어 \"A\"가 출력됩니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ncount = 0\nfor i in 1 to 20:\n    if i % 3 == 0:\n        count = count + 1\nprint(count)", choices:["5","6","7","8"], answer:1, explanation:"1~20 중 3의 배수는 3,6,9,12,15,18로 총 6개입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nresult = 1\nfor i in 1 to 4:\n    result = result * i\nprint(result)", choices:["6","12","24","120"], answer:2, explanation:"result=1×1×2×3×4=24 (4의 계승, 4!)."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\na = 10\nb = 4\nprint(a // b)", choices:["1","2","2.5","3"], answer:1, explanation:"//는 나눗셈의 몫만 취하는 연산자로, 10÷4의 몫은 2입니다."},
{category:"정보능력", question:"순서도(플로우차트)에서 '마름모' 도형이 일반적으로 나타내는 것은?", choices:["시작과 종료","처리 과정","조건 판단(분기)","데이터 입출력"], answer:2, explanation:"마름모 도형은 조건을 판단하여 흐름을 분기하는 지점을 나타냅니다."},
{category:"정보능력", question:"순서도에서 타원형으로 그려지는 '단말(터미널) 기호'가 나타내는 것은?", choices:["조건 판단","처리 과정","시작과 종료","데이터 입출력"], answer:2, explanation:"타원형 단말 기호는 알고리즘의 시작과 종료 지점을 나타냅니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ntotal = 0\ni = 1\nwhile i <= 5:\n    total = total + i\n    i = i + 1\nprint(total)", choices:["10","15","20","25"], answer:1, explanation:"i가 1부터 5까지 반복되며 total에 1+2+3+4+5=15가 누적됩니다."},
{category:"정보능력", question:"정렬 알고리즘 중 인접한 두 값을 비교하여 큰 값을 뒤로 보내는 과정을 반복하는 방식은?", choices:["버블 정렬","이진 탐색","해시 탐색","재귀 호출"], answer:0, explanation:"버블 정렬은 인접한 두 원소를 비교하여 큰 값을 뒤로 이동시키는 과정을 반복하는 정렬 방식입니다."},
{category:"정보능력", question:"정렬된 데이터에서 중간값과 비교하여 탐색 범위를 절반씩 줄여가며 원하는 값을 찾는 방법은?", choices:["선형 탐색","이진 탐색","버블 탐색","순차 탐색"], answer:1, explanation:"이진 탐색은 정렬된 데이터의 중간값과 비교해 탐색 범위를 절반씩 줄여가는 방법으로, 선형 탐색보다 효율적입니다."},
{category:"정보능력", question:"함수가 자기 자신을 다시 호출하는 프로그래밍 기법은?", choices:["반복문","재귀 호출","조건문","예외 처리"], answer:1, explanation:"재귀 호출은 함수 내부에서 자기 자신을 다시 호출하는 기법입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nn = 7\nif n % 2 == 0:\n    print(\"짝수\")\nelse:\n    print(\"홀수\")", choices:["짝수","홀수","0","1"], answer:1, explanation:"7을 2로 나눈 나머지가 1이므로 짝수 조건이 거짓이 되어 \"홀수\"가 출력됩니다."},
{category:"정보능력", question:"정보 검색 연산자 중 OR 연산자의 기능으로 옳은 것은?", choices:["두 단어를 모두 포함한 문서만 검색","두 단어 중 하나라도 포함된 문서를 검색","특정 단어를 제외한 문서를 검색","정확한 문구만 검색"], answer:1, explanation:"OR 연산자는 지정한 단어 중 하나라도 포함된 문서를 검색합니다."},
{category:"정보능력", question:"특정 단어를 검색 결과에서 제외하고자 할 때 사용하는 연산자는?", choices:["AND","OR","NOT","근접연산자"], answer:2, explanation:"NOT 연산자는 지정한 단어를 포함한 문서를 검색 결과에서 제외합니다."},
{category:"정보능력", question:"검색어를 큰따옴표(\" \")로 묶어 검색할 때 얻는 효과로 가장 적절한 것은?", choices:["입력한 단어들이 포함된 문서를 무작위로 검색","입력한 문구를 정확히 그 순서대로 포함한 문서를 검색","모든 검색결과를 제외","검색 속도만 빠르게 함"], answer:1, explanation:"큰따옴표로 묶은 검색어는 정확히 일치하는 문구를 포함한 문서를 검색하는 데 사용됩니다."},
{category:"정보능력", question:"검색어의 일부를 대체하여 여러 형태의 단어를 한 번에 검색할 수 있게 하는 기호(예: *)를 부르는 용어는?", choices:["와일드카드","해시태그","메타데이터","URL"], answer:0, explanation:"와일드카드는 특정 문자나 문자열을 대체하여 다양한 형태의 검색어를 한 번에 검색할 수 있게 하는 기호입니다."},
{category:"정보능력", question:"정보검색 시 검색 결과의 신뢰성을 판단하기 위해 가장 먼저 확인해야 할 사항으로 적절한 것은?", choices:["검색 결과의 개수","정보의 출처와 작성자의 신뢰성","글자 크기","광고 포함 여부"], answer:1, explanation:"정보의 신뢰성을 판단하려면 정보의 출처와 작성자(기관)의 신뢰성을 우선 확인해야 합니다."},
{category:"정보능력", question:"개인정보 중 이름, 주민등록번호 등을 다른 값으로 변환하여 특정 개인을 알아볼 수 없게 하는 기법은?", choices:["가명처리(비식별화)","암호화 해제","원본 그대로 보관","전체 공개"], answer:0, explanation:"가명처리(비식별화)는 개인정보의 일부를 변환하여 특정 개인을 알아볼 수 없도록 하는 기법입니다."},
{category:"정보능력", question:"다음 중 개인정보 유출 위험을 높이는 행동은?", choices:["출처가 불분명한 링크 클릭 자제","정기적인 비밀번호 변경","공공 와이파이에서 금융정보 입력","백신 프로그램 사용"], answer:2, explanation:"보안이 취약한 공공 와이파이에서 금융정보 등을 입력하면 정보가 유출될 위험이 커집니다."},
{category:"정보능력", question:"개인정보 최소 수집의 원칙으로 가장 적절한 것은?", choices:["서비스 제공에 필요한 최소한의 개인정보만 수집한다","가능한 모든 개인정보를 수집한다","수집 목적과 무관한 정보도 함께 수집한다","개인정보는 무제한 보관한다"], answer:0, explanation:"개인정보 최소 수집의 원칙은 서비스 제공에 필요한 최소한의 정보만 수집해야 한다는 원칙입니다."},
{category:"정보능력", question:"다음 중 개인정보 보호를 위한 올바른 행동은?", choices:["비밀번호를 생일 등 추측하기 쉬운 숫자로 설정","공용 PC에 로그인 정보를 저장","중요 계정에 2단계 인증을 설정","비밀번호를 메모지에 적어 모니터에 붙여둠"], answer:2, explanation:"2단계 인증을 설정하면 비밀번호가 유출되어도 추가 인증 없이는 로그인할 수 없어 보안이 강화됩니다."},
{category:"정보능력", question:"빅데이터의 특징 중 사진, 영상, SNS 텍스트 등 형태가 다양한 데이터를 포함한다는 특징을 가리키는 용어는?", choices:["Volume","Velocity","Variety","Value"], answer:2, explanation:"Variety(다양성)는 정형 데이터뿐 아니라 이미지, 영상, 텍스트 등 다양한 형태의 데이터를 포함한다는 특징입니다."},
{category:"정보능력", question:"정해진 구조(행과 열)로 정리되어 있지 않은 이미지, 동영상, 텍스트 등의 데이터를 가리키는 용어는?", choices:["정형 데이터","반정형 데이터","비정형 데이터","메타데이터"], answer:2, explanation:"비정형 데이터는 고정된 행과 열 구조로 정리되지 않은 이미지, 동영상, 텍스트 등의 데이터를 의미합니다."},
{category:"정보능력", question:"인공지능의 한 분야로, 컴퓨터가 대량의 데이터를 학습하여 스스로 규칙이나 패턴을 찾아내는 기술은?", choices:["머신러닝(기계학습)","방화벽","데이터베이스","네트워크"], answer:0, explanation:"머신러닝은 컴퓨터가 데이터를 학습하여 스스로 규칙이나 패턴을 찾아내는 인공지능 기술입니다."},
{category:"정보능력", question:"대량의 데이터에서 유의미한 패턴이나 규칙을 찾아내는 과정을 가리키는 용어는?", choices:["데이터 마이닝","데이터 삭제","데이터 암호화","데이터 백업"], answer:0, explanation:"데이터 마이닝은 대량의 데이터에서 유의미한 패턴이나 규칙을 발견해내는 과정입니다."},
{category:"정보능력", question:"다음과 같이 지점별 매출 데이터가 있다. A1:A5=\"서울\",\"부산\",\"서울\",\"대구\",\"서울\", B1:B5=100,200,150,300,250(만원)일 때 =SUMIF(A1:A5,\"서울\",B1:B5)의 결과는?", choices:["350","400","500","550"], answer:2, explanation:"서울인 행은 A1,A3,A5이며 해당 매출은 100+150+250=500(만원)입니다."},
{category:"정보능력", question:"C1:C6에 5,12,8,20,12,7이 입력되어 있을 때 =COUNTIF(C1:C6,\">10\")의 결과는?", choices:["2","3","4","5"], answer:1, explanation:"10보다 큰 값은 12, 20, 12로 총 3개입니다."},
{category:"정보능력", question:"A1:A5(부서)=\"영업\",\"영업\",\"총무\",\"영업\",\"총무\", B1:B5(등급)=\"A\",\"B\",\"A\",\"A\",\"B\", C1:C5(금액)=100,200,150,300,250일 때 =SUMIFS(C1:C5,A1:A5,\"영업\",B1:B5,\"A\")의 결과는?", choices:["100","300","400","450"], answer:2, explanation:"부서가 \"영업\"이면서 등급이 \"A\"인 행은 1행(100)과 4행(300)이며 합은 400입니다."},
{category:"정보능력", question:"D1:D5=80,100,60,40,90, E1:E5=\"합격\",\"합격\",\"불합격\",\"불합격\",\"합격\"일 때 =AVERAGEIF(E1:E5,\"합격\",D1:D5)의 결과는?", choices:["80","85","90","95"], answer:2, explanation:"\"합격\"에 해당하는 D값은 80,100,90이며 평균은 (80+100+90)/3=90입니다."},
{category:"정보능력", question:"A1=85일 때 =IF(A1>=90,\"A\",IF(A1>=80,\"B\",\"C\"))의 결과는?", choices:["A","B","C","오류"], answer:1, explanation:"85는 90 이상이 아니므로 다음 조건을 확인하며, 80 이상이므로 \"B\"가 반환됩니다."},
{category:"정보능력", question:"A1:B5에 직원명단이 있고 \"홍길동\"이 목록에 없을 때 =IFERROR(VLOOKUP(\"홍길동\",A1:B5,2,FALSE),\"없음\")의 결과로 옳은 것은?", choices:["#N/A 오류가 그대로 표시된다","0이 표시된다","\"없음\"이 표시된다","공백이 표시된다"], answer:2, explanation:"VLOOKUP이 찾는 값을 찾지 못해 오류(#N/A)가 발생하면 IFERROR는 지정한 대체값 \"없음\"을 반환합니다."},
{category:"정보능력", question:"A1:A4=\"김\",\"이\",\"박\",\"최\", B1:B4=70,85,90,60일 때 =INDEX(B1:B4,MATCH(\"박\",A1:A4,0))의 결과는?", choices:["70","85","90","60"], answer:2, explanation:"MATCH(\"박\",A1:A4,0)은 3을 반환하고, INDEX(B1:B4,3)은 3번째 값인 90을 반환합니다."},
{category:"정보능력", question:"A1:A5 중 A2와 A4가 빈 셀일 때 =COUNTBLANK(A1:A5)의 결과는?", choices:["1","2","3","4"], answer:1, explanation:"COUNTBLANK는 범위 내 빈 셀의 개수를 반환하며, 빈 셀은 A2, A4 총 2개입니다."},
{category:"정보능력", question:"A1:A3=2,3,4, B1:B3=5,6,7일 때 =SUMPRODUCT(A1:A3,B1:B3)의 결과는?", choices:["19","46","56","65"], answer:2, explanation:"대응하는 값끼리 곱한 후 합산하므로 2×5+3×6+4×7=10+18+28=56입니다."},
{category:"정보능력", question:"=CHOOSE(2,\"A\",\"B\",\"C\",\"D\")의 결과는?", choices:["A","B","C","D"], answer:1, explanation:"CHOOSE(인덱스, 값1, 값2, …)는 인덱스 번째 값을 반환하므로 2번째 값인 \"B\"가 반환됩니다."},
{category:"정보능력", question:"엑셀 함수 =TODAY()에 대한 설명으로 옳은 것은?", choices:["인수를 입력해야만 작동한다","현재 날짜만 반환하며 파일을 열 때마다 자동으로 갱신된다","현재 시각만 반환한다","항상 고정된 날짜를 반환한다"], answer:1, explanation:"TODAY() 함수는 인수 없이 시스템의 현재 날짜만 반환하며, 파일이 열리거나 재계산될 때마다 자동으로 갱신됩니다."},
{category:"정보능력", question:"=MONTH(\"2024-11-23\")의 결과는?", choices:["11","23","2024","12"], answer:0, explanation:"MONTH 함수는 날짜에서 월(月)에 해당하는 값을 반환하므로 11입니다."},
{category:"정보능력", question:"=PROPER(\"hello world\")의 결과는?", choices:["HELLO WORLD","hello world","Hello World","Hello world"], answer:2, explanation:"PROPER 함수는 각 단어의 첫 글자만 대문자로 변환하므로 \"Hello World\"가 됩니다."},
{category:"정보능력", question:"=UPPER(\"nh bank\")의 결과는?", choices:["Nh Bank","NH BANK","nh bank","NH bank"], answer:1, explanation:"UPPER 함수는 텍스트의 모든 문자를 대문자로 변환합니다."},
{category:"정보능력", question:"=SUBSTITUTE(\"2024-01-01\",\"-\",\"/\")의 결과는?", choices:["2024/01/01","2024-01-01","2024.01.01","20240101"], answer:0, explanation:"SUBSTITUTE 함수는 지정한 문자를 다른 문자로 치환하므로 \"-\"를 \"/\"로 바꾼 \"2024/01/01\"이 반환됩니다."},
{category:"정보능력", question:"=FIND(\"협\",\"NH농협은행\")의 결과는?", choices:["3","4","5","6"], answer:1, explanation:"NH농협은행에서 왼쪽부터 세면 협은 4번째 글자이므로 FIND는 4를 반환합니다."},
{category:"정보능력", question:"=REPT(\"*\",3)의 결과는?", choices:["*","**","***","****"], answer:2, explanation:"REPT 함수는 지정한 텍스트를 지정한 횟수만큼 반복하므로 \"*\"가 3번 반복된 \"***\"가 반환됩니다."},
{category:"정보능력", question:"=TRUNC(-9.7)의 결과는?", choices:["-10","-9","9","10"], answer:1, explanation:"TRUNC는 소수점 이하를 버리고 정수 부분만 남기므로(0 방향으로 절삭) -9.7은 -9가 됩니다. (INT였다면 -10이 됩니다.)"},
{category:"정보능력", question:"=CEILING(12.3,5)의 결과는?", choices:["10","12","15","20"], answer:2, explanation:"CEILING은 지정한 배수 단위로 올림하므로 12.3보다 크거나 같은 5의 배수인 15가 반환됩니다."},
{category:"정보능력", question:"=FLOOR(12.3,5)의 결과는?", choices:["5","10","12","15"], answer:1, explanation:"FLOOR는 지정한 배수 단위로 내림하므로 12.3보다 작거나 같은 5의 배수인 10이 반환됩니다."},
{category:"정보능력", question:"엑셀 함수 TODAY()와 NOW()의 차이점으로 옳은 것은?", choices:["TODAY()는 날짜와 시각을, NOW()는 날짜만 반환한다","TODAY()는 날짜만, NOW()는 날짜와 시각을 함께 반환한다","두 함수 모두 시각만 반환한다","두 함수는 완전히 동일하다"], answer:1, explanation:"TODAY()는 현재 날짜만 반환하고, NOW()는 현재 날짜와 시각을 함께 반환합니다."},
{category:"정보능력", question:"=ISNUMBER(\"100\")의 결과는?", choices:["TRUE","FALSE","100","오류"], answer:1, explanation:"큰따옴표로 묶인 \"100\"은 텍스트 형식이므로 ISNUMBER는 FALSE를 반환합니다."},
{category:"정보능력", question:"A1 셀에 수식 =B1+C1이 입력되어 있다. A1을 복사하여 A2에 붙여넣으면 어떤 수식이 되는가? (참조는 모두 상대참조)", choices:["=B1+C1","=B2+C2","=A1+A1","=B1+C2"], answer:1, explanation:"상대참조는 셀을 복사한 위치에 맞춰 참조가 자동으로 이동하므로 한 행 아래로 복사하면 =B2+C2가 됩니다."},
{category:"정보능력", question:"D1=90, D2=75, D3=88, D4=95일 때 =RANK(D1,D1:D4,1)의 결과는? (오름차순 옵션)", choices:["1","2","3","4"], answer:2, explanation:"오름차순으로 정렬하면 75,88,90,95이며 90(D1)은 3번째이므로 순위는 3입니다."},
{category:"정보능력", question:"A1:A5(등급)=\"A\",\"B\",\"A\",\"A\",\"B\", B1:B5(합격여부)=\"Y\",\"Y\",\"N\",\"Y\",\"N\"일 때 =COUNTIFS(A1:A5,\"A\",B1:B5,\"Y\")의 결과는?", choices:["1","2","3","4"], answer:1, explanation:"등급이 \"A\"이면서 합격여부가 \"Y\"인 행은 1행과 4행으로 총 2개입니다."},
{category:"정보능력", question:"VLOOKUP의 네 번째 인수를 생략하거나 TRUE로 지정했을 때(근사값 일치)에 대한 설명으로 옳은 것은? (단, 첫 번째 열은 오름차순 정렬되어 있음)", choices:["찾을 값과 정확히 일치하는 값만 반환한다","찾을 값보다 작거나 같은 값 중 가장 큰 값을 기준으로 찾는다","항상 오류를 반환한다","첫 번째 열이 아닌 마지막 열에서 값을 찾는다"], answer:1, explanation:"근사값 일치(TRUE)는 정렬된 첫 번째 열에서 찾을 값보다 작거나 같은 값 중 가장 큰 값을 기준으로 결과를 반환합니다."},
{category:"정보능력", question:"최근 엑셀 버전에서 VLOOKUP과 HLOOKUP의 단점(왼쪽/위쪽 열 검색 제한 등)을 보완하기 위해 도입된, 가로/세로 검색이 모두 가능한 함수는?", choices:["XLOOKUP","SUMPRODUCT","OFFSET","INDIRECT"], answer:0, explanation:"XLOOKUP은 검색 방향에 제약 없이 가로·세로 검색이 모두 가능하며 VLOOKUP·HLOOKUP의 단점을 보완한 함수입니다."},
{category:"정보능력", question:"한 셀에 \"홍길동,서울,과장\"처럼 쉼표로 구분된 데이터를 여러 셀(열)로 분리할 때 사용하는 엑셀 기능은?", choices:["텍스트 나누기","조건부 서식","데이터 유효성 검사","피벗테이블"], answer:0, explanation:"텍스트 나누기(텍스트 마법사) 기능은 구분 기호(쉼표, 공백 등)를 기준으로 한 셀의 데이터를 여러 열로 분리합니다."},
{category:"정보능력", question:"수식의 결과값은 정해져 있지만 그 결과를 만들어내는 입력값을 모를 때, 목표로 하는 결과값을 입력하면 필요한 입력값을 역으로 계산해주는 엑셀 기능은?", choices:["목표값 찾기","시나리오 관리자","데이터 표","피벗테이블"], answer:0, explanation:"목표값 찾기(Goal Seek)는 원하는 수식 결과를 지정하면 그 결과를 만들어내는 입력값을 자동으로 계산해주는 기능입니다."},
{category:"정보능력", question:"셀 또는 셀 범위에 \"매출액\"과 같은 의미 있는 이름을 붙여 수식에서 셀 주소 대신 사용할 수 있게 하는 기능은?", choices:["이름 정의","조건부 서식","매크로","시트 보호"], answer:0, explanation:"이름 정의 기능을 사용하면 셀이나 범위에 이름을 지정하여 수식에서 셀 주소 대신 해당 이름으로 참조할 수 있습니다."},
{category:"정보능력", question:"십진수 37을 이진수로 변환하면?", choices:["100101","100110","101001","110010"], answer:0, explanation:"37=32+4+1=2⁵+2²+2⁰이므로 이진수로 100101입니다."},
{category:"정보능력", question:"십진수 50을 이진수로 변환하면?", choices:["101010","110010","110100","111000"], answer:1, explanation:"50=32+16+2=2⁵+2⁴+2¹이므로 이진수로 110010입니다."},
{category:"정보능력", question:"이진수 11010을 십진수로 변환하면?", choices:["24","26","28","30"], answer:1, explanation:"11010₂=16+8+0+2+0=26."},
{category:"정보능력", question:"이진수 100001을 십진수로 변환하면?", choices:["31","32","33","34"], answer:2, explanation:"100001₂=32+0+0+0+0+1=33."},
{category:"정보능력", question:"십진수 200을 16진수로 변환하면?", choices:["B8","C8","D8","C4"], answer:1, explanation:"200=12×16+8이며 12는 16진수로 C이므로 결과는 C8입니다."},
{category:"정보능력", question:"16진수 3E를 10진수로 변환하면?", choices:["58","60","62","64"], answer:2, explanation:"3E=3×16+14=48+14=62."},
{category:"정보능력", question:"16진수 7B를 10진수로 변환하면?", choices:["121","122","123","124"], answer:2, explanation:"7B=7×16+11=112+11=123."},
{category:"정보능력", question:"8진수 24를 10진수로 변환하면?", choices:["18","20","22","24"], answer:1, explanation:"8진수 24=2×8+4=20."},
{category:"정보능력", question:"8진수 55를 10진수로 변환하면?", choices:["43","45","47","49"], answer:1, explanation:"8진수 55=5×8+5=45."},
{category:"정보능력", question:"십진수 65를 8진수로 변환하면?", choices:["100","101","110","111"], answer:1, explanation:"65=1×64+0×8+1×1이므로 8진수로 101입니다."},
{category:"정보능력", question:"이진수 1111을 16진수로 변환하면?", choices:["D","E","F","10"], answer:2, explanation:"이진수 4자리는 16진수 1자리에 대응하며, 1111₂=15₁₀=F(16진수)입니다."},
{category:"정보능력", question:"십진수 15를 이진수로 변환하면?", choices:["1101","1110","1111","10000"], answer:2, explanation:"15=8+4+2+1=2³+2²+2¹+2⁰이므로 이진수로 1111입니다."},
{category:"정보능력", question:"4바이트(Byte)는 몇 비트(bit)인가?", choices:["8비트","16비트","24비트","32비트"], answer:3, explanation:"1바이트는 8비트이므로 4바이트는 8×4=32비트입니다."},
{category:"정보능력", question:"1KB는 몇 바이트(Byte)인가?", choices:["1000Byte","1024Byte","1048Byte","2048Byte"], answer:1, explanation:"정보량 단위는 2¹⁰=1024를 기준으로 하므로 1KB=1024Byte입니다."},
{category:"정보능력", question:"1MB는 몇 KB인가?", choices:["100KB","512KB","1000KB","1024KB"], answer:3, explanation:"1MB=1024KB입니다."},
{category:"정보능력", question:"1TB는 몇 GB인가?", choices:["1000GB","1024GB","2048GB","4096GB"], answer:1, explanation:"1TB=1024GB입니다."},
{category:"정보능력", question:"1초(sec)는 몇 밀리초(ms)인가?", choices:["10ms","100ms","1,000ms","10,000ms"], answer:2, explanation:"1초=10³ms=1,000ms입니다."},
{category:"정보능력", question:"1밀리초(ms)는 몇 마이크로초(μs)인가?", choices:["10μs","100μs","1,000μs","10,000μs"], answer:2, explanation:"1ms=10⁻³s, 1μs=10⁻⁶s이므로 1ms=1,000μs입니다."},
{category:"정보능력", question:"1마이크로초(μs)는 몇 나노초(ns)인가?", choices:["10ns","100ns","1,000ns","10,000ns"], answer:2, explanation:"1μs=10⁻⁶s, 1ns=10⁻⁹s이므로 1μs=1,000ns입니다."},
{category:"정보능력", question:"CPU의 클럭 속도가 3GHz라는 것이 의미하는 바로 가장 적절한 것은?", choices:["초당 300만 번의 연산 사이클을 수행한다","초당 3,000번의 연산 사이클을 수행한다","초당 30억 번의 연산 사이클을 수행한다","3초에 한 번의 연산 사이클을 수행한다"], answer:2, explanation:"1GHz는 초당 10억(10⁹) 사이클을 의미하므로 3GHz는 초당 30억 사이클을 수행함을 의미합니다."},
{category:"정보능력", question:"사용자의 파일을 임의로 암호화한 뒤 이를 복구해 주는 대가로 금전을 요구하는 악성코드는?", choices:["랜섬웨어","방화벽","쿠키","캐시"], answer:0, explanation:"랜섬웨어는 파일을 암호화하여 사용할 수 없게 만든 후 복구 대가로 금전(몸값)을 요구하는 악성코드입니다."},
{category:"정보능력", question:"다수의 컴퓨터를 이용해 특정 서버에 대량의 트래픽을 동시에 발생시켜 정상적인 서비스를 마비시키는 공격은?", choices:["피싱","스푸핑","분산서비스거부공격(DDoS)","해싱"], answer:2, explanation:"DDoS(Distributed Denial of Service)는 다수의 시스템을 이용해 대상 서버에 과도한 트래픽을 유발해 서비스를 마비시키는 공격입니다."},
{category:"정보능력", question:"자신의 신원(IP주소, 이메일 주소 등)을 속여 다른 사람이나 시스템인 것처럼 위장하는 공격 기법은?", choices:["스푸핑(Spoofing)","백업","포맷","압축"], answer:0, explanation:"스푸핑은 IP주소나 이메일 주소 등을 위조하여 다른 사람 또는 시스템으로 위장하는 공격 기법입니다."},
{category:"정보능력", question:"다른 프로그램에 기생하지 않고 스스로 복제되어 네트워크를 통해 독자적으로 전파되는 악성코드는?", choices:["웜(Worm)","방화벽","쿠키","캐시메모리"], answer:0, explanation:"웜은 숙주 파일 없이도 스스로 복제하며 네트워크를 통해 자기 자신을 전파하는 악성코드입니다."},
{category:"정보능력", question:"암호화와 복호화에 동일한 하나의 키를 사용하는 암호화 방식은?", choices:["대칭키 암호화","비대칭키 암호화","해시 암호화","전자서명"], answer:0, explanation:"대칭키 암호화는 암호화할 때와 복호화할 때 동일한 키를 사용하는 방식입니다."},
{category:"정보능력", question:"기술적 해킹 기법보다는 사람의 심리적 취약점(신뢰, 호기심 등)을 이용해 정보를 빼내는 공격 방식을 통칭하는 용어는?", choices:["사회공학적 공격(Social Engineering)","방화벽 우회","암호화 공격","무작위 대입 공격"], answer:0, explanation:"사회공학적 공격은 사람의 심리를 이용해 속임수로 정보를 얻어내는 공격 방식입니다."},
{category:"정보능력", question:"소프트웨어의 보안 취약점이 발견된 직후, 이를 막을 수 있는 보안 패치가 나오기 전에 그 취약점을 악용하는 공격은?", choices:["제로데이 공격(Zero-day Attack)","피싱","랜섬웨어","웜"], answer:0, explanation:"제로데이 공격은 취약점이 알려졌지만 아직 패치가 배포되지 않은 시점을 노려 공격하는 것을 말합니다."},
{category:"정보능력", question:"백신(안티바이러스) 프로그램의 주된 기능으로 가장 적절한 것은?", choices:["네트워크 속도를 향상시킨다","컴퓨터 내 악성코드를 탐지하고 제거한다","파일 용량을 압축한다","데이터베이스를 정규화한다"], answer:1, explanation:"백신 프로그램은 컴퓨터에 존재하는 바이러스 등 악성코드를 탐지하여 제거하거나 감염을 예방하는 프로그램입니다."},
{category:"정보능력", question:"서로 멀리 떨어진 넓은 지역(다른 도시나 국가 등)의 네트워크를 연결하는 통신망은?", choices:["LAN","WAN","PAN","VAN"], answer:1, explanation:"WAN(Wide Area Network)은 멀리 떨어진 넓은 지역을 연결하는 광역 통신망입니다."},
{category:"정보능력", question:"네트워크 장비인 허브(Hub)와 스위치(Switch)의 차이에 대한 설명으로 옳은 것은?", choices:["허브는 목적지 포트로만 데이터를 전송하고, 스위치는 모든 포트로 전송한다","허브는 모든 포트로 데이터를 전송(브로드캐스트)하고, 스위치는 목적지 포트로만 전송한다","둘 다 기능상 차이가 전혀 없다","허브는 라우팅 경로를 계산하지만 스위치는 계산하지 않는다"], answer:1, explanation:"허브는 수신한 데이터를 연결된 모든 포트로 전달하지만, 스위치는 목적지 주소를 파악해 해당 포트로만 데이터를 전달합니다."},
{category:"정보능력", question:"컴퓨터 간 데이터 통신을 위해 미리 정해 놓은 규칙이나 약속을 의미하는 용어는?", choices:["프로토콜(Protocol)","알고리즘","데이터베이스","운영체제"], answer:0, explanation:"프로토콜은 통신하는 컴퓨터들 사이에서 데이터를 주고받기 위해 정한 규칙(통신 규약)입니다."},
{category:"정보능력", question:"인터넷에서 데이터를 작은 단위로 나누어 신뢰성 있게 전달하고, 각 장치를 식별하는 주소체계를 제공하는 표준 프로토콜은?", choices:["HTTP","TCP/IP","FTP","SMTP"], answer:1, explanation:"TCP/IP는 데이터를 패킷 단위로 나누어 신뢰성 있게 전달(TCP)하고 각 장치의 주소를 지정(IP)하는 인터넷 표준 프로토콜입니다."},
{category:"정보능력", question:"인터넷 상에서 서버와 클라이언트 간에 파일을 업로드하거나 다운로드할 때 사용하는 프로토콜은?", choices:["FTP","HTTP","DNS","DHCP"], answer:0, explanation:"FTP(File Transfer Protocol)는 파일을 전송하기 위해 사용되는 프로토콜입니다."},
{category:"정보능력", question:"서비스를 요청하는 컴퓨터(클라이언트)와 서비스를 제공하는 컴퓨터(서버)로 역할을 나누어 자원을 주고받는 네트워크 구조를 무엇이라 하는가?", choices:["클라이언트-서버 모델","P2P 모델","LAN 모델","VPN 모델"], answer:0, explanation:"클라이언트-서버 모델은 자원과 서비스를 제공하는 서버와 이를 요청하는 클라이언트로 역할을 분담하는 네트워크 구조입니다."},
{category:"정보능력", question:"인터넷 상의 웹 페이지(HTML 문서)를 사용자가 볼 수 있도록 해석하여 화면에 표시해주는 프로그램은?", choices:["웹 브라우저","운영체제","컴파일러","DBMS"], answer:0, explanation:"웹 브라우저는 HTML 등으로 작성된 웹 페이지를 해석하여 사용자에게 보여주는 프로그램입니다."},
{category:"정보능력", question:"컴퓨터의 하드웨어 자원과 소프트웨어 자원을 효율적으로 관리하고, 사용자와 컴퓨터 사이의 인터페이스 역할을 담당하는 소프트웨어는?", choices:["운영체제(OS)","컴파일러","방화벽","유틸리티 프로그램"], answer:0, explanation:"운영체제는 컴퓨터의 하드웨어와 소프트웨어 자원을 관리하며 사용자와 시스템 간의 인터페이스를 제공합니다."},
{category:"정보능력", question:"RAM과 ROM에 대한 설명으로 옳은 것은?", choices:["RAM은 비휘발성, ROM은 휘발성 메모리이다","RAM은 전원이 꺼지면 저장된 데이터가 사라지는 휘발성 메모리이다","ROM은 자유롭게 데이터를 수시로 읽고 쓸 수 있는 임시 저장 장치이다","RAM과 ROM은 저장 용량 외에는 차이가 없다"], answer:1, explanation:"RAM(주기억장치)은 전원이 꺼지면 데이터가 사라지는 휘발성 메모리이며, ROM은 전원이 꺼져도 데이터가 유지되는 비휘발성 메모리입니다."},
{category:"정보능력", question:"CPU(중앙처리장치)를 구성하는 주요 요소로 볼 수 없는 것은?", choices:["연산장치(ALU)","제어장치","레지스터","그래픽카드(GPU)"], answer:3, explanation:"CPU는 연산장치, 제어장치, 레지스터 등으로 구성되며, 그래픽카드(GPU)는 별도의 장치입니다."},
{category:"정보능력", question:"처리 속도가 빠른 CPU와 상대적으로 느린 주기억장치 사이의 속도 차이를 줄이기 위해 사용하는 고속 임시 저장 장치는?", choices:["캐시 메모리","보조기억장치","레지스터파일 전용 디스크","가상 메모리 전용 디스크"], answer:0, explanation:"캐시 메모리는 CPU와 주기억장치 사이에 위치하여 자주 사용하는 데이터를 임시로 저장해 처리 속도 차이를 줄여줍니다."},
{category:"정보능력", question:"프로그래밍 언어 번역 방식 중 소스코드 전체를 한꺼번에 기계어로 번역한 후 실행하는 방식은?", choices:["컴파일 방식","인터프리터 방식","디버깅 방식","링킹 방식"], answer:0, explanation:"컴파일 방식은 소스코드 전체를 한 번에 기계어로 번역하여 실행 파일을 생성한 후 실행하는 방식이며, 인터프리터는 한 줄씩 해석하며 즉시 실행합니다."},
{category:"정보능력", question:"하드웨어를 제어하기 위해 하드웨어 내부(ROM 등)에 저장되는 소프트웨어로, 하드웨어와 소프트웨어의 중간적 성격을 가지는 것은?", choices:["펌웨어(Firmware)","드라이버 아이콘","바이오스 화면","브라우저 확장 프로그램"], answer:0, explanation:"펌웨어는 하드웨어 장치를 제어하기 위해 하드웨어 내부에 내장된 소프트웨어로, 하드웨어와 소프트웨어의 중간적 성격을 가집니다."},
{category:"정보능력", question:"압축, 파일 백업, 바이러스 검사 등 컴퓨터 사용에 편의를 제공하는 보조적인 프로그램을 통칭하는 용어는?", choices:["유틸리티 프로그램","운영체제","컴파일러","데이터베이스"], answer:0, explanation:"유틸리티 프로그램은 압축, 백업, 바이러스 검사 등 컴퓨터 사용의 편의를 돕는 보조 프로그램입니다."},
{category:"정보능력", question:"유선 근거리통신망(LAN)에서 가장 널리 사용되는 통신 표준 기술은?", choices:["이더넷(Ethernet)","블루투스","와이파이(Wi-Fi)","NFC"], answer:0, explanation:"이더넷은 유선 LAN 환경에서 가장 널리 사용되는 통신 표준 기술입니다. (블루투스, 와이파이, NFC는 무선 기술입니다.)"},
{category:"정보능력", question:"SQL에서 테이블에 새로운 데이터(행)를 추가할 때 사용하는 명령어는?", choices:["SELECT","INSERT INTO","DELETE","UPDATE"], answer:1, explanation:"INSERT INTO문은 테이블에 새로운 행(데이터)을 추가할 때 사용하는 SQL 명령어입니다."},
{category:"정보능력", question:"SQL에서 테이블에 이미 저장된 데이터를 수정할 때 사용하는 명령어는?", choices:["SELECT","INSERT","UPDATE","DELETE"], answer:2, explanation:"UPDATE문은 테이블에 이미 저장되어 있는 데이터를 수정할 때 사용합니다."},
{category:"정보능력", question:"SQL에서 테이블의 특정 행(데이터)을 삭제할 때 사용하는 명령어는?", choices:["DROP","DELETE","TRUNCATE TABLE","REMOVE"], answer:1, explanation:"DELETE문은 테이블에서 조건에 맞는 특정 행을 삭제할 때 사용하는 SQL 명령어입니다."},
{category:"정보능력", question:"데이터베이스를 생성, 관리하고 응용 프로그램과 데이터베이스 사이에서 데이터를 효율적으로 처리할 수 있게 해주는 소프트웨어는?", choices:["DBMS(데이터베이스 관리시스템)","웹 브라우저","컴파일러","방화벽"], answer:0, explanation:"DBMS(DataBase Management System)는 데이터베이스를 생성·관리하며 응용프로그램과 데이터베이스 사이의 데이터 처리를 담당하는 소프트웨어입니다."},
{category:"정보능력", question:"관계형 데이터베이스에서 각 레코드를 유일하게 식별할 수 있는 속성(들)의 후보가 되는 키로, 이 중 하나가 기본키로 선택되는 것은?", choices:["외래키","후보키","슈퍼키의 반대개념","정규형"], answer:1, explanation:"후보키는 각 레코드를 유일하게 식별할 수 있는 속성(또는 속성 조합)의 후보로, 이 중 하나가 선택되어 기본키가 됩니다."},
{category:"정보능력", question:"관계형 데이터베이스의 테이블에서 하나의 행(가로줄)을 가리키는 용어는?", choices:["속성(Attribute)","튜플(Tuple)","도메인(Domain)","스키마(Schema)"], answer:1, explanation:"관계형 데이터베이스에서 테이블의 행(가로줄)을 튜플 또는 레코드라고 합니다."},
{category:"정보능력", question:"관계형 데이터베이스의 테이블에서 하나의 열(세로줄)을 가리키는 용어는?", choices:["속성(Attribute)","튜플(Tuple)","레코드","인스턴스"], answer:0, explanation:"관계형 데이터베이스에서 테이블의 열(세로줄)을 속성 또는 필드라고 합니다."},
{category:"정보능력", question:"데이터베이스에서 특정 데이터를 더 빠르게 검색할 수 있도록 별도로 만들어 두는 자료구조는?", choices:["인덱스(Index)","정규화","외래키","트랜잭션"], answer:0, explanation:"인덱스는 책의 색인처럼 데이터 검색 속도를 향상시키기 위해 별도로 구성해 두는 자료구조입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ntotal = 0\nfor i in 1 to 6:\n    total = total + i*i\nprint(total)", choices:["55","66","91","96"], answer:2, explanation:"1²+2²+3²+4²+5²+6²=1+4+9+16+25+36=91입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nx = 1\nfor i in 1 to 5:\n    x = x * 2\nprint(x)", choices:["16","32","64","10"], answer:1, explanation:"x는 1에서 시작해 2를 5번 곱하므로 1×2⁵=32입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ncount = 0\nfor i in 1 to 30:\n    if i % 5 == 0:\n        count = count + 1\nprint(count)", choices:["4","5","6","7"], answer:2, explanation:"1~30 중 5의 배수는 5,10,15,20,25,30으로 총 6개입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nsum = 0\nfor i in 1 to 10:\n    if i % 2 == 0:\n        sum = sum + i\nprint(sum)", choices:["25","30","35","40"], answer:1, explanation:"1~10 중 짝수는 2,4,6,8,10이며 합은 30입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ntotal = 0\nfor i in 1 to 3:\n    for j in 1 to 2:\n        total = total + 1\nprint(total)", choices:["3","5","6","9"], answer:2, explanation:"바깥 반복문이 3회, 안쪽 반복문이 매번 2회씩 실행되므로 총 3×2=6회 반복되어 total은 6이 됩니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ni = 1\ntotal = 0\nwhile i < 4:\n    total = total + i\n    i = i + 1\nprint(total)", choices:["3","6","10","4"], answer:1, explanation:"i가 1,2,3일 때 반복되며(4는 조건에 걸려 제외) total에 1+2+3=6이 누적됩니다."},
{category:"정보능력", question:"순서도(플로우차트)에서 '평행사변형' 기호가 일반적으로 나타내는 것은?", choices:["시작과 종료","데이터의 입력과 출력","조건 판단(분기)","처리 과정"], answer:1, explanation:"평행사변형 기호는 데이터의 입력(input)과 출력(output)을 나타내는 데 사용됩니다."},
{category:"정보능력", question:"정렬할 데이터 중 남은 원소들 중에서 매번 최솟값(또는 최댓값)을 찾아 맨 앞(또는 맨 뒤)의 원소와 교환하는 과정을 반복하는 정렬 방식은?", choices:["버블 정렬","선택 정렬","이진 탐색","재귀 호출"], answer:1, explanation:"선택 정렬은 남은 원소 중 최솟값을 찾아 정렬되지 않은 부분의 맨 앞 원소와 교환하는 과정을 반복하는 정렬 알고리즘입니다."},
{category:"정보능력", question:"정보관리의 3원칙에 해당하지 않는 것은?", choices:["목적성","용이성","유용성","보안성"], answer:3, explanation:"정보관리의 3원칙은 목적성, 용이성, 유용성이며 보안성은 이에 해당하지 않습니다."},
{category:"정보능력", question:"프로그래밍에서 데이터를 저장하기 위해 이름을 붙인 기억 공간을 의미하는 용어는?", choices:["변수(Variable)","함수(Function)","배열(Array)","클래스(Class)"], answer:0, explanation:"변수는 프로그램 실행 중 값을 저장하기 위해 이름을 붙여 사용하는 기억 공간입니다."},
{category:"정보능력", question:"프로그래밍 언어와 유사한 형식을 사용하되 실제 문법에 얽매이지 않고 알고리즘의 논리를 자연어에 가깝게 표현하는 방법은?", choices:["순서도","의사코드(Pseudocode)","플로우차트","기계어"], answer:1, explanation:"의사코드는 프로그래밍 언어와 비슷한 형태로 알고리즘의 논리적 흐름을 표현하되 실제 문법 규칙에 얽매이지 않는 표현 방법입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nn = 10\nresult = 0\nwhile n > 0:\n    result = result + n\n    n = n - 2\nprint(result)", choices:["25","28","30","32"], answer:2, explanation:"n은 10,8,6,4,2로 감소하며 result에 10+8+6+4+2=30이 누적됩니다."},
{category:"정보능력", question:"정보검색 연산자 중 두 단어가 특정 거리(글자 수) 이내에 인접하여 나타나는 문서를 검색할 때 사용하는 연산자는?", choices:["근접연산자","AND 연산자","OR 연산자","NOT 연산자"], answer:0, explanation:"근접연산자는 지정한 단어들이 일정 거리 이내에 인접하여 나타나는 문서를 검색할 때 사용합니다."},
{category:"정보능력", question:"인터넷에서 다운로드한 이미지나 문서를 업무 자료에 활용할 때 저작권 침해를 피하기 위한 방법으로 가장 적절한 것은?", choices:["출처 표시 없이 그대로 사용한다","저작권자의 허락을 받거나 이용이 허용된 자료인지 확인 후 사용한다","비영리 목적이면 무조건 자유롭게 사용해도 된다","다운로드한 자료는 모두 공공재이므로 제한이 없다"], answer:1, explanation:"저작권이 있는 자료는 저작권자의 허락을 받거나 이용 조건(라이선스)이 허용하는 범위 내에서 사용해야 저작권 침해를 피할 수 있습니다."},
{category:"정보능력", question:"구글 드라이브와 같은 클라우드 스토리지 서비스의 특징으로 가장 적절한 것은?", choices:["반드시 특정 컴퓨터에서만 파일에 접근할 수 있다","인터넷에 연결되어 있으면 언제 어디서나 저장된 파일에 접근할 수 있다","파일을 저장하면 자동으로 삭제된다","오프라인 상태에서만 사용 가능하다"], answer:1, explanation:"클라우드 스토리지는 인터넷을 통해 데이터를 원격 서버에 저장하므로 인터넷이 연결된 환경이면 언제 어디서나 파일에 접근할 수 있습니다."},
{category:"정보능력", question:"미리 정해진 형식(행과 열 구조)에 맞춰 저장되어 있어 관계형 데이터베이스 등에서 바로 처리하기 쉬운 데이터를 가리키는 용어는?", choices:["비정형 데이터","반정형 데이터","정형 데이터","메타데이터"], answer:2, explanation:"정형 데이터는 관계형 데이터베이스의 표처럼 고정된 행과 열 구조를 가진 데이터입니다."},
{category:"정보능력", question:"XML, JSON 파일처럼 완전한 표 형태는 아니지만 태그나 구조를 통해 일정한 규칙성을 갖는 데이터를 무엇이라 하는가?", choices:["정형 데이터","반정형 데이터","비정형 데이터","1차 데이터"], answer:1, explanation:"반정형 데이터는 XML, JSON처럼 고정된 표 형태는 아니지만 태그 등을 통해 일정한 구조를 갖는 데이터입니다."},
{category:"정보능력", question:"사물에 센서와 통신 기능을 내장하여 인터넷을 통해 서로 데이터를 주고받을 수 있게 하는 기술을 가리키는 용어는?", choices:["사물인터넷(IoT)","클라우드 컴퓨팅","빅데이터","가상현실(VR)"], answer:0, explanation:"사물인터넷(IoT, Internet of Things)은 사물에 센서와 통신 기능을 탑재해 인터넷으로 데이터를 주고받도록 하는 기술입니다."},
{category:"정보능력", question:"인간의 신경망 구조를 모방한 인공신경망을 기반으로 하는, 머신러닝의 한 분야로서 대량의 데이터를 통해 스스로 특징을 학습하는 기술은?", choices:["딥러닝(Deep Learning)","방화벽","데이터베이스 정규화","네트워크 프로토콜"], answer:0, explanation:"딥러닝은 인공신경망을 기반으로 하는 머신러닝의 한 분야로, 데이터를 통해 스스로 특징(패턴)을 학습합니다."},

{category:"직무상식", question:"국제협동조합연맹(ICA)이 정한 협동조합 7대 원칙에 해당하지 않는 것은?", choices:["자발적이고 개방적인 조합원 제도","조합원에 의한 민주적 관리","조합원의 경제적 참여","이윤의 주주 독점적 배분"], answer:3, explanation:"협동조합은 이윤을 주주가 독점하지 않고, 조합원의 사업 이용실적 등에 비례하여 배분하는 것을 원칙으로 합니다."},
