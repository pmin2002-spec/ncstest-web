{category:"문제해결능력", question:"\"성과가 좋으면 보너스를 받는다\"가 참일 때 반드시 참인 것은?", choices:["보너스를 받으면 성과가 좋다","보너스를 받지 못하면 성과가 좋지 않다","성과가 좋지 않으면 보너스를 받지 못한다","성과가 좋지 않아도 보너스를 받을 수 있다"], answer:1, explanation:"원명제(성과 좋음→보너스)의 대우인 \"보너스를 받지 못하면 성과가 좋지 않다\"만 항상 참입니다. ①③은 역·이 관계로 보장되지 않습니다."},
{category:"문제해결능력", question:"A,B,C,D,E 다섯 명이 달리기 시합을 했다. B는 A보다 늦게 들어왔고, C는 B보다 늦게 들어왔다. D는 A보다 먼저 들어왔고, E는 D보다 늦게 들어왔지만 A보다는 먼저 들어왔다. 1등은 누구인가?", choices:["A","D","E","C"], answer:1, explanation:"조건을 정리하면 D<E<A<B<C 순서(빠른 순)로 완전히 결정됩니다. 따라서 1등은 D입니다."},
{category:"문제해결능력", question:"갑,을,병,정 네 사람 중 한 명만 진실을 말하고 세 명은 거짓을 말한다. 갑: \"을은 거짓말을 한다.\" 을: \"병은 거짓말을 한다.\" 병: \"정은 진실을 말한다.\" 정: \"갑은 진실을 말한다.\" 진실을 말한 사람은?", choices:["갑","을","병","정"], answer:1, explanation:"을이 진실을 말한다고 가정하면 병=거짓, 정=거짓, 갑=거짓이 모두 모순 없이 성립하며 진실이 정확히 1명입니다. 다른 경우는 모두 진실이 2명 이상 되어 모순됩니다."},
{category:"문제해결능력", question:"5개 부서(인사,총무,영업,홍보,전산) 중 신입사원 5명(A,B,C,D,E)이 각각 한 부서씩 배치된다. A는 영업팀이 아니다. B는 홍보팀이다. C는 전산팀이다. D는 총무팀이다. E는 인사팀이 아니다. 다음 중 옳은 것은?", choices:["A는 인사팀이다","B는 영업팀이다","D는 홍보팀이다","E는 전산팀이다"], answer:0, explanation:"B=홍보, D=총무, C=전산으로 고정되면 남은 인사·영업은 A, E가 나눠 갖는데 A는 영업이 아니므로 A=인사, E=영업으로 확정됩니다."},
{category:"문제해결능력", question:"원탁에 A,B,C,D,E,F 여섯 명이 일정한 간격으로 앉아 있다. A와 D는 마주보고 앉아있다. B는 A의 바로 오른쪽에 앉는다. C는 B의 바로 오른쪽에 앉는다. E는 D의 바로 오른쪽에 앉는다. F의 바로 오른쪽에 앉는 사람은?", choices:["A","B","C","E"], answer:0, explanation:"6인 원탁에서 A(1)-B(2)-C(3)-D(4)-E(5)-F(6) 순서로 시계방향 자리가 결정되며, F(6번)의 바로 오른쪽(시계방향 다음)은 A(1번)입니다."},
{category:"문제해결능력", question:"병은 1위이다. 갑은 을보다 순위가 높다. 무는 을보다 순위가 높다. 정은 무보다 순위가 낮다. 을은 정보다 순위가 높다. 순위가 가장 낮은(5위) 사람은?", choices:["갑","을","무","정"], answer:3, explanation:"을<정, 무<정이 모두 성립하고 갑<을이므로 정은 갑·을·무 모두보다 순위가 낮습니다(숫자가 큼). 따라서 정이 5위입니다."},
{category:"문제해결능력", question:"A,B,C,D 네 사람이 각각 커피, 홍차, 주스, 물 중 서로 다른 음료를 하나씩 마신다. A는 커피를 마시지 않는다. B는 주스 또는 물을 마신다. C는 홍차를 마신다. D는 물을 마시지 않는다. 커피를 마시는 사람은?", choices:["A","B","C","D"], answer:3, explanation:"C=홍차로 고정되고, 커피는 A(제외됨)나 B(주스·물만 가능하므로 제외됨)가 될 수 없어 D로 확정됩니다."},
{category:"문제해결능력", question:"\"모든 정규직 사원은 퇴직연금에 가입되어 있다. 민수는 퇴직연금에 가입되어 있지 않다.\" 이때 반드시 참인 것은?", choices:["민수는 정규직이 아니다","민수는 계약직이다","민수는 회사에 다니지 않는다","민수는 곧 퇴직연금에 가입할 것이다"], answer:0, explanation:"원명제의 대우(연금 미가입→정규직 아님)에 의해 ①만 항상 참입니다. ②는 정규직이 아닌 다른 고용형태일 가능성도 있어 보장되지 않습니다."},
{category:"문제해결능력", question:"6개 좌석이 일렬로 있다(왼쪽1~오른쪽6). A는 3 또는 4번에 앉는다. B는 A의 바로 옆에 앉는다. C는 1번, D는 6번에 앉는다. E는 F의 바로 왼쪽에 앉는다. F는 5번에 앉지 않는다. 다음 중 항상 참인 것은?", choices:["A는 3번 자리에 앉는다","B는 5번 자리에 앉는다","E는 4번 자리에 앉는다","C는 6번 자리에 앉는다"], answer:1, explanation:"C=1,D=6 고정 후 남은 2~5에 A,B,E,F를 배치할 때 F≠5 조건을 만족하는 경우는 A=4,B=5,E=2,F=3뿐입니다. 따라서 B는 항상 5번에 앉습니다."},
{category:"문제해결능력", question:"A,B,C,D 네 사람의 진술 중 정확히 하나만 거짓이고 나머지는 진실이다. A: \"나는 1등이 아니다.\" B: \"C가 1등이다.\" C: \"D가 1등이다.\" D: \"나는 1등이다.\" 1등은 누구인가?", choices:["A","B","C","D"], answer:3, explanation:"1등이 D라고 가정하면 A(참),C(참),D(참)는 모두 성립하고 B(거짓)만 거짓이 되어 조건과 일치합니다. 다른 경우는 모두 거짓이 2개 이상 발생합니다."},
{category:"문제해결능력", question:"\"성실한 사람은 신뢰를 받는다. 신뢰를 받는 사람은 승진 기회를 얻는다.\"가 참일 때 항상 참인 것은?", choices:["성실하지 않은 사람은 승진 기회를 얻지 못한다","성실한 사람은 승진 기회를 얻는다","승진 기회를 얻은 사람은 성실하다","신뢰를 받으면 성실하다"], answer:1, explanation:"두 명제를 연쇄적으로 연결(가설적 삼단논법)하면 \"성실하면 승진 기회를 얻는다\"가 항상 참입니다. 나머지는 역·이 관계로 보장되지 않습니다."},
{category:"문제해결능력", question:"가,나,다,라,마 다섯 명이 월~금 하루에 한 명씩 당직을 선다. 가는 월요일 또는 화요일에 당직을 선다. 나는 가보다 먼저 당직을 선다. 다는 금요일에 당직을 선다. 라는 마보다 나중에 당직을 선다. 마는 수요일에 당직을 선다. 목요일에 당직을 서는 사람은?", choices:["가","나","라","마"], answer:2, explanation:"나<가이고 가는 월·화 중 하나여야 하므로 가=화, 나=월로 확정됩니다. 다=금, 마=수가 고정되면 남은 목요일은 라가 차지합니다."},
{category:"문제해결능력", question:"A,B,C 세 사람은 각각 항상 진실만 말하거나 항상 거짓만 말한다. A: \"B는 거짓말쟁이이다.\" B: \"C는 거짓말쟁이이다.\" C: \"A와 B는 모두 거짓말쟁이이다.\" 실제 거짓말쟁이는 몇 명인가?", choices:["0명","1명","2명","3명"], answer:2, explanation:"A가 진실이면 B는 거짓, B가 거짓이면 C는 진실이어야 하는데 C가 진실이려면 \"A와 B 모두 거짓\"이어야 해 A가 진실이라는 가정과 모순됩니다. A가 거짓이면 B는 진실, B가 진실이면 C는 거짓, C가 거짓이면 \"A,B 중 적어도 하나는 진실\"이 성립해야 하는데 B가 진실이므로 모순 없이 성립합니다. 따라서 A=거짓, B=진실, C=거짓으로 거짓말쟁이는 2명(A, C)입니다."},
{category:"문제해결능력", question:"\"모든 회원은 연회비를 납부한다. 어떤 사람은 회원이 아니다.\"라는 전제로부터 논리적으로 반드시 도출되는 것은?", choices:["어떤 사람은 연회비를 납부하지 않는다","모든 사람은 연회비를 납부한다","회원이 아닌 사람은 연회비를 납부하지 않는다","회원이 아닌 사람의 연회비 납부 여부는 이 전제만으로 알 수 없다"], answer:3, explanation:"주어진 전제는 회원의 연회비 납부만 보장할 뿐, 비회원의 연회비 납부 여부에 대해서는 아무런 정보도 주지 않으므로 알 수 없다는 것이 유일하게 타당한 결론입니다."},
{category:"문제해결능력", question:"4개 팀(기획,영업,개발,홍보)이 각각 다른 층(2~5층)에 있다. 기획팀은 개발팀보다 높은 층에 있다. 영업팀은 2층에 있다. 홍보팀은 기획팀보다 낮은 층에 있다. 개발팀은 영업팀보다 높은 층에 있다. 기획팀이 있는 층은?", choices:["2층","3층","4층","5층"], answer:3, explanation:"영업=2층 고정 후 남은 3~5층 중 기획팀은 개발팀과 홍보팀 모두보다 높아야 하므로 유일하게 5층이 될 수 있습니다."},
{category:"문제해결능력", question:"다음 중 브레인스토밍 규칙을 준수한 사례로 가장 적절한 것은?", choices:["팀장이 먼저 결론을 제시하고 나머지는 근거만 덧붙였다","한 팀원이 다소 비현실적인 아이디어를 제시했지만 아무도 비판하지 않고 다음 아이디어로 넘어갔다","아이디어 수가 많아지자 회의 중간에 발언을 제한했다","발언한 아이디어의 실현 가능성을 즉시 평가하여 탈락시켰다"], answer:1, explanation:"브레인스토밍은 비판 금지 원칙에 따라 아이디어의 현실성을 즉시 평가하지 않고 자유롭게 발언을 이어가야 합니다."},
{category:"문제해결능력", question:"갑,을,병,정 네 명 중 정확히 두 명이 자격증을 보유하고 있다. 갑과 을의 진술은 모두 진실이고, 병과 정의 진술은 모두 거짓이다. 갑: \"나는 자격증이 있다.\" 을: \"병은 자격증이 없다.\" 병: \"정은 자격증이 있다.\" 정: \"갑은 자격증이 없다.\" 자격증을 보유한 사람은?", choices:["갑, 을","갑, 병","을, 정","병, 정"], answer:0, explanation:"갑의 진술이 참이므로 갑=보유. 을의 진술이 참이므로 병=미보유. 병의 진술이 거짓이므로 정=미보유. 정확히 두 명이 보유해야 하므로 나머지 한 명인 을=보유로 확정됩니다."},
{category:"문제해결능력", question:"\"프로젝트 예산이 초과되면 추가 승인을 받아야 한다. 이번 프로젝트는 추가 승인을 받지 않았다.\" 이때 반드시 참인 것은?", choices:["이번 프로젝트는 예산이 초과되지 않았다","이번 프로젝트는 예산이 초과되었다","추가 승인은 항상 필요하지 않다","예산이 초과되지 않으면 항상 승인을 받는다"], answer:0, explanation:"원명제(초과→승인)의 대우(승인 안 받음→초과 안 됨)에 의해 ①만 항상 참입니다."},
{category:"문제해결능력", question:"6명이 3명씩 홍팀·백팀으로 나뉜다. A와 B는 같은 팀이다. C와 D는 다른 팀이다. E는 홍팀이다. A는 백팀이다. 다음 중 항상 참인 것은?", choices:["C는 백팀이다","F는 홍팀이다","D는 백팀이다","A는 홍팀이다"], answer:1, explanation:"A,B=백팀(2명), E=홍팀(1명)이 고정되면 C,D 중 한 명이 백팀의 마지막 자리를 채우고 나머지는 홍팀으로 가야 하므로, F는 반드시 홍팀의 나머지 자리를 채우게 됩니다."},
{category:"문제해결능력", question:"로직트리를 활용해 매출 부진의 원인을 분석할 때, 대분류로 적절하지 않은 것은?", choices:["고객 요인(고객 수 감소, 재구매율 하락)","제품 요인(품질, 가격)","유통 요인(판매 채널)","담당자의 개인 취미"], answer:3, explanation:"담당자의 개인 취미는 매출 부진의 원인 분석과 논리적 관련성이 없는 항목입니다."},
{category:"문제해결능력", question:"\"매출이 증가하면 광고비를 늘린다\"가 참일 때 반드시 참인 것은?", choices:["광고비를 늘리면 매출이 증가한다","광고비를 늘리지 않으면 매출이 증가하지 않는다","매출이 증가하지 않으면 광고비를 늘리지 않는다","매출이 증가하지 않아도 광고비를 늘릴 수 있다"], answer:1, explanation:"원명제(증가→늘림)의 대우(안 늘림→증가 안 함)만 항상 참입니다."},
{category:"문제해결능력", question:"A,B,C,D 네 부서의 예산이 서로 다르다. A는 B보다 예산이 많다. C는 A보다 예산이 많다. D는 B보다 예산이 적다. 예산이 가장 많은 부서와 가장 적은 부서를 순서대로 나열하면?", choices:["A, B","C, D","C, A","B, D"], answer:1, explanation:"C>A>B>D 순으로 완전히 결정되므로 가장 많은 부서는 C, 가장 적은 부서는 D입니다."},
{category:"문제해결능력", question:"5명(서연,도윤,민수,지수,현우)이 1~5번 번호표를 받는다(왼쪽1번부터). 서연은 1번, 민수는 3번이다. 지수는 민수보다 번호가 크고, 현우는 지수보다 번호가 크다. 도윤은 현우보다 번호가 작다. 5번을 받는 사람은?", choices:["민수","지수","현우","도윤"], answer:2, explanation:"서연=1, 민수=3 고정 후 남은 2,4,5 중 지수>3, 현우>지수 조건을 만족하려면 지수=4, 현우=5, 도윤=2로 유일하게 결정됩니다."},
{category:"문제해결능력", question:"진실만 말하는 사람 2명과 거짓만 말하는 사람 2명, 총 4명(A,B,C,D)이 있다. A: \"나와 B는 서로 다른 부류이다.\" B: \"C는 거짓말쟁이이다.\" C: \"D는 진실쟁이이다.\" D: \"A는 진실쟁이이다.\" 진실을 말하는 두 사람은?", choices:["A, C, D","A, B","B, D","C, D"], answer:0, explanation:"A의 진술 구조상 A가 진실이든 거짓이든 결과적으로 A는 진실, B는 거짓으로 귀결되며, B가 거짓이므로 C는 진실, C가 진실이므로 D도 진실이 되어 A, C, D가 진실을 말하는 3명이 됩니다."},
{category:"문제해결능력", question:"문제해결 시 활용하는 '체크리스트법'의 특징으로 가장 적절한 것은?", choices:["점검해야 할 항목을 미리 목록화하여 빠짐없이 확인하는 방법","모든 항목을 무작위로 확인하는 방법","한 번 사용한 체크리스트는 재사용하지 않는다","체크리스트는 정량적 항목만 포함해야 한다"], answer:0, explanation:"체크리스트법은 점검할 항목을 사전에 목록화하여 빠짐없이 순서대로 확인하는 기법입니다."},
{category:"문제해결능력", question:"네 명(A,B,C,D)이 각각 다른 스포츠(축구,야구,농구,배구)를 좋아한다. A는 축구를 좋아하지 않는다. B는 농구 또는 배구를 좋아한다. C는 야구를 좋아한다. D는 배구를 좋아하지 않는다. 축구를 좋아하는 사람은?", choices:["A","B","C","D"], answer:3, explanation:"C=야구로 고정되고, 축구는 A(제외)나 B(농구·배구만 가능하므로 제외)가 될 수 없어 D로 확정됩니다."},
{category:"문제해결능력", question:"\"이자율이 오르면 대출 수요가 감소한다. 이번 달 대출 수요는 감소하지 않았다.\" 이때 반드시 참인 것은?", choices:["이번 달 이자율은 오르지 않았다","이번 달 이자율은 올랐다","대출 수요는 항상 일정하다","이자율과 대출 수요는 관련이 없다"], answer:0, explanation:"원명제의 대우(수요 감소 안 함→이자율 안 오름)에 의해 ①만 항상 참입니다."},
{category:"문제해결능력", question:"네 개의 상자(A,B,C,D) 중 하나에만 선물이 있다. 세 사람의 진술 중 두 명은 진실, 한 명은 거짓이다. 갑: \"선물은 A 상자에 있다.\" 을: \"선물은 A 상자에 없다.\" 병: \"선물은 C 상자에 있다.\" 선물이 들어있는 상자는?", choices:["A","B","C","D"], answer:2, explanation:"갑과 을은 서로 반대 주장이라 항상 둘 중 하나만 참입니다. 조건상 진실이 2명이어야 하므로 병은 반드시 진실이어야 하며, 이에 따라 선물은 C 상자에 있습니다."},
{category:"문제해결능력", question:"다음 중 SWOT분석을 실제 상황에 적용한 예로 적절하지 않은 것은?", choices:["낮은 인건비(강점)를 활용해 저가 상품 시장에 진출한다","노후 설비(약점)를 보완하기 위해 정부 지원금(기회)을 활용해 설비를 교체한다","경쟁사의 신제품 출시(위협)에 자사의 기술력(강점)으로 신제품을 선제 출시한다","자금 부족(약점)을 해결하기 위해 오히려 사업을 무리하게 확장한다"], answer:3, explanation:"자금 부족이라는 약점 상황에서 무리하게 사업을 확장하는 것은 WT전략의 취지(위험 회피·축소)에 정반대되는 부적절한 대응입니다."},
{category:"문제해결능력", question:"3명(A,B,C)이 가위바위보를 한 번씩 냈다(모두 다른 것을 냄). A는 가위를 내지 않았다. B는 바위를 내지 않았다. C는 보를 냈다. A가 낸 것은?", choices:["가위","바위","보","알 수 없음"], answer:1, explanation:"C=보로 고정되면 남은 가위·바위 중 A는 가위를 낼 수 없으므로 A=바위, 나머지 B=가위로 결정됩니다."},
{category:"문제해결능력", question:"\"온라인 매출이 늘면 오프라인 매출이 준다. 이번 분기에는 오프라인 매출이 줄지 않았다.\" 이때 반드시 참인 것은?", choices:["이번 분기 온라인 매출은 늘지 않았다","이번 분기 온라인 매출은 늘었다","온라인과 오프라인 매출은 항상 반비례한다","오프라인 매출이 늘면 온라인 매출도 늘어난다"], answer:0, explanation:"원명제의 대우(오프라인 안 줄음→온라인 안 늘음)에 의해 ①만 항상 참입니다."},
{category:"문제해결능력", question:"5명(A,B,C,D,E)의 키를 비교했다. A는 C보다 크다. B는 A보다 작다. D는 E보다 크다. C는 D보다 크다. E는 B보다 크다. 키가 가장 큰 사람은?", choices:["A","B","C","D"], answer:0, explanation:"A>C>D>E>B 순으로 완전히 결정되는 하나의 서열이 만들어지므로 키가 가장 큰 사람은 A입니다."},
{category:"문제해결능력", question:"문제해결을 위한 정보 수집 및 분석 시, 신뢰할 수 없는 자료를 활용했을 때 발생할 수 있는 문제로 가장 적절한 것은?", choices:["의사결정의 정확성이 떨어지고 잘못된 결론에 도달할 위험이 커진다","항상 더 빠른 의사결정이 가능해진다","비용이 자동으로 절감된다","분석 시간이 단축된다"], answer:0, explanation:"신뢰할 수 없는 자료는 잘못된 분석과 결론으로 이어져 의사결정의 정확성을 떨어뜨립니다."},
{category:"문제해결능력", question:"4개 부서(총무,인사,영업,기획)가 순서대로 예산 심사를 받는다. 총무부는 인사부보다 먼저 심사받는다. 영업부는 총무부보다 나중에 심사받는다. 기획부는 영업부보다 먼저 심사받는다. 인사부는 기획부보다 먼저 심사받는다. 가장 먼저 심사받는 부서는?", choices:["총무부","인사부","기획부","영업부"], answer:0, explanation:"총무<인사<기획<영업 순으로 완전히 결정되므로 가장 먼저 심사받는 부서는 총무부입니다."},
{category:"문제해결능력", question:"'문제 정의'가 명확하지 않을 때 발생할 수 있는 결과로 가장 적절한 것은?", choices:["정확한 원인 분석과 해결안 도출이 어려워진다","모든 문제가 자동으로 해결된다","불필요한 논의가 완전히 사라진다","의사결정 속도가 항상 빨라진다"], answer:0, explanation:"문제 정의가 불명확하면 이후 원인 분석과 해결안 도출 과정 전체가 방향을 잃고 어려워집니다."},
{category:"문제해결능력", question:"A,B,C,D 네 명의 면접자가 순서대로 자기소개를 한다. B는 A보다 먼저 소개한다. C는 가장 마지막에 소개한다. D는 B보다 먼저 소개한다. 첫 번째로 소개하는 사람은?", choices:["A","B","C","D"], answer:3, explanation:"C=4번째로 고정되고, 남은 D<B<A 순서가 1,2,3번을 채우므로 D가 가장 먼저 소개합니다."},
{category:"문제해결능력", question:"\"어떤 관리자는 엄격하다. 엄격한 사람은 부하 직원에게 존경받지 못한다.\"로부터 논리적으로 타당하게 도출되는 것은?", choices:["모든 관리자는 존경받지 못한다","어떤 관리자는 존경받지 못할 수 있다","존경받는 사람은 모두 관리자가 아니다","엄격하지 않은 관리자는 모두 존경받는다"], answer:1, explanation:"특정(어떤) 관리자가 엄격하고 엄격한 사람은 모두 존경받지 못하므로, 그 특정 관리자들은 존경받지 못한다는 결론(어떤 관리자는 존경받지 못한다)만 타당하게 도출됩니다."},
{category:"문제해결능력", question:"5개 프로젝트(P1~P5) 중 P1은 P3보다 많이 필요하다. P2는 P1보다 적게 필요하다. P4는 P3보다 많이 필요하다. P5는 P4보다 많이 필요하다. P1은 P4보다 적게 필요하다. 예산이 가장 많이 필요한 프로젝트는?", choices:["P1","P3","P4","P5"], answer:3, explanation:"P3<P1<P4<P5 순으로 연결되고 P2<P1이므로 P5가 모든 프로젝트보다 예산이 많이 필요한 것으로 유일하게 결정됩니다."},
{category:"문제해결능력", question:"논리적 오류 '인신공격의 오류'에 해당하는 예로 가장 적절한 것은?", choices:["그 사람은 예전에 사기를 친 적이 있으니 이번 제안도 믿을 수 없다.","모두가 반대하니 그 의견은 틀렸다.","내가 만난 외국인 두 명이 불친절했으니 그 나라 사람은 다 그렇다.","이 약을 먹은 후 나았으니 이 약 덕분이다."], answer:0, explanation:"인신공격의 오류는 주장 자체가 아니라 주장을 하는 사람의 인격이나 과거 행실을 근거로 반박하는 오류입니다."},
{category:"문제해결능력", question:"창의적 사고 기법인 '스캠퍼(SCAMPER)'에서 첫 글자 'S'가 의미하는 것은?", choices:["Substitute(대체)","Standard(표준화)","Sort(분류)","Stop(중단)"], answer:0, explanation:"스캠퍼는 대체(Substitute), 결합(Combine), 적용(Adapt), 수정(Modify), 다른 용도(Put to other use), 제거(Eliminate), 재배열(Rearrange/Reverse)의 앞글자를 딴 창의적 사고 기법입니다."},
/* ===================== 자원관리능력 ===================== */
{category:"자원관리능력", question:"시간관리의 효과로 볼 수 없는 것은?", choices:["스트레스 감소","균형적인 삶","생산성 향상","무조건적인 업무량 증가"], answer:3, explanation:"시간관리는 효율적인 시간 활용을 통해 생산성과 삶의 질을 높이는 것이며, 업무량 증가 자체가 목적이 아닙니다."},
{category:"자원관리능력", question:"물적자원 관리의 방해요인이 아닌 것은?", choices:["보관장소를 파악하지 못한 경우","훼손 및 파손된 경우","정기적으로 재고를 점검하는 경우","분실한 경우"], answer:2, explanation:"정기적인 재고 점검은 오히려 물적자원을 효과적으로 관리하는 방법입니다."},
{category:"자원관리능력", question:"SMART 목표 설정 원칙에서 'M'이 의미하는 것은?", choices:["Specific","Measurable","Multiple","Motivated"], answer:1, explanation:"SMART는 Specific, Measurable, Achievable, Relevant, Time-bound의 약자이며 'M'은 측정 가능성(Measurable)을 의미합니다."},
{category:"자원관리능력", question:"업무 A(소요2시간, 마감 오후3시), B(소요1시간, 마감 오후1시), C(소요3시간, 마감 오후5시), D(소요1시간, 마감 오후2시)를 오전9시부터 시작할 때, 모든 마감기한을 지킬 수 있는 처리 순서는?", choices:["A-B-C-D","B-D-A-C","D-B-C-A","C-A-D-B"], answer:1, explanation:"마감기한이 빠른 순서(B 1시→D 2시→A 3시→C 5시)로 처리하면 각각 오전10시, 오전11시, 오후1시, 오후4시에 끝나 모든 기한을 지킬 수 있습니다."},
{category:"자원관리능력", question:"예산관리에서 '간접비'에 해당하는 것은?", choices:["재료비","인건비(직접 투입인력)","사무실 임대료","원료 구입비"], answer:2, explanation:"간접비는 사업에 직접 소요되지 않는 비용으로 사무실 임대료, 보험료, 광고비 등이 해당합니다."},
{category:"자원관리능력", question:"인적자원의 특성 중 '능동성'이 의미하는 것으로 가장 적절한 것은?", choices:["자원의 가치는 사용 시기와 장소에 따라 달라진다","인적자원은 스스로 개발 가능하며 능동적으로 활용된다","인적자원은 다른 자원과 달리 개발될 수 없다","인적자원도 물적자원처럼 소모성 자원이다"], answer:1, explanation:"인적자원은 환경 변화에 그대로 좌우되지 않고 스스로 성과를 결정할 수 있는 능동적 자원입니다."},
{category:"자원관리능력", question:"총 예산 500만원 중 인건비 200만원, 재료비 150만원, 홍보비 80만원을 배정하고 나머지를 예비비로 배정할 때 예비비는?", choices:["50만원","60만원","70만원","80만원"], answer:2, explanation:"500-200-150-80=70만원."},
{category:"자원관리능력", question:"물적자원 관리 과정을 순서대로 나열한 것은? (사용물품과 보관물품 구분 → 유사 물품끼리 분류 → 보관장소 선정)", choices:["보관장소 선정 → 분류 → 구분","구분 → 분류 → 보관장소 선정","분류 → 구분 → 보관장소 선정","보관장소 선정 → 구분 → 분류"], answer:1, explanation:"물적자원 관리는 사용물품·보관물품 구분 → 동일·유사 물품 분류 → 물품 특성에 맞는 보관장소 선정 순으로 진행됩니다."},
{category:"자원관리능력", question:"인력 5명이 하루 8시간씩 10일 동안 끝낼 수 있는 업무량을, 인력을 8명으로 늘려 동일한 하루 8시간 근무로 처리하면 며칠 만에 끝낼 수 있는가? (1인당 생산성 동일 가정)", choices:["5일","6.25일","7일","8일"], answer:1, explanation:"총 작업량은 5명×10일=50인일. 8명이 처리하면 50÷8=6.25일."},
{category:"자원관리능력", question:"시간낭비 요인 중 외적 요인에 해당하는 것은?", choices:["우선순위 없이 일하는 습관","여러 가지 일을 한번에 하려는 태도","동료 및 방문객의 잦은 방문","계획 부족"], answer:2, explanation:"동료·방문객의 잦은 방문은 본인이 통제하기 어려운 외적 요인이며, 나머지는 개인의 습관에서 비롯된 내적 요인입니다."},
{category:"자원관리능력", question:"화요일 오전 회의를 위해 회의실을 예약해야 한다. A회의실은 화요일 오전에 이미 예약이 있고, B회의실은 수용인원 8명으로 참석자 10명을 수용할 수 없다. C회의실은 화요일 오전 예약이 없고 수용인원 12명이며, D회의실은 예약은 없으나 발표에 필요한 프로젝터가 없다. 예약해야 할 회의실은?", choices:["A회의실","B회의실","C회의실","D회의실"], answer:2, explanation:"시간·인원·시설 조건을 모두 만족하는 곳은 C회의실뿐입니다."},
{category:"자원관리능력", question:"예산 수립 시 유의할 점으로 적절하지 않은 것은?", choices:["필요한 활동이나 과업을 도출한다","우선순위를 고려하여 예산을 배정한다","무조건 최저 비용으로 책정하여 예산을 최대한 절감한다","예산과 실제 지출의 차이를 모니터링한다"], answer:2, explanation:"예산은 과업 수행에 필요한 수준으로 적절히 책정해야 하며, 무리한 절감은 과업 수행에 차질을 줄 수 있습니다."},
{category:"자원관리능력", question:"자원관리의 4단계 순서로 옳은 것은?", choices:["자원 확보 → 필요한 자원의 종류·양 확인 → 활용 계획 수립 → 계획대로 수행","필요한 자원의 종류·양 확인 → 자원 확보 → 활용 계획 수립 → 계획에 따른 수행","활용 계획 수립 → 자원 확인 → 확보 → 수행","확보 → 수행 → 계획 수립 → 확인"], answer:1, explanation:"자원관리는 필요한 자원 파악 → 자원 확보 → 활용 계획 수립 → 계획에 따른 수행 순으로 진행됩니다."},
{category:"자원관리능력", question:"총 작업 비용이 1,200만원이고 이 중 직접비가 900만원이라면 간접비의 비율은?", choices:["15%","20%","25%","30%"], answer:2, explanation:"간접비=1,200-900=300만원. 비율=300÷1,200=25%."},
{category:"자원관리능력", question:"A업무를 외부업체에 위탁하면 300만원, 내부에서 처리하면 인건비 200만원과 장비 임대비 50만원이 든다. 비용 측면에서 더 유리한 방법과 절감액은?", choices:["외부위탁, 50만원 절감","내부처리, 50만원 절감","내부처리, 100만원 절감","외부위탁, 100만원 절감"], answer:1, explanation:"내부처리 비용=200+50=250만원, 외부위탁=300만원. 내부처리가 50만원 더 절감됩니다."},
{category:"자원관리능력", question:"'최소자원 투입의 원칙'과 가장 관련 있는 개념은?", choices:["효과성","효율성","형평성","안정성"], answer:1, explanation:"효율성은 투입 자원 대비 산출을 극대화, 즉 최소 자원으로 최대 효과를 얻는 것과 관련됩니다."},
{category:"자원관리능력", question:"인력배치의 원칙 중 '적재적소 배치'가 의미하는 것은?", choices:["팀원의 희망대로만 배치","개인의 역량과 성격 등을 고려하여 최적의 위치에 배치","근속연수 순서로만 배치","무작위로 배치"], answer:1, explanation:"적재적소 배치는 개인의 능력과 성격을 고려하여 그에 맞는 자리에 배치하는 원칙입니다."},
{category:"자원관리능력", question:"물적자원 관리 방법 중 '회전대응 보관의 원칙'이 의미하는 것은?", choices:["입출고 빈도가 높은 물품을 출입구 가까운 곳에 보관","무게가 무거운 물품을 아래에 보관","물품을 알파벳 순서로 보관","물품을 색상별로 보관"], answer:0, explanation:"회전대응 보관의 원칙은 입출고 빈도(사용 빈도)를 고려하여 자주 쓰는 물품을 출입구와 가까운 곳에 보관하는 것입니다."},
{category:"자원관리능력", question:"프로젝트 예산이 부족할 때 대응 방법으로 가장 적절하지 않은 것은?", choices:["우선순위가 낮은 활동의 예산을 축소한다","불필요한 지출 항목을 재검토한다","계획했던 품질 기준을 사전 협의 없이 임의로 낮춘다","예산 초과 원인을 분석한다"], answer:2, explanation:"품질 기준을 협의 없이 임의로 낮추는 것은 신뢰를 저해하는 부적절한 대응입니다."},
{category:"자원관리능력", question:"시간계획의 기본 원리인 '60:40의 법칙'이 의미하는 것으로 가장 적절한 것은?", choices:["계획된 행동 60%, 계획 외 행동(우발상황·자발행동) 40%의 비율로 시간 배정","업무의 60%만 완료해도 충분하다","근무시간의 60%는 회의에 사용한다","하루의 60%는 휴식한다"], answer:0, explanation:"60:40의 법칙은 전체 시간 중 60%는 계획된 행동에, 40%는 예측하지 못한 사건이나 자발적 행동에 대응하기 위해 남겨두는 원리입니다."},
{category:"자원관리능력", question:"자원관리의 대상이 되는 4대 자원에 해당하지 않는 것은?", choices:["시간","예산","물적자원","지적재산권"], answer:3, explanation:"자원관리의 4대 자원은 시간, 예산(돈), 물적자원, 인적자원입니다. 지적재산권은 이 4대 자원 분류에 포함되지 않습니다."},
{category:"자원관리능력", question:"자원관리에 실패하는 원인으로 보기 어려운 것은?", choices:["비계획적 행동","편리성 추구","자원 활용에 대한 명확한 목표 설정","자원 관리 노하우 부족"], answer:2, explanation:"명확한 목표 설정은 자원관리의 성공 요인이며, 실패 원인이 아닙니다."},
{category:"자원관리능력", question:"시간관리 매트릭스에서 '중요하지만 긴급하지 않은 일'에 해당하는 활동으로 가장 적절한 것은?", choices:["장기적 역량 개발을 위한 자기계발","마감이 임박한 보고서 작성","갑작스러운 민원 응대","의미 없는 잡무 처리"], answer:0, explanation:"자기계발은 중요도는 높지만 당장 긴급하지 않은 활동의 대표적 예입니다."},
{category:"자원관리능력", question:"파레토법칙(80:20 법칙)을 업무관리에 적용한 설명으로 가장 적절한 것은?", choices:["모든 업무는 동일한 중요도를 가진다","전체 성과의 80%는 상위 20%의 핵심 업무에서 창출된다","업무의 80%를 먼저 처리해야 한다","20%의 인력이 80%의 비용을 사용해야 한다"], answer:1, explanation:"파레토법칙은 소수의 핵심 요인(20%)이 전체 성과(80%)의 대부분을 좌우한다는 원리입니다."},
{category:"자원관리능력", question:"시간계획 수립의 일반적 순서로 옳은 것은?", choices:["시간계획서 작성 → 목표 설정 → 우선순위 판단","우선순위 판단 → 시간계획서 작성 → 목표 설정","예상 소요시간 산정 → 목표 설정 → 시간계획서 작성","목표 설정 → 우선순위 판단 → 예상 소요시간 산정 → 시간계획서 작성"], answer:3, explanation:"시간계획은 목표 설정 후 우선순위를 판단하고, 예상 소요시간을 산정한 뒤 시간계획서를 작성하는 순서로 진행됩니다."},
{category:"자원관리능력", question:"다음 중 직접비에 해당하지 않는 것은?", choices:["재료비","인건비","시설비","건물 관리비"], answer:3, explanation:"건물 관리비는 간접비에 해당하며, 나머지는 사업 수행에 직접 소요되는 직접비입니다."},
{category:"자원관리능력", question:"다음 중 간접비에 해당하지 않는 것은?", choices:["보험료","광고비","통신비","원료 구입비"], answer:3, explanation:"원료 구입비는 직접비이며, 보험료·광고비·통신비는 사업에 직접 소요되지 않는 간접비입니다."},
{category:"자원관리능력", question:"물적자원 관리 원칙 중 '동일 및 유사 물품을 함께 보관'하는 원칙의 목적으로 가장 적절한 것은?", choices:["분실 시 책임을 분산시키기 위해","보관장소를 최소화하기 위해","물품을 찾을 때 시간과 노력을 줄이기 위해","물품의 가격을 낮추기 위해"], answer:2, explanation:"동일·유사 물품을 함께 보관하면 필요할 때 신속하게 찾아 사용할 수 있어 시간과 노력을 절감할 수 있습니다."},
{category:"자원관리능력", question:"물품 보관 시 '명칭이나 유형을 기재하여 파악이 쉽도록 하는' 원칙은?", choices:["회전대응 보관의 원칙","통로대면의 원칙","표시의 원칙","유사성의 원칙"], answer:2, explanation:"표시의 원칙은 물품에 명칭이나 종류를 기재해 쉽게 파악할 수 있도록 하는 원칙입니다."},
{category:"자원관리능력", question:"예산관리에서 '무조건 예산을 최대한 아껴 남기는 것'이 바람직하지 않은 이유로 가장 적절한 것은?", choices:["예산이 남으면 세금이 늘어나기 때문","과도한 절감이 계획된 과업의 품질이나 완성도를 떨어뜨릴 수 있기 때문","예산은 항상 초과되어야 하기 때문","예산 절감은 법으로 금지되어 있기 때문"], answer:1, explanation:"예산은 과업 수행에 필요한 적정 수준으로 책정해야 하며, 무리한 절감은 오히려 과업의 품질을 저해할 수 있습니다."},
{category:"자원관리능력", question:"인력배치의 3원칙 중 '팀 전체의 능력을 고려하여 팀원 전체가 균형 있게 배치되도록 하는' 원칙은?", choices:["적재적소주의","능력주의","균형주의","성과주의"], answer:2, explanation:"균형주의는 팀이나 조직 전체의 관점에서 인력이 균형 있게 배치되도록 하는 원칙입니다."},
{category:"자원관리능력", question:"인력배치의 3원칙 중 '개인이 가진 능력과 성향을 발휘할 수 있는 위치에 배치'하는 원칙은?", choices:["적재적소주의","능력주의","균형주의","성과주의"], answer:0, explanation:"적재적소주의는 개인의 능력과 성향에 맞는 위치에 배치하는 원칙입니다."},
{category:"자원관리능력", question:"인력배치의 3원칙 중 '능력주의'에 대한 설명으로 가장 적절한 것은?", choices:["근속연수가 긴 사람을 우선 배치한다","성과를 낼 수 있는 여건을 만들어 주며 능력을 발휘하도록 하는 원칙이다","출신 지역을 고려하여 배치한다","무작위로 배치하는 원칙이다"], answer:1, explanation:"능력주의는 능력을 발휘할 수 있는 기회와 여건을 부여하고 그에 따른 성과를 평가하는 원칙입니다."},
{category:"자원관리능력", question:"시간자원의 특성으로 가장 적절한 것은?", choices:["비축하여 나중에 사용할 수 있다","누구에게나 동일한 속도로 흘러간다","사용하지 않으면 가치가 증가한다","사람마다 하루의 시간량이 다르다"], answer:1, explanation:"시간은 누구에게나 동일한 속도로 흘러가며 저장하거나 재사용할 수 없는 특성을 가집니다."},
{category:"자원관리능력", question:"물적자원 활용의 방해요인 중 '보관장소를 파악하지 못하는 경우'를 예방하는 방법으로 가장 적절한 것은?", choices:["물품을 다양한 장소에 나누어 보관한다","물품 목록과 보관위치를 기록·관리한다","물품을 최대한 많이 구매한다","물품 사용을 최소화한다"], answer:1, explanation:"물품 목록과 보관위치를 기록·관리하면 필요할 때 신속히 찾을 수 있습니다."},
{category:"자원관리능력", question:"'효과성'과 '효율성'의 차이를 가장 올바르게 설명한 것은?", choices:["효과성은 투입 대비 산출의 비율을, 효율성은 목표 달성 여부를 의미한다","효과성은 목표를 얼마나 달성했는가를, 효율성은 투입 자원 대비 산출을 얼마나 극대화했는가를 의미한다","효과성과 효율성은 완전히 같은 의미이다","효과성과 효율성은 예산관리에서만 사용되는 개념이다"], answer:1, explanation:"효과성은 목표 달성도를, 효율성은 투입 자원 대비 산출의 극대화 정도를 의미합니다."},
{category:"자원관리능력", question:"예산 수립 방식인 'Bottom-up 방식'에 대한 설명으로 가장 적절한 것은?", choices:["경영진이 전체 예산을 먼저 정하고 부서별로 배분하는 방식","각 부서나 활동 단위에서 필요한 예산을 산정해 취합하여 전체 예산을 수립하는 방식","예산을 아예 수립하지 않는 방식","전년도 예산을 그대로 사용하는 방식"], answer:1, explanation:"Bottom-up 방식은 하위 단위에서 필요한 예산을 산정해 상위로 취합하는 방식입니다."},
{category:"자원관리능력", question:"예산 수립 방식인 'Top-down 방식'에 대한 설명으로 가장 적절한 것은?", choices:["조직 전체의 목표 예산을 먼저 설정한 뒤 하위 부서에 배분하는 방식","각 팀원이 자율적으로 예산을 정하는 방식","예산을 실행 후에 사후적으로 산정하는 방식","고객의 요구에 따라서만 예산을 정하는 방식"], answer:0, explanation:"Top-down 방식은 조직 전체의 목표 예산을 먼저 정하고 이를 하위 부서에 배분하는 방식입니다."},
{category:"자원관리능력", question:"다음 중 물적자원으로 분류하기 어려운 것은?", choices:["생산 설비","원재료","사무용품","조직 구성원의 노하우"], answer:3, explanation:"조직 구성원의 노하우는 인적자원의 역량에 해당하며, 물적자원으로 분류되지 않습니다."},
{category:"자원관리능력", question:"인적자원관리의 특성으로 옳지 않은 것은?", choices:["개발 가능성을 지닌 자원이다","전략적 자원으로 활용될 수 있다","환경변화와 관계없이 항상 동일한 성과를 낸다","능동성을 지닌 자원이다"], answer:2, explanation:"인적자원은 환경과 조건, 관리 방식에 따라 성과가 달라지는 능동적 자원입니다."},
{category:"자원관리능력", question:"시간관리를 위한 구체적 방법으로 적절하지 않은 것은?", choices:["할 일 목록(To-do List) 작성","우선순위에 따라 일을 처리","모든 요청을 즉시, 순서와 관계없이 처리","정해진 시간 동안 집중해서 일하기(타임블로킹)"], answer:2, explanation:"우선순위를 고려하지 않고 모든 요청을 즉시 처리하는 것은 효과적인 시간관리 방법이 아닙니다."},
{category:"자원관리능력", question:"회의 자원(시간, 장소, 인력)을 효율적으로 관리하기 위한 방법으로 가장 적절하지 않은 것은?", choices:["회의 목적과 안건을 사전에 공유한다","회의 시간을 명확히 정하고 지킨다","안건과 무관한 인원도 모두 참석시킨다","회의록을 작성하여 결과를 공유한다"], answer:2, explanation:"안건과 무관한 인원을 참석시키는 것은 인력자원을 비효율적으로 사용하는 것입니다."},
{category:"자원관리능력", question:"자원의 낭비를 유발하는 요인으로 보기 어려운 것은?", choices:["자원에 대한 인식 부재","노하우 부족","계획적인 자원 활용","편리성 추구"], answer:2, explanation:"계획적인 자원 활용은 낭비를 방지하는 요인이며, 낭비의 원인이 아닙니다."},
{category:"자원관리능력", question:"물적자원관리에서 '통로대면의 원칙'이 의미하는 것으로 가장 적절한 것은?", choices:["물품을 쉽게 찾을 수 있도록 통로 면에 보관하는 원칙","물품을 색상별로 진열하는 원칙","가장 무거운 물품을 통로에 두는 원칙","통로를 최대한 좁게 만드는 원칙"], answer:0, explanation:"통로대면의 원칙은 물품을 통로 면에 보관하여 쉽게 찾고 이동할 수 있도록 하는 원칙입니다."},
{category:"자원관리능력", question:"인적자원의 특성인 '개발가능성'에 대한 설명으로 가장 적절한 것은?", choices:["환경변화와 관계없이 성과가 고정되어 있다","교육과 훈련을 통해 잠재력과 능력을 지속적으로 개발할 수 있다","한번 정해진 역량은 변하지 않는다","물적자원과 마찬가지로 소모되기만 한다"], answer:2, explanation:"인적자원은 교육과 훈련을 통해 잠재력을 지속적으로 개발할 수 있는 특성을 지닙니다."},
{category:"자원관리능력", question:"시간낭비를 유발하는 요인 중 '내적 요인'에 해당하는 것은?", choices:["상급자의 갑작스러운 지시","동료의 잦은 방문","우선순위를 정하지 않고 일하는 습관","예상치 못한 정전"], answer:2, explanation:"우선순위를 정하지 않는 습관은 본인의 행동에서 비롯된 내적 요인이며, 나머지는 외적 요인입니다."},
{category:"자원관리능력", question:"예산관리의 기본 원칙으로 가장 적절한 것은?", choices:["필요한 과업을 도출하고 우선순위를 고려하여 배정한다","모든 항목에 동일한 예산을 배정한다","예산은 한 번 정하면 절대 수정하지 않는다","예산 계획 없이 필요할 때마다 지출한다"], answer:0, explanation:"예산관리는 필요한 과업을 도출하고 우선순위에 따라 예산을 배정하는 것이 기본 원칙입니다."},
{category:"자원관리능력", question:"'물품의 특성에 맞는 보관 장소를 선정'해야 하는 이유로 가장 적절한 것은?", choices:["물품의 재질이나 형태에 따라 훼손·분실을 방지하고 활용도를 높이기 위해","보관 장소를 다양화하여 찾기 어렵게 만들기 위해","물품의 가격을 인위적으로 높이기 위해","보관 비용을 무조건 최대화하기 위해"], answer:0, explanation:"물품의 특성에 맞는 장소에 보관하면 훼손·분실을 방지하고 필요할 때 원활히 활용할 수 있습니다."},
{category:"자원관리능력", question:"시간관리에 대한 설명으로 옳은 것은?", choices:["시간관리는 창의적인 업무를 하는 사람에게는 불필요하다","시간에 쫓기지 않고 계획적으로 대응하기 위해 시간관리가 필요하다","시간관리를 철저히 하면 오히려 창의성이 항상 떨어진다","시간관리는 정해진 업무가 없는 사람에게만 필요하다"], answer:1, explanation:"시간관리는 예측 가능한 계획적 대응을 통해 스트레스를 줄이고 생산성을 높이기 위해 누구에게나 필요합니다."},
{category:"자원관리능력", question:"자원관리 계획을 수립할 때 고려해야 할 사항으로 가장 적절하지 않은 것은?", choices:["필요한 자원의 종류와 양을 정확히 파악한다","이용 가능한 자원을 실제 필요한 양보다 여유 있게 확보하는 것을 고려한다","확보한 자원을 활용할 계획을 수립한다","계획은 수립 이후 절대 수정하지 않는다"], answer:3, explanation:"자원관리 계획은 상황 변화에 따라 유연하게 수정·보완할 수 있어야 합니다."},
{category:"자원관리능력", question:"물적자원의 종류 구분으로 옳은 것은?", choices:["자연자원과 인공자원","시간자원과 예산자원","인적자원과 조직자원","유동자원과 고정자원"], answer:0, explanation:"물적자원은 자연에서 얻어지는 자연자원과 인공적으로 만들어진 인공자원으로 구분됩니다."},
{category:"자원관리능력", question:"인적자원관리에서 '팀워크 향상'을 위한 방안으로 가장 적절하지 않은 것은?", choices:["구성원 간 정보와 의견을 공유한다","역할과 책임을 명확히 한다","성과에 대한 공정한 평가와 피드백을 제공한다","개인의 성과만을 강조하고 협업을 배제한다"], answer:3, explanation:"개인 성과만을 강조하고 협업을 배제하면 팀워크가 저해됩니다."},
{category:"자원관리능력", question:"시간계획 시 '유연성'을 고려해야 하는 이유로 가장 적절한 것은?", choices:["돌발 상황이나 우선순위 변화에 대응할 여유가 필요하기 때문","계획이 완벽하면 예상치 못한 일이 생기지 않기 때문","계획은 한번 세우면 절대 바꾸지 않아야 하기 때문","유연성은 시간관리와 무관하기 때문"], answer:0, explanation:"시간계획에 여유(유연성)를 두어야 돌발 상황이나 우선순위 변화에 효과적으로 대응할 수 있습니다."},
{category:"자원관리능력", question:"물품관리 시 '유사성의 원칙'을 적용한 예로 가장 적절한 것은?", choices:["사무용품 중 필기류를 한 곳에, 서류는 다른 한 곳에 모아 보관한다","모든 물품을 무작위로 뒤섞어 보관한다","사용 빈도와 무관하게 아무 곳에나 보관한다","가장 비싼 물품만 따로 잠금 보관하고 나머지는 관리하지 않는다"], answer:0, explanation:"유사성의 원칙은 유사한 종류의 물품을 함께 모아 보관하는 것입니다."},
{category:"자원관리능력", question:"예산 항목 중 '출장(여행) 경비'가 속하는 비용 유형은?", choices:["간접비","직접비","예산 항목이 아님","세금"], answer:1, explanation:"출장 경비는 프로젝트 수행에 직접 소요되는 비용으로 직접비에 해당합니다."},
{category:"자원관리능력", question:"시간관리 매트릭스에서 '긴급하지도 중요하지도 않은 일'을 처리하는 방법으로 가장 적절한 것은?", choices:["최우선으로 처리한다","과감히 줄이거나 제거한다","다른 사람에게 위임할 필요 없이 직접 처리한다","가장 많은 시간을 투입한다"], answer:1, explanation:"긴급하지도 중요하지도 않은 일은 과감히 줄이거나 제거하는 것이 바람직합니다."},
{category:"자원관리능력", question:"물품이 훼손되는 것을 예방하기 위한 방법으로 가장 적절한 것은?", choices:["물품의 재질과 특성에 맞지 않는 환경에 보관한다","사용 후 아무 곳에나 방치한다","파손 여부와 관계없이 동일하게 관리한다","정기적으로 물품 상태를 점검하고 적절한 보관 환경을 유지한다"], answer:3, explanation:"정기적인 상태 점검과 적절한 보관 환경 유지가 훼손 예방의 핵심입니다."},
{category:"자원관리능력", question:"'자원의 유한성'이 자원관리에서 중요한 이유로 가장 적절한 것은?", choices:["자원은 무한하므로 관리가 불필요하기 때문","한정된 자원을 효율적으로 배분해야 목표를 달성할 수 있기 때문","자원이 유한하면 목표를 세울 필요가 없기 때문","자원의 유한성은 예산에만 적용되기 때문"], answer:1, explanation:"자원은 한정되어 있으므로 효율적으로 배분해야 목표를 효과적으로 달성할 수 있습니다."},
{category:"자원관리능력", question:"인적자원관리에서 '라포(rapport)'가 의미하는 것으로 가장 적절한 것은?", choices:["서로 신뢰하고 감정적으로 통하는 친근한 관계","업무 성과를 수치화한 지표","조직의 위계질서","급여 체계"], answer:0, explanation:"라포는 상호 신뢰와 친근감을 바탕으로 한 관계를 의미합니다."},
{category:"자원관리능력", question:"무형자원에 해당하는 것은?", choices:["토지","설비","원자재","지적 재산권 및 네트워크"], answer:3, explanation:"지적 재산권, 네트워크 등은 형태가 없는 무형자원에 해당하며, 나머지는 유형의 물적자원입니다."},
{category:"자원관리능력", question:"예산관리에서 '직접비'와 '간접비'를 구분하는 이유로 가장 적절한 것은?", choices:["단순히 회계 규칙을 지키기 위해","사업 수행에 필요한 비용 구조를 정확히 파악하여 효율적으로 관리하기 위해","세금을 줄이기 위해","예산을 무조건 늘리기 위해"], answer:1, explanation:"직접비와 간접비를 구분하면 비용 구조를 정확히 파악하여 예산을 효율적으로 관리할 수 있습니다."},
{category:"자원관리능력", question:"업무 E(소요2시간, 마감13시), F(소요1시간, 마감10시), G(소요3시간, 마감17시), H(소요2시간, 마감15시)를 오전8시부터 처리할 때, 모든 마감기한을 지키는 처리 순서는?", choices:["F-E-H-G","E-F-G-H","G-H-E-F","F-H-E-G"], answer:0, explanation:"마감이 빠른 순서(F 10시→E 13시→H 15시→G 17시)로 처리하면 각각 9시, 11시, 13시, 16시에 끝나 모든 기한을 지킬 수 있습니다."},
{category:"자원관리능력", question:"시급 12,000원인 직원 5명이 하루 6시간씩 4일간 근무했을 때 총 인건비는?", choices:["1,200,000원","1,320,000원","1,440,000원","1,560,000원"], answer:2, explanation:"12,000×5×6×4=1,440,000원."},
{category:"자원관리능력", question:"프로젝트 총 예산 800만원 중 인건비가 45%, 재료비가 30%를 차지한다면 나머지(기타 경비)는?", choices:["150만원","180만원","200만원","220만원"], answer:2, explanation:"100%-45%-30%=25%. 800만원×0.25=200만원."},
{category:"자원관리능력", question:"어떤 작업을 인부 6명이 하면 15일이 걸린다. 같은 작업을 9일 만에 끝내려면 몇 명이 필요한가? (1인당 작업량 동일)", choices:["8명","9명","12명","10명"], answer:3, explanation:"총 작업량=6×15=90인일. 90÷9=10명."},
{category:"자원관리능력", question:"총 작업비용이 2,000만원이고 간접비가 직접비의 25%일 때, 직접비는?", choices:["1,600만원","1,500만원","1,700만원","1,800만원"], answer:0, explanation:"직접비를 x라 하면 x+0.25x=1.25x=2,000만원 → x=1,600만원."},
{category:"자원관리능력", question:"프로젝트를 외부업체 A는 총액 480만원, 외부업체 B는 착수금 200만원과 완료 후 잔금 250만원을 요구한다. 비용이 더 적게 드는 업체와 절감액은?", choices:["B, 30만원 절감","A, 30만원 절감","B, 50만원 절감","A, 50만원 절감"], answer:0, explanation:"A=480만원, B=200+250=450만원. B가 30만원 더 적습니다."},
{category:"자원관리능력", question:"하루 근무시간이 8시간일 때, 60:40의 법칙에 따라 계획된 행동에 배정해야 하는 시간은?", choices:["3.6시간","4.2시간","4.8시간","5.4시간"], answer:2, explanation:"8시간×0.6=4.8시간."},
{category:"자원관리능력", question:"회의실 대여료가 참석 인원 1인당 5,000원씩 부과된다. 원래 12명 기준이던 참석 인원이 늘어 총 대여료가 90,000원이 되었다면, 참석 인원은 원래보다 몇 명 증가한 것인가?", choices:["4명","5명","7명","6명"], answer:3, explanation:"90,000÷5,000=18명. 18-12=6명 증가."},
{category:"자원관리능력", question:"예산 300만원을 부서 A, B, C에 2:3:5의 비율로 나눈다면 C부서가 받는 금액은?", choices:["150만원","90만원","120만원","180만원"], answer:0, explanation:"전체 비율 합=10. C=5/10×300만원=150만원."},
{category:"자원관리능력", question:"직원 3명이 하루 5시간씩 8일 동안 처리하는 업무량을, 직원 4명이 하루 4시간씩 근무해 처리하면 며칠이 걸리는가? (1인당 작업속도 동일)", choices:["6일","7.5일","6.5일","7일"], answer:1, explanation:"총 작업량=3×5×8=120인시간. 4명×4시간=16시간/일. 120÷16=7.5일."},
{category:"자원관리능력", question:"창고에 있는 상자 450개를 지게차 A(시간당 30개), 지게차 B(시간당 20개)가 동시에 옮긴다면 모두 옮기는 데 걸리는 시간은?", choices:["7시간","8시간","9시간","10시간"], answer:2, explanation:"합산 처리량=30+20=50개/시간. 450÷50=9시간."},
{category:"자원관리능력", question:"예산 편성 시 인건비 300만원, 재료비 180만원이 소요되며 간접비가 전체 예산의 20%를 차지한다면 전체 예산은?", choices:["500만원","550만원","650만원","600만원"], answer:3, explanation:"직접비=480만원. 전체를 T라 하면 T×0.8=480만원 → T=600만원."},
{category:"자원관리능력", question:"물품 A 200개를 보관하는 데 필요한 창고 면적이 40㎡라면, 같은 비율로 물품 350개를 보관하는 데 필요한 면적은?", choices:["70㎡","60㎡","65㎡","75㎡"], answer:0, explanation:"1개당 면적=40÷200=0.2㎡. 350×0.2=70㎡."},
{category:"자원관리능력", question:"4개 업무의 중요도(1~5)와 긴급도(1~5)가 A(중요5,긴급2), B(중요3,긴급5), C(중요4,긴급4), D(중요2,긴급1)이다. 중요도×긴급도 값이 가장 큰 업무부터 처리한다면 가장 먼저 처리할 업무는?", choices:["A","C","B","D"], answer:1, explanation:"A=10, B=15, C=16, D=2. C의 값이 가장 큽니다."},
{category:"자원관리능력", question:"인턴 4명이 서류 240건을 균등하게 나누어 처리한다면 1인당 처리해야 하는 서류는?", choices:["50건","55건","60건","65건"], answer:2, explanation:"240÷4=60건."},
{category:"자원관리능력", question:"예산 1,000만원 중 700만원을 이미 집행했다면, 남은 예산은 전체의 몇 %인가?", choices:["20%","25%","30%","35%"], answer:2, explanation:"(1,000-700)÷1,000=30%."},
{category:"자원관리능력", question:"A업무는 3명이 4일, B업무는 2명이 6일 걸린다(두 업무는 서로 독립적이며 인력은 겹치지 않음). 두 업무를 동시에 진행하는 데 필요한 최소 동시 투입 인원은?", choices:["3명","4명","5명","6명"], answer:2, explanation:"A업무에 3명, B업무에 2명이 동시에 필요하므로 합산 5명이 필요합니다."},
{category:"자원관리능력", question:"창고 임대료가 월 80만원인데, 보관 물품이 늘어 창고를 1.5배 넓혀야 한다면 예상 월 임대료는? (면적에 비례)", choices:["100만원","120만원","110만원","130만원"], answer:1, explanation:"80만원×1.5=120만원."},
{category:"자원관리능력", question:"월 예산 500만원 중 하루 평균 20만원씩 소진한다면, 예산이 모두 소진되기까지 며칠이 걸리는가?", choices:["20일","22일","25일","28일"], answer:2, explanation:"500÷20=25일."},
{category:"자원관리능력", question:"인력 A(1일 8건 처리), B(1일 5건 처리)가 함께 일하면 총 260건을 처리하는 데 며칠이 걸리는가?", choices:["18일","20일","22일","24일"], answer:1, explanation:"합산 처리량=8+5=13건/일. 260÷13=20일."},
{category:"자원관리능력", question:"인건비 예산 900만원을 근무일수에 비례하여 갑, 을, 병 세 명에게 배분한다. 갑 20일, 을 15일, 병 10일 근무했다면 갑이 받는 금액은?", choices:["350만원","400만원","380만원","420만원"], answer:1, explanation:"총 근무일=45일. 갑의 비율=20/45. 900만원×20/45=400만원."},
{category:"자원관리능력", question:"회의 자료를 1인당 30장씩 인쇄해야 하며 참석자가 25명이다. 프린터 한 대가 1분에 12장을 인쇄할 수 있다면 전체 인쇄에 걸리는 시간은?", choices:["55분","58분","62.5분","65분"], answer:2, explanation:"총 인쇄량=30×25=750장. 750÷12=62.5분."},
{category:"자원관리능력", question:"예산 640만원을 프로젝트 진행률에 따라 지급하기로 했다. 1단계(40% 진행) 완료 시 지급받는 금액은?", choices:["216만원","236만원","276만원","256만원"], answer:3, explanation:"640만원×0.4=256만원."},
{category:"자원관리능력", question:"어떤 자재를 kg당 3,500원에 구매한다. 예산 700,000원으로 구매할 수 있는 최대 자재 양은?", choices:["200kg","180kg","190kg","210kg"], answer:0, explanation:"700,000÷3,500=200kg."},
{category:"자원관리능력", question:"동일한 업무를 A팀은 6시간, B팀은 8시간, C팀은 12시간에 처리한다. 세 팀이 함께 처리하면 걸리는 시간은?", choices:["2시간","8/3시간(약 2.67시간)","2.4시간","3시간"], answer:1, explanation:"시간당 처리율 합=1/6+1/8+1/12=9/24=3/8. 전체 소요시간=8/3시간(약 2.67시간)."},
{category:"자원관리능력", question:"인력 10명이 하루 6시간씩 근무하여 5일 만에 끝낸 작업을, 인력 15명이 하루 4시간씩 근무하면 며칠이 걸리는가?", choices:["4일","5일","6일","7일"], answer:1, explanation:"총 작업량=10×6×5=300인시간. 15명×4시간=60시간/일. 300÷60=5일."},
{category:"자원관리능력", question:"물품구매 예산 250만원 중 소모품에 60%, 사무기기에 25%를 배정하면 나머지 예비 예산은?", choices:["30만원","32.5만원","35만원","37.5만원"], answer:3, explanation:"100%-60%-25%=15%. 250만원×0.15=37.5만원."},
{category:"자원관리능력", question:"A창고에서 B창고까지 물품을 옮기는 데 트럭 1대로는 왕복 4회가 필요하며, 왕복 1회에 40분이 걸린다. 트럭 2대를 동시에 운행하여 균등하게 나누어 운송하면 전체 운송이 완료되는 데 걸리는 시간은?", choices:["80분","40분","60분","160분"], answer:0, explanation:"트럭 2대가 각각 2회씩 왕복하면 되므로 소요시간=2×40분=80분."},
{category:"자원관리능력", question:"직원 1인당 사무용품 지급 예산이 15,000원이고 직원이 48명일 때 전체 예산은?", choices:["680,000원","720,000원","700,000원","740,000원"], answer:1, explanation:"15,000×48=720,000원."},
{category:"자원관리능력", question:"프로젝트 기간이 원래 20일 걸릴 예정이었으나 인력을 25% 추가 투입하여 기간을 단축했다. 추가 투입 후 소요 기간은? (작업량 동일, 인력과 기간은 반비례)", choices:["14일","15일","16일","18일"], answer:2, explanation:"원래 인력을 P, 총 작업량=20P. 새 인력=1.25P. 새 기간=20P÷1.25P=16일."},
{category:"자원관리능력", question:"예산 480만원을 A, B 두 활동에 5:7 비율로 배분한다면 B활동에 배정되는 금액은?", choices:["240만원","260만원","300만원","280만원"], answer:3, explanation:"전체 비율 합=12. B=7/12×480만원=280만원."},
{category:"자원관리능력", question:"재고 물품 1,200개를 매일 40개씩 사용한다면 재고가 모두 소진되기까지 며칠이 걸리는가?", choices:["30일","25일","28일","32일"], answer:0, explanation:"1,200÷40=30일."},
{category:"자원관리능력", question:"업무 우선순위 점수를 중요도(40%)와 긴급도(60%)의 가중평균으로 계산한다. 업무 X의 중요도 80점, 긴급도 60점일 때 가중평균 점수는?", choices:["62점","68점","65점","70점"], answer:1, explanation:"80×0.4+60×0.6=32+36=68점."},
{category:"자원관리능력", question:"어느 부서의 연간 예산이 1억 2천만원이고 이를 12개월 균등 배분한다면 월 예산은?", choices:["900만원","950만원","1,000만원","1,050만원"], answer:2, explanation:"12,000만원÷12=1,000만원."},
{category:"자원관리능력", question:"인쇄물 1,000장을 인쇄해야 하는데 프린터 A는 1분에 25장, 프린터 B는 1분에 15장을 인쇄한다. 두 대를 동시에 사용하면 인쇄를 마치는 데 걸리는 시간은?", choices:["20분","22분","28분","25분"], answer:3, explanation:"합산 인쇄속도=25+15=40장/분. 1,000÷40=25분."},
{category:"자원관리능력", question:"예산 550만원 중 320만원을 이미 사용했다. 남은 예산으로 1개당 15만원인 장비를 최대 몇 개 구매할 수 있는가?", choices:["15개","13개","14개","16개"], answer:0, explanation:"남은 예산=550-320=230만원. 230÷15=15.33이므로 최대 15개 구매 가능합니다."},
{category:"자원관리능력", question:"직원 A는 문서 1건을 처리하는 데 20분, 직원 B는 30분이 걸린다. 두 사람이 각자 독립적으로 하루 8시간 동안 처리할 수 있는 총 문서 건수는?", choices:["32건","40건","36건","44건"], answer:1, explanation:"A는 시간당 3건, B는 시간당 2건 처리. 합산 5건/시간×8시간=40건."},
{category:"자원관리능력", question:"예산 90만원으로 1개 6만원인 의자와 1개 3만원인 테이블을 구매하려 한다. 의자를 10개 구매하고 남은 예산으로 구매할 수 있는 테이블의 최대 개수는?", choices:["8개","9개","10개","11개"], answer:2, explanation:"의자 10개=60만원. 남은 예산=30만원. 30÷3=10개."},
{category:"자원관리능력", question:"프로젝트가 원래 인력 4명 기준 24일이 걸릴 예정이었다. 인력을 6명으로 늘리면 며칠 만에 끝나는가? (작업량과 인력은 반비례)", choices:["14일","15일","18일","16일"], answer:3, explanation:"총 작업량=4×24=96인일. 96÷6=16일."},
/* ===================== 정보능력 ===================== */
{category:"정보능력", question:"엑셀에서 특정 조건을 만족하는 셀들의 합계를 구하는 함수는?", choices:["VLOOKUP","SUMIF","COUNTIF","IFERROR"], answer:1, explanation:"SUMIF는 조건을 만족하는 셀의 합계를 구하는 함수입니다."},
{category:"정보능력", question:"엑셀 함수 =VLOOKUP(A1, B1:D10, 3, FALSE)의 기능으로 옳은 것은?", choices:["A1값을 B1:D10의 첫 열에서 찾아 정확히 일치할 때 3번째 열의 값을 반환","A1값을 3번째 행에서 찾는다","B1:D10의 평균을 구한다","A1이 B1:D10에 있는지 TRUE/FALSE로만 반환"], answer:0, explanation:"VLOOKUP(찾을값, 범위, 반환할 열 번호, 정확히 일치 여부)로, FALSE는 정확히 일치하는 값만 찾으라는 의미입니다."},
{category:"정보능력", question:"다음 시간 단위를 큰 것부터 작은 것 순서로 나열한 것은? (ms, μs, ns, ps)", choices:["ms > μs > ns > ps","ps > ns > μs > ms","ns > ms > ps > μs","μs > ms > ns > ps"], answer:0, explanation:"1ms=10⁻³s, 1μs=10⁻⁶s, 1ns=10⁻⁹s, 1ps=10⁻¹²s이므로 ms>μs>ns>ps 순입니다."},
{category:"정보능력", question:"이진수 1011을 10진수로 변환한 값은?", choices:["9","10","11","12"], answer:2, explanation:"1011₂ = 1×8+0×4+1×2+1×1 = 8+0+2+1 = 11."},
{category:"정보능력", question:"정보보안의 3대 요소가 아닌 것은?", choices:["기밀성(Confidentiality)","무결성(Integrity)","가용성(Availability)","확장성(Scalability)"], answer:3, explanation:"정보보안의 3대 요소는 기밀성, 무결성, 가용성이며 확장성은 이에 해당하지 않습니다."},
{category:"정보능력", question:"엑셀 함수 =IF(B2>=80,\"합격\",\"불합격\")의 의미로 옳은 것은?", choices:["B2가 80 이상이면 합격, 그렇지 않으면 불합격 표시","B2가 80 초과이면 합격","B2와 80이 같으면 합격","B2가 80 이하이면 합격"], answer:0, explanation:"IF(조건, 참일 때 값, 거짓일 때 값) 구조로, B2>=80은 80 이상을 의미합니다."},
{category:"정보능력", question:"IPv4의 주소 표현 방식으로 옳은 것은?", choices:["8비트씩 4개 구간, 총 32비트","16비트씩 8개 구간, 총 128비트","8비트씩 8개 구간","32비트씩 4개 구간"], answer:0, explanation:"IPv4는 8비트씩 4개 구간(옥텟)으로 구성되어 총 32비트입니다. (IPv6는 16비트×8구간, 128비트)"},
{category:"정보능력", question:"컴퓨터 바이러스 예방 및 대응 방법으로 적절하지 않은 것은?", choices:["백신 프로그램을 최신 버전으로 유지한다","출처가 불분명한 이메일 첨부파일은 실행하지 않는다","중요한 자료는 정기적으로 백업한다","무료 소프트웨어는 출처와 상관없이 모두 다운로드하여 사용한다"], answer:3, explanation:"출처가 불분명한 소프트웨어를 무분별하게 다운로드하는 것은 바이러스 감염 위험을 높입니다."},
{category:"정보능력", question:"엑셀에서 여러 조건을 모두 만족하는 셀의 개수를 구하는 함수는?", choices:["COUNT","COUNTA","COUNTIFS","SUMIFS"], answer:2, explanation:"COUNTIFS는 여러 조건을 모두 만족하는 셀의 개수를 구하는 함수입니다."},
{category:"정보능력", question:"데이터베이스에서 기본키(Primary Key)의 특징으로 옳지 않은 것은?", choices:["각 레코드를 고유하게 식별한다","null값을 가질 수 있다","테이블 내에서 중복될 수 없다","하나의 테이블에는 하나의 기본키(또는 복합키 하나의 세트)만 지정할 수 있다"], answer:1, explanation:"기본키는 각 레코드를 고유하게 식별해야 하므로 null값을 가질 수 없습니다."},
{category:"정보능력", question:"클라우드 컴퓨팅 서비스 모델 중 'SaaS'의 예시로 가장 적절한 것은?", choices:["가상 서버 인프라 대여","개발 플랫폼 제공","웹 기반 이메일 및 오피스 프로그램","물리적 데이터센터 임대"], answer:2, explanation:"SaaS(Software as a Service)는 소프트웨어 자체를 서비스로 제공하는 형태로, 웹 기반 오피스·이메일 서비스가 대표적입니다."},
{category:"정보능력", question:"엑셀에서 수식을 다른 셀에 복사해도 참조 위치가 바뀌지 않도록 고정하는 참조 방식은?", choices:["상대참조","절대참조($A$1)","혼합참조","순환참조"], answer:1, explanation:"절대참조는 행과 열 앞에 $를 붙여(예: $A$1) 셀을 복사해도 참조 위치가 고정되도록 합니다."},
{category:"정보능력", question:"다음 코드를 실행한 결과는?\ntotal = 0\nfor i in 1 to 5:\n    total = total + i\nprint(total)", choices:["10","15","20","25"], answer:1, explanation:"1+2+3+4+5=15가 출력됩니다."},
{category:"정보능력", question:"'알고리즘'의 조건으로 적절하지 않은 것은?", choices:["유한한 단계 내에 종료되어야 한다","각 단계는 명확하게 정의되어야 한다","동일한 입력에 대해 실행할 때마다 다른 결과가 나와야 한다","실행 가능해야 한다"], answer:2, explanation:"알고리즘은 동일한 입력에 대해 항상 동일한 결과를 산출해야 하는 명확성을 가져야 합니다."},
{category:"정보능력", question:"정보의 가공 절차를 순서대로 나열한 것은?", choices:["수집 → 기획 → 활용 → 관리","기획 → 수집 → 관리 → 활용","관리 → 기획 → 수집 → 활용","활용 → 관리 → 수집 → 기획"], answer:1, explanation:"정보는 필요성을 기획하고, 이를 바탕으로 수집한 후 관리하고, 최종적으로 활용하는 순서로 처리됩니다."},
{category:"정보능력", question:"엑셀에서 =ROUND(1234.567, 1)의 결과값은?", choices:["1234.5","1234.6","1234.57","1235"], answer:1, explanation:"소수 첫째 자리까지 반올림하면 둘째 자리 숫자 6에 의해 올림되어 1234.6이 됩니다."},
{category:"정보능력", question:"정보검색 시 사용하는 연산자 중 AND 연산자의 기능으로 옳은 것은?", choices:["두 단어 중 하나라도 포함된 문서를 검색","두 단어를 모두 포함한 문서를 검색","특정 단어를 제외한 문서를 검색","정확히 일치하는 문구만 검색"], answer:1, explanation:"AND 연산자는 지정한 두 단어(조건)를 모두 포함하는 문서를 검색합니다."},
{category:"정보능력", question:"개인정보 보호를 위한 행동으로 적절하지 않은 것은?", choices:["비밀번호를 주기적으로 변경한다","공용 컴퓨터 사용 후 로그아웃한다","회원가입 시 비밀번호를 모든 사이트에서 동일하게 사용한다","출처가 불분명한 사이트에 개인정보를 입력하지 않는다"], answer:2, explanation:"여러 사이트에 동일한 비밀번호를 사용하면 하나가 유출될 경우 다른 계정도 위험해집니다."},
{category:"정보능력", question:"엑셀에서 텍스트 문자열을 왼쪽에서부터 지정한 개수만큼 추출하는 함수는?", choices:["RIGHT","MID","LEFT","LEN"], answer:2, explanation:"LEFT 함수는 문자열의 왼쪽에서부터 지정한 개수만큼의 문자를 추출합니다."},
{category:"정보능력", question:"빅데이터의 특징을 나타내는 3V(Volume, Velocity, Variety)에 해당하지 않는 것은?", choices:["Volume(규모)","Velocity(속도)","Variety(다양성)","Value(가치)"], answer:3, explanation:"전통적인 3V는 Volume, Velocity, Variety이며, Value와 Veracity는 이후 4V/5V로 확장되며 추가된 개념입니다."},
{category:"정보능력", question:"셀 A1=10, A2=25, A3=15일 때 =SUM(A1:A3)의 결과는?", choices:["40","45","50","55"], answer:2, explanation:"SUM은 지정한 범위의 합을 구합니다. 10+25+15=50."},
{category:"정보능력", question:"셀 B1=8, B2=12, B3=10, B4=10일 때 =AVERAGE(B1:B4)의 결과는?", choices:["8","9","10","11"], answer:2, explanation:"(8+12+10+10)÷4=40÷4=10."},
{category:"정보능력", question:"셀 C1=7, C2=3, C3=9, C4=5일 때 =MAX(C1:C4)-MIN(C1:C4)의 결과는?", choices:["4","5","6","7"], answer:2, explanation:"최댓값 9에서 최솟값 3을 빼면 6입니다."},
{category:"정보능력", question:"D1=90, D2=75, D3=88, D4=90일 때 =RANK(D1,D1:D4,0)의 결과는?", choices:["1","2","3","4"], answer:0, explanation:"RANK(값,범위,0)은 내림차순 순위를 반환합니다. D1과 D4가 모두 최댓값 90으로 동률이므로 D1의 순위는 1위입니다."},
{category:"정보능력", question:"E1=\"합격\", E2=빈 셀, E3=\"불합격\", E4=90일 때 =COUNTA(E1:E4)의 결과는?", choices:["2","3","4","5"], answer:1, explanation:"COUNTA는 비어있지 않은 셀의 개수를 구합니다. E2만 빈 셀이므로 나머지 3개가 집계됩니다."},
{category:"정보능력", question:"=IFERROR(10/0,\"오류\")의 결과는?", choices:["0","10","오류","#DIV/0!"], answer:2, explanation:"10/0은 오류를 발생시키므로 IFERROR는 지정한 대체값인 \"오류\"를 반환합니다."},
{category:"정보능력", question:"F1=\"농협\", F2=\"은행\"일 때 =CONCATENATE(F1,F2)의 결과는?", choices:["농협","은행","농협은행","은행농협"], answer:2, explanation:"CONCATENATE는 여러 텍스트를 순서대로 결합합니다."},
{category:"정보능력", question:"G1=1234500일 때 =TEXT(G1,\"#,##0\")의 결과로 가장 적절한 것은?", choices:["1234500","1,234,500","1234,500","123,4500"], answer:1, explanation:"\"#,##0\" 서식은 천 단위마다 쉼표를 넣어 표시합니다."},
{category:"정보능력", question:"H1=\"금융감독원\"일 때 =MID(H1,3,2)의 결과는?", choices:["금융","감독","독원","금감"], answer:1, explanation:"금(1)융(2)감(3)독(4)원(5) 중 3번째 글자부터 2글자는 \"감독\"입니다."},
{category:"정보능력", question:"I1=\"데이터분석사\"일 때 =LEFT(I1,3)의 결과는?", choices:["데이터","이터분","분석사","데이"], answer:0, explanation:"왼쪽에서부터 3글자를 추출하면 '데이터'입니다."},
{category:"정보능력", question:"J1=\"스마트뱅킹\"일 때 =RIGHT(J1,3)의 결과는?", choices:["스마트","마트뱅","트뱅킹","뱅킹"], answer:2, explanation:"오른쪽에서부터 3글자를 추출하면 '트뱅킹'입니다."},
{category:"정보능력", question:"수식을 다른 셀에 복사했을 때 열은 고정되고 행만 상대적으로 바뀌는 참조 방식은?", choices:["$A$1","A$1","$A1","A1"], answer:2, explanation:"'$A1'은 열에만 $를 붙인 혼합참조로, 복사 시 열(A)은 고정되고 행 번호만 상대적으로 바뀝니다."},
{category:"정보능력", question:"VLOOKUP 사용 시 찾을 값이 항상 있어야 하는 위치는?", choices:["범위의 마지막 열","범위의 첫 번째 열","범위의 중간 열","아무 위치나 가능"], answer:1, explanation:"VLOOKUP은 지정한 범위의 첫 번째 열에서 찾을 값을 검색합니다."},
{category:"정보능력", question:"HLOOKUP 사용 시 찾을 값이 항상 있어야 하는 위치는?", choices:["범위의 첫 번째 행","범위의 마지막 행","범위의 첫 번째 열","범위의 마지막 열"], answer:0, explanation:"HLOOKUP은 지정한 범위의 첫 번째 행에서 찾을 값을 검색합니다."},
{category:"정보능력", question:"대량의 데이터를 항목별로 요약하여 합계·평균 등을 빠르게 집계·분석하는 엑셀 기능은?", choices:["매크로","피벗테이블","시나리오 관리자","목표값 찾기"], answer:1, explanation:"피벗테이블은 데이터를 항목별로 재구성하여 요약·집계·분석하는 기능입니다."},
{category:"정보능력", question:"특정 조건을 만족하는 셀에 자동으로 배경색이나 글꼴 서식을 적용하는 기능은?", choices:["조건부 서식","데이터 유효성 검사","이름 정의","틀 고정"], answer:0, explanation:"조건부 서식은 지정한 조건을 만족하는 셀에 자동으로 서식을 적용하는 기능입니다."},
{category:"정보능력", question:"셀에 입력 가능한 값의 종류나 범위를 미리 제한하여 잘못된 데이터 입력을 막는 기능은?", choices:["조건부 서식","데이터 유효성 검사","시트 보호","매크로"], answer:1, explanation:"데이터 유효성 검사는 셀에 입력할 수 있는 데이터의 종류나 범위를 제한하는 기능입니다."},
{category:"정보능력", question:"K1=5, K2=3일 때 =AND(K1>0,K2>0)의 결과는?", choices:["TRUE","FALSE","0","오류"], answer:0, explanation:"AND 함수는 모든 조건이 참일 때만 TRUE를 반환합니다. K1>0, K2>0 모두 참이므로 TRUE입니다."},
{category:"정보능력", question:"L1=-5, L2=3일 때 =OR(L1>0,L2>0)의 결과는?", choices:["TRUE","FALSE","0","오류"], answer:0, explanation:"OR 함수는 하나라도 조건이 참이면 TRUE를 반환합니다. L2>0이 참이므로 TRUE입니다."},
{category:"정보능력", question:"=MOD(17,5)의 결과는?", choices:["1","2","3","4"], answer:1, explanation:"17을 5로 나누면 3이 몫이고 나머지가 2입니다(17=3×5+2). MOD는 나머지를 반환합니다."},
{category:"정보능력", question:"=INT(9.6)의 결과는?", choices:["8","9","10","9.6"], answer:1, explanation:"INT는 소수 부분을 버리고 그보다 작거나 같은 최대 정수를 반환하므로 9입니다."},
{category:"정보능력", question:"범위 M1:M5에 값 {12,45,7,45,30}이 있을 때 =LARGE(M1:M5,2)의 결과는?", choices:["30","45","12","7"], answer:1, explanation:"큰 값부터 나열하면 45,45,30,12,7이므로 2번째로 큰 값도 45입니다."},
{category:"정보능력", question:"N1=\" 농협은행 \"(앞뒤에 공백 포함)일 때 =TRIM(N1)의 결과로 가장 적절한 것은?", choices:["농협은행 (양쪽 공백 그대로)","농협은행 (양쪽 공백 제거)","농협 은행 (중간에 공백 추가)","농협은행 (뒤쪽 공백만 제거)"], answer:1, explanation:"TRIM은 텍스트 양쪽 끝의 불필요한 공백을 제거합니다."},
{category:"정보능력", question:"=LEN(\"NH농협은행\")의 결과는?", choices:["4","5","6","7"], answer:2, explanation:"\"NH농협은행\"은 N,H,농,협,은,행으로 총 6글자입니다."},
{category:"정보능력", question:"특정 값이 범위 내에서 몇 번째 위치(행 또는 열 번호)에 있는지 반환하는 함수는?", choices:["MATCH","INDEX","VLOOKUP","RANK"], answer:0, explanation:"MATCH(찾을값, 범위, 옵션)는 값이 범위 내에서 몇 번째 위치에 있는지를 반환합니다."},
{category:"정보능력", question:"INDEX(범위, MATCH(찾을값, 범위, 0))의 조합을 사용하는 주된 이유로 가장 적절한 것은?", choices:["단순 합계를 구하기 위해","VLOOKUP과 달리 찾을 열이 반환할 열의 오른쪽에 있어도 검색 가능하기 때문","텍스트 서식을 바꾸기 위해","그래프를 그리기 위해"], answer:1, explanation:"INDEX와 MATCH를 조합하면 VLOOKUP처럼 왼쪽 열만 검색해야 하는 제약 없이 유연하게 값을 찾을 수 있습니다."},
{category:"정보능력", question:"필터링(숨김)된 행을 제외하고 화면에 보이는 셀만 집계할 수 있는 함수는?", choices:["SUM","SUBTOTAL","COUNT","AVERAGE"], answer:1, explanation:"SUBTOTAL은 옵션에 따라 숨겨진(필터링된) 행을 제외하고 집계할 수 있습니다."},
{category:"정보능력", question:"화면을 아래로 스크롤해도 제목 행이 항상 보이도록 고정하는 기능은?", choices:["창 나누기","틀 고정","인쇄 영역 설정","시트 숨기기"], answer:1, explanation:"틀 고정은 스크롤 시에도 지정한 행이나 열이 화면에 항상 보이도록 고정하는 기능입니다."},
{category:"정보능력", question:"십진수 25를 이진수로 변환하면?", choices:["10111","11001","11010","10011"], answer:1, explanation:"25=16+8+1=2⁴+2³+2⁰ 이므로 이진수로 11001입니다."},
{category:"정보능력", question:"이진수 1101을 십진수로 변환하면?", choices:["11","12","13","14"], answer:2, explanation:"1101₂=8+4+0+1=13."},
{category:"정보능력", question:"십진수 100을 16진수로 변환하면?", choices:["5A","64","6A","46"], answer:1, explanation:"100=6×16+4이므로 16진수로 64입니다."},
{category:"정보능력", question:"8진수 17을 10진수로 변환하면?", choices:["13","14","15","16"], answer:2, explanation:"8진수 17=1×8+7=15."},
{category:"정보능력", question:"16진수 2F를 10진수로 변환하면?", choices:["45","46","47","48"], answer:2, explanation:"16진수 2F=2×16+15=47."},
{category:"정보능력", question:"1바이트(Byte)는 몇 비트(bit)로 구성되는가?", choices:["4비트","8비트","16비트","32비트"], answer:1, explanation:"1바이트는 8비트로 구성됩니다."},
{category:"정보능력", question:"저장장치 용량 단위를 작은 것부터 큰 순서로 나열한 것은?", choices:["KB<MB<GB<TB","MB<KB<TB<GB","GB<TB<KB<MB","TB<GB<MB<KB"], answer:0, explanation:"용량 단위는 KB<MB<GB<TB 순으로 커집니다."},
{category:"정보능력", question:"1GB는 몇 MB인가?", choices:["512MB","1000MB","1024MB","2048MB"], answer:2, explanation:"정보량 단위는 1024(2¹⁰)를 기준으로 하므로 1GB=1024MB입니다."},
{category:"정보능력", question:"다음 중 저장장치가 아닌 것은?", choices:["SSD","HDD","USB메모리","CPU"], answer:3, explanation:"CPU는 연산을 처리하는 중앙처리장치로, 데이터를 저장하는 장치가 아닙니다."},
{category:"정보능력", question:"LAN(Local Area Network)에 대한 설명으로 가장 적절한 것은?", choices:["전세계를 연결하는 통신망","한정된 공간(사무실, 건물 등) 내부의 통신망","위성을 이용한 통신망","전화선만을 이용하는 통신망"], answer:1, explanation:"LAN은 사무실이나 건물처럼 한정된 공간 내부를 연결하는 근거리 통신망입니다."},
{category:"정보능력", question:"인터넷에서 도메인 이름을 숫자로 이루어진 IP주소로 변환해주는 시스템은?", choices:["DNS","HTTP","FTP","DHCP"], answer:0, explanation:"DNS(Domain Name System)는 도메인 이름을 IP주소로 변환해주는 시스템입니다."},
{category:"정보능력", question:"웹 브라우저와 웹 서버 간에 하이퍼텍스트 문서를 전송하기 위한 프로토콜은?", choices:["FTP","SMTP","HTTP","TCP"], answer:2, explanation:"HTTP는 웹에서 하이퍼텍스트 문서를 주고받기 위한 통신 프로토콜입니다."},
{category:"정보능력", question:"서로 다른 네트워크를 연결하고 최적의 경로로 데이터를 전달하는 네트워크 장비는?", choices:["허브","라우터","리피터","모니터"], answer:1, explanation:"라우터는 서로 다른 네트워크를 연결하며 데이터의 전송 경로를 결정하는 장비입니다."},
{category:"정보능력", question:"인터넷을 통해 데이터가 암호화되어 안전하게 전송됨을 나타내는 프로토콜은?", choices:["HTTP","HTTPS","FTP","Telnet"], answer:1, explanation:"HTTPS는 HTTP에 암호화(SSL/TLS)를 추가하여 데이터를 안전하게 전송하는 프로토콜입니다."},
{category:"정보능력", question:"방화벽(Firewall)의 주된 기능으로 가장 적절한 것은?", choices:["네트워크 속도를 높이는 장치","내부 네트워크와 외부 네트워크 사이에서 비인가 접근을 차단하는 보안 장치","파일을 압축하는 장치","화면 해상도를 높이는 장치"], answer:1, explanation:"방화벽은 내부·외부 네트워크 사이에서 비인가된 접근을 탐지·차단하는 보안 장치입니다."},
{category:"정보능력", question:"정보를 제3자가 알아볼 수 없도록 특정한 규칙에 따라 변환하는 기술은?", choices:["암호화","압축","백업","포맷"], answer:0, explanation:"암호화는 정보를 특정 규칙(키)에 따라 제3자가 알아볼 수 없는 형태로 변환하는 기술입니다."},
{category:"정보능력", question:"암호화할 때와 복호화할 때 서로 다른 키(공개키·개인키)를 사용하는 암호화 방식은?", choices:["대칭키 암호화","비대칭키(공개키) 암호화","해시 암호화","단방향 암호화"], answer:1, explanation:"비대칭키 암호화는 암호화와 복호화에 서로 다른 키(공개키와 개인키)를 사용합니다."},
{category:"정보능력", question:"로그인 시 아이디·비밀번호 외에 문자메시지 인증번호 등을 추가로 요구하는 보안 방식은?", choices:["단일 인증","2단계 인증(다중 인증)","공인인증서 폐지","방화벽 인증"], answer:1, explanation:"2단계 인증은 비밀번호 외에 추가 인증 수단을 요구하여 보안을 강화하는 방식입니다."},
{category:"정보능력", question:"정상 프로그램으로 위장하여 사용자 정보를 몰래 유출하는 악성코드는?", choices:["트로이 목마","방화벽","백신","쿠키"], answer:0, explanation:"트로이 목마는 정상 프로그램으로 위장해 시스템에 침투하여 정보를 유출하거나 피해를 주는 악성코드입니다."},
{category:"정보능력", question:"사용자를 속여 은행이나 기관을 사칭한 가짜 웹사이트로 유도해 개인정보를 탈취하는 공격 기법은?", choices:["피싱(Phishing)","방화벽","백업","포맷"], answer:0, explanation:"피싱은 신뢰할 수 있는 기관을 사칭하여 개인정보나 금융정보를 탈취하는 사회공학적 공격 기법입니다."},
{category:"정보능력", question:"데이터의 무결성을 확인하기 위해 원본 데이터로부터 고정된 길이의 값을 생성하는 함수는?", choices:["해시 함수","압축 함수","암호화 키","방화벽"], answer:0, explanation:"해시 함수는 데이터로부터 고정된 길이의 값을 생성하여 데이터의 위변조 여부를 확인하는 데 사용됩니다."},
{category:"정보능력", question:"데이터베이스에서 데이터 중복을 최소화하고 무결성을 높이기 위해 테이블을 구조화하는 과정은?", choices:["정규화","암호화","백업","인덱싱"], answer:0, explanation:"정규화는 데이터 중복을 줄이고 무결성을 높이기 위해 테이블 구조를 체계적으로 설계하는 과정입니다."},
{category:"정보능력", question:"관계형 데이터베이스에서 다른 테이블의 기본키를 참조하는 값은?", choices:["기본키(Primary Key)","외래키(Foreign Key)","후보키","대체키"], answer:1, explanation:"외래키는 다른 테이블의 기본키를 참조하여 테이블 간 관계를 형성하는 값입니다."},
{category:"정보능력", question:"SQL에서 테이블의 데이터를 조회할 때 사용하는 기본 명령어는?", choices:["SELECT","INSERT","DELETE","UPDATE"], answer:0, explanation:"SELECT문은 테이블에서 원하는 데이터를 조회하는 데 사용하는 기본 SQL 명령어입니다."},
{category:"정보능력", question:"누구나 무료로 사용할 수 있지만 소스코드는 공개되지 않는 소프트웨어는?", choices:["프리웨어(Freeware)","오픈소스 소프트웨어","상용 소프트웨어","컴파일러"], answer:0, explanation:"프리웨어는 무료로 사용할 수 있으나 소스코드가 공개되지 않는 소프트웨어이며, 오픈소스는 소스코드까지 공개됩니다."},
{category:"정보능력", question:"클라우드 컴퓨팅에서 개발자가 애플리케이션을 개발할 수 있는 플랫폼(운영체제, 실행환경 등)을 서비스로 제공하는 모델은?", choices:["IaaS","PaaS","SaaS","DaaS"], answer:1, explanation:"PaaS(Platform as a Service)는 애플리케이션 개발에 필요한 플랫폼 환경을 서비스로 제공하는 모델입니다."},
{category:"정보능력", question:"클라우드 컴퓨팅에서 서버, 스토리지 등 하드웨어 인프라 자체를 서비스로 제공하는 모델은?", choices:["IaaS","PaaS","SaaS","FaaS"], answer:0, explanation:"IaaS(Infrastructure as a Service)는 서버·스토리지 등 하드웨어 인프라를 서비스로 제공하는 모델입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ntotal = 0\nfor i in 1 to 10:\n    total = total + i\nprint(total)", choices:["45","50","55","60"], answer:2, explanation:"1부터 10까지의 합은 55입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nx = 5\ny = 3\nif x > y:\n    print(\"A\")\nelse:\n    print(\"B\")", choices:["A","B","오류","x"], answer:0, explanation:"x(5)가 y(3)보다 크므로 조건이 참이 되어 \"A\"가 출력됩니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ncount = 0\nfor i in 1 to 20:\n    if i % 3 == 0:\n        count = count + 1\nprint(count)", choices:["5","6","7","8"], answer:1, explanation:"1~20 중 3의 배수는 3,6,9,12,15,18로 총 6개입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nresult = 1\nfor i in 1 to 4:\n    result = result * i\nprint(result)", choices:["6","12","24","120"], answer:2, explanation:"result=1×1×2×3×4=24 (4의 계승, 4!)."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\na = 10\nb = 4\nprint(a // b)", choices:["1","2","2.5","3"], answer:1, explanation:"//는 나눗셈의 몫만 취하는 연산자로, 10÷4의 몫은 2입니다."},
{category:"정보능력", question:"순서도(플로우차트)에서 '마름모' 도형이 일반적으로 나타내는 것은?", choices:["시작과 종료","처리 과정","조건 판단(분기)","데이터 입출력"], answer:2, explanation:"마름모 도형은 조건을 판단하여 흐름을 분기하는 지점을 나타냅니다."},
{category:"정보능력", question:"순서도에서 타원형으로 그려지는 '단말(터미널) 기호'가 나타내는 것은?", choices:["조건 판단","처리 과정","시작과 종료","데이터 입출력"], answer:2, explanation:"타원형 단말 기호는 알고리즘의 시작과 종료 지점을 나타냅니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\ntotal = 0\ni = 1\nwhile i <= 5:\n    total = total + i\n    i = i + 1\nprint(total)", choices:["10","15","20","25"], answer:1, explanation:"i가 1부터 5까지 반복되며 total에 1+2+3+4+5=15가 누적됩니다."},
{category:"정보능력", question:"정렬 알고리즘 중 인접한 두 값을 비교하여 큰 값을 뒤로 보내는 과정을 반복하는 방식은?", choices:["버블 정렬","이진 탐색","해시 탐색","재귀 호출"], answer:0, explanation:"버블 정렬은 인접한 두 원소를 비교하여 큰 값을 뒤로 이동시키는 과정을 반복하는 정렬 방식입니다."},
{category:"정보능력", question:"정렬된 데이터에서 중간값과 비교하여 탐색 범위를 절반씩 줄여가며 원하는 값을 찾는 방법은?", choices:["선형 탐색","이진 탐색","버블 탐색","순차 탐색"], answer:1, explanation:"이진 탐색은 정렬된 데이터의 중간값과 비교해 탐색 범위를 절반씩 줄여가는 방법으로, 선형 탐색보다 효율적입니다."},
{category:"정보능력", question:"함수가 자기 자신을 다시 호출하는 프로그래밍 기법은?", choices:["반복문","재귀 호출","조건문","예외 처리"], answer:1, explanation:"재귀 호출은 함수 내부에서 자기 자신을 다시 호출하는 기법입니다."},
{category:"정보능력", question:"다음 의사코드를 실행한 결과는?\nn = 7\nif n % 2 == 0:\n    print(\"짝수\")\nelse:\n    print(\"홀수\")", choices:["짝수","홀수","0","1"], answer:1, explanation:"7을 2로 나눈 나머지가 1이므로 짝수 조건이 거짓이 되어 \"홀수\"가 출력됩니다."},
{category:"정보능력", question:"정보 검색 연산자 중 OR 연산자의 기능으로 옳은 것은?", choices:["두 단어를 모두 포함한 문서만 검색","두 단어 중 하나라도 포함된 문서를 검색","특정 단어를 제외한 문서를 검색","정확한 문구만 검색"], answer:1, explanation:"OR 연산자는 지정한 단어 중 하나라도 포함된 문서를 검색합니다."},

const state = {
  pos: 0,
  current: null,
  answered: false,
  stats: { total: 0, correct: 0 }
};

const el = {
  categorySelect: document.getElementById('categorySelect'),
  questionSelect: document.getElementById('questionSelect'),
  qCategory: document.getElementById('qCategory'),
  qText: document.getElementById('qText'),
  choices: document.getElementById('choices'),
  feedbackArea: document.getElementById('feedbackArea'),
  nextRow: document.getElementById('nextRow'),
  nextBtn: document.getElementById('nextBtn'),
  statTotal: document.getElementById('statTotal'),
  statCorrect: document.getElementById('statCorrect'),
  statRate: document.getElementById('statRate'),
  resetStatsBtn: document.getElementById('resetStatsBtn'),
};

function buildCategoryOptions(){
  const cats = ['전체', ...Array.from(new Set(questions.map(q => q.category)))];
  el.categorySelect.innerHTML = cats.map(c => {
    const count = c === '전체' ? questions.length : questions.filter(q => q.category === c).length;
    return `<option value="${c}">${c} (${count})</option>`;
  }).join('');
}

function currentFilteredIndices(){
  const cat = el.categorySelect.value;
  return questions
    .map((q, i) => ({ q, i }))
    .filter(({ q }) => cat === '전체' || q.category === cat)
    .map(({ i }) => i);
}

function buildQuestionNumberOptions(){
  const pool = currentFilteredIndices();
  el.questionSelect.innerHTML = pool.map((_, pos) => `<option value="${pos}">${pos + 1}번</option>`).join('');
}

function goToPosition(pos){
  const pool = currentFilteredIndices();
  if (pool.length === 0) return;
  state.pos = Math.max(0, Math.min(pos, pool.length - 1));
  state.current = pool[state.pos];
  el.questionSelect.value = String(state.pos);
  renderQuestion();
}

function nextQuestion(){
  const pool = currentFilteredIndices();
  let pos = state.pos + 1;
  if (pos >= pool.length) pos = 0;
  goToPosition(pos);
}

function renderQuestion(){
  const idx = state.current;
  state.answered = false;
  const q = questions[idx];

  el.qCategory.textContent = q.category;
  el.qText.textContent = q.question;
  el.feedbackArea.innerHTML = '';
  el.nextRow.style.display = 'none';

  el.choices.innerHTML = '';
  q.choices.forEach((choiceText, ci) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = `${['①','②','③','④'][ci]} ${choiceText}`;
    btn.addEventListener('click', () => selectAnswer(ci));
    el.choices.appendChild(btn);
  });
}

function selectAnswer(choiceIndex){
  if (state.answered) return;
  state.answered = true;
  const q = questions[state.current];
  const buttons = el.choices.querySelectorAll('.choice');
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    else if (i === choiceIndex) b.classList.add('wrong');
  });

  const isCorrect = choiceIndex === q.answer;
  state.stats.total++;
  if (isCorrect) state.stats.correct++;
  updateStats();
  saveStats();

  el.feedbackArea.innerHTML = `
    <div class="feedback ${isCorrect ? 'ok' : 'no'}">
      ${isCorrect ? '정답입니다!' : `오답입니다. 정답은 ${['①','②','③','④'][q.answer]}번입니다.`}
    </div>
    <div class="explain"><b>해설</b><br>${q.explanation}</div>
  `;
  el.nextRow.style.display = 'block';
}

function updateStats(){
  el.statTotal.textContent = state.stats.total;
  el.statCorrect.textContent = state.stats.correct;
  const rate = state.stats.total === 0 ? 0 : Math.round((state.stats.correct / state.stats.total) * 100);
  el.statRate.textContent = rate + '%';
}

function saveStats(){
  try { localStorage.setItem('nh_ncs_stats', JSON.stringify(state.stats)); } catch(e){}
}
function loadStats(){
  try {
    const saved = JSON.parse(localStorage.getItem('nh_ncs_stats'));
    if (saved && typeof saved.total === 'number') state.stats = saved;
  } catch(e){}
}

el.nextBtn.addEventListener('click', nextQuestion);
el.categorySelect.addEventListener('change', () => {
  buildQuestionNumberOptions();
  goToPosition(0);
});
el.questionSelect.addEventListener('change', () => {
  goToPosition(Number(el.questionSelect.value));
});
el.resetStatsBtn.addEventListener('click', () => {
  state.stats = { total: 0, correct: 0 };
  updateStats();
  saveStats();
});

document.addEventListener('keydown', (e) => {
  if (!state.answered && ['1','2','3','4'].includes(e.key)) {
    selectAnswer(Number(e.key) - 1);
  } else if (state.answered && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    nextQuestion();
  }
});

loadStats();
updateStats();
buildCategoryOptions();
buildQuestionNumberOptions();
goToPosition(0);
</script>
